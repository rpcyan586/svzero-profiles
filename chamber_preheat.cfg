# Host-side stirred-nozzle qualifier and optional bed-boost planner for M191.
#
# Install klipper/chamber_preheat.py in ~/klipper/klippy/extras/ and include
# this file from printer.cfg. Every M191 wait uses the extra so fan0 can be
# applied asynchronously while G-code is blocked and a previously hot nozzle
# can become a chamber proxy without aborting the print.
#
# A one-minute cold-nozzle sample uses an exponential moving average of 5 s
# rate increments to produce a linear chamber ETA. The bed begins at +5 C,
# then uses the lesser of 10 C and remaining minutes at 1 C/min. It holds at
# +10 while the filtered ETA exceeds ten minutes. After the first decrease,
# filtered ETA may hold the command but never raise it; downward slew is capped
# at 1 C/min. M191 can override all four policy values per call. Python owns the
# live wait because TEMPERATURE_WAIT holds Klipper's G-code mutex, so delayed
# G-code/Jinja cannot alter the bed target concurrently.

[chamber_preheat]
slope_sample_seconds: 60
update_seconds: 5
minimum_rate: 0.02
# Absolute plate ceiling, not a boost magnitude: a magnitude cap does not
# survive changing the printing bed target, and this machine will eventually
# run a 124 C bed. 100 C is a PLA-era limit on what the chamber should see,
# not a limit of the plate.
max_bed_temp: 100
# Retained only so a G-code file that still passes MAX_BOOST is honoured.
max_bed_boost: 1000
# Two monotonic legs: the plate climbs at climb_rate until the ETA says it must
# turn around, then falls at coast_rate. coast_rate also scales how many degrees
# of boost one minute of ETA buys -- two meanings on one knob, to be separated.
climb_rate: 3
# Before any ETA exists the plate ramps blind at climb_rate rather than holding
# the opening guess, commanded in whole degrees so the moves read cleanly.
blind_step: 1
blind_step_seconds: 20
# How far the blind ramp may run unaided. A trend normally appears within a
# couple of minutes; this only bounds a nozzle that never yields one.
blind_max: 15
# Ease into the plateau instead of arriving at full rate: inside this many
# minutes of the ceiling the climb steps down 3 -> 2 -> 1 C/min, one per minute.
climb_ease_minutes: 2
# The turn is a threshold crossing on a noisy signal, so it fires on the ETA's
# downward blips and turns the plate early and low. Deciding it on the highest
# ETA seen in this window resists that; the descent still floors on the live
# value so it never holds on a stale one. Longer is more aggressive: replayed,
# 360 s reached the plate ceiling and cut the bed margin to 6 s.
turn_eta_window: 180
# The plate settles here rather than exactly on the printing target: nozzle and
# motion after the soak add their own heat, and a small bump nudges the end of
# the chamber rise. It CANNOT be raised to buy more of that: Klipper's PID
# check_busy tests the absolute error against PID_SETTLE_DELTA = 1.0, so the
# M190 that follows M191 blocks while a hotter plate cools. A carry of exactly
# 1.0 sits on that boundary -- 2026-08-26 cleared it by 0.01 C. Capped at 0.9.
bed_carry: 0.5
# Hold the maximum for a beat before turning around.
peak_plateau: 60
# The approach ETA is unbiased but jumpy. Smooth it before acting on it.
eta_alpha: 0.25
# coast_rate is a FLOOR on the descent, not a target: a plate still ramping when
# the print starts carries a gradient and cups. Arriving early is soak time, not
# waste. descent_max_rate applies only at or past the deadline, where the plate
# must come down hard -- the bed is never allowed to be later than the chamber.
descent_max_rate: 6
# Pause the descent only when the chamber has demonstrably slowed: the smoothed
# ETA growing by at least this many minutes since the last sample. Replayed
# across two soaks this holds ~10% of the descent; 0.5 gives ~16%, 1.0 gives ~5%.
eta_grow_hold: 0.75
coast_rate: 1
initial_bed_boost: 5
rate_filter_alpha: 0.25
# Qualification: the regressed nozzle slope must reach this band from below
# and then hold for the settle dwell before the nozzle is a chamber proxy.
ready_slope: -0.02
# Fallback only. A nozzle that cooled from above, flattened to within the
# regression's own uncertainty of zero, and sits above the threshold qualifies
# at once: the standard error answers "has it settled" better than a clock.
settle_dwell: 60
qualify_timeout: 900
# Trailing regression window for the slope, and the number of standard errors
# assumed in the chamber's favour when sizing a boost. Measured nozzle noise is
# 0.10-0.18 C against a 0.2-0.5 C/min trend, so a short window is all noise.
slope_window_seconds: 120
slope_confidence: 2
# Newton-cooling projection. A still-cooling nozzle whose extrapolated
# destination already clears the minimum by this margin qualifies immediately,
# so a warm printer is not charged for the descent. Admitted only for a clearly
# decaying nozzle with a plausible time constant and enough span: replayed
# without those guards, the four recorded cold starts overshot the true
# settling point by +62 to +125 C. Set asymptote_margin to 0 to disable.
asymptote_margin: 2
asymptote_min_decay: 0.10
asymptote_tau_min: 30
asymptote_tau_max: 1800
asymptote_drop_max: 60
asymptote_min_span: 60

# The slope worth scheduling a boost against, distinct from minimum_rate above
# which only decides whether an ETA is displayable. A trailing regression lags a
# chamber whose slope is still climbing, so committing too early reads the ETA
# far too long. Not the safety mechanism: sizing from the earliest plausible
# arrival is, with boost_fraction as the margin.
# 0.02 matches minimum_rate deliberately: during development the aim is the
# earliest and largest boost the ETA will justify, to learn the machine's time
# constants. Raise it once those are understood -- a trailing regression lags a
# chamber whose slope is still climbing, so a low threshold reads the ETA long
# and steps up further than a settled estimate would.
boost_min_rate: 0.02

# Land the bed back on its printing setpoint this far ahead of the chamber
# reaching its minimum. Waiting on the bed is always wasted time. With no lead
# the 2026-08-26 run held the print open 15 s past chamber readiness.
bed_lead_seconds: 60

# Smallest first boost worth committing. Near the end of a soak a fraction of a
# degree is churn on the bed for no useful heat.
min_boost_step: 0.5

# Fraction of the apparent headroom actually committed to a boost. Halving it
# was the conservative first pass; on 2026-08-25 it held the bed only ~20 s
# past chamber readiness, so the operator asked for the full headroom back.
boost_fraction: 1.0

# Seed the slope window from Moonraker's temperature store, the same 1200
# one-second samples Mainsail scrolls. An idle machine then qualifies at once
# instead of spending ~148 s re-deriving a flat line. Optional: any failure
# just costs the normal wait.
history_seconds: 300
history_interval: 1.0
history_match_tolerance: 2
moonraker_url: http://127.0.0.1:7125
moonraker_timeout: 5
max_temp_margin: 1
bed_ready_tolerance: 0.5
report_seconds: 30
