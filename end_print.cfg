# END_PRINT — restore Sovol's own end-of-print retract, and record it as a debt
#
# Include AFTER Macro.cfg. Includes apply linearly and duplicate sections merge
# with the later one winning (configfile.py uses RawConfigParser(strict=False)),
# so this overrides Sovol's END_PRINT without editing their file, which
# factory_resets.sh overwrites.
#
# WHY THIS EXISTS
#
# Sovol's END_PRINT already contains a 4 mm retract. It has never run on any
# Zero. The guard reads
#
#     printer['filament_switch_sensor filament_sensor'].enable == True
#
# but Klipper's filament_switch_sensor exposes `enabled`, not `enable`. The
# missing attribute renders as Undefined, Undefined == True is False, and the
# block has no else -- so it is skipped unconditionally, on every print, on every
# firmware from 1.3.7 through 1.4.7. See notes/kb/end-of-print.md.
#
# The consequence is not cosmetic: every print ends with a full melt zone at
# temperature, the nozzle oozes a bead as it cools, and that bead solidifies on
# the tip. The next print therefore starts against OLD HARD CRUD rather than
# fresh ooze -- which the brush displaces without liberating, and which ends up
# on the purge ring.
#
# STOCKALIKE. This is Sovol's structure and Sovol's numbers. The only changes are
# the corrected attribute name and the debt bookkeeping. The 1.4.7 homed_axes
# wrapper is kept because it is strictly safer and harmless on 1.3.7.
#
# THE DEBT
#
# A retract at the end of a job has to be given back at the start of the NEXT
# one, so it cannot live in a gcode_macro variable -- those do not survive the
# restart in between. It goes to save_variables, alongside nb_lane, and
# CLEAN_NOZZLE returns it. CLEAN_NOZZLE is called by Sovol's own START_PRINT, so
# the whole cycle closes with NO slicer involvement and works with any profile,
# including Sovol's stock ones.
#
# It is SET, never accumulated. If the debt is never returned -- a print sliced
# somewhere that does not reach CLEAN_NOZZLE -- the next END_PRINT overwrites it
# with the same 4 mm rather than growing it without bound.

[gcode_macro _END_PRINT_CFG]
description: Settings for the END_PRINT override. Edit here, not in the macro.
variable_retract_mm: 4.0       # Sovol's own intent: 2 mm, then 2 mm with a 0.2 Z lift
variable_retract_f: 2700
gcode:

[gcode_macro END_PRINT]
description: Finish the print, retract as Sovol intended, and record the debt.
variable_state: 'normal'
gcode:
    {% set c = printer["gcode_macro _END_PRINT_CFG"] %}
    {% set z_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance|int %}
    {% set e_mintemp  = printer.configfile.settings['extruder'].min_extrude_temp %}

    # COOLDOWN. Decided here, before anything is turned off, because the inputs
    # are the print's own live setpoints and TURN_OFF_HEATERS destroys them. The
    # bed target is still this print's, and ch_target is whatever M141 last set.
    # Neither is carried across a job boundary, so neither can go stale.
    #
    # Default ON: Sovol's single-step drop to ambient is not behaviour worth
    # preserving. cooldown.cfg is optional and the guard makes an installation
    # without it identical to before.
    {% set cool_ok = 'gcode_macro _COOL_STATE' in printer %}
    {% set cool_final = printer["gcode_macro _COOL_STATE"].p_final|float
                        if cool_ok and printer["gcode_macro _COOL_STATE"].policy_set|int == 1
                        else (printer["gcode_macro _COOLDOWN_CFG"].final|float if cool_ok else 0.0) %}
    {% set ramp = (cool_ok
                   and printer.save_variables.variables.cool_enable|default(1)|int == 1
                   and (printer.heater_bed.target|float > cool_final
                        or printer.save_variables.variables.ch_target|default(0.0)|float > cool_final)) %}

    M117 Finish Print!!!
    # REMEMBER WHAT THIS PRINT RAN AT, so the next one can infer a wipe
    # temperature without the slicer. Captured here because the extruder target
    # is still live at END_PRINT -- the retract guard below depends on exactly
    # that, and saved_variables carrying end_retract = 4.0 is the evidence it
    # holds. The slicer's own M104 S0 arrives after this macro, not before.
    #
    # Persisted rather than kept in RAM: the whole point is to survive the
    # restart between jobs, which is the same reason the retract debt lives
    # here. Only ever a fallback -- a job that names its material still wins.
    {% if printer.extruder.target|float > 0 %}
        SAVE_VARIABLE VARIABLE=last_nozzle_temp VALUE={printer.extruder.target|float|round(0)}
    {% endif %}
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        G91
        # `enabled`, not `enable`. That single character is the whole fix.
        {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
            printer['filament_switch_sensor filament_sensor'].filament_detected == True
        %}
            # Stock also tested `temperature >= target`. Under PID at steady
            # state the reading oscillates either side of the target, so that
            # clause is a coin flip -- it would retract on roughly half of all
            # prints, at random. Print 1 lost its retract to exactly this. What
            # the test is FOR is "the heater is meant to be on, and we are hot
            # enough to extrude", and the two remaining clauses say that
            # precisely. Second deliberate deviation from stock, after `enabled`.
            {% if (printer.extruder.target != 0 and
                printer.extruder.temperature >= e_mintemp)
            %}
                # Sovol's split move, preserved: half the retract, then the rest
                # combined with a small Z lift so the tip leaves the surface
                # while it is still pulling back.
                M83
                G1 E-{c.retract_mm / 2} F{c.retract_f}
                G1 E-{c.retract_mm / 2} Z0.2 F2400
                SAVE_VARIABLE VARIABLE=end_retract VALUE={c.retract_mm}
                RESPOND PREFIX="endprint" MSG="retracted {c.retract_mm}mm - CLEAN_NOZZLE will return it next job"
            {% endif %}
        {% endif %}

        # Stock's relative 10 mm lift, for a ramp and for a plain finish alike.
        #
        # The ramp USED to park at a fixed high Z, reasoning that the stock
        # chamber sensor is corrupted by bed geometry below about 68 mm, so a
        # ramp left wherever the print ended would measure a different chamber
        # on a short print than on a tall one. Removed 2026-09-03 on the
        # operator's call, and the argument against it is the stronger one: that
        # corruption is present through the whole preheat and the whole print
        # too. Parking high for the cooldown does not fix a sensor, it just
        # makes the cooldown the one phase measured differently from the rest.
        #
        # It also cost something real. The park fires from END_PRINT before
        # _COOLDOWN_START has run, so a ramp that then fails to start -- as one
        # did, to a stray M141 S0 -- leaves the machine parked at Z100 for
        # nothing. And it gave the end-of-print observer a different camera
        # geometry on ramping prints than on non-ramping ones, which is exactly
        # the confound that campaign exists to avoid.
        {% if (printer.gcode_move.position.z + 10) < z_max %}
            G1 Z+10 F3000
        {% else %}
            G1 Z+{(z_max - printer.gcode_move.position.z)} F3000
        {% endif %}
        G90
        G1 X-2 Y152.5 F9000
    {% endif %}
    ALL_FAN_OFF
    # Extruder only when a ramp follows: the bed and, if fitted, the chamber
    # heater stay commanded and _COOLDOWN_START takes ownership of them. It is
    # responsible for TURN_OFF_HEATERS in every path where it does not schedule
    # one, so this macro always ends in a defined thermal state.
    #
    # M104 S0 goes through chamber_fan.cfg's wrapper, which hands the exhaust
    # vent floor TARGET=0 -- the floor then persists on its own terms until the
    # nozzle passes 45 C, independently of the ramp. That is deliberate: it is a
    # FUME behaviour, not a chamber-control one.
    #
    # NOT a heatbreak one either, which this comment used to claim. The vent
    # floor is an addition of ours and its only purpose is extracting fumes
    # while the hotend is hot. It borrows 45 C from the stock heatbreak fan's
    # trigger because that was a convenient threshold, and borrowing a number is
    # not sharing a purpose -- chamber_fan.cfg says so directly: "Fume
    # extraction follows commanded heat; the heatbreak fan keeps its own
    # predicate and is not changed here." The heatbreak fan is untouched by any
    # of this.
    {% if ramp %}
        M104 S0
    {% else %}
        TURN_OFF_HEATERS
    {% endif %}
    M220 S100
    M221 S100
    # 1.4.x only. Zero2's 1.3.7 _global_var has no such variable and
    # SET_GCODE_VARIABLE raises on an unknown name, which aborted the rest of
    # this macro -- CLEAR_PAUSE, PRINT_END and M84 never ran, and the job was
    # reported cancelled. Guarded so one file serves both firmwares.
    {% if 'filament_sensor_print' in printer['gcode_macro _global_var'] %}
        SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=filament_sensor_print VALUE=False
    {% endif %}
    CLEAR_PAUSE
    PRINT_END
    M84 X Y Z E
    # Last, so every cleanup step above has already run whatever the ramp does.
    {% if ramp %}
        _COOLDOWN_START
    {% endif %}
    {action_respond_info("Finish Print!")}
