# CLEAN_NOZZLE — hybrid: park-and-heat, heater off, graded scrub, probe-temp floor
#
# Include AFTER Macro.cfg. Includes apply linearly and duplicate sections merge
# with the later one winning, so this overrides Sovol's CLEAN_NOZZLE without
# editing their file, which factory_resets.sh overwrites.
#
# SEQUENCE
#
#   1. park OVER THE PAD, then heat to the cleaning temperature
#      -- so heat-up ooze lands in the bristles and pulls off the last print's
#         residue, instead of being deposited wherever the toolhead was left
#      -- temperature comes from the slicer as TEMP=, per material
#   2. tap for the brush datum, then retract
#      <- the ONLY point in the whole routine where E is legal
#   3. heater OFF
#   4. scrub while it falls: rotating lanes, and three gradients running
#      together -- fast->slow, shallow->deep, overtravel->none
#   5. target probe_temp partway through, so it is a floor rather than a hope
#   6. hold OVER THE PAD for the probe_temp wait, not hovering at the tap point
#   7. return at probe_temp for tap and mesh
#   8. caller reheats to print temperature and calls BRUSH_PRIME
#
# WHY THE RETRACT IS WHERE IT IS -- THE ONE REAL CONSTRAINT
#
# Zero2 has min_extrude_temp: 150, and the brushing window runs from the cleaning
# temperature down to probe_temp.
# Klipper refuses any E move below that limit, so a retract or prime ANYWHERE in
# the heater-off window raises "Extrude below minimum temp" and aborts the macro
# WITH THE NOZZLE BURIED IN THE BRUSH. That is a worse failure than not
# retracting at all.
#
# So the retract happens at retract_temp, above the limit with margin, before the
# heater goes off; and the prime does not happen here at all. It happens after
# the caller reaches print temperature, via BRUSH_PRIME, which primes back
# exactly what was retracted. Nothing extrudes between those two points.
#
# The cleaning temperature must therefore clear min_extrude_temp with margin: at
# exactly the limit a PID undershoot of a tenth of a degree is the difference
# between a retract and an aborted macro. The macro refuses to retract below it
# rather than aborting mid-scrub.
#
# TEMPERATURE POLICY
#
# Four published positions existed and Sovol's was the worst of them: heat to
# 200, wipe, then wait to cool to 130, fully serial. This takes coreystup's
# heater-off (the PID stops driving, so it falls as fast as the hardware allows),
# ss1gohan13's never-go-hot (a material-appropriate temperature, not a flat 200),
# the speed/depth gradient from 0dysseusRex's brass-wire-brush macro, and the
# scrub-during-the-ramp idea
# from cardoc/Liberty4Ever/vladv -- the whole scrub happens inside the cooldown
# that used to be dead time. See notes/kb/nozzle-wiping.md for the comparison.

# ---------------------------------------------------------------------------
# LOAD-CELL TAP: multi-sample with a median, 1.4.7's eddy philosophy applied to
# the pressure probe.
#
# This is a DUPLICATE SECTION OVERRIDE of Sovol's [probe_pressure]. Includes
# apply linearly and duplicate sections merge with the later one winning, so the
# keys below are added to Sovol's pin/offset/speed without restating them.
#
# probe_pressure.py inherits upstream probe.py, so all of this already existed
# and Sovol simply never enabled it: samples defaults to 1, samples_result to
# average, and samples_tolerance_retries to 0. A single unchecked tap is what let
# a 20.28 mm reading through and sent the brush pass 19 mm into the air.
#
# Why median rather than average: one bad sample moves an average by (outlier -
# mean)/N and moves a median not at all, provided fewer than half the samples are
# bad. _calc_median sorts by Z and takes the middle (probe_pressure.py:159-166).
#
# Why an ODD count: with an even count Klipper averages the two middle samples,
# which lets an outlier adjacent to the middle back into the result. 7 is odd,
# tolerates 3 bad samples, and costs about half of what 10 would.
#
# The two mechanisms cover different failures and both are wanted:
#   samples_result median  -- small scatter, always applied
#   samples_tolerance      -- gross outliers, forces a full re-measure
#
# NOTE THIS ALSO AFFECTS Z_OFFSET_CALIBRATION, which probes with the same
# object. That is intended: it is the same sensor with the same failure mode.
[probe_pressure]
samples: 7
samples_result: median
samples_tolerance: 0.20
samples_tolerance_retries: 3
sample_retract_dist: 1.0

[gcode_macro _BRUSH]
description: Geometry and behaviour for CLEAN_NOZZLE. Edit here, not in the macro.
# --- brush footprint: BOUNDS PLUS MARGIN -----------------------------------
# ss1gohan13's _FELT_WIPE idea. State where the PAD IS, once, and let the macro
# derive the usable area by insetting the margin. Two things fall out that
# hardcoded stroke coordinates do not give you:
#   * the macro uses all of the pad it is told about, automatically, so widening
#     coverage is a measurement rather than a rewrite;
#   * it cannot walk off the edge, because every stroke is derived from the
#     bounds rather than typed next to them.
#
# TAUGHT ON ZERO2, 2026-08-17, by jogging the nozzle tip to each corner
# (BRUSH_CORNER / BRUSH_TEACH). Not calipers, not the vendor listing.
#
#   corner 1 front-left   X -10.0  Y  6.5  Z 0.2
#   corner 2 front-right  X  -7.3  Y  5.5  Z 0.2
#   corner 3 back-right   X  -7.3  Y 36.0  Z 0.3   <- hardest to see, softest number
#   corner 4 back-left    X -10.0  Y 39.0  Z 0.2
#
# X -10.0 IS THE MACHINE, NOT THE PAD. position_min, position_endstop and the
# jog limit all agree at -10, so the carriage cannot go further left and the
# silicone continues past where the nozzle can reach. The usable width is
# therefore bounded by X travel, and the vendor's 4.8 mm is an upper bound we
# will never see. 2.7 mm reachable against the 1.0 mm stock uses.
#
# Y 5.5..39.0 is 33.5 mm against the vendor's listed 32.8, which corroborates the
# listing. The left edge measures 32.5 mm (corner 4 - corner 1) and the right
# edge 30.5 mm (corner 3 - corner 2); the 2 mm disagreement is corner 3, which
# was reported hard to judge, so trust the left edge.
variable_pad_x_min: -10.0
variable_pad_x_max: -7.3
variable_pad_y_min: 5.5
variable_pad_y_max: 39.0
variable_margin: 0.4           # inset from the pad edges
# The left edge needs NO margin: X -10 is the endstop, so the machine physically
# cannot overshoot it, and the silicone continues past it anyway. Spending 0.4 mm
# of a 2.7 mm band defending against an impossible failure is the difference
# between 1.9 and 2.3 mm of usable brush.
variable_margin_x_min: 0.0
variable_lanes: 5
# NET depth below where RUN_PROBE_PRESSURE parks the nozzle. NEGATIVE IS DEEPER.
#
# THERE IS ONLY ONE Z FRAME, which is worth stating because it looks like two.
# RUN_PROBE_PRESSURE calls run_probe and DISCARDS the result -- no set_position,
# no datum reset (probe_pressure.py:83-86). run_probe retracts only BETWEEN
# samples, so after the last one the nozzle is left sitting at the tap target's
# trigger height. The tap is a positioning move, not a second datum. Everything
# is the homed frame throughout, where Z0 is the nozzle at the bed (eddy
# z_offset 3.5, and G28 does leave Z reading 3.5).
#
# CORRECTED 2026-08-17. These were -2.4 and -1.8 because stock's G-code contains
# "G1 Z-2.4" and that was read as a depth. It is a RELATIVE MOVE following a
# "G1 Z2" lift, so stock NET engagement is -0.4. This macro was set to run 2.0mm
# deeper than stock while its comments claimed to match it, and stage 4 would
# have driven that into the brush at first contact.
#
# -0.4 is the stock-equivalent and the safe starting point. Liberty4Ever reports
# half the nozzle buried already at stock depth, and the taught pad top sits at
# Z +0.2 in the homed frame.
#
# GOING DEEPER IS THE LEVER for brushing the nozzle cone rather than just the
# tip, which is the stated goal. stepper_z position_min is -5, so there is room.
# Increase deliberately in small steps AFTER stage 4 passes at stock depth, not
# by inheriting a number from a misread.
variable_z_deep: -1.47        # 1.2 mm immersion, the tested default
variable_z_shallow: -0.97
# --- depth by immersion, measured on Zero2 2026-08-17 ---------------------
# Both numbers below are measurements, not guesses, and together they turn depth
# into arithmetic:
#   pad_top   taught by jogging the nozzle tip to the pad corners (stage 3)
#   tap_park  where RUN_PROBE_PRESSURE leaves the nozzle, derived in stage 4
#             from the absolute Z reached while scrubbing at a known z_deep
#
#   immersion = pad_top - (tap_park + z_deep)
#   so  z_deep = pad_top - immersion - tap_park
#
# Pass IMMERSION=<mm> to CLEAN_NOZZLE and it computes z_deep and z_shallow from
# these. Without it the configured z_deep/z_shallow above are used unchanged.
# Re-measure both if the nozzle is changed: a different nozzle length moves the
# tap park, and a different brush moves the pad top.
variable_pad_top: 0.2
variable_tap_park: 0.47
variable_hop_span: 0.5         # how much shallower the shallowest hop is
# CEILING FOUND BY TEST, 2026-08-17: at 2.0 mm immersion the pad STARTS LIFTING
# OFF ITS MOUNT. That is the binding constraint, and it is adhesion rather than
# nozzle geometry or machine travel -- position_min leaves 5 mm and an MK8 cone
# is 3.5-4 mm, so neither runs out first. Usable window is roughly 0.13 mm
# (stock-equivalent) to under 2 mm. The shipped default is 1.2 mm, tested.
# Another machine will have its own ceiling; this number does not transfer.
variable_z_hops: 4
variable_lift: 2.0
# --- motion ----------------------------------------------------------------
variable_wipes: 8              # full-length passes, each on its own lane and hop
variable_cross: 3              # cross-grain sweeps along X
variable_cross_every: 2        # interleave a cross after every N full passes (0 = all at the end)
variable_feed: 1800            # legacy flat feed; used when feed_start/end are 0
variable_feed_cross: 900
# Speed gradient, after the brass-brush strategy: knock debris off fast, then
# finish slow while the nozzle is coldest and the bristles bite hardest.
# Geometric, so the ratio between consecutive passes is constant.
variable_feed_start: 3000      # first pass -- fast and shallow
variable_feed_end: 300         # last pass -- slow and deep
# Nozzle geometry. y_overtravel is in MULTIPLES of nozzle_d: run the tip clear
# of the pad end so the bristles close behind it and wipe the trailing face.
# It FADES to zero as the passes get deeper, because the mount lip beyond the
# pad ends has never been measured. Raising this needs a teach stage first.
variable_nozzle_d: 4.0         # MK8 cone diameter at the wiping height
variable_y_overtravel: 1.0     # 1.0 = one full nozzle_d (4.0 mm) past each end
variable_x_over: 0.0           # extra +X past pad_x_max. POSTPONED (D3) -- the bed is right there
# Hard axis limits, mirrored from printer.cfg so overtravel can be clamped here
# rather than trusting Klipper to error out mid-scrub with the nozzle engaged.
variable_axis_y_min: -2.0      # stepper_y position_min
variable_axis_y_max: 152.5     # stepper_y position_max
variable_axis_x_max: 155.0     # stepper_x position_max (the BED is the real limit)
# --- filament --------------------------------------------------------------
variable_retract_mm: 3.0       # 0 disables both retract and prime
variable_retract_f: 2700
variable_owed_max: 10.0        # sanity clamp on the stored end-of-print debt
variable_retracted: 0.0        # runtime: what BRUSH_PRIME owes back
# --- temperature -----------------------------------------------------------
# Cleaning temperature. The SLICER passes it as CLEAN_NOZZLE TEMP=<n>, per
# material -- see kb/filament-profiles.md. When the slicer says nothing we fall
# back to Sovol's stock cleaning temperature rather than to our old fixed 155,
# because 200 is the value every stock profile has always used and is safe for
# every material the machine handles.
#   The retract happens AT this temperature (it must clear min_extrude_temp).
#   The scrub then happens during the coast down to probe_temp.
variable_retract_temp: 200     # last-resort fallback. Stock cleaning temperature
variable_clean_temp: 0         # runtime: set by the slicer's start G-code before
                               # START_PRINT, which calls CLEAN_NOZZLE without
                               # arguments so TEMP= cannot reach it. 0 = unset.
variable_min_extrude_temp: 150 # mirrored from [extruder]; retract is refused below it
variable_probe_temp: 150       # floor during the scrub, and the tap temperature
                               # 150 (was 130) per D4: 0dysseusRex probes his load cell
                               # at 150. Revert to 130 if tap spread degrades.
variable_off_fraction: 0.6     # share of the scrub done with the heater fully off
# --- probe -----------------------------------------------------------------
# 1.3.7/1.3.8: RUN_PROBE_PRESSURE. 1.4.0+: RUN_PROBE_VIR_CONTACT, an eddy
# measurement whose sensor sits -19.8 from the nozzle and leaves the plate before
# the nozzle does -- so on 1.4.x use tap_x 30, tap_y 30 and do NOT move it left.
variable_probe: "RUN_PROBE_PRESSURE"
# The datum tap is taken on a DIRTY nozzle on purpose -- it reports where the
# crud surface is, which is the surface the first pass has to clear. Precision
# against an unknown blob is meaningless, and repeated samples just press the
# debris we are about to wipe off. One sample.
#   NOTE: with SAMPLES=1 Klipper's run_probe skips the inter-sample lift (the
#   retract is guarded by "if len(positions) < sample_count"), so the nozzle is
#   left resting on the target until the next move. That is fine here and is
#   why the retract and lift follow immediately.
#   Blank this string on 1.4.x if RUN_PROBE_VIR_CONTACT rejects SAMPLES.
variable_probe_datum_args: "SAMPLES=1"
variable_tap_x: -1.0
# Vergo's fix (forum t/8051): never probe where something was previously
# deposited. The datum tap runs on a DIRTY nozzle and can leave crud on the tap
# target; the clean tap must not then read it back. So they sit 2 mm apart,
# straddling the nominal point rather than both landing on it.
#   NOTE: the target's extent has never been measured. These are +/-1 mm from a
#   point known to work. Widening them needs a teach stage first.
variable_tap_dirty_dx: -1.0    # datum tap, 1 mm left of nominal
variable_tap_clean_dx: 1.0     # final tap, 1 mm right of nominal
variable_tap_y: 20.0
# Sanity window for where the tap may leave the nozzle. KEPT even though the
# probe now medians 7 samples, because the two catch different things: the median
# and tolerance handle samples that DISAGREE, and this handles samples that all
# AGREE on a wrong value -- a stuck or mis-tared sensor, which no amount of
# repetition detects. Five good taps on Zero2
# fell between 0.374 and 0.479; a sixth returned 20.2825 and the macro believed
# it, so the scrub ran ~19 mm above the brush. A tap that reads HIGH wastes a
# clean; one that reads LOW drives the nozzle into the pad or its mount, so both
# ends are checked. Sovol's own z_offset_calibration retries until two taps agree
# within 0.03 mm, which is the same admission that a single tap is not
# trustworthy -- stock CLEAN_NOZZLE simply never noticed because its 0.4 mm
# engagement makes a bad tap harmless.
# Plausibility window for the datum tap. Wide ON PURPOSE: it spans the bed's
# THERMAL STATE, not measurement noise. Z homes by probing the plate at centre
# (safe_z_home 96,76.2), so Z0 is the plate surface, while the tap target is a
# separate bed-mounted object near the front-left. The two move apart as the bed
# heats. Measured on Zero2:
#     cold, 26 C bed   tap = 1.59 .. 1.65   (repeatability 0.002 .. 0.024)
#     hot, in service  tap = 0.41 .. 0.47   (commissioning, 7-sample medians)
# ~1.2 mm of legitimate travel. The window must clear both ends or a manual
# cold run aborts; it still catches the failure it was written for, a tap that
# returned 20.28 and sent the macro scrubbing 19 mm of air.
variable_tap_min: -0.5
variable_tap_max: 2.5
# --- dry run ---------------------------------------------------------------
# CLEAN_NOZZLE DRY=1 rehearses the pattern in free air: same XY, same feeds, same
# Z deltas, lifted to dry_z. No heater, no probe, no extrusion. It runs the real
# code path rather than a copy, which is the only version worth trusting.
variable_dry_z: 50.0
variable_teach_z: 5.0          # height BRUSH_CORNER parks at while you eyeball it
variable_park_z: 5.0           # safe absolute Z for hovering over the pad (D1/D2)
gcode:


[gcode_macro CLEAN_NOZZLE]
description: Scrub the nozzle during a heater-off cooldown, ending at probe temp.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set lanes = [b.lanes, 1]|max %}
    {% set hops  = [b.z_hops, 1]|max %}
    {% set lane0 = printer.save_variables.variables.nb_lane|default(0)|int %}
    {% set off_wipes = (b.wipes * b.off_fraction)|round(0)|int %}
    # Commissioning parameters. Each stage adds exactly one new risk, so they
    # compose rather than forking the code -- the thing being rehearsed is always
    # the real macro. See notes/runbook-brush-commissioning.md.
    #   DRY=1      no contact at all; the whole pattern in free air at DRY_Z
    #   DRY_Z=n    where that air pass happens
    #   HEAT=0     no heater commands. IMPLIES no extrusion: below
    #              min_extrude_temp Klipper refuses E and would abort the macro
    #              with the nozzle in the brush
    #   SPEED=n    percent of normal feed, for watching real contact slowly
    {% set dry = params.DRY|default(0)|int %}
    {% set dz  = params.DRY_Z|default(b.dry_z)|float %}
    {% set heat = params.HEAT|default(1)|int %}
    {% set sc = [params.SPEED|default(100)|float, 1.0]|max / 100.0 %}
    # IMMERSION=<mm> below the taught pad top. Overrides z_deep/z_shallow.
    {% set imm = params.IMMERSION|default(0)|float %}
    # D5. Cleaning temperature is the SLICER's to choose, per material. Absent a
    # TEMP=, fall back to Sovol's stock cleaning temperature rather than to a
    # value of ours: an unparameterised caller should get the vendor behaviour.
    # Resolution order: an explicit TEMP= (manual call) beats the slicer's
    # variable, which beats the stock fallback. The slicer cannot pass TEMP=
    # because Sovol's START_PRINT is what calls this macro.
    {% set slicer_temp = b.clean_temp|float %}
    {% set clean_temp = params.TEMP|default(slicer_temp if slicer_temp > 0 else b.retract_temp)|float %}
    {% if heat and b.retract_mm > 0 and clean_temp < b.min_extrude_temp %}
        { action_raise_error("CLEAN_NOZZLE: TEMP=%.0f is below min_extrude_temp %.0f, "
          "so the retract would abort the macro with the nozzle in the brush. "
          "Raise TEMP or set _BRUSH retract_mm to 0."|format(clean_temp, b.min_extrude_temp)) }
    {% endif %}
    {% set z_deep = (b.pad_top - imm - b.tap_park) if imm > 0 else b.z_deep %}
    {% set z_shallow = (z_deep + b.hop_span) if imm > 0 else b.z_shallow %}
    {% if (b.tap_park + z_deep) < -4.5 %}
        { action_raise_error("CLEAN_NOZZLE: IMMERSION %.2f puts the nozzle at Z %.2f, "
          "past stepper_z position_min -5"|format(imm, b.tap_park + z_deep)) }
    {% endif %}
    {% set feed = (b.feed * sc)|round(0)|int %}
    {% set feed_cross = (b.feed_cross * sc)|round(0)|int %}
    {% set feed_z = (600 * sc)|round(0)|int %}
    {% set wet_e = (not dry) and heat %}

    # Usable area derived from the pad bounds, inset by the margin.
    {% set x_min = b.pad_x_min + b.margin_x_min %}
    {% set x_max = [b.pad_x_max - b.margin + b.x_over, b.axis_x_max]|min %}
    {% set y_min = b.pad_y_min + b.margin %}
    {% set y_max = b.pad_y_max - b.margin %}
    {% if x_max <= x_min or y_max <= y_min %}
        { action_raise_error("CLEAN_NOZZLE: margin %.2f leaves no usable pad area "
          "between the bounds. Check _BRUSH pad_x/pad_y and margin."|format(b.margin)) }
    {% endif %}

    # Restores G90/G91 and M82/M83 by mechanism rather than by remembering to,
    # so an error path cannot leave the machine in relative mode for whatever
    # runs next. See AGENTS.md, Motion mode in macros.
    SAVE_GCODE_STATE NAME=clean_nozzle
    BED_MESH_CLEAR
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

    {% if not heat and not dry %}
        RESPOND PREFIX="brush" MSG="COLD CONTACT RUN at {(sc*100)|round(0)|int}% speed, immersion {(b.pad_top - (b.tap_park + z_deep))|round(2)}mm, z_deep {z_deep|round(2)}"
    {% endif %}
    {% if dry %}
        RESPOND PREFIX="brush" MSG="DRY RUN at Z{dz} - no heater, no probe, no extrusion"
        G90
        G1 Z{dz + b.lift} F1200
    {% else %}
        # 1. D1: park over the pad BEFORE heating, so the heat-up ooze binds
        #    into the bristles and lifts the previous print's residue, instead
        #    of being deposited wherever the toolhead happened to be left.
        #    HandyDoodads' idea (forum, 2025-12-17).
        G90
        G1 Z{b.park_z} F1200
        G1 X{(x_min + x_max) / 2} Y{(y_min + y_max) / 2} F9000
        {% if heat %}M109 S{clean_temp}{% endif %}

        # 2. Datum tap, then the only legal extrusion in the routine.
        G1 X{b.tap_x + b.tap_dirty_dx} Y{b.tap_y} F9000
        {b.probe} {b.probe_datum_args}
        _BRUSH_CHECK_TAP
        # Retract for the scrub. UNCONDITIONAL and always the same amount --
        # the cross-job debt deliberately does NOT modulate this. Whatever the
        # stored state says, the nozzle arrives at the brush retracted by
        # exactly retract_mm from wherever it started, so brush behaviour is
        # identical every print and does not depend on bookkeeping that a manual
        # load, a filament change or a power cut can invalidate.
        #
        # The debt is settled later instead, by BRUSH_PRIME, at PRINTING
        # temperature and immediately before the purge -- which is the one place
        # in the job where pushing filament out of the nozzle is the intent
        # rather than a mess. Any error in the stored value therefore lands in
        # the purge line, which tolerates it, instead of at the brush.
        {% if b.retract_mm > 0 and wet_e %}
            M83
            G1 E-{b.retract_mm} F{b.retract_f}
            SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=retracted VALUE={b.retract_mm}
        {% endif %}

        # 3. Heater off. Not a lower target -- the PID stops driving entirely, so
        #    the nozzle falls as fast as the hardware allows and no residual power
        #    keeps it oozing onto the brush it is being cleaned against.
        {% if heat %}SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0{% endif %}

        # Lift, traverse, engage. Never traverse at depth.
    # NOTE: this descent is RELATIVE to where the tap left the nozzle, so the
    # immersion tracks the tap and therefore the bed's temperature. In service
    # that is correct and self-correcting -- the slicer's M190 runs before
    # START_PRINT, so the bed is always hot here. Run CLEAN_NOZZLE by hand on a
    # cold bed and the same G-code scrubs ~1.2 mm shallower, which on the
    # measured numbers is the pad's surface rather than 1.2 mm into it.
        G91
        G1 Z{b.lift} F1200
        G90
    {% endif %}
    G1 X{x_min} Y{y_min} F9000
    G91
    # Engage at the SHALLOW end -- the pass sequence starts shallow and works
    # deeper, so plunging to z_deep here would spend the first contact at full
    # depth and then back out, which is the opposite of the intended gradient.
    G1 Z{z_shallow - b.lift} F{feed_z}
    G90

    # 4-5. Full-length passes. Three gradients run together across the sequence,
    #      all borrowed from the brass-brush strategy and applied to silicone:
    #        speed    fast  -> slow    (geometric)
    #        depth    shallow -> deep  (linear)
    #        overtravel full -> none   (linear, safety: see y_overtravel)
    #      Fast and shallow knocks loose debris off without dragging it around;
    #      slow and deep finishes, when the nozzle is coolest and the bristles
    #      have the most time to conform to it. The lane index still rotates and
    #      still persists across prints, so wear leveling is unchanged -- depth
    #      is no longer the wear axis, it is the aggression axis.
    {% set n = [b.wipes, 1]|max %}
    {% set graded = b.feed_start > 0 and b.feed_end > 0 %}
    {% set fr = (b.feed_end / b.feed_start) ** (1.0 / (n - 1)) if graded and n > 1 else 1.0 %}
    {% for i in range(n) %}
        {% if i == off_wipes and not dry and heat %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={b.probe_temp}
        {% endif %}
        {% set t = (i / (n - 1)) if n > 1 else 1.0 %}
        {% set lane = (lane0 + i) % lanes %}
        {% set x = x_min + (x_max - x_min) * lane / (lanes - 1 if lanes > 1 else 1) %}
        # Shallow first, deep last. z_shallow is the LESS negative offset.
        {% set z = z_shallow + (z_deep - z_shallow) * t %}
        {% set f = ((b.feed_start * (fr ** i)) if graded else b.feed) %}
        {% set f = ([f * sc, 30]|max)|round(0)|int %}
        # Overtravel fades with depth: the tip clears the pad end while it is
        # still shallow, and stays inside the taught bounds once it is deep.
        {% set ot = b.nozzle_d * b.y_overtravel * (1.0 - t) %}
        {% set y_hi = [y_max + ot, b.axis_y_max]|min %}
        {% set y_lo = [y_min - ot, b.axis_y_min]|max %}
        # Z hops must be RELATIVE. These values are offsets from the tap datum,
        # and the datum's absolute height is not known here -- emitting them in
        # G90 would command an absolute Z of -2.4, i.e. into the bed. The
        # previous depth is recomputed from the same formula rather than carried
        # in a Jinja namespace, which keeps this stateless.
        {% set t_prev = ((i - 1) / (n - 1)) if n > 1 else 1.0 %}
        {% set z_prev = (z_shallow + (z_deep - z_shallow) * t_prev) if i > 0 else z_shallow %}
        {% if (z - z_prev)|abs > 0.0005 %}
            G91
            G1 Z{"%.3f"|format(z - z_prev)} F{feed_z}
            G90
        {% endif %}
        G1 X{"%.3f"|format(x)} Y{"%.3f"|format(y_hi if i % 2 == 0 else y_lo)} F{f}
        # Interleaved cross-grain. Every pass above runs along the bristles and
        # flattens them that way; these attack from the side and are the only
        # motion that cleans the nozzle's X faces. Interleaving rather than
        # appending means they inherit the current depth and speed.
        {% if b.cross_every > 0 and (i + 1) % b.cross_every == 0 and (i + 1) < n %}
            {% set yc = y_min + (y_max - y_min) * (((i // b.cross_every) % 3) + 0.5) / 3 %}
            G1 Y{"%.3f"|format(yc)} F{f}
            G1 X{"%.3f"|format(x_max)} F{f}
            G1 X{"%.3f"|format(x_min)} F{f}
            G1 X{"%.3f"|format(x)} F{f}
        {% endif %}
    {% endfor %}

    # Trailing cross-grain sweeps, at the final (deepest, slowest) setting.
    {% for j in range(b.cross) %}
        {% set y = y_min + (y_max - y_min) * (j + 0.5) / b.cross %}
        G1 X{x_min} Y{"%.3f"|format(y)} F{feed_cross}
        G1 X{"%.3f"|format(x_max)} F{feed_cross}
        G1 X{x_min} F{feed_cross}
    {% endfor %}

    {% if not dry %}
        SAVE_VARIABLE VARIABLE=nb_lane VALUE={(lane0 + b.wipes) % (lanes * hops)}
    {% endif %}

    # 6. Retap and settle at probe temperature. The caller does tap and mesh from
    #    here; this macro does not probe on the caller's behalf.
    G90
    {% if dry %}
        G1 Z{dz} F1200
        G1 X{b.tap_x} F9000
        RESPOND PREFIX="brush" MSG="DRY RUN complete - lane index NOT advanced"
    {% else %}
        # D2. Wait for probe_temp HOLDING OVER THE PAD rather than hovering at
        #     the tap point. Whatever still oozes during the wait lands in the
        #     bristles; at the tap point it would land on the plate, next to the
        #     coordinate we are about to measure.
        G91
        G1 Z{b.lift} F1200
        G90
        {% if heat %}
            M106 S255
            M109 S{b.probe_temp}
            M106 S0
        {% endif %}
        G1 Z3 F1200
        G1 X{b.tap_x + b.tap_clean_dx} Y{b.tap_y} F9000
        {b.probe}
        G1 Z5 F1200
    {% endif %}
    RESTORE_GCODE_STATE NAME=clean_nozzle


[gcode_macro BRUSH_PRIME]
description: Prime back exactly what CLEAN_NOZZLE retracted. Call AFTER print temp.
# CONSEQUENCE OF NOT CALLING THIS. The filament ends the job retracted by
# END_PRINT's amount and is retracted again by CLEAN_NOZZLE, so a start G-code
# that never reaches BRUSH_PRIME leaves it ~7 mm back and under-purges. Our
# profiles call it; Sovol's stock ones do not. That is the one place where this
# pack's macros and its profiles are genuinely a matched set.
#
# Separate from CLEAN_NOZZLE on purpose. The retract happens above
# min_extrude_temp and the machine then spends the whole clean-and-probe sequence
# below it, so the matching prime cannot be issued until the caller has reached
# printing temperature. Priming a hardcoded number instead would over-extrude
# whenever retract_mm is changed or set to 0.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set scrub = b.retracted|float %}
    # END_PRINT retracted this at the end of the LAST job and it has been sitting
    # in save_variables ever since, because a gcode_macro variable does not
    # survive the restart in between. Clamped: END_PRINT is the only writer and
    # only ever stores retract_mm, so this guards a hand-edited or corrupt value.
    {% set owed_raw = printer.save_variables.variables.end_retract|default(0)|float %}
    {% set end_owed = [[owed_raw, 0]|max, b.owed_max]|min %}
    {% set total = scrub + end_owed %}
    {% if owed_raw > b.owed_max %}
        RESPOND PREFIX="brush" MSG="stored end_retract {owed_raw}mm exceeds owed_max {b.owed_max}mm - clamped"
    {% endif %}
    {% if total > 0 %}
        SAVE_GCODE_STATE NAME=brush_prime
        M83
        G1 E{"%.3f"|format(total)} F{b.retract_f}
        RESTORE_GCODE_STATE NAME=brush_prime
        SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=retracted VALUE=0
        {% if end_owed > 0 %}SAVE_VARIABLE VARIABLE=end_retract VALUE=0{% endif %}
        RESPOND PREFIX="brush" MSG="primed {"%.3f"|format(total)}mm = {scrub} scrub retract + {end_owed} owed by END_PRINT"
    {% endif %}


[gcode_macro BRUSH_STATUS]
description: Report brush geometry, coverage and the current indices.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    RESPOND PREFIX="brush" MSG="pad {b.pad_x_max - b.pad_x_min}mm inset {b.margin} over {b.lanes} lanes, {b.z_hops} depths, {b.wipes} passes plus {b.cross} cross"
    RESPOND PREFIX="brush" MSG="index {printer.save_variables.variables.nb_lane|default(0)}, owed {b.retracted}mm, heater off for first {(b.wipes * b.off_fraction)|round(0)|int} passes"


[gcode_macro BRUSH_RESET_LANE]
description: Restart the lane and depth rotation at 0.
gcode:
    SAVE_VARIABLE VARIABLE=nb_lane VALUE=0
    RESPOND PREFIX="brush" MSG="rotation reset"


[gcode_macro BRUSH_CORNER]
description: Park above a corner of the brush pad so it can be eyeballed and jogged.
# Stage 3 of commissioning. The pad bounds in _BRUSH are the stock CONTACT band,
# not a measurement, and everything about coverage is blocked on knowing the real
# extent. This drives to each declared corner at teach_z so the aim can be judged
# by eye, jogged, and then recorded with BRUSH_TEACH.
#
# It deliberately does not descend to contact. Getting close without touching is
# the whole point.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set n = params.CORNER|default(1)|int %}
    {% set z = params.Z|default(b.teach_z)|float %}
    {% set x = b.pad_x_min if n in [1, 4] else b.pad_x_max %}
    {% set y = b.pad_y_min if n in [1, 2] else b.pad_y_max %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("BRUSH_CORNER: home first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=brush_corner
    G90
    G1 Z{[z + 5, 5]|max} F1200
    G1 X{x} Y{y} F3000
    G1 Z{z} F600
    RESPOND PREFIX="brush" MSG="corner {n} of 4 at X{x} Y{y} Z{z}. Jog to the true corner, then BRUSH_TEACH CORNER={n}"
    RESTORE_GCODE_STATE NAME=brush_corner


[gcode_macro BRUSH_TEACH]
description: Record the jogged position as a pad corner. Reports, does not apply.
# Writes to save_variables and prints the resulting bounds. It deliberately does
# NOT rewrite _BRUSH: the config stays the authority, so a stray jog cannot
# silently move the brush geometry. Paste the reported values in when all four
# corners agree.
gcode:
    {% set n = params.CORNER|default(1)|int %}
    {% set x = printer.gcode_move.gcode_position.x %}
    {% set y = printer.gcode_move.gcode_position.y %}
    {% set z = printer.gcode_move.gcode_position.z %}
    SAVE_VARIABLE VARIABLE=nb_corner{n}_x VALUE={x|round(3)}
    SAVE_VARIABLE VARIABLE=nb_corner{n}_y VALUE={y|round(3)}
    SAVE_VARIABLE VARIABLE=nb_corner{n}_z VALUE={z|round(3)}
    RESPOND PREFIX="brush" MSG="corner {n} taught at X{x|round(3)} Y{y|round(3)} Z{z|round(3)}"


[gcode_macro BRUSH_TEACH_REPORT]
description: Print the pad bounds implied by the taught corners.
gcode:
    {% set v = printer.save_variables.variables %}
    {% set xs = [v.nb_corner1_x|default(0), v.nb_corner2_x|default(0), v.nb_corner3_x|default(0), v.nb_corner4_x|default(0)] %}
    {% set ys = [v.nb_corner1_y|default(0), v.nb_corner2_y|default(0), v.nb_corner3_y|default(0), v.nb_corner4_y|default(0)] %}
    {% set zs = [v.nb_corner1_z|default(0), v.nb_corner2_z|default(0), v.nb_corner3_z|default(0), v.nb_corner4_z|default(0)] %}
    RESPOND PREFIX="brush" MSG="taught pad_x_min {xs|min} pad_x_max {xs|max} pad_y_min {ys|min} pad_y_max {ys|max}"
    # Z is recorded per corner but is NOT a pad bound. It is the pad top height
    # above the homed Z datum, and the spread across four corners is how level
    # the brush sits. A large spread means the scrub depth varies across the pad
    # and z_deep cannot be a single number.
    RESPOND PREFIX="brush" MSG="taught Z per corner {zs} - spread {(zs|max - zs|min)|round(3)}mm"
    RESPOND PREFIX="brush" MSG="paste into _BRUSH and set margin 0.5. Current config says {printer['gcode_macro _BRUSH'].pad_x_min}..{printer['gcode_macro _BRUSH'].pad_x_max}"


[gcode_macro _BRUSH_CHECK_TAP]
description: Reject an implausible tap before anything moves at depth.
# MUST be a separate macro. Klipper renders a macro's whole template BEFORE
# executing any of its lines, so a {printer...} read inside CLEAN_NOZZLE would
# report the position from before the tap ran. A nested macro is rendered when
# the calling line executes, which is the only way to see post-tap state.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set z = printer.gcode_move.gcode_position.z|float %}
    {% if z < b.tap_min or z > b.tap_max %}
        { action_raise_error("CLEAN_NOZZLE: tap returned Z %.3f, outside the plausible "
          "%.2f..%.2f window. Refusing to scrub -- at this reading the pass would be "
          "%.1f mm off the pad. Check the nozzle is clean and retry."
          |format(z, b.tap_min, b.tap_max, z - b.pad_top)) }
    {% endif %}
