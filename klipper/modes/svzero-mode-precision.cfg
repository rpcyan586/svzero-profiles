# PRECISION MODE -- slow, quiet, fine-detail printing. See docs/PRECISION.md.
#
# INSTALL: the download ships this as svzero-mode-precision.cfg.off. Copy it
# into the pack's svzero/ directory under that name, which leaves the printer in
# standard mode. The firmware-matched pack file ends
# with [include svzero-mode-*.cfg], so renaming this to svzero-mode-precision.cfg
# and restarting Klipper selects precision mode, and renaming it back returns to
# standard. Microsteps can only change in config, so a mode never changes at
# runtime. With the optional svzero_mode_switch Moonraker component, a job
# sliced for the other mode does the rename and restart itself.
#
# The pack include must come AFTER printer.cfg's stepper sections, as INSTALL.md
# places it: the later value of a key wins (configfile.py merges same-named
# sections). The handshake checks this and refuses a precision job otherwise.
#
# In precision mode the handshake refuses any job not sliced for it, before
# heating. Slice with the precision printer profile.

[gcode_macro _SVZERO_PACK]
variable_mode: "precision"
# What this file sets, so the handshake can tell it was applied.
variable_mode_microsteps: 64

# 64 microsteps, interpolation off, spreadCycle: Klipper's own recommendation
# for accuracy (docs/PRECISION.md). Homing is unaffected:
# X and Y home on physical switches, not stallguard.
[stepper_x]
microsteps: 64
[stepper_y]
microsteps: 64

# corgi108's chopper recipe (docs/PRECISION.md), TPFD at 5 as he later suggested for
# plain Klipper. 1.4 A against stock 3.5 A (operator, 2026-10-14; it was
# corgi108's 2.4 A, which the standard tiers now run): a noise and heat choice,
# at accelerations of 4000 mm/s^2 at most. TPFD is the per-unit value to tune.
[tmc5160 stepper_x]
interpolate: false
run_current: 1.4
driver_TBL: 3
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 3
driver_TPFD: 5
[tmc5160 stepper_y]
interpolate: false
run_current: 1.4
driver_TBL: 3
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 3
driver_TPFD: 5

# Step-rate budget: peak per-motor rate on CoreXY is 5 x microsteps x v x sqrt(2)
# steps/s. Stock's 1200 mm/s at 16 microsteps is about 136k steps/s; the same
# rate at 64 allows 300 mm/s. 4000 mm/s^2 is the precision tiers' travel acceleration
# (Prusa Core One 0.25 DETAIL), the highest any precision tier asks for.
[printer]
max_velocity: 300
max_accel: 4000

# The ceiling above is only a starting value. SET_VELOCITY_LIMIT and M204 ASSIGN
# limits rather than clamping them (toolhead.py), so a sliced job or a UI slider
# could raise the machine past its own step-rate budget. These two wrappers clamp
# every request to the ceiling and say so when they do.
[gcode_macro _SVZERO_PRECISION]
description: Precision-mode motion ceiling; read by the SET_VELOCITY_LIMIT and M204 wrappers.
variable_max_velocity: 300.0
variable_max_accel: 4000.0
gcode:
    {% set c = printer["gcode_macro _SVZERO_PRECISION"] %}
    RESPOND PREFIX="svzero" MSG="precision mode ceiling: velocity={c.max_velocity} accel={c.max_accel}"

[gcode_macro SET_VELOCITY_LIMIT]
description: Precision mode: SET_VELOCITY_LIMIT, clamped to the mode's ceiling.
rename_existing: _SVZERO_SVL_BASE
gcode:
    {% set c = printer["gcode_macro _SVZERO_PRECISION"] %}
    {% set ns = namespace(args="", clamped="") %}
    {% for k, v in params.items() %}
        {% set cap = c.max_velocity if k == "VELOCITY" else (c.max_accel if k in ("ACCEL", "ACCEL_TO_DECEL") else none) %}
        {% if cap is not none and v|float > cap|float %}
            {% set ns.clamped = ns.clamped ~ " " ~ k ~ "=" ~ v ~ ">" ~ cap %}
            {% set ns.args = ns.args ~ " " ~ k ~ "=" ~ cap %}
        {% else %}
            {% set ns.args = ns.args ~ " " ~ k ~ "=" ~ v %}
        {% endif %}
    {% endfor %}
    {% if ns.clamped %}
        RESPOND PREFIX="svzero" MSG="precision mode clamped{ns.clamped}"
    {% endif %}
    _SVZERO_SVL_BASE{ns.args}

[gcode_macro M204]
description: Precision mode: M204, clamped to the mode's acceleration ceiling.
rename_existing: M99204
gcode:
    {% set cap = printer["gcode_macro _SVZERO_PRECISION"].max_accel|float %}
    {% set ns = namespace(args="", clamped="") %}
    {% for k, v in params.items() %}
        {% if k in ("S", "P", "T") and v|float > cap %}
            {% set ns.clamped = ns.clamped ~ " " ~ k ~ "=" ~ v ~ ">" ~ cap %}
            {% set ns.args = ns.args ~ " " ~ k ~ cap %}
        {% else %}
            {% set ns.args = ns.args ~ " " ~ k ~ v %}
        {% endif %}
    {% endfor %}
    {% if ns.clamped %}
        RESPOND PREFIX="svzero" MSG="precision mode clamped M204{ns.clamped}"
    {% endif %}
    M99204{ns.args}
