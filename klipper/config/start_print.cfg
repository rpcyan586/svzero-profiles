# START_PRINT — clean, settle the bed, calibrate Z, mesh, and park for heating
#
# Include AFTER Macro.cfg and after nozzle_brush.cfg. Includes apply linearly
# and duplicate sections merge with the later one winning
# (configfile.py uses RawConfigParser(strict=False)), so this overrides Sovol's
# START_PRINT without editing their file, which factory_resets.sh overwrites.
#
# RELEASED STARTUP ORDER
#
# Public slicer profiles set bed/chamber policy, select the cleaning material,
# and wait with M190 BEFORE calling START_PRINT. That early wait is deliberate:
# the same profiles must work with stock Sovol macros when this pack is absent.
# SET_CLEAN_TEMP also starts nozzle heating before that early bed wait.
#
# This replacement cleans, optionally tunes the camera, waits for the current
# bed target again, calibrates Z, rehomes Z and meshes. CLEAN_NOZZLE uses a
# taught pad height without an initial datum tap, but DOES probe after wiping.
# That final cleaning probe is separate from Z_OFFSET_CALIBRATION below.
#
# After mesh, release any chamber-helper bed carry and park over the pad.
# The slicer then heats to printing temperature and calls PURGE_LINE, which
# owns the purge placement and the return of cleaning/end-retract debt.
#
# Earlier comments described overlapping cleaning with the bed's final coast
# after chamber preheat. The released profiles retain their early M190 and do
# not depend on that overlap. Removing it requires reviewing the complete
# sequence, including the cleaner's final probe. See docs/STARTUP.md.

[gcode_macro START_PRINT]
description: Clean the nozzle, settle the bed, calibrate Z and mesh, then park for heating.
gcode:
    # Say so when the slicer never identified itself. Inert if svzero_pack.cfg
    # is not installed: the guard checks for the section before calling.
    {% if 'gcode_macro _SVZERO_PACK' in printer %}_SVZERO_CHECK_PROFILE{% endif %}
    {% if printer.save_variables.variables.was_interrupted|float == True %}
        PRINT_END #Clear the last printed power-off information
        CHANG_ROOT_MAIN
        SET_DISPLAY_TEXT
    {% endif %}
    _CHAMBER_AUTOSTART   # chamber_fan.cfg: honour M141, else infer from bed
    CLEAR_PAUSE
    M117 Clean Nozzle
    # No slicer named a material, so ask the spool, then the last print. Guarded
    # on the section existing so a partial install just skips it, and on
    # clean_temp being unset so a job that DID name its material always wins.
    {% if 'gcode_macro _BRUSH_INFER_CLEAN_TEMP' in printer
          and printer["gcode_macro _BRUSH"].clean_temp|float <= 0 %}
        _BRUSH_INFER_CLEAN_TEMP
    {% endif %}
    CLEAN_NOZZLE
    # Measure the stationary scene after cleaning, before calibration and mesh.
    # The optional extra pins manual exposure and searches a bounded set of
    # white-strip/exposure pairs. It never moves or changes a heater target.
    {% if 'camera_tune' in printer %}
        CAMERA_TUNE STARTUP=1
    {% endif %}
    # NOT rounded, and the target is re-sent unchanged rather than recomputed.
    # chamber_preheat releases the plate to target + bed_carry, a deliberate
    # fractional offset sized against PID_SETTLE_DELTA; rounding here would
    # silently discard it and command a different bed than the preheat chose.
    {% set bed = printer.heater_bed.target|float %}
    {% if bed > 0 %}
        M117 Bed Settle
        M190 S{bed}
    {% endif %}
    SET_GCODE_OFFSET Z=0
    M117 Eddy Calibration
    # EXTRUDER_TEMP IS PASSED, and not passing it was costing a plateau and a
    # decision. z_offset_calibration.py defaults it to 130 and then blocks on
    # M109, so a start that only sent BED_TEMP went 195 -> 150 -> 130 -> 280:
    # CLEAN_NOZZLE ends its scrub at probe_temp, the calibration pulled the
    # nozzle down another 20 C, waited for it, and only then reheated to print.
    # Measured on the 2026-09-04 ABS job at about 1.5 minutes of pure wait.
    #
    # Worse than the time, it silently reverted a deliberate choice. probe_temp
    # was raised 130 -> 150 because 0dysseusRex probes his load cell at 150
    # (nozzle_brush.cfg), and the tap was happening at 130 regardless. Sending
    # probe_temp makes the tap temperature one number in one place, and the
    # M109 returns immediately because the nozzle is already there.
    # Guarded like end_print.cfg guards _COOL_STATE: the pack is modular, and a
    # machine without nozzle_brush.cfg must still run this. The fallback is
    # z_offset_calibration.py's OWN default, so an installation without the
    # brush behaves exactly as it did before this line existed.
    # `|default` rather than an `in printer` test: the section can be present
    # while the variable is not, and only the filter survives both. The fallback
    # is z_offset_calibration.py's OWN default, so an installation without
    # nozzle_brush.cfg behaves exactly as it did before this line existed.
    {% set probe_temp = printer["gcode_macro _BRUSH"].probe_temp|default(130.0)|float %}
    # Select the calibration path from the configured probe object.
    #
    # Stock 1.3.7 configures probe_pressure and an eddy sensor. Stock 1.4.x
    # uses eddy contact instead; the physical load cell may still be present.
    # Their z_offset_calibration.py implementations differ.
    #
    # In the preserved 1.3.7 implementation, METHOD=force_overlay bypasses
    # the already-calibrated/default-method skip. It runs load-cell reference
    # work AND eddy calibration, not just a scalar SET_GCODE_OFFSET operation.
    #
    # On 1.4.7, any non-default METHOD would likewise bypass the skip and
    # force contact calibration on every start. Leave METHOD at its default
    # when probe_pressure is absent so that firmware can skip existing data.
    {% if 'probe_pressure' in printer %}
        Z_OFFSET_CALIBRATION METHOD=force_overlay BED_TEMP={printer.heater_bed.target} EXTRUDER_TEMP={probe_temp}
    {% else %}
        Z_OFFSET_CALIBRATION BED_TEMP={printer.heater_bed.target} EXTRUDER_TEMP={probe_temp}
    {% endif %}
    G28 Z
    M117 Mesh Calibration
    BED_MESH_CALIBRATE
    # DROP bed_carry NOW THAT PROBING IS DONE. chamber_preheat leaves the plate
    # at target + bed_carry, which is right for the wipe, the tap and the mesh --
    # the extra half degree nudges the chamber and stays inside
    # PID_SETTLE_DELTA -- but the PRINT should run on the number the slicer
    # asked for. Without this the whole job ran 0.5 C hot and the console said
    # 100.5 where the profile said 100.
    #
    # One-shot: the value is consumed and cleared, so a job that never called
    # M191 has nothing to restore and this is inert.
    # print_bed_target is written by M191 (chamber_fan.cfg) and cleared to the
    # STRING "None" by the reset path, so it cannot be |float'd unguarded.
    {% set raw_bed = printer["gcode_macro _CH_STATE"].print_bed_target %}
    {% set real_bed = raw_bed|float if raw_bed not in (None, "None", "") else 0.0 %}
    {% if real_bed > 0 and (printer.heater_bed.target|float - real_bed)|abs > 0.01 %}
        M140 S{real_bed}
        RESPOND PREFIX="preheat" MSG="bed back to the printing target {real_bed}C, carry released"
    {% endif %}
    {% if real_bed > 0 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_bed_target VALUE=0.0
    {% endif %}
    # PARK OVER THE BRUSH FOR THE FINAL HEAT-UP.
    #
    # The slicer's M104/M109 to first-layer temperature runs immediately after
    # this macro returns, and the ramp from probe_temp to 280 C on ABS produces
    # a real bead. Until now it happened wherever BED_MESH_CALIBRATE left the
    # toolhead, which on the 2026-09-07 job was inside the part volume.
    #
    # The pad is the right catcher and it already exists for this: it is at
    # NEGATIVE X, off the front-left of the plate, so nothing that drips here
    # can land on the print. Existing retraction does not eliminate heat-up
    # ooze; keeping the wait over the pad controls where that material lands.
    #
    # Z FIRST, THEN XY. The mesh leaves the nozzle near the plate; moving X to
    # -8.65 at that height would drag it across the bed and off the front edge.
    # The start G-code's own `G1 Z5` follows this and is harmless: same axis,
    # same direction, already there.
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set park_x = (b.pad_x_min|float + b.pad_x_max|float) / 2.0 %}
    {% set park_y = (b.pad_y_min|float + b.pad_y_max|float) / 2.0 %}
    G90
    G1 Z5 F600
    G1 X{park_x|round(2)} Y{park_y|round(2)} F6000
    RESPOND PREFIX="start" MSG="parked over the brush for the heat-up, ooze lands on the pad"

    save_last_file
    # STOCK IS `M117 {last_file}` AND IT HAS NEVER SHOWN ANYTHING. `last_file`
    # is a save_variable (plr.cfg writes it), not a Jinja global, so the bare
    # name is Undefined and Klipper renders Undefined as an empty string rather
    # than raising -- an M117 with no argument, on every print since launch.
    #
    # Reading it back through printer.save_variables would be wrong too, and
    # more subtly: Klipper renders a macro completely before executing any of
    # it, so the value here would be the one save_last_file wrote LAST job, not
    # the one on the line above. print_stats.filename is already this job's and
    # is correct at render time.
    M117 {printer.print_stats.filename}
