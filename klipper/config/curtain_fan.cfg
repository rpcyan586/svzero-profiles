# Rear-curtain / auxiliary fan electrical configuration selected by the
# 2026-08-17 two-printer characterization campaign. This overrides the stock
# [fan_generic fan2] section when included after printer.cfg's stock section.
# See notes/runbook-curtain-fan.md.

[fan_generic fan2]
pin: PE11
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.030
kick_start_time: 0.100
off_below: 0.0
tachometer_pin: ^PE13
tachometer_ppr: 2
tachometer_poll_interval: 0.0012
