# Rear-curtain / auxiliary fan electrical configuration selected by the
# 2026-08-17 two-printer characterization campaign. This overrides the stock
# [fan_generic fan2] section when included after printer.cfg's stock section.
# See notes/runbook-curtain-fan.md.

[fan_generic fan2]
pin: PE11
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.030
kick_start_time: 0.100
# Published floor. A slicer M106 P2 below this turns the fan off instead of
# leaving it powered and stalled. Measured 2026-08-17: 14% held five minutes
# at 30 ms on both units, 15% at 10-15 ms; 0.15 is one point above the bench
# floor, and in-service floors run higher than bench ones. cooldown.cfg
# never asks for less than its curtain_min of 0.20.
off_below: 0.15
tachometer_pin: ^PE13
tachometer_ppr: 2
tachometer_poll_interval: 0.0012
