# Post-print controlled cooldown — synchronized bed and chamber ramp
#
# Include AFTER Macro.cfg, chamber_fan.cfg and end_print.cfg. Optional: a
# printer without this file prints exactly as before, because END_PRINT and
# CANCEL_PRINT both guard on `'gcode_macro _COOL_STATE' in printer`.
#
# WHAT IT DOES
#
# Sovol's END_PRINT drops the bed and the chamber from print temperature to
# ambient in one step. This holds both on a scheduled descent to a common
# endpoint so the part and the plate contract together instead of the part
# shrinking against a plate still held at 110 C.
#
# NOT ANNEALING. PC's Tg is around 147 C and it prints on a 110 C plate, so the
# part is already glassy before the ramp starts and no stress relaxation is
# available at these temperatures. What the ramp buys is a smaller part-to-plate
# differential, no exhaust draft across one face, and a smaller top-to-bottom
# gradient. The re-warm destress cycle some community macros run afterwards is
# deliberately NOT implemented here.
#
# THE ARITHMETIC, recovered from the 2026-01-02 design. See
# notes/design-end-print-cooldown.md.
#
#   t_total = max((C0 - final) / chamber_rate, (B0 - final) / bed_rate)
#   rc      = (C0 - final) / t_total          actual chamber rate
#   rb      = (B0 - final) / t_total          actual bed rate
#
# Taking the max means the SLOWER constraint governs and the other is slowed to
# match, so both arrive at the endpoint together and neither cap is violated.
# The 40/70 edge case is why: a chamber-only schedule there would demand
# 10.5 C/min from the bed.
#
# TWO ACTUATOR MODELS, one macro.
#
# With a chamber heater installed the trajectory is a real setpoint: the heater
# gets it, and the exhaust ceiling is held `deadband` degrees ABOVE it so the
# exhaust is only ever a brake against overshoot. Without that gap a watermark
# heater with max_delta 1.0 drives to T+1 while the exhaust PI vents above T,
# and the two burn power into the room for the length of the ramp.
#
# Without a chamber heater the exhaust is the only actuator and it can only
# cool, so the trajectory is a CEILING: the chamber falls passively and the fan
# runs only when the chamber is lagging the schedule. Same arithmetic, same
# state machine, and the fan is idle for most of a normal descent.
#
# WHY NOT M141 PER STEP
#
# M141 is the right user-facing command and the wrong per-tick one, twice over.
# It calls CHAMBER_ON, which zeroes the PI integral and the priming flags -- so
# re-issuing it every 40 s would reset the chamber controller roughly fifty
# times across one ramp. And it sets _CH_STATE.requested, the RAM flag
# _CHAMBER_AUTOSTART consumes to mean "the slicer asked for this chamber target
# THIS print"; leaving it set would make the next print believe the slicer had
# requested a 37 C ceiling. The loop re-reads ch_target from save_variables on
# every iteration, so writing it directly moves the ceiling with no side
# effects at all.

[gcode_macro _COOLDOWN_CFG]
description: Settings for the post-print cooldown ramp. Edit here, not in the macros.
# Common endpoint for bed and chamber. Operational, not a Tg calculation:
# below anything that matters here, above room temperature so the ramp is not
# servoing to ambient, and a clean point to release active control.
variable_final: 35.0
# Maxima on the COMMANDED target descent, not guarantees about measured
# temperature. Recovered 2026-01-02 design constants. The material table in
# source/filament-cooldown.json overrides them per print via COOLDOWN_ARM.
# 0 = no chamber leg, matching every row of _COOLDOWN_MATERIALS. This is the
# fallback used when NO material was identified, and leaving it at 1.5 would
# have meant an unidentified spool still ran a chamber ramp that every named
# material had opted out of -- which is also the path the last real ramp took,
# with material "default".
variable_chamber_rate: 0.0
variable_bed_rate: 5.0
# Nominal chamber quantum. The real step is derived from the achieved rate and
# the cadence, so this only sets how fine the staircase is. At the recovered
# 1.5 C/min it produces the original 1 C every 40 s.
variable_chamber_step: 1.0
# How far above the chamber-heater setpoint the exhaust ceiling sits. Ignored
# entirely when no chamber heater is installed.
variable_deadband: 2.0
# SETTLE PHASE: the bed holds its print target until the NOZZLE HAS COOLED TO
# THE BED, then the ramp begins (operator, 2026-09-14). Once the hotend is no
# hotter than the plate it is no longer adding heat above it, so there is
# nothing left to wait for -- a few minutes after a hot ABS nozzle is switched
# off.
#
# It used to wait for the chamber to go flat, and that was not useful. The
# slope first came from the chamber loop, which reads 0.0 whenever the loop is
# off, so settle ended at its 3-minute floor regardless. Measured from the
# sensor instead, it held print 2 of 2026-09-14 for 10.5 min against the 10-min
# cap, bed at 100 C, with the chamber still falling when the ramp started.
#
# settle_max stays as a backstop, so a nozzle that never reads below the bed --
# a missing sensor, a reheated hotend -- cannot hold the plate indefinitely.
variable_settle_max: 600
variable_settle_tick: 15
# park_z IS GONE, not merely unset. END_PRINT parked at a fixed high Z for the
# whole ramp, reasoning that the stock chamber sensor is corrupted by bed
# geometry below about 68 mm. Removed 2026-09-03: that corruption is present
# through the preheat and the print too, so parking high for the cooldown does
# not fix a sensor, it only makes the cooldown the one phase measured
# differently. Deleted rather than defaulted to zero, because a knob left
# sitting here is an invitation to switch the behaviour back on without
# re-reading why it went.
# Absolute watchdog. Whatever else happens, heaters are off by here.
variable_max_seconds: 5400
# Report once when the bed is coasting this far above its commanded setpoint:
# natural loss is slower than the schedule, so the trajectory is aspirational
# and the bed heater has no authority left. Informational, not an abort -- the
# target keeps descending and the bed catches up.
variable_coast_delta: 5.0
# Any larger disagreement between what we last commanded and what the heater
# actually holds means somebody else moved it. Abort rather than fight them.
variable_override_delta: 0.5
# Head-room added to the idle_timeout extension. See _COOLDOWN_TICK.
variable_idle_margin: 300
# HOW OFTEN THE RAMP RE-EVALUATES, in seconds. Decoupled from the step size on
# 2026-09-05. It used to be that the tick period WAS the schedule: each tick
# subtracted one c_step from the last commanded value, so the only way to get a
# finer descent was a shorter step, and the only way to get a shorter step was
# a faster tick. `interval` therefore had to be ~104 s to make a 1 C chamber
# step come out at 1.5 C/min, and the console went silent for that whole time.
#
# The commanded value is now a function of ELAPSED SECONDS -- c0 - rate * t --
# so this only sets how often that function is sampled and how promptly the
# assist and the abort guards see the world. Granularity of the descent no
# longer depends on it at all.
variable_ramp_tick: 15
# How often to say something while settling or ramping. The macro has no wall
# clock -- Klipper's Jinja environment exposes no time-of-day -- so progress is
# reported as minutes remaining rather than as a finish time.
variable_report_seconds: 60
gcode:

# THE MATERIAL TABLE LIVES HERE, not in the slicer.
#
# It used to be generated into the start G-code from
# source/filament-cooldown.json, which meant the numbers existed twice and a
# print sliced anywhere else silently got the generic row. Now the slicer only
# NAMES the material and Klipper owns the policy, so the same print gets the
# same descent from Orca, from PrusaSlicer, from Sovol's stock profile, or from
# no slicer involvement at all -- the spool itself can name it.
#
# Keys are normalize_material() output from spool_guard.py: lowercased with
# non-alphanumerics stripped. Matched exactly, then by prefix over `order`,
# which is sorted longest-first so "plaplus" lands on PLA and "petg" is never
# swallowed by a shorter key.
#
# RATES ARE MAXIMA ON THE COMMANDED DESCENT and are chosen against the MEASURED
# passive decay curve in notes/data/cooldown/zero2-passive-decay-20260903.md:
#
#   bed 90-100 C  5.06 C/min     50-60 C  1.02
#       80- 90    3.46           40-50    0.58
#       70- 80    2.61           30-40    0.22
#       60- 70    1.84           20-30    0.07
#
# A commanded rate BELOW that curve is one the bed heater can hold, and it
# brakes the descent. A rate ABOVE it is one the bed cannot follow unaided, and
# it is the assist's job to make up -- see _COOLDOWN_ASSIST_CFG. The old
# recovered default of 5.0 C/min sat above the curve everywhere below 90 C,
# which is why it did nothing.

[gcode_macro _COOLDOWN_MATERIALS]
description: Per-material descent policy. Data, not a command.
# THE CHAMBER LEG IS OFF. All chamber rates are 0, so every ramp is bed-only.
#
# Operator's call, 2026-09-08: "the chamber rampdown is irrelevant, focus on the
# bed". The reasoning is sound and the measurement supports it. The chamber has
# no heater on this machine, so a descending chamber CEILING is not a
# temperature schedule at all -- it is a request to the exhaust PI loop, which
# already has the forced-cooling assist as a far more direct handle on the same
# fan. And the chamber tracks the plate anyway: it is the plate that heats it.
# Scheduling both legs was asking two controllers to chase one physical
# coupling.
#
# It also removes an entire failure class. A chamber leg CLAIMS the ceiling, so
# any other writer of ch_target aborts the ramp -- which is exactly what killed
# the 2026-09-07 ABS cooldown on its first tick. With chamber 0 and the assist
# idle, ch_claimed is false and there is nothing to collide over.
#
# The rates are kept here rather than deleted, at 0, because the column is the
# record of what the policy USED to be and re-enabling one material is then a
# one-number change. Previous values, C/min: abs 1.0, asa 1.0, pc 0.8,
# petg 1.5, pla 2.0, tpu 1.5, pa 2.0.
variable_table: {
        "abs":  {"final": 35.0, "bed": 1.5, "chamber": 0.0},
        "asa":  {"final": 35.0, "bed": 1.5, "chamber": 0.0},
        "pc":   {"final": 35.0, "bed": 1.0, "chamber": 0.0},
        "petg": {"final": 35.0, "bed": 2.0, "chamber": 0.0},
        "pla":  {"final": 30.0, "bed": 3.0, "chamber": 0.0},
        "tpu":  {"final": 35.0, "bed": 2.0, "chamber": 0.0},
        "pa":   {"final": 35.0, "bed": 5.0, "chamber": 0.0}
    }
variable_order: ["petg", "abs", "asa", "pla", "tpu", "pc", "pa"]
gcode:
    {% set m = printer["gcode_macro _COOLDOWN_MATERIALS"] %}
    RESPOND PREFIX="cool" MSG="materials {m.table|length} rows, order {m.order|join(' ')}"

# FORCED-COOLING ASSIST -- the other half of the authority.
#
# The bed heater can only ever SLOW the descent: it holds the plate above where
# losses alone would take it. Past the point where the commanded rate crosses
# the passive curve the heater has nothing left to give, and the schedule simply
# runs away underneath the real temperature. That crossover is at 62 C for ABS
# at 1.5 C/min, and everything below it was uncontrolled.
#
# The two fans cool. They are the only actuators that can pull the bed BELOW its
# passive curve, and they are what lets a schedule be tracked rather than merely
# braked. Both are gated, because forced air across a part is also the warp
# mechanism the whole ramp exists to avoid:
#
#   bed_ceiling  -- no assist at all while the bed is above this. One number
#                   does the right thing for every material: an ABS part off a
#                   100 C plate is far below Tg by the time the bed reaches
#                   60 C, while a PLA part off a 60 C plate qualifies almost
#                   immediately, which is exactly when its curtain air is
#                   wanted anyway.
#   error_on/off -- engage only once the bed has fallen BEHIND the schedule by
#                   error_on, release at error_off. Hysteresis, so a bed sitting
#                   on the threshold does not chatter the fans.
#
# THE EXHAUST IS NOT DRIVEN DIRECTLY. On this machine it is _CH_HW.fan, owned by
# the chamber PI loop, and a direct SET_FAN_SPEED would be overwritten on that
# loop's next tick and would fight it in between. The ramp already owns
# ch_target, so the assist pulls the chamber CEILING down instead and lets the
# PI spend the fan. That composes with the controller rather than racing it.
#
# CURTAIN DEFAULTS OFF. It is the actuator with real authority over the bed --
# it blows across the plate rather than venting the box -- and it is therefore
# also the one that can ruin a part. The architecture supports it, the ceiling
# guards it, and turning it on is one variable.

[gcode_macro _COOLDOWN_ASSIST_CFG]
description: Forced-cooling assist settings. Data, not a command.
variable_exhaust_enable: 1
variable_curtain_enable: 0
# Engage / release hysteresis on the schedule error, in C. Lowered from 3.0 on
# 2026-09-05: a positive error already means the bed heater is at zero power and
# out of authority, so waiting for three whole degrees of it was waiting for the
# schedule to be visibly lost before doing anything about it.
variable_error_on: 1.0
variable_error_off: 0.3
# ---- PI ON THE SCHEDULE ERROR, 2026-09-13 --------------------------------
#
#   demand = exhaust_floor + assist_kp * (err - error_on) + I
#
# in exhaust-equivalent duty, clamped to [exhaust_floor, exhaust_max], or to
# exhaust_max + k * curtain_max while the curtain is allowed. I grows by
# assist_ki * (err - error_on) per minute while the assist is engaged, with
# anti-windup; see _COOLDOWN_TICK for the rules.
#
# Replaces exhaust_span, a proportional band of 5 C that left 5 C of standing
# error with both fans near 0.4 on Zero2's curtain cooldowns. With the operator's
# rule -- a large error puts the fans at their ceiling -- kp 0.75 takes the
# exhaust from its floor to full 1.15 C past error_on, and both fans to full
# 2.5 C past it. ki 0.25 per C per minute gives an integral time kp / ki of
# 3 min, about three times the 30-60 s the plate took to answer the curtain step
# on 2026-09-13. Both are STARTING POINTS, not tuned values.
variable_assist_kp: 0.75
variable_assist_ki: 0.25
# Bed heater duty at or below which the assist may engage, on the error or on
# its projection. Above it the heater still has authority, whatever the error
# says: the first 1 C ramp step reads as a 1 C error before the heater has
# answered it (Zero2, 2026-09-14, heater at 17 %).
variable_authority_power: 0.02
# 0 means "use ch_minfan", the adaptively-learned duty at which this rotor
# reliably turns. Commanding less than that is commanding a stalled fan.
variable_exhaust_min: 0.0
variable_exhaust_max: 1.0

# ---- BLENDED THROTTLE ------------------------------------------------------
#
# The exhaust is the loud one, and it is the one Sovol themselves gave up on:
# stock 1.4.x runs it as [temperature_fan exhaust_fan] with max_power: 0.8.
# They did not say why. We take the number and not the reasoning -- it is the
# only published statement about how hard this rotor should be pushed.
#
# So the exhaust runs alone up to curtain_latch, and the NEXT increment of
# cooling is bought from the curtain instead. The ladder, in exhaust-equivalent
# duty (see curtain_strength_factor):
#
#   A  demand <= knee   exhaust = demand, curtain = 0
#   ~  demand == knee   curtain steps to its floor and the exhaust steps DOWN
#                       to ITS floor. Total cooling is unchanged across the
#                       handover -- that is what defines the knee:
#
#                           knee = exhaust_floor + k * curtain_floor
#
#                       0.13 + 1.0 * 0.20 = 0.33 at the shipped numbers.
#   B  above the knee   both rise TOGETHER, by equal increments d, so
#                       exhaust = e_floor + d and curtain = c_floor + d.
#
# REVISED 2026-09-08, on the operator's call: bring the curtain in SOONER and
# run both gently, rather than spending the exhaust alone up to 0.80 first.
#
# The old ladder latched at 0.80 and then held the exhaust at 0.60 while the
# curtain climbed alone to meet it -- a three-phase shape whose middle phase
# existed only to bring two unequal duties into equality. The knee is now the
# LOWEST demand at which both fans can run at their own floors simultaneously,
# which is the earliest point the pair is even expressible, and above it there
# is a single rule. Phase B of the old design is gone.
#
# The two fans never become equal under the new rule: they stay
# c_floor - e_floor apart, 0.07 at the shipped numbers. That is a feature, not
# a rounding error. Each floor is that fan's own measured stall point, so
# holding the offset keeps BOTH above their own floors by construction, where
# equal duties would have had to pick one fan's floor to respect.
#
# d is split so the arithmetic closes exactly: total = e + k*c = demand for all
# d, which is what makes the handover seamless and keeps the schedule's demand
# meaningful rather than approximate.
#
# WHY THIS IS THE BETTER TRADE. Fan noise goes roughly as the fifth power of
# speed, so two fans at 40% are far quieter than one at 80% for similar air --
# and the old ladder deliberately gave that up to spend the "safe" actuator
# first. Running both gently from 0.33 keeps each rotor out of its loud fifth
# for the whole of the normal working range, and extreme duty at EITHER
# location is what causes trouble: the exhaust is the loud one, the curtain is
# the one that can crack a part. Neither now approaches its extreme until the
# schedule is genuinely desperate. bed_ceiling still gates the curtain
# entirely on a hot plate, so the "safe actuator first" argument is preserved
# where it actually bites.
#
# WHY EXTRACTION FIRST, when sharing the load between two fans would be
# QUIETER at every point below the latch (fan noise goes roughly as the fifth
# power of speed, so 2 x 70% beats 1 x 100%): the curtain is not a free
# actuator. It blows across the part rather than extracting from the chamber,
# so it carries a warp and crack risk the exhaust does not -- which is what
# bed_ceiling below exists for. Spending the safe actuator first is worth more
# than the decibels, and the latch at 0.80 already banks most of the acoustic
# win by keeping the extractor out of its loudest fifth while a quieter option
# is still available.
#
# UNMEASURED, AND THE ONE NUMBER THAT MATTERS. k is how much chamber cooling
# one point of curtain duty buys, expressed in points of exhaust duty. 1.0 says
# they are worth the same, which is a PLACEHOLDER, not a finding: the 2026-08-17
# curtain campaign says in as many words that its traces "cannot rank curtain
# settings thermally". This comment used to argue for k < 1 on the grounds
# that the curtain mostly stirs chamber air. It does not: the stock curtain is
# an INLET, blowing room air across the part (operator, 2026-09-13). At the one
# clean handover so far -- 2026-09-13, 2.5 C/min to 30 C -- the plate went from
# 1.9 to 3.2 C/min as the curtain came in at 0.44 while the exhaust was still
# ramping down from 0.69, which leans toward k > 1 but is not a measurement.
# Fitting both cooldowns for k gave 41.6 or -0.01 depending on the reference
# temperature, so it is unidentifiable from ramp data. Holding the plate and
# reading bed power per fan per duty is the measurement. Until then: if the
# handover dips, lower k; if it overshoots, raise it. It is clamped to 0.05 from below,
# because a curtain worth nothing is a curtain that should not run -- express
# that with curtain_enable: 0, not with a factor of zero.
variable_curtain_strength_factor: 1.0
# Where the exhaust stops climbing alone. 0 DERIVES IT as
# exhaust_floor + k * curtain_floor -- the lowest demand at which both fans can
# sit on their own floors at once, and therefore the earliest the pair can be
# expressed at all. Same idiom as exhaust_min: 0 above.
#
# Was 0.80, Sovol's own 1.4.x max_power, when the exhaust ran alone up to it.
# That number has not been discarded -- it is still the only published word on
# how hard this rotor should be pushed -- it is just no longer a KNEE, because
# the exhaust no longer climbs alone to anywhere near it. Set this non-zero to
# put the old behaviour back.
variable_curtain_latch: 0
# Release band, to stop demand hovering at the latch chattering both fans.
# 0.15, up from 0.05 on 2026-09-14. At assist_kp 0.75, 0.05 of demand is 0.07 C
# of error -- inside the bed sensor's own noise -- and on that day's ABS
# cooldown the curtain latched and released 8 times in 8 minutes. 0.15 is 0.2 C.
variable_curtain_unlatch: 0.15
# Lowest duty this rotor was MEASURED turning at: 20% -> 2500 rpm, 2026-08-17.
# Nothing below that was ever tried, so it is a floor of evidence rather than a
# floor of the hardware. NOT the exhaust's 0.13 -- that is a different fan with
# a different learned stall point, and borrowing it would put this one at a duty
# nobody has seen it start from.
variable_curtain_min: 0.20
# curtain_span is gone, 2026-09-13: one demand, driven by the PI, covers both
# fans, so there is no second band to size.
#
# Lowering curtain_max re-parks the burden on the exhaust: the curtain stops at
# its cap and the exhaust resumes climbing alone. It also lowers the ceiling on
# demand, exhaust_max + k * curtain_max.
variable_curtain_max: 1.0
# GATES THE CURTAIN ONLY, not the exhaust. Extraction from the chamber is safe
# on a hot part; a draft across one is what cracks and warps it.
variable_bed_ceiling: 60.0
# ---- LATCH, FLOOR AND RUN-AHEAD -------------------------------------------
#
# Observed 2026-09-07: the assist toggled the exhaust fully on and fully off as
# the error crossed back and forth, and the ramp then FINISHED with the plate at
# 40 C against a 35 C endpoint -- because `done` tested the COMMANDED value,
# which had reached 35 on schedule, rather than the plate, which had not.
#
# Three changes, and they are the same three the blended throttle already makes
# for the two fans:
#
#   LATCH    once the assist has engaged it stays engaged for the rest of the
#            ramp. Releasing to zero and re-engaging is the toggling; there is
#            nothing to be gained by it, because the schedule only ever gets
#            harder from here.
#   FLOOR    while latched the exhaust never returns below its stall floor. It
#            modulates between floor and max instead of between OFF and max.
#   AHEAD    engage on the error PROJECTED assist_lookahead seconds out, not on
#            the error now. The plate's thermal lag is the whole problem; by the
#            time the error is real the fan is already late.
variable_assist_latch: 1
variable_assist_lookahead: 30.0
# The ramp is not over until the PLATE is at the endpoint. finish_grace bounds
# how long it may keep trying past the schedule before giving up and saying so.
variable_finish_tolerance: 1.0
variable_finish_grace: 900.0
gcode:
    {% set a = printer["gcode_macro _COOLDOWN_ASSIST_CFG"] %}
    RESPOND PREFIX="cool" MSG="assist exhaust={a.exhaust_enable|int} curtain={a.curtain_enable|int} on={a.error_on}C off={a.error_off}C ceiling={a.bed_ceiling}C"


[gcode_macro _COOL_STATE]
description: Volatile cooldown state. Not saved, and must not be.
# Volatile ON PURPOSE. This is the _CHAMBER_AUTOSTART pattern: a persisted value
# does not mean "this print asked", it means "somebody asked, possibly three
# prints ago". Everything here dies with a Klipper restart and is consumed on
# use, so an omitted COOLDOWN_ARM falls back to the default policy rather than
# silently reusing the last print's.
variable_active: 0
variable_phase: 0
variable_policy_set: 0
variable_p_final: 35.0
variable_p_chamber_rate: 1.5
variable_p_bed_rate: 5.0
variable_c0: 0.0
variable_b0: 0.0
variable_c_cmd: 0.0
variable_b_cmd: 0.0
variable_c_step: 0.0
variable_b_step: 0.0
variable_interval: 40.0
# THE SCHEDULE ITSELF, in C/min, and its total length in seconds. These are what
# the descent is actually computed from since 2026-09-05; c_step and b_step are
# retained because `c_step > 0` is the chamber-leg predicate used throughout
# this file and because COOLDOWN_STATUS reports them, but nothing derives a
# commanded temperature from them any more.
variable_c_rate: 0.0
variable_b_rate: 0.0
variable_total_s: 0.0
# Seconds-elapsed stamp of the last progress line, so reporting is paced by
# report_seconds rather than by the tick.
variable_last_report: 0
variable_has_heater: 0
variable_elapsed: 0
variable_settle_elapsed: 0
variable_idle_restore: 1800.0
variable_coast_warned: 0
# Resolved once at _COOLDOWN_START and reported, so the console line says which
# policy actually ran rather than leaving it to be inferred from three numbers.
variable_material: "default"
# Whether COOLDOWN_ARM supplied explicit rates. Naming a material is the normal
# case; passing numbers is the experiment case, and it wins.
variable_rates_set: 0
# Assist state. `assist` is the hysteresis latch, not a request.
variable_assist: 0
variable_assist_curtain: 0.0
variable_assist_exhaust: 0.0
# 1 once the blended throttle has handed the marginal cooling to the curtain.
# Held across ticks so the release can carry hysteresis; see _COOLDOWN_ASSIST_CFG.
variable_curtain_latched: 0
# Last value handed to SET_IDLE_TIMEOUT. Klipper's idle_timeout.py answers every
# one with "Timeout set to N s" on the console, and the ramp re-sent the SAME
# number every 15 s tick -- four identical lines a minute for the whole descent.
# Written on change only, like the bed target and the assist floor above it.
variable_idle_set: 0.0
# 1 once the assist has engaged at any point in this ramp. Latched, so the
# exhaust holds its floor instead of switching off and on again.
variable_assist_latched: 0
# Previous tick's schedule error, for the run-ahead projection.
variable_prev_err: 0.0
# The assist PI's integral term, in exhaust-equivalent duty. Zeroed on every
# engagement and at start and clear; see _COOLDOWN_TICK.
variable_assist_i: 0.0
# Seconds spent past the scheduled end waiting for the plate to actually arrive.
variable_overrun_s: 0.0
# A bed sample and the elapsed time it was taken at, for the MEASURED cooling
# rate. The console ETA used to be pure schedule arithmetic -- total_s minus
# elapsed -- which is a promise, not an estimate, and it read 0 while the plate
# was still five degrees out. These let it report what the plate is actually
# doing once there is enough of it to divide by.
variable_eta_bed: 0.0
variable_eta_at: 0.0
# WHAT WE LAST WROTE to ch_target, rather than what we would recompute. The
# override check compares against this: with the assist pulling the ceiling
# below the schedule, a recomputed expectation no longer matches what is on
# disk, and the ramp would abort itself believing the operator had moved it.
variable_ch_written: 0.0
gcode:


[gcode_macro COOLDOWN_ARM]
description: Record this print's cooldown policy. Consumed by END_PRINT.
# Called from the start G-code, next to the generated CLEAN_TEMP block and from
# the same source table. Omitting it is safe and supported: END_PRINT then uses
# the _COOLDOWN_CFG default row, which is the recovered generic design, and the
# print's own bed and chamber temperatures still set the severity.
gcode:
    {% set cfg = printer["gcode_macro _COOLDOWN_CFG"] %}
    {% set explicit = params.FINAL is defined or params.CHAMBER_RATE is defined
                      or params.BED_RATE is defined %}
    {% set final = params.FINAL|default(cfg.final)|float %}
    {% set rc = params.CHAMBER_RATE|default(cfg.chamber_rate)|float %}
    {% set rb = params.BED_RATE|default(cfg.bed_rate)|float %}

    # A ZERO CHAMBER RATE IS LEGAL AND MEANS "NO CHAMBER LEG" -- it is now the
    # shipped default for every material. A zero or negative BED rate is still
    # nonsense: the bed leg is the whole ramp, and a zero there would ask for a
    # descent that never descends. Negative is rejected on both.
    {% if rb <= 0 or rc < 0 %}
        {action_raise_error("COOLDOWN_ARM: bed rate must be greater than zero, chamber rate must not be negative")}
    {% endif %}

    # MATERIAL IS NOW STORED, and naming it is the normal way to use this
    # command. It used to be echoed and discarded, because the policy arrived as
    # three numbers generated into the start G-code. The numbers live in
    # _COOLDOWN_MATERIALS now, so the same print gets the same descent from any
    # slicer -- or from none, when the spool names the material instead.
    #
    # The quoting is the trap the old comment warned about, and it is real:
    # SET_GCODE_VARIABLE runs VALUE through ast.literal_eval, so a bare word
    # raises and a string needs quotes that survive shlex. Single-outside,
    # double-inside is the form that works, as _LIGHT_STATE already does.
    {% set lowered = params.MATERIAL|default("")|lower %}
    {% set clean = lowered|replace("+", "")|replace("-", "")|replace(" ", "")|replace("_", "")|replace("/", "") %}
    {% set name = clean if clean else "default" %}

    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"{name}"'
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=policy_set VALUE=1
    {% if explicit %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_final VALUE={final}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_chamber_rate VALUE={rc}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_bed_rate VALUE={rb}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=1
        RESPOND PREFIX="cool" MSG="armed {name} with explicit rates end={final}C chamber max={rc}C/min bed max={rb}C/min"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=0
        RESPOND PREFIX="cool" MSG="armed {name}, policy from the material table"
    {% endif %}


[gcode_macro _COOLDOWN_START]
description: Begin the synchronized bed and chamber cooldown ramp.
# Called by END_PRINT INSTEAD OF TURN_OFF_HEATERS, and responsible for turning
# them off itself in every path that does not schedule a ramp. END_PRINT has
# already zeroed the extruder with M104 S0 by this point; the bed and, if
# fitted, the chamber heater are still commanded.
gcode:
    {% set cfg = printer["gcode_macro _COOLDOWN_CFG"] %}
    {% set st  = printer["gcode_macro _COOL_STATE"] %}
    {% set sv  = printer.save_variables.variables %}

    # WHICH MATERIAL, in precedence order. The slicer wins when it named one,
    # because a profile naming a material is a claim about THIS job; the spool is
    # a claim about what is loaded, which is almost always the same thing and
    # occasionally is not.
    #
    # spool_guard latched the spool's material into RAM at print start, when it
    # fetched it to check the job against it. Reading it here costs nothing and
    # needs no HTTP call from inside a macro hours later. Guarded with `in
    # printer` so a machine without that extra still runs this file.
    {% set armed = st.material if st.policy_set|int == 1 else "default" %}
    {% set from_spool = printer.spool_guard.material if 'spool_guard' in printer and printer.spool_guard.material else "" %}
    {% set material = armed if armed != "default" else (from_spool if from_spool else "default") %}
    {% set source = "slicer" if armed != "default" else ("spool" if from_spool else "default") %}

    # Exact key, then longest-first prefix, so "plaplus" finds PLA and "petg" is
    # never captured by a shorter row.
    {% set mt = printer["gcode_macro _COOLDOWN_MATERIALS"] %}
    {% set found = namespace(row=None, key="default") %}
    {% if material in mt.table %}
        {% set found.row = mt.table[material] %}
        {% set found.key = material %}
    {% else %}
        {% for key in mt.order %}
            {% if found.row is none and material.startswith(key) %}
                {% set found.row = mt.table[key] %}
                {% set found.key = key %}
            {% endif %}
        {% endfor %}
    {% endif %}

    # Explicit rates count only INSIDE an arming. Belt and braces against the
    # half-armed state: policy_set cleared while rates_set survived would
    # otherwise let one experiment's numbers govern every later print.
    {% set explicit = st.policy_set|int == 1 and st.rates_set|int == 1 %}
    {% set final = st.p_final|float if explicit else (found.row.final|float if found.row else cfg.final|float) %}
    {% set rc_max = st.p_chamber_rate|float if explicit else (found.row.chamber|float if found.row else cfg.chamber_rate|float) %}
    {% set rb_max = st.p_bed_rate|float if explicit else (found.row.bed|float if found.row else cfg.bed_rate|float) %}

    {% set b0 = printer.heater_bed.target|float %}
    # THE COOLDOWN DOES NOT CONTROL THE CHAMBER, since 2026-09-14 (operator).
    # There is no chamber leg any more, whatever the policy row or COOLDOWN_ARM
    # says: no ch_target schedule, no chamber heater setpoint, no chamber loop.
    # When the ramp begins, _COOLDOWN_TAKE_OVER stops every chamber controller
    # and the assist drives the exhaust and curtain itself. c0 is the live
    # chamber reading, carried for the console and nothing else.
    {% set ch_live = printer["temperature_sensor chamber_temp"].temperature|float
                     if 'temperature_sensor chamber_temp' in printer else 0.0 %}
    {% set c0 = ch_live %}
    {% set has_heater = 0 %}

    # cd is zero, so t_ch and rc below are zero and the schedule is the bed
    # alone. The structure is kept so a chamber rate can be reported as ignored.
    {% set cd = 0.0 %}
    {% set bd = [b0 - final, 0.0]|max %}
    # A ZERO RATE MEANS "NO LEG", and it has to be tested BEFORE the division.
    # Testing only the delta divided by zero the moment the chamber rates went
    # to 0 for the bed-only policy: cd is 9.3 C on a 44 -> 35 ramp, so the
    # `cd > 0` guard passed and rc_max was 0. END_PRINT then died with
    # "ZeroDivisionError: float division by zero" and the ramp never armed.
    {% set t_ch = (cd / rc_max) if (cd > 0 and rc_max > 0) else 0.0 %}
    {% set t_bed = (bd / rb_max) if (bd > 0 and rb_max > 0) else 0.0 %}
    {% set t_total = [t_ch, t_bed]|max %}

    {% if t_total <= 0 %}
        TURN_OFF_HEATERS
        RESPOND PREFIX="cool" MSG="nothing to ramp, bed {b0|round(1)}C chamber {c0|round(1)}C already at or below {final}C"
    {% else %}
        # Same test again, and not only to avoid dividing. t_total is the
        # SLOWER leg's duration, so without the rate guard a disabled chamber
        # leg would be handed a brand-new non-zero rate here and run after all
        # -- the one thing the zero was meant to express.
        {% set rc = (cd / t_total) if (cd > 0 and rc_max > 0) else 0.0 %}
        {% set rb = (bd / t_total) if (bd > 0 and rb_max > 0) else 0.0 %}
        # Cadence comes from whichever axis is actually moving. Clamped so a
        # very slow schedule does not sit silent for minutes and a very fast one
        # does not flood the queue.
        {% set drive = rc if rc > 0 else rb %}
        {% set interval = [[60.0 * cfg.chamber_step|float / drive, 10.0]|max, 120.0]|min %}
        {% set c_step = rc * interval / 60.0 %}
        {% set b_step = rb * interval / 60.0 %}

        # Klipper renders a macro completely before executing any of it, so a
        # Jinja failure above means NOTHING here ran -- including the timeout
        # extension -- and the stock idle_timeout remains as the backstop.
        # Extend it only once the schedule is known to be sound.
        {% set idle_restore = printer.configfile.settings.idle_timeout.timeout|float
                              if 'idle_timeout' in printer.configfile.settings else 1800.0 %}

        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=phase VALUE=1
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c0 VALUE={c0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b0 VALUE={b0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_cmd VALUE={c0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_cmd VALUE={b0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_final VALUE={final}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_step VALUE={c_step}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_step VALUE={b_step}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=interval VALUE={interval}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_rate VALUE={rc}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_rate VALUE={rb}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=total_s VALUE={t_total * 60.0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=has_heater VALUE={has_heater}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=elapsed VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=settle_elapsed VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=coast_warned VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=idle_restore VALUE={idle_restore}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"{found.key}"'
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_curtain VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_exhaust VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=curtain_latched VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_latched VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=prev_err VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_i VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=overrun_s VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at VALUE=0.0

        # NOTHING ABOUT THE CHAMBER IS TOUCHED HERE. The settle phase leaves
        # whatever the print left running; _COOLDOWN_TAKE_OVER stops it all when
        # the ramp begins. The old ramp started the chamber loop, claimed
        # ch_target and set the chamber heater here, and every one of those
        # couplings produced a failure of its own -- a full-speed exhaust off a
        # zero target (2026-09-03), a self-abort on the first tick (2026-09-07),
        # a 0.20/min rate limit on the assist and a PI cycling against a
        # stand-in target (2026-09-13).
        {% if rc_max > 0 %}
            RESPOND PREFIX="cool" MSG="chamber rate {rc_max}C/min ignored, the cooldown does not control the chamber"
        {% endif %}

        SET_IDLE_TIMEOUT TIMEOUT={(t_total * 60.0) + cfg.settle_max|float + cfg.idle_margin|float}
        UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.settle_tick}
        RESPOND PREFIX="cool" MSG="ramp {found.key} via {source} bed {b0|round(1)}C to {final}C over {t_total|round(1)}min at {rb|round(2)}C/min, tick {cfg.ramp_tick|int}s, chamber {c0|round(1)}C not controlled"
        # SAY THAT THE HOLD IS DELIBERATE. Phase 1 holds the print's own targets
        # for up to settle_max -- ten minutes by default -- and until 2026-09-05
        # it said nothing at all for the whole of it. The operator reasonably
        # read a silent console with a still-hot bed as a hung cooldown.
        RESPOND PREFIX="cool" MSG="settling first: holding bed {b0|round(0)|int}C until the nozzle cools to it, at most {(cfg.settle_max|float / 60.0)|round(1)}min, then {t_total|round(1)}min of ramp. Total {((cfg.settle_max|float + t_total * 60.0) / 60.0)|round(0)|int}min at most."
    {% endif %}


[delayed_gcode COOLDOWN_TIMER]
gcode:
    _COOLDOWN_TICK


[gcode_macro _COOLDOWN_TICK]
description: One settle or ramp step. Rescheduled by COOLDOWN_TIMER.
gcode:
    {% set cfg = printer["gcode_macro _COOLDOWN_CFG"] %}
    {% set st  = printer["gcode_macro _COOL_STATE"] %}
    {% set final = st.p_final|float %}
    {% set bed_temp = printer.heater_bed.temperature|float %}
    {% set bed_target = printer.heater_bed.target|float %}
    # No chamber override guard, since 2026-09-14. The ramp no longer writes or
    # claims ch_target, so a changed or released ceiling is not the ramp's
    # business: M141 defers while a ramp runs, and nothing here watches it.

    {% if st.active|int == 1 %}
        # A new job has taken the machine. START_PRINT calls COOLDOWN_ABORT
        # through _CHAMBER_AUTOSTART, but a stale tick must never outlive it and
        # pull a preheating bed back down.
        {% if printer.print_stats.state == "printing" %}
            # KEEP_POLICY: this print may already have armed itself behind the
            # same blocking wait that delayed this tick. See _COOLDOWN_CLEAR.
            _COOLDOWN_CLEAR KEEP_POLICY=1
            RESPOND PREFIX="cool" MSG="aborted, a new print has started"

        # Somebody moved the bed setpoint out from under us. Explicit abort
        # beats silently overwriting an operator's command on the next tick.
        {% elif (bed_target - st.b_cmd|float)|abs > cfg.override_delta|float %}
            _COOLDOWN_CLEAR
            RESPOND PREFIX="cool" MSG="aborted, bed target changed to {bed_target|round(1)}C outside the ramp"

        {% elif st.elapsed|int >= cfg.max_seconds|int %}
            _COOLDOWN_FINISH
            RESPOND PREFIX="cool" MSG="watchdog at {st.elapsed|int}s, heaters off"

        {% elif st.phase|int == 1 %}
            # SETTLE. Hold the print's own targets until the nozzle has cooled
            # to the bed, then begin the ramp. See _COOLDOWN_CFG for why this
            # replaced waiting on the chamber slope.
            {% set elapsed = st.settle_elapsed|int + cfg.settle_tick|int %}
            {% set nozzle = printer.extruder.temperature|float %}
            {% set cooled = nozzle <= bed_temp %}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=settle_elapsed VALUE={elapsed}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=elapsed VALUE={st.elapsed|int + cfg.settle_tick|int}

            {% if cooled %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=phase VALUE=2
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE=0
                _COOLDOWN_TAKE_OVER
                UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.ramp_tick}
                RESPOND PREFIX="cool" MSG="settled after {elapsed}s, nozzle {nozzle|round(1)}C at or below bed {bed_temp|round(1)}C, starting ramp"
            {% elif elapsed >= cfg.settle_max|int %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=phase VALUE=2
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE=0
                _COOLDOWN_TAKE_OVER
                UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.ramp_tick}
                # The backstop. A nozzle still above the bed after settle_max is
                # a reheated hotend or a bad reading, not a slow cool, so say
                # which number it stopped on.
                RESPOND PREFIX="cool" MSG="settle cap {cfg.settle_max|int}s reached with the nozzle still at {nozzle|round(1)}C over bed {bed_temp|round(1)}C, starting ramp"
            {% else %}
                # Progress, paced by report_seconds rather than by the tick.
                # Names the two things that end this phase so a watching
                # operator can see which one it is waiting on.
                {% if elapsed - st.last_report|int >= cfg.report_seconds|int %}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE={elapsed}
                    RESPOND PREFIX="cool" MSG="settling {elapsed}/{cfg.settle_max|int}s, nozzle {nozzle|round(0)|int}C, bed {bed_temp|round(0)|int}C - ramp starts when the nozzle is at or below the bed, or at {cfg.settle_max|int}s"
                {% endif %}
                UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.settle_tick}
            {% endif %}

        {% else %}
            # RAMP. One step on each axis, snapped to the endpoint.
            #
            # SNAP, NOT CLAMP. A plain max() leaves the last step at 35.0000001
            # when the step size does not divide the span exactly -- 50 C of bed
            # in 15 steps of 3.3333 lands just above the endpoint in binary
            # floating point. The ramp then spends one extra whole interval
            # commanding a value it has effectively already reached. Snapping
            # inside a tolerance ends it on the tick the arithmetic intended.
            # DRIVEN BY ELAPSED SECONDS, NOT BY AN ACCUMULATOR, since
            # 2026-09-05, and COMMANDED IN WHOLE DEGREES.
            #
            # The old form subtracted one step per tick from the last commanded
            # value. That coupled three things that have no business being
            # coupled: the resolution of the descent, the period of the tick,
            # and how often the abort guards and the assist got to look at the
            # machine. Holding 1.5 C/min with a 1 C step forced a 104 s tick, so
            # the assist could not respond and the console could not speak for
            # nearly two minutes at a time.
            #
            # The schedule is now the straight line it always described --
            # c0 - rate * t -- sampled every ramp_tick. Rounding that line to an
            # integer is what produces the steps, so a 1.5 C/min chamber still
            # moves in 1 C increments about every 40 s while the loop itself runs
            # four times a minute. Error against the ideal line is bounded by
            # half a degree and never accumulates, which the old form could not
            # promise: it re-derived each value from the previous one, so every
            # skipped or doubled tick was a permanent offset in the trajectory.
            #
            # Integer commands are also the honest resolution. The PID reports
            # to 0.01 C but the plate is 300 W across a small casting and the
            # measured passive curve is quoted per 10 C band; a commanded 81.8
            # was arithmetic showing through, not control.
            {% set tick = cfg.ramp_tick|int %}
            {% set ramp_s = (st.elapsed|int - st.settle_elapsed|int) + tick %}
            {% set c_ideal = st.c0|float - st.c_rate|float * ramp_s / 60.0 %}
            {% set b_ideal = st.b0|float - st.b_rate|float * ramp_s / 60.0 %}
            # A zero rate means that axis has no leg in this ramp, so it is
            # already at the endpoint as far as `done` is concerned -- the same
            # thing the old snap did for a bed-only ramp carrying c0 = 0.
            {% set c_next = final if (st.c_rate|float <= 0.0 or c_ideal <= final) else [c_ideal|round(0)|float, final]|max %}
            {% set b_next = final if (st.b_rate|float <= 0.0 or b_ideal <= final) else [b_ideal|round(0)|float, final]|max %}
            # THE RAMP IS OVER WHEN THE PLATE ARRIVES, NOT WHEN THE SCHEDULE
            # RUNS OUT. Testing the commanded value finished a 2026-09-07 ramp
            # with the plate at 40 C against a 35 C endpoint: b_next had reached
            # 35 exactly on time, so `done` fired, the assist released and the
            # remaining 5 C were simply abandoned. Now the schedule ending only
            # opens the overrun, and finish_grace bounds how long that may run.
            {% set sched_done = (c_next <= final) and (b_next <= final) %}
            {% set plate_there = bed_temp <= final + printer["gcode_macro _COOLDOWN_ASSIST_CFG"].finish_tolerance|float %}
            {% set overrun = st.overrun_s|float + (tick if sched_done else 0) %}
            {% set gave_up = overrun >= printer["gcode_macro _COOLDOWN_ASSIST_CFG"].finish_grace|float %}
            {% set done = sched_done and (plate_there or gave_up) %}
            {% set remain_s = [st.total_s|float - ramp_s, 0]|max %}

            # ASSIST. A positive error means the bed is BEHIND the schedule --
            # falling more slowly than commanded -- which is exactly the regime
            # where the heater has nothing left to give and only forced air can
            # close the gap. Below the ceiling and past the threshold, the fans
            # take over from the heater; the two never fight, because they act in
            # opposite directions on opposite sides of the error.
            {% set acfg = printer["gcode_macro _COOLDOWN_ASSIST_CFG"] %}
            # AGAINST THE SMOOTH SCHEDULE, NOT THE STEP, since 2026-09-14. The bed
            # is commanded in whole degrees, so b_next moves 1 C every 40 s at
            # 1.5 C/min. Measured against it the error is a 1 C sawtooth, and at
            # assist_kp 0.75 every step swung demand by 0.75: on that day's real
            # ABS cooldown the exhaust changed 71 times in 31 min, 73 % of them
            # reversals, 57 of them within 20 s of a target step, and the curtain
            # latched and released 8 times in 8 min. It was also the step that
            # engaged the assist on the first ramp tick. b_ideal is the line
            # b_next rounds from; the heater keeps its integer M140 below.
            {% set b_ref = final if st.b_rate|float <= 0.0 else [b_ideal, final]|max %}
            {% set err = bed_temp - b_ref %}
            {% set threshold = acfg.error_off|float if st.assist|int == 1 else acfg.error_on|float %}
            # RUN AHEAD. The plate lags; by the time the error is real the fan
            # is already late. Project it forward by assist_lookahead seconds at
            # the rate it is currently moving, and engage on that.
            #
            # BUT ONLY ONCE THE HEATER HAS LET GO, since 2026-09-13. On both
            # curtain cooldowns that day the projection crossed error_on at the
            # settle-to-ramp handover, 3.3-3.5 min in, with the plate at 124 C
            # and the heater still drawing 30-60 W. assist_latch then held the
            # exhaust on for the whole descent -- extraction from print
            # temperature, over a part. A projection is a guess about losing
            # authority; heater power at its floor is the fact of it, so the
            # guess is only allowed to act once the fact agrees.
            #
            # AND THE SAME GATE ON THE ERROR ITSELF. The first version gated
            # only the projection, and the next run engaged at 3.3 min anyway:
            # "assist engaged at bed 124.0C, 1.0C behind schedule", heater at
            # 17 %. err is taken against b_next -- the step this tick is ABOUT
            # to command -- so the first 1 C step of every ramp reads as a 1 C
            # error before the heater has seen the new setpoint. A positive
            # error only means lost authority once the heater agrees.
            {% set err_rate = (err - st.prev_err|float) / (tick if tick > 0 else 1) %}
            {% set err_ahead = err + err_rate * acfg.assist_lookahead|float %}
            {% set heater_idle = printer.heater_bed.power|default(0.0)|float <= acfg.authority_power|float %}
            # LATCH. Once engaged it stays engaged for the rest of the ramp --
            # the schedule only gets harder from here, so releasing to zero and
            # re-engaging is pure toggling.
            {% set assist_on = 1 if (heater_idle and ([err, err_ahead]|max) > threshold)
                               else (1 if (acfg.assist_latch|int == 1
                                           and st.assist_latched|int == 1) else 0) %}

            # THE TRIGGER IS THE ERROR. Rewritten 2026-09-05.
            #
            # A POSITIVE ERROR IS THE DEFINITION OF LOST AUTHORITY. The bed
            # heater can only ADD heat, so while it is modulating it is holding
            # the plate UP to a schedule that is falling faster than the plate
            # would on its own. The moment the plate is above its commanded
            # value the heater is already at zero power and has nothing left --
            # only moving air can close the gap. So the trigger is the error
            # itself, at error_on rather than at some fixed temperature.
            #
            # This is not a new rule so much as a derived one. Against the
            # measured passive curve, ABS on a 1.5 C/min bed leg loses authority
            # where passive loss drops below that -- the 50-60 C band, at 1.02
            # C/min. The old fixed bed_ceiling of 60 C was that crossing,
            # hard-coded for one material. Derived from the error it now lands
            # in the right place for PC, PETG and PLA too, whose legs and plates
            # cross elsewhere.
            #
            # THE EXHAUST GOES FIRST AND STARTS AT THE STALL FLOOR. exhaust_min
            # of 0 means "use ch_minfan", the adaptively-learned duty at which
            # this particular rotor reliably turns -- there is no point
            # commanding less, and the old design commanded far more: it yanked
            # the chamber ceiling to (chamber - 6), which saturates the PI, so
            # the exhaust had exactly two states and slammed to 100% the instant
            # it engaged. Demand now starts at the stall floor and is driven by
            # the PI below.
            {% set e_min = acfg.exhaust_min|float if acfg.exhaust_min|float > 0.0
                           else printer.save_variables.variables.ch_minfan|default(0.13)|float %}
            {% set e_max = acfg.exhaust_max|float %}
            {% set over = err - acfg.error_on|float %}

            # ONE DEMAND, THEN A SPLIT. The two fans used to be two independent
            # proportional bands, which meant the schedule could not say how
            # much cooling it wanted -- only how far along each fan's own ramp
            # it was. Now the error produces a single demand in
            # exhaust-equivalent duty and the ladder decides who delivers it.
            # That is what lets the handover conserve total cooling instead of
            # stepping it.
            #
            # bed_ceiling gates THE CURTAIN ONLY, and never the exhaust. The two
            # are different actions on different air: extraction is safe on a
            # hot part, a draft across one is what cracks and warps it. With the
            # curtain gated off there is no ladder at all and the exhaust carries
            # the whole demand, up to exhaust_max.
            {% set k = [acfg.curtain_strength_factor|float, 0.05]|max %}
            {% set c_min = acfg.curtain_min|float %}
            {% set c_max = acfg.curtain_max|float %}
            {% set c_min_cfg = acfg.curtain_min|float %}
            {% set latch = acfg.curtain_latch|float if acfg.curtain_latch|float > 0.0
                           else e_min + k * c_min_cfg %}
            {% set c_ok = (acfg.curtain_enable|int == 1 and bed_temp <= acfg.bed_ceiling|float) %}
            # PI ON THE SCHEDULE ERROR, 2026-09-13.
            #
            #   demand = e_min + assist_kp * over + I,  over = err - error_on
            #
            # clamped to [e_min, top], where top is e_max alone or e_max +
            # k * c_max with the curtain allowed. The curtain changes WHO
            # delivers a demand, never how much is asked for: one gain either
            # way, and crossing bed_ceiling moves the split, not the total.
            #
            # WHY. Two curtain-on cooldowns on Zero2 that day ran this as a
            # pure proportional band, 0.172 demand per C, and it behaved like
            # one: a standing error was the only thing holding the fans up. 5 C
            # behind left them near 0.4 and 0.45; on the first run, squeezed
            # further by a since-removed second band, 5.5 C behind held the
            # exhaust at 0.34 and the curtain never ran (notes/data/cooldown/
            # zero2-curtain-cooldown-20260913). A large error should put the
            # fans at their ceiling, and a small one that persists should not be
            # tolerated forever. So: far more proportional gain, and an integral.
            #
            # THE INTEGRAL carries only while the assist was already engaged, so
            # every engagement starts from zero. It does not accumulate while the
            # push would deepen a saturation -- demand at top with the error
            # still positive, or at the floor with it negative -- and it is held
            # in [0, top - e_min]. A negative integral would hold the fans below
            # their floor-plus-P response the next time the error returns, which
            # is windup in the other direction. The reference is error_on, not
            # zero: below it the heater is modulating again, so the fans bleed
            # the integral off instead of fighting the heater for the last degree.
            {% set top = (e_max + k * c_max) if c_ok else e_max %}
            {% set p_term = acfg.assist_kp|float * over %}
            {% set i_prev = st.assist_i|float if st.assist|int == 1 else 0.0 %}
            {% set unclamped = e_min + p_term + i_prev %}
            {% set wind_up = over > 0.0 and unclamped >= top %}
            {% set wind_down = over < 0.0 and unclamped <= e_min %}
            {% set i_step = 0.0 if (assist_on != 1 or wind_up or wind_down)
                            else acfg.assist_ki|float * over * tick / 60.0 %}
            {% set i_next = ([[i_prev + i_step, 0.0]|max, top - e_min]|min) if assist_on == 1 else 0.0 %}
            {% set demand = [[e_min + p_term + i_next, e_min]|max, top]|min %}

            # LATCHED, WITH A BAND. The split is continuous in demand but the
            # actuators are not: crossing the latch steps the exhaust down by
            # k * c_min and the curtain up from nothing. Demand hovering on that
            # point would chatter both fans, so the release sits curtain_unlatch
            # below the engage.
            {% set was = st.curtain_latched|int %}
            {% set latched = 1 if (c_ok and assist_on == 1
                                   and (demand >= latch
                                        or (was == 1 and demand >= latch - acfg.curtain_unlatch|float)))
                              else 0 %}

            # PHASE B holds the exhaust at e_hold and hands every further
            # increment to the curtain, until the two duties match. PHASE C
            # splits the demand evenly from there, which keeps them matched.
            # Continuous at the seam by construction: curtain reaches e_hold
            # exactly when demand reaches e_hold * (1 + k), which is the same
            # place the even split first returns e_hold.
            # Equal increments above the knee. d is what each fan adds, and
            # dividing the surplus by (1 + k) is what makes e + k*c == demand
            # hold exactly for every d rather than only at the seam.
            # base_c is the curtain's duty AT the knee. With the knee derived
            # it is exactly c_min, which is the whole point: the knee is the
            # lowest demand at which both fans sit on their own floors. An
            # operator who pins curtain_latch higher gets the generalisation --
            # the exhaust still drops to its floor and the curtain takes
            # whatever is left over at that demand -- so the handover stays
            # seamless for any latch, not just the derived one.
            {% set base_c = [c_min, (latch - e_min) / k]|max %}
            {% set d = [(demand - (e_min + k * base_c)) / (1.0 + k), 0.0]|max %}
            {% set e_raw = e_min + d %}
            {% set c_raw = base_c + d %}
            {% if assist_on != 1 or acfg.exhaust_enable|int != 1 %}
                {% set exhaust = 0.0 %}
                {% set curtain = 0.0 %}
            {% elif latched != 1 %}
                # The floor is the point of the latch: a fan that has been asked
                # for once is held at its lowest reliable duty rather than
                # switched off, so the next demand starts from moving air.
                {% set exhaust = [[demand, e_max]|min,
                                  e_min if st.assist_latched|int == 1 else 0.0]|max %}
                {% set curtain = 0.0 %}
            {% elif c_raw > c_max %}
                # The curtain saturates first whenever c_max <= e_max, because
                # it starts higher. Whatever it can no longer take goes back to
                # the exhaust, which is the safe actuator anyway.
                {% set curtain = c_max %}
                {% set exhaust = [[demand - k * c_max, e_max]|min, e_min]|max %}
            {% elif e_raw > e_max %}
                {% set exhaust = e_max %}
                {% set curtain = [[(demand - e_max) / k, c_max]|min, base_c]|max %}
            {% else %}
                {% set exhaust = [[e_raw, e_max]|min, e_min]|max %}
                {% set curtain = [[c_raw, c_max]|min, base_c]|max %}
            {% endif %}

            # ONLY WHEN IT MOVES. At a 15 s tick an unconditional M140 would
            # re-command an unchanged integer four times a minute for the whole
            # descent. The abort guard compares the live bed target against
            # b_cmd, and both are only ever updated together, so skipping the
            # write cannot desynchronise them.
            {% if (b_next - st.b_cmd|float)|abs > 0.001 %}
                M140 S{b_next|round(0)|int}
            {% endif %}

            # THE RAMP DRIVES THE EXHAUST ITSELF, since 2026-09-14. It used to ask
            # the chamber loop for a floor, and the loop rate-limits its output
            # to ch_slew_per_loop -- 0.05 per 15 s pass, 0.20/min -- so the PI's
            # full-duty request took 3.5 min to arrive on 2026-09-13 and 2.3 min
            # to come back down at the curtain handover. That limit was written
            # for the chamber loop's Z-scheduled print control and was never
            # meant for this. The loop is stopped when the ramp begins, so a
            # direct write is the only writer.
            #
            # REASSERTED EVERY TICK while the assist is engaged or still holds a
            # duty, rather than on change. SET_FAN_SPEED writes nothing to disk,
            # and anything that touches the fan between ticks is corrected within
            # one tick instead of being left standing for the rest of the ramp.
            {% if assist_on == 1 or st.assist_exhaust|float > 0 %}
                SET_FAN_SPEED FAN={printer["gcode_macro _CH_HW"].fan} SPEED={exhaust|round(3)}
            {% endif %}
            {% if (exhaust - st.assist_exhaust|float)|abs > 0.0005 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_exhaust VALUE={exhaust|round(3)}
            {% endif %}
            {% if (curtain - st.assist_curtain|float)|abs > 0.01 %}
                SET_FAN_SPEED FAN=fan2 SPEED={curtain|round(3)}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_curtain VALUE={curtain|round(3)}
            {% endif %}
            {% if latched != was %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=curtain_latched VALUE={latched}
                {% set how = ("latched, exhaust " ~ exhaust|round(2) ~ " curtain " ~ curtain|round(2))
                             if latched == 1 else ("released, exhaust " ~ exhaust|round(2) ~ " alone") %}
                RESPOND PREFIX="cool" MSG="curtain {how} at demand {demand|round(2)}"
            {% endif %}
            {% if assist_on != st.assist|int %}
                {% set word = "engaged" if assist_on == 1 else "released" %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist VALUE={assist_on}
                RESPOND PREFIX="cool" MSG="assist {word} at bed {bed_temp|round(1)}C, {err|round(1)}C behind schedule, exhaust {exhaust|round(2)} curtain {curtain|round(2)}"
            {% endif %}

            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_cmd VALUE={c_next}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_cmd VALUE={b_next}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=elapsed VALUE={st.elapsed|int + tick}
            {% if (err - st.prev_err|float)|abs > 0.005 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=prev_err VALUE={err|round(3)}
            {% endif %}
            {% if (i_next - st.assist_i|float)|abs > 0.0005 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_i VALUE={i_next|round(4)}
            {% endif %}
            {% if overrun != st.overrun_s|float %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=overrun_s VALUE={overrun}
            {% endif %}
            {% if assist_on == 1 and st.assist_latched|int == 0 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_latched VALUE=1
            {% endif %}

            # The bed heater has no authority left once natural loss is slower
            # than the schedule. Said once, not every step -- and it now says
            # whether anything can be done about it, because with the assist
            # available this is a recoverable condition rather than a dead end.
            {% if bed_temp > b_next + cfg.coast_delta|float and st.coast_warned|int == 0 %}
                {% set remedy = "assist is engaged" if assist_on == 1 else ("assist waits for bed below " ~ acfg.bed_ceiling|float|round(0)|int ~ "C") %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=coast_warned VALUE=1
                RESPOND PREFIX="cool" MSG="bed {bed_temp|round(1)}C is coasting above the commanded {b_next|round(1)}C, schedule is ahead of passive loss, {remedy}"
            {% endif %}

            {% if not done and ramp_s - st.last_report|int >= cfg.report_seconds|int %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE={ramp_s}
                {% set leg = ("bed " ~ b_next|round(0)|int ~ "C") if st.c_rate|float <= 0.0 else ("bed " ~ b_next|round(0)|int ~ "C chamber " ~ c_next|round(0)|int ~ "C") %}
                # THE ETA IS MEASURED ONCE IT CAN BE. The schedule figure is a
                # promise: it counts down to zero whether or not the plate is
                # anywhere near the endpoint, which is exactly how a ramp
                # announced "0min left" with five degrees still to go. Divide
                # the observed drop by the observed time instead, and fall back
                # to the schedule only until there is enough of a sample.
                {% set dt = ramp_s - st.eta_at|float %}
                {% set drop = st.eta_bed|float - bed_temp %}
                {% set measured = (bed_temp - final) / (drop / dt)
                                  if (dt >= 60 and drop > 0.05 and bed_temp > final) else 0 %}
                {% set eta_s = measured if measured > 0 else remain_s %}
                {% set how = "measured" if measured > 0 else "scheduled" %}
                # The controller's own terms, so a tuning run can be read off the
                # console without a logger.
                {% set pi = (", assist demand " ~ demand|round(2) ~ " = floor " ~ e_min|round(2) ~ " + P " ~ p_term|round(2) ~ " + I " ~ i_next|round(2)) if assist_on == 1 else "" %}
                RESPOND PREFIX="cool" MSG="cooling to {final|round(0)|int}C: {leg}, {(eta_s / 60.0)|round(1)}min left ({how}) of {(st.total_s|float / 60.0)|round(1)}min (bed now {bed_temp|round(0)|int}C){pi}"
                # Re-anchor the sample each report, so the rate reflects the
                # recent plate rather than the whole ramp -- passive loss slows
                # markedly as the plate approaches ambient, and an average over
                # the whole descent would keep promising the early rate.
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed VALUE={bed_temp|round(2)}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at VALUE={ramp_s}
            {% endif %}

            {% if done and gave_up %}
                RESPOND PREFIX="cool" MSG="giving up {overrun|round(0)|int}s past the schedule with the plate at {bed_temp|round(1)}C, {(bed_temp - final)|round(1)}C above the {final}C endpoint"
            {% elif sched_done and not done and (st.overrun_s|float == 0 or (overrun|int) % 60 == 0) %}
                RESPOND PREFIX="cool" MSG="schedule done, plate at {bed_temp|round(1)}C still above {final}C -- holding the assist, {overrun|round(0)|int}s over"
            {% endif %}
            {% if done %}
                _COOLDOWN_FINISH
                RESPOND PREFIX="cool" MSG="ramp complete at {final}C after {(st.elapsed|int / 60)|round(1)}min"
            {% else %}
                {% set idle_want = cfg.idle_margin|float + cfg.ramp_tick|float * 4 %}
                {% if (idle_want - st.idle_set|float)|abs > 0.01 %}
                    SET_IDLE_TIMEOUT TIMEOUT={idle_want}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=idle_set VALUE={idle_want}
                {% endif %}
                UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.ramp_tick}
            {% endif %}
        {% endif %}
    {% endif %}


[gcode_macro _COOLDOWN_TAKE_OVER]
description: At ramp start, stop every chamber controller so the ramp alone drives its fans.
# THE COOLDOWN HAS NOTHING TO DO WITH CHAMBER CONTROL (operator, 2026-09-14),
# and any controller still running is disabled once the ramp begins.
#
# Called on the settle-to-ramp transition, never earlier: settle holds what the
# print left running while the chamber absorbs the hotend. From here on the
# ramp is the only writer of the exhaust and curtain.
#
#   CHAMBER_OFF    the chamber PI loop, its stall guard and retry timers, and
#                  the exhaust itself -- zero until the assist asks for it.
#   chamber heater setpoint to 0, where one is fitted.
#   _CHAMBER_VENT  stands down on its own while a ramp is in phase 2; it runs
#                  every second and would otherwise command the exhaust to its
#                  floor, or to zero once the nozzle drops below 45 C.
#
# Before this, the ramp drove the exhaust THROUGH the chamber loop: a stand-in
# target written every tick, and an assist floor fed into the loop's rate-limited
# output. On 2026-09-13 that cost 3.5 min to reach full duty and made the loop's
# own PI cycle the exhaust 0.14 -> 0.19 -> 0.14 against the stand-in target.
gcode:
    CHAMBER_OFF
    {% if 'heater_generic chamber_heater' in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
    RESPOND PREFIX="cool" MSG="ramp begins: chamber control off, the ramp drives the exhaust and curtain"


[gcode_macro _COOLDOWN_CLEAR]
description: Release ramp state and the timeout extension without touching heaters.
# Used by the abort paths, where whoever interrupted the ramp -- a new print, an
# operator, CANCEL_PRINT -- owns the heaters from that moment on. Turning them
# off here would fight them, which is exactly the failure this avoids.
#
# KEEP_POLICY=1 IS FOR THE NEW-PRINT ABORT, and it exists because of an ordering
# hazard that is invisible until a ramp and a print overlap.
#
# A blocking wait in the start G-code -- M191 is minutes long -- stalls the whole
# gcode stream, delayed_gcode included. So a ramp still ticking when a print
# begins does not abort promptly: its tick queues up behind the wait, alongside
# that print's own COOLDOWN_ARM. Whichever lands second wins, and if it is the
# tick then a plain clear ERASES the policy the new print just armed for itself.
# The result is a print that silently descends on the default row.
#
# Clearing the ramp MECHANICS is always right here. Clearing the POLICY is only
# right when nothing has armed a new one, which the new-print path cannot know.
gcode:
    {% set keep = params.KEEP_POLICY|default(0)|int %}
    {% set st = printer["gcode_macro _COOL_STATE"] %}
    UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION=0
    # Give the curtain back only if this ramp ever took it. On the abort paths
    # something else already owns the machine, and zeroing a fan we never
    # touched would stomp whatever it had set.
    {% if st.assist_curtain|float > 0 %}
        SET_FAN_SPEED FAN=fan2 SPEED=0
    {% endif %}
    # Same rule for the exhaust, which the ramp drives directly: zero it only if
    # this ramp raised it.
    {% if st.assist_exhaust|float > 0 %}
        SET_FAN_SPEED FAN={printer["gcode_macro _CH_HW"].fan} SPEED=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist VALUE=0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_curtain VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_exhaust VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=curtain_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_i VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=phase VALUE=0
    {% if keep == 0 %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=policy_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"default"'
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={st.idle_restore}


[gcode_macro _COOLDOWN_FINISH]
description: End the ramp, release every heater and stop the chamber loop.
gcode:
    _COOLDOWN_CLEAR
    TURN_OFF_HEATERS
    # The slicer's end-of-job M141 S0 was deferred while the ramp ran, so honour
    # it here: chamber loop off and ch_target zero, rather than leaving the
    # print's ceiling for the next job to inherit.
    CHAMBER_OFF
    SAVE_VARIABLE VARIABLE=ch_target VALUE=0
    _CH_PREHEAT_CLEAR
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=0


[gcode_macro COOLDOWN_ABORT]
description: Stop any running cooldown ramp. Leaves heaters as they are.
gcode:
    {% if printer["gcode_macro _COOL_STATE"].active|int == 1 %}
        _COOLDOWN_CLEAR
        RESPOND PREFIX="cool" MSG="ramp aborted"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=policy_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"default"'
    {% endif %}


[gcode_macro COOLDOWN_CONFIG]
description: Enable or disable the post-print cooldown ramp persistently.
gcode:
    {% if params.ENABLE is defined %}
        SAVE_VARIABLE VARIABLE=cool_enable VALUE={params.ENABLE|int}
    {% endif %}
    RESPOND PREFIX="cool" MSG="enable={printer.save_variables.variables.cool_enable|default(1)|int}"


[gcode_macro COOLDOWN_STATUS]
description: Report cooldown policy and live ramp state.
gcode:
    {% set st = printer["gcode_macro _COOL_STATE"] %}
    {% set a = printer["gcode_macro _COOLDOWN_ASSIST_CFG"] %}
    RESPOND PREFIX="cool" MSG="enable={printer.save_variables.variables.cool_enable|default(1)|int} active={st.active|int} phase={st.phase|int} material={st.material} policy={st.policy_set|int} rates={st.rates_set|int} heater={st.has_heater|int} end={st.p_final|float} cmd={st.b_cmd|float|round(1)},{st.c_cmd|float|round(1)} rate={st.b_rate|float|round(2)},{st.c_rate|float|round(2)}C/min leg={st.b_step|float|round(2)},{st.c_step|float|round(2)} tick={printer["gcode_macro _COOLDOWN_CFG"].ramp_tick|int}s elapsed={st.elapsed|int}s settle={st.settle_elapsed|int}s of {st.total_s|float|round(0)|int}s"
    RESPOND PREFIX="cool" MSG="assist on={st.assist|int} exhaust={st.assist_exhaust|float|round(2)} curtain={st.assist_curtain|float|round(2)} I={st.assist_i|float|round(3)} exhaust_enable={a.exhaust_enable|int} curtain_enable={a.curtain_enable|int} ceiling={a.bed_ceiling|float|round(0)|int}C"
