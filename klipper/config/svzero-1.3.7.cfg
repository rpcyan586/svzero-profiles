# SV Zero macro pack -- THE ONLY LINE YOU ADD TO printer.cfg.
#
#   [include svzero/svzero-1.3.7.cfg]
#
# Put this file and the rest of the pack in a subdirectory beside printer.cfg:
#
#   ~/printer_data/config/svzero/
#
# Klipper resolves a nested include relative to the file doing the including
# (configfile.py:229), so everything below is found inside that directory and
# nothing here needs editing for your paths.
#
# No Python extras are required for this macro-only install.
# For the adaptive preheat and Spoolman helpers, install their modules and
# add [include svzero/svzero-python.cfg] AFTER this include in printer.cfg.
# See INSTALL.md for dependencies and restart/rollback instructions.
#
# PICK THE FILE THAT MATCHES YOUR FIRMWARE and include only that one. This is
# svzero-1.3.7.cfg. The two select firmware-specific fan hardware and probe commands;
# the exhaust fan is a different pin and a different object on each, and the
# name fan3 means different hardware between them.
#
# ORDER IS LOAD-BEARING and is why this is an explicit list rather than a
# wildcard. Klipper applies includes linearly and a later duplicate section
# wins, which is how this pack overrides Sovol's macros without editing
# Macro.cfg -- and how factory_resets.sh can overwrite their file without
# taking ours with it. A glob would sort alphabetically and get it wrong.

# Identity and the profile handshake. First, so anything below can use it.
[include svzero_pack.cfg]

# Chamber control by PI-regulated exhaust fan. The hardware file claims the fan
# and the chamber thermistor; on 1.4.x it also REPLACES a stock section, which
# that file explains.
[include chamber_fan_hw_1.3.7.cfg]
[include chamber_fan.cfg]

# Curtain fan electrical settings, from the 2026-08-17 characterization
# campaign: 30 ms PWM period so a low duty is actually honoured, a 100 ms kick
# so it starts from rest, and the PE13 tachometer so a stall is visible instead
# of assumed. Overrides the stock [fan_generic fan2] rather than adding a
# section -- same pin PE11 on both firmwares, so one file serves both. Needed
# by cooldown.cfg's blended throttle, which drives fan2 as the second stage.
[include curtain_fan.cfg]

# Hotend fan tach: two pulses per revolution. Sovol's stock section says
# tachometer_ppr: 1, so the UI showed twice the real speed. Display only; the
# stock 1.3 ms poll counts to ~11,500 rpm at 2, above the fan's ~8,400.
[heater_fan hotend_fan]
tachometer_ppr: 2

# Input shaping: a 5-133 Hz resonance test in place of Sovol's 35-45 Hz one,
# the damping the shaper fit assumes, and two macros. Sets no shaper type or
# frequency, so SAVE_CONFIG keeps your calibration. See that file.
[include input_shaper.cfg]

# 1.3.7 ONLY: the accelerometer's axes. Stock 1.3.7 maps the LIS2DW as z,x,y,
# so the X excitation lands in the y channel and Y in x: per-axis resonance
# graphs and labels are swapped (the fitted frequency is not, since the fit
# uses the sum). Sovol fixed it in 1.3.8 and every 1.4.x as x,z,y.
[lis2dw]
axes_map: x,z,y

# Overrides of Sovol's own macros. MUST follow Macro.cfg, which printer.cfg
# includes far above this line.
[include probe_pressure_1.3.7.cfg]
[include nozzle_brush.cfg]
[include purge_line.cfg]
[include cancel_print.cfg]
[include end_print.cfg]
[include filament_load.cfg]
[include orca_compat.cfg]

# Post-print controlled cooldown. MUST follow chamber_fan.cfg and end_print.cfg:
# END_PRINT guards on _COOL_STATE existing, and the ramp stops chamber_fan.cfg's
# loop when it begins and drives the exhaust fan that file names.
[include cooldown.cfg]

# Nozzle growth compensation: offsets the first layer for the nozzle being
# hotter than when this job's Z reference was taken. Published ON with a
# provisional k; SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=0 turns it
# off on a machine. Before start_print.cfg for reading order only: START_PRINT
# finds it with `in printer` at run time, so an install without it skips the
# bookkeeping.
[include nozzle_growth.cfg]

# START_PRINT override: clean, recheck the bed target, calibrate Z, mesh and park.
# Public profiles also wait before calling it. MUST follow nozzle_brush.cfg.
[include start_print.cfg]

# Personal overrides are opt-in. Include your own file last in printer.cfg,
# after any optional Python config it modifies. A personal file can declare
# Python sections, so auto-including one would defeat the macro-only fallback.

# MACHINE MODE, last, so a mode file overrides printer.cfg's stepper sections
# and everything above. No match is standard mode; svzero-mode-precision.cfg
# beside this file selects precision (docs/PRECISION.md). The one wildcard in
# the pack, and the one include the release builder leaves for Klipper rather
# than inlining: which mode file is present is the operator's choice at runtime.
[include svzero-mode-*.cfg]
