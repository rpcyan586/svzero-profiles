# Profile/pack handshake. A version mismatch warns and never rejects a job. A
# mode mismatch refuses it.
#
# Stock firmware skips the unknown handshake and other optional calls. Public
# profiles supply a bed wait and priming skirt independently of this pack.
# A missing macro is not a fallback implementation of its behavior.
# With this pack installed, unnamed material/temperature settings may be
# inferred; arbitrary third-party startup sequences still need waits and prime.
# See INSTALL.md for the stock, macro-only and optional Python contracts.
#
# MODES. A mode is a machine configuration that a slicer profile has to be
# built for. The pack ships one, "standard". A mode that changes what the
# hardware can run -- microsteps, driver current, a velocity ceiling -- is
# selected by a config include and a Klipper restart, never at runtime, and
# that include declares the mode by overriding one key of this section:
#
#     [gcode_macro _SVZERO_PACK]
#     variable_mode: "precision"
#
# Includes apply linearly and a later duplicate section merges key by key
# (configfile.py uses RawConfigParser(strict=False)), so the mode file names
# only the mode and everything else keeps its value here.
#
# Profiles name the mode they were sliced for with SVZERO_REQUIRE MODE=. A job
# that names none was sliced before modes existed and is taken as standard.
#
# The pack ships two modes: standard, and precision (svzero-mode-precision.cfg,
# docs/PRECISION.md). Switching is a rename and a restart. The optional
# svzero_mode_switch Moonraker component does it for a refused job: it sets
# mode_switch below when Klipper is ready, so installing it is the whole
# opt-in. Without it the refusal says which file to rename.

[gcode_macro _SVZERO_PACK]
description: Pack identity. Read by SVZERO_REQUIRE; edit only when releasing.
# Bump on any change that alters what the start G-code may rely on. Compared as
# a plain string: a mismatch is a warning, never a refusal, because a pack newer
# than the profile is the normal state during development and is almost always
# fine.
# 2.0.0 introduced renamed tiers and the macro-pack installation. Python
# sections became opt-in in the 2026-09-18 compatibility repair.
variable_version: "2.1.1"
# The machine mode. Changed only by a mode include and a restart -- see above.
variable_mode: "standard"
# Set by the svzero_mode_switch Moonraker component when Klipper is ready.
variable_mode_switch: False
# A mode file states the microsteps it sets; 0 here means no check.
variable_mode_microsteps: 0
# Set by SVZERO_REQUIRE, cleared by START_PRINT once it has been read and by
# CANCEL_PRINT. This is how the pack notices a job that never introduced itself.
variable_seen: 0
gcode:

[gcode_macro SVZERO_REQUIRE]
description: Announce which profile sliced this job; refuse one sliced for another mode.
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set want = params.VERSION|default("")|string %}
    {% set job_mode = params.MODE|default("standard")|string|lower %}
    {% set machine_mode = p.mode|default("standard")|string|lower %}
    # What the handshake refuses: a job sliced for another mode, which asks for
    # motion this configuration was not set up for, in either direction (only
    # the profile knows which mode it was built for); and a mode whose file did
    # not take effect. This is the first line of the start G-code, so a refused
    # job has heated nothing.
    {% if job_mode != machine_mode and p.mode_switch|default(False) %}
        # Ask first: the call is made while this template renders, before the
        # refusal below ends the job. The component waits for the job to end.
        {action_call_remote_method("svzero_mode_switch", mode=job_mode, filename=printer.print_stats.filename)}
        {action_raise_error("svzero: this job was sliced for %s mode and the printer is in %s mode. Refused before heating. svzero_mode_switch restarts Klipper in %s mode and starts this job again, and logs to svzero_mode_switch.log if it cannot." % (job_mode, machine_mode, job_mode))}
    {% elif job_mode != machine_mode %}
        # Without the component, say exactly what to rename. Standard mode is no
        # mode file; any other mode is its own file beside the pack.
        {% set how = ("rename svzero-mode-%s.cfg to svzero-mode-%s.cfg.off" % (machine_mode, machine_mode))
                     if job_mode == "standard"
                     else ("rename svzero-mode-%s.cfg.off to svzero-mode-%s.cfg" % (job_mode, job_mode)) %}
        {action_raise_error("svzero: this job was sliced for %s mode and the printer is in %s mode. Refused before heating. Reslice it with the %s printer profile, or %s in the pack's directory and restart Klipper." % (job_mode, machine_mode, machine_mode, how))}
    {% endif %}
    # A mode file states the microsteps it sets. If printer.cfg's own stepper
    # sections come after the pack include, theirs win and the mode is only a
    # name, so the job is refused rather than printed at the wrong resolution.
    {% set want_steps = p.mode_microsteps|default(0)|int %}
    {% set settings = printer.configfile.settings %}
    {% set have_steps = settings.stepper_x.microsteps|int if 'stepper_x' in settings else want_steps %}
    {% if want_steps and have_steps != want_steps %}
        {action_raise_error("svzero: %s mode is selected but stepper_x runs %d microsteps, not the %d it sets. The pack include comes before printer.cfg's stepper sections; move it after them, as INSTALL.md places it. Refused before heating." % (machine_mode, have_steps, want_steps))}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SVZERO_PACK VARIABLE=seen VALUE=1
    {% if want and want != p.version %}
        RESPOND PREFIX="svzero" MSG="profile expects pack {want}, installed pack is {p.version}. Not fatal -- check the release notes if something behaves oddly."
    {% endif %}

# Report the machine mode, or ask svzero_mode_switch for another one. With no
# job attached the component switches and restarts Klipper, and starts nothing.
[gcode_macro SVZERO_MODE]
description: Report the machine mode; MODE=<name> asks svzero_mode_switch to switch (restarts Klipper when idle).
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set machine_mode = p.mode|default("standard")|string|lower %}
    {% set want = params.MODE|default("")|string|lower %}
    {% if not want %}
        RESPOND PREFIX="svzero" MSG="machine mode {machine_mode}, automatic switching {'on' if p.mode_switch|default(False) else 'off'}"
    {% elif want == machine_mode %}
        RESPOND PREFIX="svzero" MSG="already in {machine_mode} mode"
    {% elif not p.mode_switch|default(False) %}
        RESPOND PREFIX="svzero" MSG="automatic switching is off (no svzero_mode_switch component). Rename the {want} mode file by hand and restart Klipper."
    {% else %}
        {action_call_remote_method("svzero_mode_switch", mode=want, filename="")}
        RESPOND PREFIX="svzero" MSG="asked svzero_mode_switch for {want} mode. Klipper restarts once the printer is idle and cold."
    {% endif %}

# Called by START_PRINT. Warns when a job arrived without SVZERO_REQUIRE, which
# means it was sliced by a profile that predates the handshake or by a stock
# one. In standard mode everything still runs; the values simply come from
# inference rather than from the slicer. In any other mode the job is refused:
# it cannot show it was sliced for this configuration. That check runs at
# START_PRINT, after the slicer's own heating, because an unidentified job
# reaches the pack no earlier. A third-party job that never calls START_PRINT
# is not caught here at all.
[gcode_macro _SVZERO_CHECK_PROFILE]
description: Warn once per job if the slicer never identified itself; refuse it outside standard mode.
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set machine_mode = p.mode|default("standard")|string|lower %}
    {% if p.seen|int == 0 %}
        {% if machine_mode != "standard" %}
            {action_raise_error("svzero: this job did not say which mode it was sliced for, and the printer is in %s mode, which runs only jobs sliced for it. Refused." % machine_mode)}
        {% endif %}
        RESPOND PREFIX="svzero" MSG="this job was not sliced by an rpcyan SV Zero profile ({p.version} installed). Chamber, material and silicone nozzle wipe temperatures fall back to inference."
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SVZERO_PACK VARIABLE=seen VALUE=0

# X/Y driver current for one job (2026-10-14). A print tier's Notes carry it as
# SVZERO_XY_CURRENT=<A>A, and the start G-code sends it here right after
# START_PRINT, so homing, probing and the mesh keep the configured current.
# SET_TMC_CURRENT lasts until a restart, so END_PRINT and CANCEL_PRINT put the
# configured run_current back. It only ever lowers: a request above the
# configured value is reported and the job keeps it. "Configured" is the merged
# config, so in precision mode it is the mode file's run_current. Draft sends
# nothing and runs printer.cfg's.
[gcode_macro SVZERO_XY_CURRENT]
description: Lower the X/Y driver current for this job; END_PRINT and CANCEL_PRINT restore the configured run_current.
gcode:
    {% set want = params.CURRENT|default(0)|float %}
    {% set settings = printer.configfile.settings %}
    {% if "tmc5160 stepper_x" not in settings or "tmc5160 stepper_y" not in settings %}
        RESPOND PREFIX="svzero" MSG="no tmc5160 stepper_x and stepper_y sections, X/Y current left as configured"
    {% else %}
        {% set have = [settings["tmc5160 stepper_x"].run_current|float, settings["tmc5160 stepper_y"].run_current|float]|min %}
        {% if want <= 0 or want > have %}
            RESPOND PREFIX="svzero" MSG="X/Y current {want} A refused, it can only lower the configured {have} A. This job runs at the configured current."
        {% else %}
            SET_TMC_CURRENT STEPPER=stepper_x CURRENT={want}
            SET_TMC_CURRENT STEPPER=stepper_y CURRENT={want}
            RESPOND PREFIX="svzero" MSG="X/Y current {want} A for this job, the configured {have} A after it"
        {% endif %}
    {% endif %}
