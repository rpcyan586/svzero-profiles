# Input shaping: a resonance test that can find the Zero's resonances, the
# damping the fit assumes, and typical values to fall back on.
#
# WHY. Sovol's [resonance_tester] sweeps 35-45 Hz. On a Zero the X axis
# resonates near 61 Hz and Y near 45 Hz (measured 5-133 Hz on Zero2,
# 2026-08-15), so the stock test returns the centre of its own window for X,
# about 40 Hz, and the shaper is fitted where X has almost no resonance. The
# front screen's Setup -> Resonances runs SHAPER_CALIBRATE with no frequency
# range, so it inherits that window. Widening the window here fixes the screen
# entry as well as SVZERO_SHAPER_CALIBRATE below.
#
# WHAT IS DELIBERATELY NOT SET HERE: shaper_type_x/y and shaper_freq_x/y.
# SHAPER_CALIBRATE saves exactly those keys through SAVE_CONFIG, and Klipper
# refuses SAVE_CONFIG when a pending key is also set by an include
# ("conflicts with included value", configfile.py). A value here would also
# silently win over the one SAVE_CONFIG writes into printer.cfg. Calibrate,
# or use SVZERO_SHAPER_TYPICAL for a session, and SAVE_CONFIG keeps your own.

[resonance_tester]
# Klipper's own default range. The fit considers shapers up to 1.5 x max_freq.
# accel_per_hz (100), hz_per_sec (1), probe_points and accel_chip stay Sovol's;
# this Klipper cannot change accel_per_hz per test, so a full sweep runs to
# about 13,300 mm/s2 at 133 Hz, which is how the measurement above was taken.
min_freq: 5
max_freq: 133

[input_shaper]
# Sovol ships damping_ratio 0.001, but SHAPER_CALIBRATE fits every shaper at
# Klipper's default 0.1 and the stock config then applies the result at 0.001.
# The Zero's measured damping is 0.12 (X) and 0.10 (Y), from the -3 dB
# bandwidth of the 2026-08-15 sweep. 0.1 makes printing match the fit.
damping_ratio_x: 0.1
damping_ratio_y: 0.1

[gcode_macro SVZERO_SHAPER_CALIBRATE]
description: Full 5-133 Hz input-shaper calibration of X and Y. Refused in precision mode. SAVE_CONFIG afterwards keeps the result.
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set mode = p.mode|default("standard")|string|lower %}
    {% set axis = params.AXIS|default("")|string|upper %}
    {% if mode != "standard" %}
        # The sweep raises acceleration to about 13,300 mm/s2; precision mode
        # clamps SET_VELOCITY_LIMIT to its ceiling, which would distort the test.
        {action_raise_error("SVZERO_SHAPER_CALIBRATE: the printer is in %s mode. Calibrate in standard mode: the test needs the full acceleration range." % mode)}
    {% elif printer.print_stats.state|default("standby") in ["printing", "paused"] %}
        {action_raise_error("SVZERO_SHAPER_CALIBRATE: a job is running. Calibrate while idle.")}
    {% elif axis and axis not in ["X", "Y"] %}
        {action_raise_error("SVZERO_SHAPER_CALIBRATE: AXIS must be X or Y, or left out for both.")}
    {% else %}
        RESPOND PREFIX="svzero" MSG="input shaper: sweeping 5-133 Hz{(' on ' + axis) if axis else ' on X, then Y'}. About two minutes per axis, and the printer shakes."
        ACCELEROMETER_QUERY
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        SHAPER_CALIBRATE {("AXIS=" + axis) if axis else ""} FREQ_START=5 FREQ_END=133
        RESPOND PREFIX="svzero" MSG="input shaper: applied for now. SAVE_CONFIG keeps it (Klipper restarts). Typical Zero results: X mzv about 62 Hz, Y mzv about 46 Hz."
    {% endif %}

[gcode_macro SVZERO_SHAPER_TYPICAL]
description: Apply typical measured Zero input-shaper values until the next restart. Calibrating your own is better.
gcode:
    # The middle of four Zeros' full-range results (notes/kb/input-shaping.md):
    # X mzv 62.6 and 62.4, with zv 60.6 and 64.6 on another unit; Y mzv 45.0,
    # 46.8 and 48.0. A modded machine at X 52 / Y 66 is left out. Their
    # acceleration limits are about 11,500 (X) and 6,000 (Y), which is where
    # the profiles' acceleration ladder stops.
    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=62.5 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=46.5 DAMPING_RATIO_X=0.1 DAMPING_RATIO_Y=0.1
    RESPOND PREFIX="svzero" MSG="input shaper: typical Zero values applied until Klipper restarts (X mzv 62.5 Hz, Y mzv 46.5 Hz). SVZERO_SHAPER_CALIBRATE measures your own, and SAVE_CONFIG keeps that."
