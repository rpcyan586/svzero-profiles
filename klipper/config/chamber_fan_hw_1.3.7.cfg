# Chamber control — hardware sections for 1.3.7
#
# 1.3.7 IS THE EASIER TARGET. Nothing stock has to be deleted, unlike 1.4.x.
#
# The hardware is identical across firmware versions — PB0 drives the exhaust
# fan, PC4 reads the chamber thermistor, on both units. What differs is how
# Sovol's config exposes them, and the fan3 NAME, which is the trap:
#
#            exhaust fan (PB0)            chamber thermistor (PC4)     fan3
#   1.3.7    [fan_generic fan3]           [temperature_sensor          = PB0,
#            no controller at all          chamber_temp]                the exhaust fan
#   1.4.x    [temperature_fan exhaust_fan] same section, sensor_pin    = PE14,
#            watermark controller                                       a different fan
#
# So on 1.3.7:
#
#   * The thermistor is ALREADY declared as [temperature_sensor chamber_temp]
#     on PC4, exactly as the macros expect. It is not repeated here. Redefining
#     it would be tolerated — Klipper parses with strict=False and merges
#     duplicate sections — but it would claim PC4 twice under a second section
#     name if you renamed it, so leave it alone.
#
#   * The exhaust fan is ALREADY [fan_generic fan3] on PB0, and there is no
#     controller on it whatsoever — no temperature_fan, no watermark, nothing.
#     Stock 1.3.7 leaves it to the slicer and the UI. So this mod is purely
#     additive here; there is nothing to remove.
#
#   * This file therefore OVERRIDES the stock [fan_generic fan3] rather than
#     declaring a new section. A second section on PB0 would be fatal
#     ("pin PB0 used multiple times in config"), and renaming it to exhaust_fan
#     would break Macro.cfg's ALL_FAN_OFF, which does SET_FAN_SPEED FAN=fan3.
#
# ORDER MATTERS. Includes apply linearly — configfile.py buffers lines between
# includes "so that overrides in includes apply linearly as they do within a
# single file". Placed at the top of printer.cfg this is expanded before the
# stock [fan_generic fan3], which would then overwrite it. Put both includes at
# the END of printer.cfg:
#
#   ...existing contents, including the stock [fan_generic fan3]...
#   [include chamber_fan_hw_1.3.7.cfg]
#   [include chamber_fan.cfg]
#
# The hardware identity macro below tells the shared controller that this
# firmware calls PB0 `fan3`; chamber_fan.cfg itself is identical on both eras.

[gcode_macro _CH_HW]
variable_fan: "fan3"
gcode:

[fan_generic fan3]
tachometer_pin: PB1
tachometer_ppr: 2                # Gekkio scope measurement, 2026-06-01
tachometer_poll_interval: 0.0019
hardware_pwm: false
cycle_time: 0.07                 # stock is 0.015
# Published floor, as on the curtain fan: a request below it turns the fan off
# instead of leaving it powered and stalled. That includes a slicer M106 P3,
# which Sovol's M106 sends straight to fan3. 10% held five minutes at 70 ms on
# the bench, but in service one unit failed 13% and holds 14%; 0.15 is one point
# above. The adaptive floor trials in chamber_fan.cfg (ch_floor_autotune, off by
# default) need off_below: 0.00, or every trial below 0.15 reads as a stall.
off_below:  0.15
max_power: 1.0
kick_start_time: 0.40            # Zero2 needed 10/10 at its low-duty target
shutdown_speed: 0.00
