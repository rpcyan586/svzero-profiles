# camera_auto -- the stock camera's exposure follows the room, print to print.
#
# Optional, and not part of either firmware file: include it yourself, after
# the pack, with klipper/camera_auto.py copied into ~/klipper/klippy/extras/
# and Klipper's service restarted. It needs nothing a stock Zero image does not
# ship: v4l2-ctl, ffmpeg, crowsnest's ustreamer and NumPy in klippy-env.
#
#   start  _PREFLIGHT starts it in the background before the bed heats. It
#          corrects the stored exposure for this room's light, by at most
#          start_max_step, toward the plate brightness the last print's end
#          chose. The first run meters toward target_median instead.
#   end    END_PRINT starts it with the finished part on the plate. It tries
#          exposure / end_bracket_step, exposure and x end_bracket_step, keeps
#          the sharpest per unit of noise that clips nothing and sits in
#          median_min..median_max, and writes it into crowsnest.conf's
#          v4l2ctl (backup: crowsnest.conf.camera-auto-orig). A crowsnest or
#          machine restart starts from it.
#
# It never moves, heats, cools or lights anything and runs no G-code. Every
# result is one console line and the camera_auto status object. A failure
# leaves the camera as it was and does not touch the print.
#
# WHY THE START IS ONLY A CORRECTION. A bare dark plate clips at no exposure
# the camera offers, so "brightest without clipping" runs exposure to its
# maximum, and the next white part blows out (notes/runbook-webcam.md). The
# start therefore restores a brightness rather than searching. The end is where
# clipping can bind, because there is a part on the plate.
#
# Crowsnest must own the camera: when [cam 1]'s device is /dev/null or absent,
# as on a go2rtc machine, it reports that and does nothing.
#
#   CAMERA_AUTO PHASE=start|end   run a phase now, in the background
#   CAMERA_AUTO_RESET             forget the reference; the next start meters

[camera_auto]
# The plate, as x0,y0,x1,y1 fractions of the camera's own frame, which on a
# stock Zero is upside down: crowsnest does not rotate, Moonraker's web view
# does. The default is Zero2's measured bed region; check yours against a raw
# snapshot (http://<printer>:8080/?action=snapshot), because mounts differ.
#roi: 0.16,0.40,0.78,0.71
# A region that is grey in this view, to trim white balance toward. Without one
# the camera's automatic white balance stays on: a plate is not grey.
#neutral_patch:
# Exposure in the camera's units of 100 us. 120 is Zero2's measured value with
# a bright reference on the plate; 600 caps a dark plate's pull upward.
#exposure_initial: 120
#exposure_min: 20
#exposure_max: 600
# The plate median the first run meters toward, and the band an end-phase pick
# must land in. 60 is Zero2's metering target on its sheet.
#target_median: 60
#median_min: 40
#median_max: 100
# Constraints on the plate region, as fractions of its pixels: at most 2%
# clipped and 15% crushed (Zero2's measured tuning limits).
#max_clip: 0.02
#max_dark: 0.15
#start_max_step: 2.0
#end_bracket_step: 1.4
#gain: 0
# White balance: B/G falls by this per +1000 K (Zero2's MGS1, 2026-10-13).
#wb_slope: 0.27
#settle_seconds: 0.8
#max_seconds: 30
#snapshot_url: http://127.0.0.1:8080/?action=snapshot
#cam: 1
#crowsnest_conf: ~/printer_data/config/crowsnest.conf
#state_file: ~/printer_data/config/camera_auto_state.json
