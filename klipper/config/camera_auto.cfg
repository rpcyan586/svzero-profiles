# camera_auto -- the stock camera's exposure follows the room, print to print.
#
# Optional, and not part of either firmware file: include it yourself, after
# the pack, with klipper/camera_auto.py copied into ~/klipper/klippy/extras/
# and Klipper's service restarted. It needs nothing a stock Zero image does not
# ship: v4l2-ctl, ffmpeg, crowsnest's ustreamer and NumPy in klippy-env.
#
#   start  _PREFLIGHT starts it in the background before the bed heats. It
#          corrects the stored exposure for this room's light, by at most
#          start_max_step, toward the plate brightness the last print's end
#          chose. The first run meters toward target_median instead.
#   end    END_PRINT starts it with the finished part on the plate. It tries
#          exposure / end_bracket_step, exposure and x end_bracket_step, keeps
#          the sharpest per unit of noise that clips nothing and sits in
#          median_min..median_max, and writes it into crowsnest.conf's
#          v4l2ctl (backup: crowsnest.conf.camera-auto-orig). A crowsnest or
#          machine restart starts from it.
#
# It also sets crowsnest's resolution, 672x456 unless `resolution` below says
# otherwise; crowsnest picks that up when it next starts.
#
# It never moves, heats, cools or lights anything and runs no G-code. Every
# result is one console line and the camera_auto status object. A failure
# leaves the camera as it was and does not touch the print.
#
# WHY THE START IS ONLY A CORRECTION. A bare dark plate clips at no exposure
# the camera offers, so "brightest without clipping" runs exposure to its
# maximum, and the next white part blows out (notes/runbook-webcam.md). The
# start therefore restores a brightness rather than searching. The end is where
# clipping can bind, because there is a part on the plate.
#
# Crowsnest must own the camera: when [cam 1]'s device is /dev/null or absent,
# as on a go2rtc machine, it reports that and does nothing.
#
#   CAMERA_AUTO PHASE=start|end   run a phase now, in the background
#   CAMERA_AUTO_RESET             forget the reference; the next start meters

[camera_auto]
# The stream's size. camera_auto writes it into crowsnest.conf's [cam 1]
# resolution at the next start or print's end where it differs, and it takes
# effect the next time crowsnest starts: restart crowsnest from Mainsail's
# power menu, under services, or reboot. It never restarts crowsnest itself,
# so a print's stream is not cut. To change it, uncomment the
# line below with one of these, restart the Klipper service while idle, then
# run CAMERA_AUTO PHASE=start (or print once) and restart crowsnest.
#
# Every size is the camera's own MJPEG, which crowsnest's ustreamer passes
# through untouched: with one viewer it used 2.1% of a core at 672x456, 2.2%
# at 800x480 and 2.9% at 1280x720. Each smaller size scales the full sensor
# height down in the camera and crops the sides. Measured on two Zeros'
# cameras, 2026-11-22 (docs/images/camera-framing.png). Frame sizes move with
# the scene and the camera settings; the ranges are from two of each:
#
#   672x456   the default. 1/1.58 of the sensor, keeping about x 115 to 1172
#             of its 1280 and the full height: the whole plate, without most
#             of the room seen through the door or of the front-right
#             leadscrew. Both corners of the build area that come near the
#             sides stay in frame at every bed height; the rear-right comes
#             closest, about 20 px inside the right edge, at the first layer.
#             34-44 KB a frame.
#   1280x720  native: the whole sensor. Barely sharper -- about 4% of its
#             detail is finer than 800x480 can hold -- but less noisy once a
#             viewer shrinks it, because the camera's own downscale does not
#             average. 100-170 KB a frame, 2.3 to 5 times the others, which is
#             what each viewer pulls over Wi-Fi.
#   800x480   what a stock image gets: Sovol's crowsnest.conf asks for 720x540,
#             which the camera does not offer, and lands here. 1/1.5, the full
#             width less about 40 px on each side. 39-46 KB a frame.
#   640x480   4:3, 1/1.5: drops a quarter of the width, and with it the build
#             area's rear-right corner until the bed is about 50 mm down.
#             About 34 KB a frame.
#   keep      leave crowsnest's resolution alone.
#
# Obico sees no difference among these: its detector stretches every frame to
# 416x416. crowsnest.conf.camera-auto-orig keeps the original file.
#resolution: 672x456
# The part of the frame that is measured, as x0,y0,x1,y1 fractions of the
# camera's own frame (upside down on a stock Zero: crowsnest does not rotate,
# Moonraker's web view does). It is a crop, not the plate: the bed moves in Z,
# so the plate moves through the frame, and the start and end phases compare
# the same framing because the bed does not move between one print's end and
# the next one's start. Crop away what never helps -- the frame's edges, and
# the room seen through the door and lid in your view
# (http://<printer>:8080/?action=snapshot).
#roi: 0.10,0.10,0.90,0.90
# White balance: 0 keeps the camera's own automatic on, and it is persisted.
# Under the stock white LED bar no manual temperature is neutral -- the MGS1's
# one axis trades red against blue, and on Zero1's dark-grey interior R/G stayed
# 0.20-0.54 from 2800 to 6500 K, the green cast. Its AWB made the same interior
# neutral (R/G 1.03, B/G 0.99) within 1.6 s, and turning AWB off drops straight
# back to the manual gains, so AWB's result cannot be frozen (2026-10-31). A
# value from 2800 to 6500 pins a manual temperature instead.
#white_balance_temperature: 0
# Each phase reports the interior's colour, R/G and B/G over the crop's
# mid-tones, and calls it neutral within this of 1: the check that AWB still
# sees grey. It changes nothing.
#colour_tolerance: 0.15
# Exposure in the camera's units of 100 us. 120 is Zero2's measured value with
# a bright reference on the plate; 600 caps a dark plate's pull upward.
#exposure_initial: 120
#exposure_min: 20
#exposure_max: 600
# The plate median the first run meters toward, and the band an end-phase pick
# must land in. 60 is Zero2's metering target on its sheet.
#target_median: 60
#median_min: 40
#median_max: 100
# Constraints on the plate region, as fractions of its pixels: at most 2%
# clipped and 15% crushed (Zero2's measured tuning limits).
#max_clip: 0.02
#max_dark: 0.15
#start_max_step: 2.0
#end_bracket_step: 1.4
#gain: 0
# brightness is an additive offset, and it is pinned. At 64 the median of a
# Zero1 frame went only 66 -> 111 across exposures 20 -> 640; at 0 it went
# 0 -> 45, so a brightness ratio means something. 0 is the camera's default.
#brightness: 0
# The median goes roughly as exposure ** this: doubling exposure from 160 and
# from 320 multiplied it by 2.8 and 2.6 (Zero1's MGS1 at brightness 0,
# 2026-10-31). The start phase moves exposure by the ratio ** (1 / this).
#response_exponent: 1.4
#settle_seconds: 0.8
#max_seconds: 30
#snapshot_url: http://127.0.0.1:8080/?action=snapshot
#cam: 1
#crowsnest_conf: ~/printer_data/config/crowsnest.conf
#state_file: ~/printer_data/config/camera_auto_state.json
