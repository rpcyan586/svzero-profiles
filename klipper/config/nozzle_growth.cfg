# Nozzle growth -- the first layer at its own nozzle temperature, not the probe's
#
# Optional. START_PRINT reaches this file only through
# `'gcode_macro _NOZZLE_GROWTH' in printer`, and on stock firmware the slicer's
# SVZERO_NOZZLE_GROWTH line is an unknown command that warns and continues.
#
# THE ERROR. Every print's Z reference is taken with the nozzle at one
# temperature and the first layer is printed at another, and a hotter nozzle
# reaches further down. On Zero2 (1.3.7, 0.4 nozzle, 2026-10-18) the tare-tap
# read 40-45 um higher from 150 to 190 C while the eddy, which sees the plate
# and not the nozzle, rose 10: net, about 0.75-0.9 um per degree. That is ONE
# clean step. Above 190 C that run was spoiled by plastic on the tip. A later
# run on the same machine, 150 to 280 C and back, fit 0.8-1.1 um/C with residue
# on the tip still in play. Run 10, with the tip cleaned by hand and nothing
# loaded, tapped 8 untouched plate spots once at 150 and once at 280 C, half
# of them hot first: 0.67 um/C mean, standard error 0.05. That is the k below.
#
# Where each firmware takes its reference:
#
#   1.3.7, tare-tap   START_PRINT runs Z_OFFSET_CALIBRATION METHOD=force_overlay
#                     on every print at EXTRUDER_TEMP=_BRUSH.probe_temp (150),
#                     and G28 Z and the mesh follow at that nozzle temperature.
#                     The reference is probe_temp, every job.
#   1.4.x, eddy only  Z_OFFSET_CALIBRATION returns at once when eddy data exists
#                     ("Eddy data already exists"), so the reference is a
#                     calibration stored once, at whatever nozzle temperature it
#                     ran (the calibrator's default is 130), and nothing records
#                     which. Unknown unless SVZERO_NOZZLE_GROWTH_EDDY_REF below
#                     recorded it. The one exception: with no eddy data the
#                     calibrator runs during this START_PRINT, at probe_temp.
#
# ABS's first layer runs at 280 C, so on the tare-tap path it sits closer than
# calibrated by k x (280 - 150): 0.087 mm at 0.67 um/C, 44% of a 0.2 mm layer.
#
# THE MODEL is linear: dz = k x (first-layer temperature - reference), applied
# with SET_GCODE_OFFSET Z_ADJUST=dz. + means farther from the bed, the same
# sign as the per-filament stub: a hotter, longer nozzle needs the bed further
# away. k is in mm per degree C. The slicer sends the first-layer temperature
# right after START_PRINT, before it heats to it, so the purge and the first
# layer both print in the adjusted frame. Later layers keep it; a 10 C
# difference between first and other layers is 7 um at 0.67 um/C.
#
# PUBLISHED ON, the operator's decision of 2026-10-18. The published k is the
# operator's Zero2 value from run 10, set once, in variable_mm_per_c below.
# Against the 150 C probe temperature it puts the first layer about 0.05 mm
# farther from the bed at 230 C, 0.07 at 250, 0.08 at PETG's 265 and 0.09 at
# ABS's 280. k belongs to one machine's nozzle, heater block and probe, so on
# any other Zero it is an estimate. Measure your own (docs/STARTUP.md) and
# store it, or store 0 to turn the compensation off on that machine:
#
#     SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=0.0008
#     SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=0
#
# The save_variable wins over variable_mm_per_c, so it survives a pack update.
#
# ADDITIVE WITH THE PER-FILAMENT STUB. Each filament's start G-code carries its
# own SET_GCODE_OFFSET Z_ADJUST, which the slicer emits after the printer's
# start G-code. An offset tuned without this compensation -- with an earlier
# pack, or with k saved as 0 -- already holds this machine's growth for that
# material, so with k applied it is counted twice: set those offsets back to 0
# and re-tune them as residuals.
#
# NOT COMPENSATED: the eddy coil's own drift. The coil sits beside the nozzle,
# and in the same run the eddy rose 56 um while the nozzle went from 48 to
# 150 C, which may be the coil warming rather than the frame moving. Stock
# printer.cfg configures no coil temperature sensor for Klipper's drift
# compensation to read. It is a known second term on the eddy path, not
# separated or measured yet, and this file does not model it.

[gcode_macro _NOZZLE_GROWTH]
description: Nozzle growth state. k from save_variables nozzle_growth_mm_per_c, else variable_mm_per_c, 0 is off.
# mm per degree C; 0 is off. THE PUBLISHED k, and the only place it is set.
# Measured on the operator's Zero2 (1.3.7, 0.4 nozzle): the mean of run 10's
# 8 spot pairs, 2026-10-18. The offsets quoted above, in docs/STARTUP.md,
# INSTALL.md and CHANGELOG.md are computed from it.
variable_mm_per_c: 0.00067
# THE GUARD, in mm. The hotend's whole range is 355 C (max_temp on both
# firmwares) and the lowest reference the pack takes is the calibrator's 130,
# so 225 C at the top of the measured rate, 0.9 um/C, is 0.20 mm: the most
# growth this machine could produce if the rate held to max_temp. Past 0.25 the
# number is not growth but a slip -- um typed as mm is 1000x, a dropped zero
# 10x -- or a wrong reference. It is REFUSED, not clamped: a clamp would still
# print 0.25 mm off on a k already shown to be wrong, while a refusal prints as
# the machine did before this file existed, and says so in red.
variable_max_adjust: 0.25
# This job's Z reference nozzle temperature, written by START_PRINT after
# Z_OFFSET_CALIBRATION. -1 is unknown, and then nothing is applied.
variable_ref_temp: -1.0
# Where ref_temp came from, for the console line: none, tap, eddy_new,
# eddy_saved or eddy_unknown.
variable_ref_source: "none"
# The adjustment already applied this job, mm. START_PRINT clears it along with
# the G-code offset, so calling SVZERO_NOZZLE_GROWTH twice applies only the
# difference rather than doubling it.
variable_applied: 0.0
gcode:


[gcode_macro SVZERO_NOZZLE_GROWTH]
description: Offset Z by k x (TEMP - this job's reference nozzle temperature) for the first layer. SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=0 turns it off.
gcode:
    {% set g = printer["gcode_macro _NOZZLE_GROWTH"] %}
    {% set sv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set k = sv.nozzle_growth_mm_per_c|default(g.mm_per_c)|float %}
    {% set k_from = "save_variables" if 'nozzle_growth_mm_per_c' in sv else "macro default" %}
    {% set t = params.TEMP|default(0)|float %}
    {% set ref = g.ref_temp|float %}
    {% set src = g.ref_source|default("none")|string %}
    {% set why = {"tap": "tare-tap at probe temperature this job",
                  "eddy_new": "eddy calibrated this job at probe temperature",
                  "eddy_saved": "stored eddy calibration, temperature recorded by SVZERO_NOZZLE_GROWTH_EDDY_REF",
                  "eddy_unknown": "stored eddy calibration, its nozzle temperature was never recorded",
                  "none": "START_PRINT has not set one this job"}.get(src, src) %}
    {% if k <= 0 %}
        RESPOND PREFIX="growth" MSG="nozzle growth compensation off, k={k} mm/C from {k_from}. Nothing applied. Measure this machine's k, then SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=<k>"
    {% elif t <= 0 %}
        RESPOND PREFIX="growth" MSG="no first-layer temperature given (TEMP={params.TEMP|default('')}). Nothing applied. k={k} mm/C, reference {ref}C ({why}), applied {g.applied|float} mm this job"
    {% elif ref <= 0 %}
        RESPOND PREFIX="growth" MSG="reference temperature unknown: {why}. Nothing applied, k={k} mm/C, first layer {t}C. On eddy-only firmware, after a deliberate eddy calibration at a known nozzle temperature run SVZERO_NOZZLE_GROWTH_EDDY_REF TEMP=<that temperature>"
    {% else %}
        {% set dz = (k * (t - ref))|round(4) %}
        {% set delta = (dz - g.applied|float)|round(4) %}
        {% if dz|abs > g.max_adjust|float %}
            # No PREFIX: Klipper's PREFIX replaces the "!!" that marks an error.
            RESPOND TYPE=error MSG="nozzle growth refused: k={k} mm/C x (first layer {t}C - reference {ref}C) = {dz} mm, beyond the {g.max_adjust} mm bound. Check k is in mm per degree C, 0.0008 rather than 0.8. Nothing applied."
        {% elif delta == 0 %}
            RESPOND PREFIX="growth" MSG="already applied {dz} mm this job (k={k} mm/C, first layer {t}C, reference {ref}C). Nothing more applied."
        {% else %}
            SET_GCODE_OFFSET Z_ADJUST={delta} MOVE=1
            SET_GCODE_VARIABLE MACRO=_NOZZLE_GROWTH VARIABLE=applied VALUE={dz}
            RESPOND PREFIX="growth" MSG="k={k} mm/C ({k_from}) x (first layer {t}C - reference {ref}C, {why}) = {dz} mm. SET_GCODE_OFFSET Z_ADJUST={delta} MOVE=1, + is farther from the bed"
        {% endif %}
    {% endif %}


# RECORD THE EDDY CALIBRATION'S NOZZLE TEMPERATURE (1.4.x).
#
# On eddy-only firmware the Z reference is the stored eddy calibration, and
# Klipper keeps no note of how hot the nozzle was when it was taken. Run this
# right after a deliberate calibration at a known nozzle temperature, for
# example with the bed at its usual print temperature:
#
#     Z_OFFSET_CALIBRATION METHOD=force BED_TEMP=100 EXTRUDER_TEMP=150
#     SVZERO_NOZZLE_GROWTH_EDDY_REF TEMP=150
#     SAVE_CONFIG
#
# Any METHOD other than the default forces the calibration on 1.4.7. SAVE_CONFIG
# keeps it (and restarts Klipper, so only while idle); without it the old
# calibration returns at the next restart and the record is wrong. Re-record
# after every eddy calibration: a stale value applies the wrong reference
# silently, which is why nothing here guesses one. On 1.3.7 the tare-tap
# re-takes the reference each print and this value is not read.
[gcode_macro SVZERO_NOZZLE_GROWTH_EDDY_REF]
description: Record the nozzle temperature of the stored eddy calibration (1.4.x). TEMP=<C> records, CLEAR=1 forgets, no argument reports.
gcode:
    {% set sv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set have = sv.nozzle_growth_eddy_ref_temp|default(-1.0)|float %}
    {% set top = printer.configfile.settings.extruder.max_temp|default(355.0)|float %}
    {% if params.CLEAR|default(0)|int == 1 %}
        SAVE_VARIABLE VARIABLE=nozzle_growth_eddy_ref_temp VALUE=-1.0
        RESPOND PREFIX="growth" MSG="eddy calibration nozzle temperature forgotten (was {have}C). Eddy-only jobs now apply no growth compensation."
    {% elif 'TEMP' not in params %}
        RESPOND PREFIX="growth" MSG="eddy calibration nozzle temperature {(have|string + 'C, recorded') if have > 0 else 'not recorded'}. Set it with SVZERO_NOZZLE_GROWTH_EDDY_REF TEMP=<C> after a deliberate eddy calibration."
    {% else %}
        {% set t = params.TEMP|float %}
        {% if t <= 0 or t > top %}
            RESPOND TYPE=error MSG="nozzle growth: TEMP={params.TEMP} is not a nozzle temperature between 0 and {top}C. Nothing recorded."
        {% else %}
            SAVE_VARIABLE VARIABLE=nozzle_growth_eddy_ref_temp VALUE={t}
            RESPOND PREFIX="growth" MSG="eddy calibration recorded as taken at nozzle {t}C (was {have}C). Re-record after every eddy calibration."
        {% endif %}
    {% endif %}
