# Nozzle growth -- the first layer at its own nozzle temperature, not the probe's
#
# Optional. START_PRINT reaches this file only through
# `'gcode_macro _NOZZLE_GROWTH' in printer`, and on stock firmware the slicer's
# SVZERO_NOZZLE_GROWTH line is an unknown command that warns and continues.
#
# THE ERROR. Every print's Z reference is taken with the nozzle at one
# temperature and the first layer is printed at another, and a hotter nozzle
# reaches further down. On Zero2 (1.3.7, 0.4 nozzle, 2026-10-18) the tare-tap
# read 40-45 um higher from 150 to 190 C while the eddy, which sees the plate
# and not the nozzle, rose 10: net, about 0.75-0.9 um per degree. That is ONE
# clean step. Above 190 C that run was spoiled by plastic on the tip. A later
# run on the same machine, 150 to 280 C and back, fit 0.8-1.1 um/C with residue
# on the tip still in play. Run 10, the tip cleaned by hand and nothing
# loaded, tapped 8 untouched plate spots once at 150 and once at 280 C: 0.67
# um/C. Its spots were far from the tare-tap's sensor, which sits under the
# hotbed's front-left corner screw (Sovol's CAD). Run 12 repeated it on the
# plate's front margin beside the sensor: 1.13 um/C, standard error 0.13.
# Run 13 printed single-layer squares lifted for k 0.67, 1.0, 1.3 and 1.6 and
# tapped them cold: 0.67 and 1.0 came out over-squished, and 1.3's square was
# flat at 0.273 mm for a 0.25 mm layer, 0.147 mm of growth or 1.13 um/C. The
# k published from them, 1.1 um/C, sits between 1.0 and those two. Every rate
# here is per degree on Sovol's sensor curve; hotend_pt1000.cfg replaces that
# curve, so the k below is 1.1 rescaled to real degrees, 1.15 um/C.
#
# Where each firmware stands, the operator's decision of 2026-10-18:
#
#   1.3.7, tare-tap   ON. START_PRINT runs Z_OFFSET_CALIBRATION
#                     METHOD=force_overlay on every print at
#                     EXTRUDER_TEMP=_BRUSH.probe_temp (150), and G28 Z and the
#                     mesh follow at that nozzle temperature. The reference is
#                     probe_temp, every job, and k below was measured this way.
#   1.4.x, eddy only  OFF, stock behaviour. Nothing is applied, whatever k is
#                     saved, and there is no opt-in. k was measured with the
#                     1.3.7 tare-tap, the eddy path has a term of its own (the
#                     coil, below) and has not been measured, and the two are
#                     not to be conflated.
#
# ABS's first layer runs at 271 C (280 on Sovol's curve), so on the tare-tap
# path it sits closer than calibrated by k x (271 - 150): 0.139 mm at
# 1.15 um/C, 70% of a 0.2 mm layer.
#
# THE MODEL is linear: dz = k x (first-layer temperature - reference), applied
# with SET_GCODE_OFFSET Z_ADJUST=dz. + means farther from the bed, the same
# sign as the per-filament stub: a hotter, longer nozzle needs the bed further
# away. k is in mm per degree C. The slicer sends the first-layer temperature
# right after START_PRINT, before it heats to it, so the purge and the first
# layer both print in the adjusted frame. Later layers keep it; a 10 C
# difference between first and other layers is 11.5 um at 1.15 um/C.
#
# PUBLISHED ON FOR 1.3.7. The published k is the operator's Zero2 value from
# runs 12 and 13, set once, in variable_mm_per_c below. Against the 150 C
# probe temperature it puts the first layer about 0.08 mm farther from the bed
# at Brass PLA's 223 C, 0.11 at TPU's 242, 0.12 at PETG's 257 and 0.14 at
# ABS's 271.
# k belongs to
# one machine's nozzle, heater block and probe, so on any other Zero it is an
# estimate. Measure your own (docs/STARTUP.md) and store it, or store 0 to
# turn the compensation off on that machine:
#
#     SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=0.0008
#     SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=0
#
# The save_variable wins over variable_mm_per_c, so it survives a pack update.
# On 1.4.x neither is read.
#
# ADDITIVE WITH THE PER-FILAMENT STUB (1.3.7). Each filament's start G-code
# carries its own SET_GCODE_OFFSET Z_ADJUST, which the slicer emits after the
# printer's start G-code. An offset tuned without this compensation -- with an
# earlier pack, or with k saved as 0 -- already holds this machine's growth for
# that material, so with k applied it is counted twice: set those offsets back
# to 0 and re-tune them as residuals.
#
# WHY THE EDDY PATH IS OFF: the coil's own drift. The coil sits beside the
# nozzle, and in the same run the eddy rose 56 um while the nozzle went from 48
# to 150 C, which may be the coil warming rather than the frame moving. Stock
# printer.cfg configures no coil temperature sensor for Klipper's drift
# compensation to read. It is a second term on the eddy path, not separated or
# measured yet, so a k measured with the tare-tap is not applied to it.

[gcode_macro _NOZZLE_GROWTH]
description: Nozzle growth state. k from save_variables nozzle_growth_mm_per_c, else variable_mm_per_c, 0 is off.
# mm per degree C; 0 is off. THE PUBLISHED k, and the only place it is set.
# Measured on the operator's Zero2 (1.3.7, 0.4 nozzle), 2026-10-19: taps beside
# the sensor (run 12, 1.13 um/C) and printed squares (run 13, between 1.0 and
# about 1.13). Applied on the 1.3.7 tare-tap path only. The offsets quoted
# above, in docs/STARTUP.md, INSTALL.md and CHANGELOG.md are computed from it.
# Rescaled for hotend_pt1000.cfg: the runs' 150 and 280 C set points, on
# Sovol's curve, were 146.62 and 270.92 C at the nozzle, so the published
# 1.1 um/C per reported degree is 1.1 x 130 / 124.30 = 1.15 per real one
# (source/hotend-sensor.json).
variable_mm_per_c: 0.00115
# THE GUARD, in mm. The hotend's whole range is 344 C (max_temp in
# hotend_pt1000.cfg) and the lowest reference the pack takes is the
# calibrator's 130, so 214 C at the highest single-spot rate measured, 1.41
# um/C on Sovol's curve (run 12) and 1.47 rescaled, is 0.32 mm: the most growth
# this machine could produce if the rate held to max_temp. Past 0.35 the number
# is not growth but a slip -- um typed as mm is
# 1000x, a dropped zero 10x -- or a wrong reference. It is REFUSED, not
# clamped: a clamp would still print 0.35 mm off on a k already shown to be
# wrong, while a refusal prints as the machine did before this file existed,
# and says so in red.
variable_max_adjust: 0.35
# This job's Z reference nozzle temperature, written by START_PRINT after
# Z_OFFSET_CALIBRATION. -1 is none, and then nothing is applied.
variable_ref_temp: -1.0
# Where ref_temp came from, for the console line: none, tap, or eddy_off on
# eddy-only firmware.
variable_ref_source: "none"
# The adjustment already applied this job, mm. START_PRINT clears it along with
# the G-code offset, so calling SVZERO_NOZZLE_GROWTH twice applies only the
# difference rather than doubling it.
variable_applied: 0.0
gcode:


[gcode_macro SVZERO_NOZZLE_GROWTH]
description: Offset Z by k x (TEMP - this job's reference nozzle temperature) for the first layer, on the 1.3.7 tare-tap only. Off on eddy-only firmware. SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=0 turns it off.
gcode:
    {% set g = printer["gcode_macro _NOZZLE_GROWTH"] %}
    {% set sv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set k = sv.nozzle_growth_mm_per_c|default(g.mm_per_c)|float %}
    {% set k_from = "save_variables" if 'nozzle_growth_mm_per_c' in sv else "macro default" %}
    {% set t = params.TEMP|default(0)|float %}
    {% set ref = g.ref_temp|float %}
    {% set src = g.ref_source|default("none")|string %}
    {% set why = {"tap": "tare-tap at probe temperature this job",
                  "none": "START_PRINT has not set one this job"}.get(src, src) %}
    # Eddy-only firmware first, before k or TEMP: off whatever is saved. The
    # firmware is tested here as well as in START_PRINT's eddy_off, so a call
    # outside START_PRINT applies nothing either.
    {% if src == "eddy_off" or 'probe_pressure' not in printer %}
        RESPOND PREFIX="growth" MSG="nozzle growth compensation is off on eddy-only firmware: k was measured with the 1.3.7 tare-tap, and the eddy path is unmeasured. Nothing applied."
    {% elif k <= 0 %}
        RESPOND PREFIX="growth" MSG="nozzle growth compensation off, k={k} mm/C from {k_from}. Nothing applied. Measure this machine's k, then SAVE_VARIABLE VARIABLE=nozzle_growth_mm_per_c VALUE=<k>"
    {% elif t <= 0 %}
        RESPOND PREFIX="growth" MSG="no first-layer temperature given (TEMP={params.TEMP|default('')}). Nothing applied. k={k} mm/C, reference {ref}C ({why}), applied {g.applied|float} mm this job"
    {% elif ref <= 0 %}
        RESPOND PREFIX="growth" MSG="reference temperature unknown: {why}. Nothing applied, k={k} mm/C, first layer {t}C."
    {% else %}
        {% set dz = (k * (t - ref))|round(4) %}
        {% set delta = (dz - g.applied|float)|round(4) %}
        {% if dz|abs > g.max_adjust|float %}
            # No PREFIX: Klipper's PREFIX replaces the "!!" that marks an error.
            RESPOND TYPE=error MSG="nozzle growth refused: k={k} mm/C x (first layer {t}C - reference {ref}C) = {dz} mm, beyond the {g.max_adjust} mm bound. Check k is in mm per degree C, 0.0008 rather than 0.8. Nothing applied."
        {% elif delta == 0 %}
            RESPOND PREFIX="growth" MSG="already applied {dz} mm this job (k={k} mm/C, first layer {t}C, reference {ref}C). Nothing more applied."
        {% else %}
            SET_GCODE_OFFSET Z_ADJUST={delta} MOVE=1
            SET_GCODE_VARIABLE MACRO=_NOZZLE_GROWTH VARIABLE=applied VALUE={dz}
            RESPOND PREFIX="growth" MSG="k={k} mm/C ({k_from}) x (first layer {t}C - reference {ref}C, {why}) = {dz} mm. SET_GCODE_OFFSET Z_ADJUST={delta} MOVE=1, + is farther from the bed"
        {% endif %}
    {% endif %}
