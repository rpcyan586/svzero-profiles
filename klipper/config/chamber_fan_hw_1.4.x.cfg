# Chamber control — hardware sections for 1.4.x (tested on 1.4.7)
#
# YOU MUST DELETE A STOCK SECTION FIRST. 1.4.x ships:
#
#   [temperature_fan exhaust_fan]     <- printer.cfg ~263 on 1.4.7
#   pin: PB0                          <- the exhaust fan
#   sensor_type: EPCOS 100K B57560G104F
#   sensor_pin: PC4                   <- the chamber thermistor
#
# That single section is both halves of what this mod replaces: it is the
# watermark controller responsible for the banding and the noise, and it holds
# the chamber thermistor. It claims PB0 and PC4, so leaving it in place while
# adding the sections below is fatal — pins.py raises "pin PB0 used multiple
# times in config". Comment it out or delete it.
#
# There is no way to keep it and override it: a temperature_fan cannot be driven
# by SET_FAN_SPEED, and it cannot be converted into a fan_generic in place.
#
# Do NOT confuse this with [fan_generic fan3] on PE14. On 1.4.x fan3 is a
# different, unrelated fan. The name fan3 means different hardware on 1.3.7.
#
#   [include chamber_fan_hw_1.4.x.cfg]
#   [include chamber_fan.cfg]

[gcode_macro _CH_HW]
variable_fan: "exhaust_fan"
gcode:

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 80

[fan_generic exhaust_fan]
pin: PB0
tachometer_pin: PB1
tachometer_ppr: 2                # Gekkio scope measurement, 2026-06-01
tachometer_poll_interval: 0.0019 # was 0.0046, which aliased at higher speed
hardware_pwm: false              # sw PWM, so cycle_time is actually honoured
cycle_time: 0.07                 # chosen by long-dwell minimum, not cold start
# The macro clamps and hysteretically turns off; a hardware cutoff would hide
# the 9% downward trial from the tach guard instead of letting it detect stall.
off_below:  0.00
max_power: 1.0
kick_start_time: 0.40            # ~39 dB(A) measured vs 37 dB(A) background
shutdown_speed: 0.00
