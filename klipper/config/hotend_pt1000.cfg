# HOTEND SENSOR -- Klipper's own PT1000 conversion in place of Sovol's table.
#
# Sovol's [extruder] reads the hotend's PT1000B through [adc_temperature
# my_thermistor_e], three resistance points with pullup_resistor: 11500. The
# part is a catalogue IEC 751 class B PT1000 (Sovol drawing JXHMP4602-08052-f,
# 3850 ppm/K) and the toolhead's real pull-up is 10 kOhm, so that pair reads
# high and the nozzle runs cold. True temperature minus set point, from
# Klipper's own interpolation with an ideal PT1000 on 10 kOhm:
#
#     set point   150   200   230   250   265   280   300   355
#     C          -3.4  -5.1  -6.8  -7.8  -8.5  -9.1  -9.8  -11.0
#
# pi.r measured it inside a Zero's block (forum t/10515); torch on a stock
# SV08 MAX with a thermocouple (t/8603); the operator's two Zeros read within
# 0.5% of 10 kOhm at room temperature. Method and sources:
# source/hotend-sensor.json.
#
# THE PACK'S TEMPERATURES MOVE WITH IT. Every Sovol-derived nozzle and
# first-layer temperature in the slicer profiles is rebased to what the
# nozzle reached on Sovol's curve, so a print reaches the temperature it did
# before and the number now means what it says. PCTG, the operator's own
# preset, is not rebased. A profile from elsewhere -- Sovol's stock Orca
# filaments, or your own -- now prints 5-11 C hotter than it did, by the
# table above; lower it by that much to keep its result.
#
# max_temp: 355 on Sovol's curve put the nozzle at 344 C, so the ceiling
# keeps that: the stock value rebased by the same rule as the profiles.
#
# MUST FOLLOW printer.cfg's [extruder]. A later duplicate section wins option
# by option, which is how three options change without editing Sovol's file;
# the pin, PID and every other option stay Sovol's. The [adc_temperature]
# section stays defined and unused. Sovol's OTA and factory_resets.sh copy
# their printer.cfg over yours and drop this include with it: the nozzle then
# runs cold by the table above, not hot. To go back to Sovol's curve, remove
# the include and restart.
#
# Checks once installed, with the hotend cold: QUERY_ADC NAME=extruder reads
# the sensor's resistance, and the extruder now matches the chamber and bed
# sensors at room temperature to about a degree, where Sovol's curve read
# 1.5 C low. A PID_CALIBRATE is optional: the loop's gain changes by about 5%.

[extruder]
sensor_type: PT1000
pullup_resistor: 10000
max_temp: 344
