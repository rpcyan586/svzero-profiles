# Orbiting stir for the chamber preheat: sweep the plate instead of hovering.
#
# THE PROBLEM. M191 parks the toolhead at bed centre and runs fan0 to stir the
# chamber. The nozzle doubles as the chamber proxy, so it has to sit in moving
# air -- but a fan blowing down on one spot of a 120 C plate for twenty minutes
# extracts heat from that spot and nowhere else. The proxy then reads a hole it
# dug itself, and the plate carries a cold centre into the first layer.
#
# THE SHAPE. Concentric full circles at a constant radial step, walked outward
# and returned in one straight move. Not a true spiral: Klipper's gcode_arcs
# rotates the START offset at fixed magnitude (gcode_arcs.py:155-161), so a G2
# whose endpoint sits at a different radius does not interpolate -- it runs a
# constant-radius arc and then jumps. Rings are what the firmware can actually
# hold.
#
# WHY CONSTANT STEP AND CONSTANT FEED IS THE EVEN ANSWER. Time on a ring is
# 2*pi*r/v. The area it serves is the annulus, 2*pi*r*step. The ratio is
# 1/(v*step) -- r cancels. Every part of the plate gets the same dwell per unit
# area no matter how far out it is, which is the whole point. Measured across
# the shipped defaults: 0.00500 s/mm^2 at r=12, r=30 and r=58 alike.
#
# THE BUDGET IS ENFORCED, NOT ASSUMED. Rings are added outward only while the
# accumulated path still fits `budget` at `feed`. A sweep that would overrun
# stops early and returns, so one out-and-back never exceeds its allowance and
# the temperature check that follows is never late.

[gcode_macro _CHAMBER_ORBIT_CFG]
description: Orbiting stir geometry. Data, not a command.
# Innermost ring. Not zero: a tight ring at speed is a centripetal demand of
# v^2/r, and the plate's own centre is the one place the parked nozzle already
# covered. 10 mm asks 1000 mm/s^2 of a 5000 mm/s^2 machine and leaves only
# 2.8% of the swept disc unvisited.
variable_r_min: 10.0
# Outermost ring, before the edge clamp below. 60 mm on a 152.4 mm plate keeps
# the nozzle 16 mm clear of the frame.
variable_r_max: 60.0
# Radial step. 2.0 gives 26 rings and 58.3 s -- the largest sweep that fits a
# 60 s budget. Raising it coarsens coverage and shortens the sweep; the dwell
# per unit area scales as 1/step either way.
variable_step: 2.0
variable_feed: 6000
# Seconds for one out-and-back. The operator's constraint, enforced below.
variable_budget: 60
# Keep this far inside the axis limits whatever r_max says.
variable_edge_margin: 16.0
gcode:

[gcode_macro CHAMBER_STIR_ORBIT]
description: One out-and-back orbit of the plate, inside the time budget.
gcode:
    {% set c = printer["gcode_macro _CHAMBER_ORBIT_CFG"] %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set cx = params.X|default((xmin + xmax) / 2.0)|float %}
    {% set cy = params.Y|default((ymin + ymax) / 2.0)|float %}
    {% set feed = params.FEED|default(c.feed)|float %}
    {% set budget = params.BUDGET|default(c.budget)|float %}
    {% set step = params.STEP|default(c.step)|float %}
    {% set r_min = params.R_MIN|default(c.r_min)|float %}

    # Clamp to the tightest edge, so an off-centre origin or a smaller machine
    # cannot drive the nozzle into a frame member.
    {% set reach = [cx - xmin, xmax - cx, cy - ymin, ymax - cy]|min - c.edge_margin|float %}
    {% set r_max = [params.R_MAX|default(c.r_max)|float, reach]|min %}

    {% if r_max <= r_min or step <= 0 %}
        RESPOND PREFIX="orbit" MSG="no room to orbit: reach {reach|round(1)}mm against r_min {r_min}mm"
    {% else %}
        # Walk outward while the path still fits. mm of budget = feed * budget/60.
        {% set allow = feed * budget / 60.0 %}
        {% set ns = namespace(len=0.0, rings=[], r=r_min) %}
        {% for _ in range(200) %}
            {% if ns.r <= r_max %}
                # This ring, plus the radial step onto it, plus the straight
                # return from it -- so the budget holds even if we stop here.
                # NOT a {#..#} comment: Klipper's Jinja uses { and } as the
                # variable delimiters, so {# opens an expression and the comment
                # body becomes a syntax error.
                {% set need = 2 * 3.14159265 * ns.r + step + ns.r %}
                {% if ns.len + need <= allow %}
                    {% set ns.len = ns.len + 2 * 3.14159265 * ns.r + step %}
                    {% set ns.rings = ns.rings + [ns.r] %}
                    {% set ns.r = ns.r + step %}
                {% else %}
                    {% set ns.r = r_max + 1 %}
                {% endif %}
            {% endif %}
        {% endfor %}

        {% if ns.rings|length == 0 %}
            RESPOND PREFIX="orbit" MSG="budget {budget}s too small for even one ring at {feed}mm/min"
        {% else %}
            SAVE_GCODE_STATE NAME=_orbit
            G90
            {% for r in ns.rings %}
                G1 X{(cx + r)|round(3)} Y{cy|round(3)} F{feed}
                # Full circle: no endpoint, so target == current and gcode_arcs
                # takes the 2*pi branch. I/J are the offset to the centre.
                G2 I{(0 - r)|round(3)} J0 F{feed}
            {% endfor %}
            G1 X{cx|round(3)} Y{cy|round(3)} F{feed}
            RESTORE_GCODE_STATE NAME=_orbit
            RESPOND PREFIX="orbit" MSG="{ns.rings|length} rings {r_min|round(0)|int}-{ns.rings[-1]|round(0)|int}mm, {(ns.len + ns.rings[-1])|round(0)|int}mm in {((ns.len + ns.rings[-1]) / feed * 60)|round(1)}s of {budget|round(0)|int}s"
        {% endif %}
    {% endif %}
