# Orbiting stir for the chamber preheat: sweep the plate instead of hovering.
#
# THE PROBLEM. M191 parks the toolhead at bed centre and runs fan0 to stir the
# chamber. The nozzle doubles as the chamber proxy, so it has to sit in moving
# air -- but a fan blowing down on one spot of a 120 C plate for twenty minutes
# extracts heat from that spot and nowhere else. The proxy then reads a hole it
# dug itself, and the plate carries a cold centre into the first layer.
#
# A SPIRAL OF SEMICIRCLES. Klipper's gcode_arcs rotates the START offset at a
# fixed magnitude (gcode_arcs.py:155-161), so a single G2/G3 cannot spiral --
# give it an endpoint at a different radius and it runs a constant-radius arc
# and then jumps. A spiral has to be built from arcs it can hold, and the
# classic two-centre construction does it in 180 degree pieces:
#
#   centres alternate at -pitch/4 and +pitch/4 on the X axis through bed centre
#   every junction lands on that axis, radius grows pitch/2 per half turn
#
# Because each junction sits on the axis with its radius along X, both arcs meet
# it travelling along Y. The join is tangent continuous, so the toolhead never
# stops or corners between arcs -- which is the whole reason for a spiral rather
# than concentric rings joined by radial steps.
#
# PITCH IS THE SPOT SIZE. At the Z16 park the fan's footprint on the plate is
# about 16 mm across, so a 16 mm pitch lays each pass edge to edge against the
# last: no gap to leave a warm stripe, no overlap to spend budget twice.
#
# WHY IT EXTRACTS EVENLY. A spiral at constant feed sweeps area at v*pitch, so
# the dwell per unit area is 1/(v*pitch) everywhere -- independent of radius,
# for the same reason it was on concentric rings. Even extraction is a property
# of the geometry, not something that needs tuning.
#
# VELOCITY IS THE OPEN QUESTION. Feed defaults to whatever fills the budget
# exactly (699 mm/min on the shipped numbers), which maximises dwell. Whether
# faster air movement beats longer dwell is a salt-tray question and is not
# answered here; pass FEED= to try a value.

[gcode_macro _CHAMBER_ORBIT_CFG]
description: Orbiting stir geometry. Data, not a command.
# Innermost radius. Lowered 10 -> 4 on 2026-09-06 after decomposing the
# residual: the total spread of dwell/E is 15.2% radial plus 10.9% banding, so
# the systematic radial error dominates, and the radial profile said where. The
# hub was starved -- dwell/E of 0.15 inside r=6 and 0.52 from 6 to 12 -- purely
# because r_min excluded it, and that hole is the hottest ground on the plate.
#
#   r_min  cycle   spread   worst centripetal (limit 5000)
#    10    23.5 s   18.7%      810
#     6    23.8 s   17.1%     1350
#     4    23.8 s   16.1%     2025      <- shipped
#     2    23.9 s   16.0%     4050
#
# 4 rather than 2: the same spread for half the centripetal demand. Tight fast
# arcs at 81% of the acceleration limit are exactly where the noise would come
# back, and 2 buys 0.1 points for that risk. Cycle time is unchanged either way.
#
# The tightest arc is not r_min itself but the hub transition semicircle, which
# has radius r_min exactly; the innermost spiral arc is r_min + pitch/4.
variable_r_min: 4.0
# Outermost radius before the edge clamp. 76 reaches the plate edge where the
# spiral crosses a centreline, which is as far out as a circle about centre can
# go -- the corners at 107.8 are outside the machine entirely.
variable_r_max: 76.0
# PER LEG. The cycle runs the spiral out and then the SAME spiral rotated 180
# degrees back in, so the two legs interleave and the effective track spacing is
# half this.
#
# 16 is the fan's footprint at the Z16 park, and setting the leg pitch to TWICE
# the spot so the two legs interleave to exactly one spot is the tempting
# arithmetic. It is wrong. That argument only holds ON THE AXIS, where the
# crossings really do land a spot apart; off-axis the two-centre construction
# does not hold that spacing. Gridding the disc at 0.5mm and asking what lies
# within half a spot of the path: 32mm legs cover 88.1%, 24mm cover 95.9%,
# 16mm cover 99.8%. So the leg pitch is the spot and the interleave is half it.
# Re-measure the spot if park_z changes.
variable_pitch: 16.0
# 6000 mm/min = 100 mm/s. NOT derived from the budget any more: filling 60 s
# put it at 699 mm/min, and at 11.6 mm/s the steppers sing -- a slow constant
# velocity sits right in the range where the drivers make audible tones. The
# budget is a CEILING on the cycle, not a target to stretch into. Total dwell
# over a twenty minute preheat is the same either way; only the pass rate
# changes. 0 restores the derive-to-fill-budget behaviour.
variable_feed: 6000
# Seconds for one out-and-back.
variable_budget: 60
# Keep this far inside the axis limits whatever r_max says. Small, because the
# coverage is wanted out to the plate edge along the centrelines and the axis
# limits are already the machine's own guard.
variable_edge_margin: 2.0
# VELOCITY GRADING against the bed's own gradient. 0 runs a single feed.
#
# The plate is hottest in the middle and coldest at the outboard corners. To
# flatten it, extraction has to be proportional to the local excess heat rather
# than uniform -- most in the middle, least at the rim. A spiral at constant
# pitch spends dwell per unit AREA of 1/(v*pitch), so grading is purely a
# question of what F each arc carries, and every arc here has exactly one
# radius. Nothing needs interpolating.
#
#   E(r) = corner_drop * (1 - (r/corner_radius)^2)      assumed gradient
#   v(r) = feed * E(0)/E(r) = feed / (1 - (r/corner_radius)^2)
#
# which makes dwell/E constant -- checked flat at 0.002000 from r=10 to r=76.
# See notes/data/chamber-orbit/plot-thermal.py for the figure and the model.
#
# THE GRADIENT IS ASSUMED. Target at centre, corner_drop below it at the
# corner, falling as the square of distance. Nothing has measured it; a salt
# tray would. Set grade: 0 to go back to one feed everywhere.
# STAGGER: shift the starting radius a little on each successive cycle, so the
# tracks of one cycle fall between the tracks of the last.
#
# A single cycle lays tracks pitch/2 apart and the dwell it delivers is banded
# between them -- visible as rings in the delivery map. A preheat runs dozens of
# cycles, so what matters is the ACCUMULATED dwell, and moving the start radius
# by a fraction of the track spacing fills the gaps over time at no cost in
# cycle time at all.
#
# Measured as spread of dwell/E over the reachable disc, which is what the
# banding actually is: baseline 20.0%, four 2mm steps 16.0%, eight 1mm steps
# 16.9%, halving the pitch instead 14.4% for double the time. Four steps of 2mm
# spans the 8mm track spacing evenly and is free, so that is the default.
# stagger_steps: 1 disables it.
variable_stagger_steps: 4
variable_stagger_mm: 2.0
variable_grade: 1
# THE VELOCITY BAND, in mm/min, that the graded law is compressed into.
#
# The unbounded law wants 101..199 mm/s across the radius, and 199 is well
# outside the range this machine is quiet in. Listening on 2026-09-06, first at
# 20-300 by 40 and then 60-140 by 10, put the sweet spot at 90-120 mm/s. Two
# effects cross there: the microstep tone at 80 x v is still climbing out of
# hearing below it, and low-frequency belt and frame excitation is already
# growing above it. 110 rather than 120 at the top: at 120 the rim arcs sit on
# the band edge and the noise returns there.
#
# So the SHAPE of 1/E is kept and only its RANGE is compressed onto this band.
# Cancellation degrades gracefully rather than being abandoned -- spread of
# dwell/E over the reachable disc, four staggered cycles:
#
#   no grading, flat 105 mm/s     21.9 s cycle   21.7%
#   full law, 101-199             17.1 s cycle   16.0%
#   compressed into 90-120        22.7 s cycle   17.7%
#   compressed into 90-110        23.5 s cycle   18.7%   <- shipped
#   compressed into 95-110        22.8 s cycle   19.5%
#
# 90-110 is what the operator settled on after hearing 90-120: the rim arcs sat
# at exactly the top of the band and the noise was creeping back there. Narrowing
# costs one more point of uniformity and 0.8 s of cycle, which is a trade worth
# making -- the grading is a refinement, and a machine nobody wants in the room
# is worth nothing at all. It still recovers 3.0 of the 5.7 points grading is
# worth, against a flat feed.
#
# Narrowing further is available and gets worse fast: 95-110 gives up another
# 0.8 points for no gain in cycle time, because a narrower band is closer to no
# grading at all. At the limit feed_lo == feed_hi is exactly grade: 0.
variable_feed_lo: 5400
variable_feed_hi: 6600
variable_corner_drop: 5.0
# Bed half-diagonal, 76.2*sqrt(2). The corners are the coldest point and are
# NOT reachable -- the rim of the spiral is the centreline edge -- so this is a
# model parameter rather than a place the toolhead goes.
variable_corner_radius: 107.8
gcode:

[gcode_macro CHAMBER_ORBIT_SWEEP]
description: Arm the spiral and run it by hand. BEGIN plus a run of STEPs.
gcode:
    # NO SECOND COPY OF THE GEOMETRY. This used to be a standalone macro with
    # its own construction, which then had to be kept in step with BEGIN by
    # hand -- and was not: it still retraced while BEGIN had moved on to
    # interleaving. It arms the real one and steps it instead.
    #
    # ARCS overshooting the cycle length is harmless: STEP wraps, so extra steps
    # simply continue the spiral round again, which is what a long preheat does
    # anyway. Undershooting just stops early, mid-spiral.
    _CHAMBER_ORBIT_BEGIN{% for k, v in params.items() %}{% if k != 'CYCLES' %} {k}={v}{% endif %}{% endfor %}
    {% for _ in range(params.CYCLES|default(1)|int) %}
        _CHAMBER_ORBIT_CYCLE
    {% endfor %}
    _CHAMBER_ORBIT_END

# STEPPING THE SPIRAL, one arc per call.
#
# CHAMBER_ORBIT_SWEEP above queues a whole cycle, which is right when nothing
# else is happening and wrong inside M191. The preheat wait samples the nozzle
# on a timer and reads it as a chamber proxy; queueing 60 s of motion from
# inside that loop makes toolhead._process_moves pause the caller the moment the
# buffer passes BUFFER_TIME_HIGH (toolhead.py:400-408), so the loop stops
# sampling until the sweep drains.
#
# So the wait feeds one semicircle at a time and samples between them. The arc
# list is computed once by BEGIN and walked by STEP, which wraps back to the
# first arc and re-centres, so the spiral repeats for as long as the preheat
# lasts. STEP is deliberately cheap: no geometry, one arc, one index write.

[gcode_macro _CHAMBER_ORBIT_STATE]
description: Spiral step state. Written by BEGIN and STEP.
variable_arcs: []
variable_index: 0
variable_cx: 0.0
variable_cy: 0.0
variable_feed: 0
variable_active: 0
# Cycle counter driving the stagger. Advanced by BEGIN.
variable_stagger: 0
gcode:

[gcode_macro _CHAMBER_ORBIT_BEGIN]
description: Compute the spiral and move to its start. Does not sweep.
gcode:
    {% set c = printer["gcode_macro _CHAMBER_ORBIT_CFG"] %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set cx = params.X|default((xmin + xmax) / 2.0)|float %}
    {% set cy = params.Y|default((ymin + ymax) / 2.0)|float %}
    {% set pitch = params.PITCH|default(c.pitch)|float %}
    {% set budget = params.BUDGET|default(c.budget)|float %}
    {% set stg = printer["gcode_macro _CHAMBER_ORBIT_STATE"].stagger|int %}
    {% set steps = [c.stagger_steps|int, 1]|max %}
    {% set r_min = (params.R_MIN|default(c.r_min)|float)
                   + (stg % steps) * c.stagger_mm|float %}
    {% set reach = [cx - xmin, xmax - cx, cy - ymin, ymax - cy]|min - c.edge_margin|float %}
    {% set r_max = [params.R_MAX|default(c.r_max)|float, reach]|min %}
    {% set ns = namespace(x=r_min, out=[], len=0.0, done=false) %}
    {% for k in range(200) %}
        {% set cen = (0 - pitch / 4.0) if k % 2 == 0 else (pitch / 4.0) %}
        {% set nx = 2 * cen - ns.x %}
        {% if not ns.done and nx|abs > r_max %}
            {% set ns.done = true %}
        {% endif %}
        {% if not ns.done %}
            {% set _ = ns.out.append([(cen - ns.x)|round(3), nx|round(3), ns.x|round(3)]) %}
            {% set ns.len = ns.len + 3.14159265 * (cen - ns.x)|abs %}
            {% set ns.x = nx %}
        {% endif %}
    {% endfor %}
    # THE RETURN INTERLEAVES, it does not retrace. Walking the outbound arcs
    # backwards puts the toolhead over ground it has just swept and covers
    # nothing new. Rotating an Archimedean spiral by 180 degrees shifts its
    # radius by half a pitch, so the SAME spiral mirrored through the centre
    # falls exactly between the outbound passes -- which in this construction
    # means negating the centre offsets and the x positions.
    #
    # The two legs are antipodal at both ends, so each end needs one semicircle
    # about bed centre to join them: r_max at the rim, r_min at the hub. Those
    # are arcs too, so the whole cycle is arcs and closes on itself with no
    # repositioning move anywhere.
    {% set nb = namespace(x=(0 - r_min), out=[], done=false) %}
    {% for k in range(200) %}
        {% set cen = (pitch / 4.0) if k % 2 == 0 else (0 - pitch / 4.0) %}
        {% set nx = 2 * cen - nb.x %}
        {% if not nb.done and nx|abs > r_max %}
            {% set nb.done = true %}
        {% endif %}
        {% if not nb.done %}
            {% set _ = nb.out.append([(cen - nb.x)|round(3), nx|round(3), nb.x|round(3)]) %}
            {% set ns.len = ns.len + 3.14159265 * (cen - nb.x)|abs %}
            {% set nb.x = nx %}
        {% endif %}
    {% endfor %}
    # ALL CLOCKWISE: G2 throughout. A single rotational sense is what makes the
    # sequence read as a spiral rather than an oscillation, and the operator
    # asked for clockwise.
    # RESOLVED BEFORE THE ARC LIST, because each arc now carries its own F
    # derived from this one. It used to sit after, which was harmless when a
    # single feed applied to everything and an undefined-name error the moment
    # it did not.
    {% set total = ns.len + 3.14159265 * (ns.x|abs + r_min) %}
    {% set derived = (total / budget * 60.0) if budget > 0 else 6000.0 %}
    {% set feed = params.FEED|default(c.feed)|float %}
    {% set feed = derived if feed <= 0 else feed %}
    {% set rc = c.corner_radius|float %}
    {% set graded = c.grade|int == 1 and rc > 0 %}
    # Normalised against the CONFIG bounds rather than the staggered ones, so
    # the band maps identically every cycle instead of drifting with the
    # stagger. feed is now only the fallback for grade: 0.
    {% set rlo = c.r_min|float %}
    {% set rhi = [c.r_max|float, reach]|min %}
    {% set inv0 = 1.0 / (1.0 - (rlo / rc) ** 2) %}
    {% set inv1 = 1.0 / (1.0 - (rhi / rc) ** 2) %}
    {% set span = inv1 - inv0 %}
    {% set flo = c.feed_lo|float %}
    {% set fhi = c.feed_hi|float %}
    # Klipper's Jinja has no user-defined functions, so the feed law is written
    # out at each of the four places an arc is appended rather than called.
    # radius is |I| for a spiral arc and |x| for the two transition semicircles.
    {% set ns2 = namespace(all=[]) %}
    {% for a in ns.out %}
        {% set rr = a[0]|abs %}
        {% set _ = ns2.all.append([a[0], a[1], 2,
            ((flo + (fhi - flo) * ((1.0 / (1.0 - (rr / rc) ** 2)) - inv0) / span) if (graded and span > 0 and rr < rc) else feed)|round(0)|int]) %}
    {% endfor %}
    {% set rr = ns.x|abs %}
    {% set _ = ns2.all.append([(0 - ns.x)|round(3), nb.x|round(3), 2,
        ((flo + (fhi - flo) * ((1.0 / (1.0 - (rr / rc) ** 2)) - inv0) / span) if (graded and span > 0 and rr < rc) else feed)|round(0)|int]) %}
    {% for a in nb.out|reverse %}
        {% set rr = a[0]|abs %}
        {% set _ = ns2.all.append([(0 - a[0])|round(3), a[2], 2,
            ((flo + (fhi - flo) * ((1.0 / (1.0 - (rr / rc) ** 2)) - inv0) / span) if (graded and span > 0 and rr < rc) else feed)|round(0)|int]) %}
    {% endfor %}
    {% set _ = ns2.all.append([r_min|round(3), r_min|round(3), 2,
        ((flo + (fhi - flo) * ((1.0 / (1.0 - (r_min / rc) ** 2)) - inv0) / span) if (graded and span > 0 and r_min < rc) else feed)|round(0)|int]) %}
    {% if ns2.all|length == 0 %}
        RESPOND PREFIX="orbit" MSG="no arcs fit; not starting"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=arcs VALUE="{ns2.all}"
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=stagger VALUE={stg + 1}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=index VALUE=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=cx VALUE={cx|round(3)}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=cy VALUE={cy|round(3)}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=feed VALUE={feed|round(0)|int}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=active VALUE=1
        G90
        G1 X{(cx + r_min)|round(3)} Y{cy|round(3)} F{feed|round(0)|int}
        RESPOND PREFIX="orbit" MSG="spiral armed: {ns2.all|length} arcs (out and back), r {r_min|round(1)}-{ns.x|abs|round(0)|int}mm, pitch {pitch|round(0)|int}mm, {feed|round(0)|int}mm/min, {(total / feed * 60)|round(1)}s per cycle, budget {budget|round(0)|int}s"
    {% endif %}

[gcode_macro _CHAMBER_ORBIT_STEP]
description: Emit the next semicircle. Wraps and re-centres at the end.
gcode:
    {% set st = printer["gcode_macro _CHAMBER_ORBIT_STATE"] %}
    {% if st.active|int == 1 and st.arcs|length > 0 %}
        # NO REPOSITIONING, EVER. The list already runs out and back, and the
        # last inbound arc lands on r_min -- exactly where the first outbound
        # arc starts. So the index just wraps and the next arc continues from
        # where the last one ended. The straight dash to centre that used to
        # live here was the only non-arc motion in the cycle, and it was
        # visible.
        {% set i = st.index|int % (st.arcs|length) %}
        {% set a = st.arcs[i] %}
        G90
        G{a[2]} X{(st.cx + a[1])|round(3)} Y{st.cy} I{a[0]} J0 F{a[3]}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=index VALUE={(i + 1) % (st.arcs|length)}
    {% endif %}

[gcode_macro _CHAMBER_ORBIT_CYCLE]
description: One complete out-and-back, emitted as a single script.
gcode:
    # ALL THE ARCS IN ONE SCRIPT, which is the entire point. Klipper blends
    # consecutive moves through its lookahead, and the junctions here are
    # tangent, so a cycle queued in one go runs as continuous motion. Handing
    # the arcs over a few at a time cannot do that: the queue tops out at
    # BUFFER_TIME_HIGH (toolhead.py:400-408), and every time it drains the last
    # move is finalised and the toolhead decelerates to a standstill. That is
    # what turned a smooth spiral into batches with waits between them.
    #
    # This DOES block the caller for most of the cycle, and that is correct
    # here rather than a cost to be engineered around: the wanted shape is out
    # and back, pause, check the temperature, repeat. Sampling once per cycle is
    # the design, not a casualty of it.
    {% set st = printer["gcode_macro _CHAMBER_ORBIT_STATE"] %}
    {% if st.active|int == 1 and st.arcs|length > 0 %}
        G90
        {% for a in st.arcs %}
            G{a[2]} X{(st.cx + a[1])|round(3)} Y{st.cy} I{a[0]} J0 F{a[3]}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=index VALUE=0
    {% endif %}

[gcode_macro _CHAMBER_ORBIT_END]
description: Stop stepping and return to centre.
gcode:
    {% set st = printer["gcode_macro _CHAMBER_ORBIT_STATE"] %}
    {% if st.active|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_ORBIT_STATE VARIABLE=active VALUE=0
        G90
        G1 X{st.cx} Y{st.cy} F{st.feed}
    {% endif %}

# VELOCITY SWEEP for the stepper whine. Diagnostic, not part of any preheat.
#
# Constant radius, constant speed, a few laps, then step the speed and say so.
# One variable at a time, and the console line arrives AFTER the previous step's
# motion has drained (M400) so what is printed matches what is being heard.
#
# WHAT THE NUMBERS MEAN. stepper_x/y are 200 full steps, 16 microsteps, 40 mm
# per rotation, so 80 microsteps per mm. The driver's waveform steps at
#
#     f_micro = 80 * v      Hz
#
# and tmc5160 has interpolate: false on both axes, so that IS the current
# waveform rather than a 256-step smoothing of it. 100 mm/s is 8 kHz. The
# earlier 11.6 mm/s crawl was 930 Hz, which is why it growled rather than
# whined.
#
# A CIRCLE ON COREXY SWEEPS ITS OWN TONE. The motors carry a = x+y and b = x-y,
# so for a circle at constant tangential speed each motor's rate varies
# sinusoidally from 0 to sqrt(2)*v and back, twice per lap. The pitch therefore
# warbles between silence and f_peak within every lap no matter how steady the
# commanded feed is -- worth knowing before blaming the path for it.
#
# FIRST LISTENING PASS, 2026-09-06, r=76, the operator's own words:
#
#    20 mm/s   don't like             step tone  1600 Hz
#    60        better, still audible             4800
#   100        better still                      8000
#   140        new low noise                    11200
#   180        more low noise                   14400
#
# Two effects moving in opposite directions, which is what "a sweet spot in
# between" means. The microstep tone is 80 x v, so it climbs out of the range an
# adult hears -- roughly 15 kHz -- somewhere near 180 mm/s, and that is the
# improvement from 20 up to 140. What gets WORSE with speed is low frequency and
# therefore not the microstep tone at all: belt, rail or frame excitation, or
# the CoreXY warble above, all of which grow with velocity. The quiet band is
# where the first has left hearing and the second has not yet arrived, which the
# first pass puts near 100-140.
#
# Not narrowed yet, and the range and granularity are deliberately unchanged
# until an equal-time pass confirms the shape.

# CENTRIPETAL ACCELERATION IS NOT INDEPENDENT HERE. At fixed radius it is v^2/r,
# so stepping v also steps the acceleration and this sweep cannot separate the
# two. If velocity turns out not to explain what you hear, the follow-up is a
# sweep at constant v^2/r -- radius and velocity moved together -- which holds
# acceleration still while velocity changes.

[gcode_macro ORBIT_WHINE_SWEEP]
description: Constant-radius laps stepping through velocities, for listening.
gcode:
    {% set c = printer["gcode_macro _CHAMBER_ORBIT_CFG"] %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set cx = params.X|default((xmin + xmax) / 2.0)|float %}
    {% set cy = params.Y|default((ymin + ymax) / 2.0)|float %}
    {% set reach = [cx - xmin, xmax - cx, cy - ymin, ymax - cy]|min - c.edge_margin|float %}
    {% set r = [params.R|default(c.r_max)|float, reach]|min %}
    # EQUAL TIME PER STEP, not equal laps. A fixed lap count makes the fast
    # steps flash past -- 3 laps is 72 s at 20 mm/s and 5 s at 300 -- so the
    # speeds hardest to judge get the least listening. Laps are derived from a
    # per-step duration instead.
    #
    # The default duration is ONE LAP AT THE SLOWEST SPEED, so nothing is padded
    # and nothing is shorter than the natural floor: the slow end cannot be
    # subdivided below a lap, so that sets the pace for everything.
    {% set vmin = params.VMIN|default(20)|float %}
    {% set vmax = params.VMAX|default(300)|float %}
    {% set vstep = params.VSTEP|default(40)|float %}
    {% set circ = 2 * 3.14159265 * r %}
    {% set secs = params.SECONDS|default(circ / vmin)|float %}
    # The LIVE limit from the toolhead, not the config file's. SET_VELOCITY_LIMIT
    # can have moved it since startup, and the sweep should refuse against what
    # the machine will actually honour.
    {% set accel_max = printer.toolhead.max_accel|float %}
    {% set steps_mm = 80.0 %}

    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        RESPOND PREFIX="whine" MSG="homing first"
        G28
    {% endif %}
    RESPOND PREFIX="whine" MSG="r={r|round(1)}mm circumference {circ|round(0)|int}mm, {secs|round(0)|int}s per step, {vmin|round(0)|int}-{vmax|round(0)|int} by {vstep|round(0)|int} mm/s"
    RESPOND PREFIX="whine" MSG="80 microsteps/mm, interpolate off - expect f = 80 x v Hz, warbling 0 to 1.41 x v twice per lap"
    SAVE_GCODE_STATE NAME=_whine
    G90
    {% for k in range(((vmax - vmin) / vstep)|round(0, 'floor')|int + 1) %}
        {% set v = vmin + k * vstep %}
        {% set cent = v * v / r %}
        {% set nlaps = params.LAPS|default([1, (secs * v / circ)|round(0)|int]|max)|int %}
        {% if cent <= accel_max %}
            # Drain first, so the line below lands with the sound it describes.
            M400
            RESPOND PREFIX="whine" MSG="{v|round(0)|int} mm/s  {nlaps} laps {(nlaps * circ / v)|round(0)|int}s  step {(steps_mm * v)|round(0)|int}Hz  peak {(steps_mm * v * 1.4142)|round(0)|int}Hz  centripetal {cent|round(0)|int} of {accel_max|round(0)|int} mm/s2"
            G1 X{(cx + r)|round(3)} Y{cy|round(3)} F{(v * 60)|round(0)|int}
            {% for _ in range(nlaps) %}
                G2 I{(0 - r)|round(3)} J0 F{(v * 60)|round(0)|int}
            {% endfor %}
        {% else %}
            M400
            RESPOND PREFIX="whine" MSG="{v|round(0)|int} mm/s skipped - needs {cent|round(0)|int} mm/s2, over max_accel {accel_max|round(0)|int}"
        {% endif %}
    {% endfor %}
    M400
    G1 X{cx|round(3)} Y{cy|round(3)} F6000
    RESTORE_GCODE_STATE NAME=_whine
    RESPOND PREFIX="whine" MSG="sweep done"
