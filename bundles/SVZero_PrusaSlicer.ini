printer_notes = SV Zero (Klipper). Place svzero_bed.stl and svzero_bed.svg where SuperSlicer can find them.
start_gcode = ;---SV Zero startup. See notes/incidents/2026-08-17-zero2-startup-crash.\n;  START_PRINT owns homing, nozzle cleaning, Z calibration and bed mesh.\n;  DO NOT add G28 here. Two of them around START_PRINT gave three homes per\n;  job, one of which ran before the bed was at temperature.\n;  Chamber: M141 is a NONBLOCKING ceiling. M191 blocks until the chamber\n;  reaches a MINIMUM and calls its own G28, which is wrong for PLA where 32C\n;  is a cap. Use M191 deliberately, and only for chamber-sensitive materials.\n;  _PREFLIGHT is first so a rejected job costs no heating. It is inert\n;  unless the optional spool_guard extra is installed.\nSVZERO_REQUIRE VERSION=2.0.2-beta.1\n_PREFLIGHT\n;  M140 BEFORE the chamber block, and that order is load-bearing. The\n;  M191 macro reads printer.heater_bed.target live and hands it to the\n;  host waiter as BED_TARGET; with no target set yet the waiter is told\n;  0 and commands the plate OFF for the whole chamber soak. Orca's\n;  preamble has always had it this way round.\nM140 S[first_layer_bed_temperature]\n;>>>CHAMBER emitted per slicer -- do not hand-edit\n;  M191 blocks until the chamber reaches the material's minimum;\n;  M141 then leaves a non-blocking ceiling at its target.\n{if chamber_minimal_temperature[0] > 0}M191 S{chamber_minimal_temperature[0]}\n{endif}{if chamber_temperature[0] > 0}M141 S{chamber_temperature[0]}{else}M141 S32{endif}\n;<<<CHAMBER\n;>>>CLEAN_TEMP\n;  The material is NAMED here; the temperature table lives in the macro\n;  pack, in nozzle_brush.cfg's _BRUSH_CLEAN_TEMPS. Same division as\n;  COOLDOWN_ARM below. Provenance for the curve is\n;  source/filament-clean-temp.json.\n;  Safe to omit: without the pack this is an unknown command and only\n;  warns, and CLEAN_NOZZLE falls back to _BRUSH.retract_temp.\nSET_CLEAN_TEMP MATERIAL=[filament_type]\n;<<<CLEAN_TEMP\n;>>>COOLDOWN generated from source/filament-cooldown.json -- do not hand-edit\n;  Names the material; the RATES live in cooldown.cfg's\n;  _COOLDOWN_MATERIALS, so one table serves every slicer and the spool\n;  can name the material when no slicer does. Pass FINAL, CHAMBER_RATE\n;  or BED_RATE here only to OVERRIDE the table for an experiment.\n;  Omitting this block is safe: END_PRINT then asks spool_guard what is\n;  loaded, and falls back to the default row if nothing knows.\nCOOLDOWN_ARM MATERIAL=[filament_type]\n;<<<COOLDOWN\n;---Skew compensation. Left ENABLED and UNSET on purpose. SKEW_PROFILE\n;  needs an empty skew_correction section in printer.cfg -- square\n;  brackets are left off that name on purpose, the slicer reads them as a\n;  template variable -- which NEITHER\n;  firmware ships -- checked against Sovol's own 1.4.x tree, not against\n;  a machine somebody had already modified -- and a profile YOU\n;  measured, saved with SKEW_PROFILE SAVE=<name> and SAVE_CONFIG.\n;  Uncomment the line below with your own name once you have one.\n;  Shipping somebody else's skew numbers would be worse than shipping\n;  none, and naming a profile that does not exist logs a failed load on\n;  every print -- skew_correction.py answers an unknown name with\n;  respond_info, so it warns forever rather than failing once.\n;SKEW_PROFILE LOAD=your_skew_profile\n;  Stock START_PRINT does not guarantee a settled plate before calibration.\nM190 S[first_layer_bed_temperature]\nSTART_PRINT\nG90\nG1 Z5 F600 ; clearance from the freshly calibrated bed before any XY move\nG92 E0\nSET_GCODE_OFFSET Z_ADJUST=-0.00 MOVE=1\nM104 S[first_layer_temperature]\nM83\n;---Purge. PURGE_LINE owns placement and motion; the slicer passes the numbers\n;  only it knows. The old inline math is retired: it collapsed algebraically to\n;  nozzle_diameter/2, ignored the filament's volumetric ceiling (TPU was driven\n;  3.7x over), and skipped the purge entirely when the part sat near an edge.\n;  See notes/kb/purge-lines.md.\nM109 S[first_layer_temperature]\nPURGE_LINE VOL_MAX=[filament_max_volumetric_speed] FIL_D=[filament_diameter] NOZZLE=[nozzle_diameter] CLEAR={skirt_distance + skirts * first_layer_extrusion_width + 2}\nSET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count}
