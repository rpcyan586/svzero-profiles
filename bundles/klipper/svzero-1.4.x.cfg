# GENERATED by tools/build-macros.py. Edit the separate source files.
# Copy this file to printer_data/config/svzero/ and add to printer.cfg:
# [include svzero/svzero-1.4.x.cfg]
# Native macros only; no optional Python modules are required.
# Include after stock macros and hardware, before SAVE_CONFIG.
# FIRST disable the entire stock [temperature_fan exhaust_fan]
# section. Keep [fan_generic fan3]. See INSTALL.md for rollback.
# Do not include the modular sources as well. Restart only while idle.
# Source comments below describe the modular development layout.

# BEGIN SOURCE: klipper/config/svzero-1.4.x.cfg
# SV Zero macro pack -- THE ONLY LINE YOU ADD TO printer.cfg.
#
#   [include svzero/svzero-1.4.x.cfg]
#
# Put this file and the rest of the pack in a subdirectory beside printer.cfg:
#
#   ~/printer_data/config/svzero/
#
# Klipper resolves a nested include relative to the file doing the including
# (configfile.py:229), so everything below is found inside that directory and
# nothing here needs editing for your paths.
#
# No Python extras are required for this macro-only install.
# For the adaptive preheat and Spoolman helpers, install their modules and
# add [include svzero/svzero-python.cfg] AFTER this include in printer.cfg.
# See INSTALL.md for dependencies and restart/rollback instructions.
#
# PICK THE FILE THAT MATCHES YOUR FIRMWARE and include only that one. This is
# svzero-1.4.x.cfg. The two select firmware-specific fan hardware and probe commands;
# the exhaust fan is a different pin and a different object on each, and the
# name fan3 means different hardware between them.
#
# ONE DELETION FIRST, AND ONLY ON THIS FIRMWARE. Stock 1.4.x printer.cfg carries
#
#   [temperature_fan exhaust_fan]     <- around line 259
#   pin: PB0
#   sensor_type: EPCOS 100K B57560G104F
#   sensor_pin: PC4
#
# Comment it out or delete it. It claims both pins this pack needs, and Klipper
# aborts at config parse with "pin PB0 used multiple times in config" -- before
# any macro here exists to warn you. chamber_fan_hw_1.4.x.cfg explains why it
# cannot be overridden in place. 1.3.7 needs nothing removed.
#
# ORDER IS LOAD-BEARING and is why this is an explicit list rather than a
# wildcard. Klipper applies includes linearly and a later duplicate section
# wins, which is how this pack overrides Sovol's macros without editing
# Macro.cfg -- and how factory_resets.sh can overwrite their file without
# taking ours with it. A glob would sort alphabetically and get it wrong.

# Identity and the profile handshake. First, so anything below can use it.

# BEGIN SOURCE: klipper/config/svzero_pack.cfg
# Profile/pack handshake. A version mismatch warns and never rejects a job. A
# mode mismatch refuses it.
#
# Stock firmware skips the unknown handshake and other optional calls. Public
# profiles supply a bed wait and priming skirt independently of this pack.
# A missing macro is not a fallback implementation of its behavior.
# With this pack installed, unnamed material/temperature settings may be
# inferred; arbitrary third-party startup sequences still need waits and prime.
# See INSTALL.md for the stock, macro-only and optional Python contracts.
#
# MODES. A mode is a machine configuration that a slicer profile has to be
# built for. The pack ships one, "standard". A mode that changes what the
# hardware can run -- microsteps, driver current, a velocity ceiling -- is
# selected by a config include and a Klipper restart, never at runtime, and
# that include declares the mode by overriding one key of this section:
#
#     [gcode_macro _SVZERO_PACK]
#     variable_mode: "precision"
#
# Includes apply linearly and a later duplicate section merges key by key
# (configfile.py uses RawConfigParser(strict=False)), so the mode file names
# only the mode and everything else keeps its value here.
#
# Profiles name the mode they were sliced for with SVZERO_REQUIRE MODE=. A job
# that names none was sliced before modes existed and is taken as standard.
#
# The pack ships two modes: standard, and precision (svzero-mode-precision.cfg,
# docs/PRECISION.md). Switching is a rename and a restart. The optional
# svzero_mode_switch Moonraker component does it for a refused job: it sets
# mode_switch below when Klipper is ready, so installing it is the whole
# opt-in. Without it the refusal says which file to rename.

[gcode_macro _SVZERO_PACK]
description: Pack identity. Read by SVZERO_REQUIRE; edit only when releasing.
# Bump on any change that alters what the start G-code may rely on. Compared as
# a plain string: a mismatch is a warning, never a refusal, because a pack newer
# than the profile is the normal state during development and is almost always
# fine.
# 2.0.0 introduced renamed tiers and the macro-pack installation. Python
# sections became opt-in in the 2026-09-18 compatibility repair.
variable_version: "2.1.0"
# The machine mode. Changed only by a mode include and a restart -- see above.
variable_mode: "standard"
# Set by the svzero_mode_switch Moonraker component when Klipper is ready.
variable_mode_switch: False
# A mode file states the microsteps it sets; 0 here means no check.
variable_mode_microsteps: 0
# Set by SVZERO_REQUIRE, cleared by START_PRINT once it has been read and by
# CANCEL_PRINT. This is how the pack notices a job that never introduced itself.
variable_seen: 0
gcode:

[gcode_macro SVZERO_REQUIRE]
description: Announce which profile sliced this job; refuse one sliced for another mode.
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set want = params.VERSION|default("")|string %}
    {% set job_mode = params.MODE|default("standard")|string|lower %}
    {% set machine_mode = p.mode|default("standard")|string|lower %}
    # What the handshake refuses: a job sliced for another mode, which asks for
    # motion this configuration was not set up for, in either direction (only
    # the profile knows which mode it was built for); and a mode whose file did
    # not take effect. This is the first line of the start G-code, so a refused
    # job has heated nothing.
    {% if job_mode != machine_mode and p.mode_switch|default(False) %}
        # Ask first: the call is made while this template renders, before the
        # refusal below ends the job. The component waits for the job to end.
        {action_call_remote_method("svzero_mode_switch", mode=job_mode, filename=printer.print_stats.filename)}
        {action_raise_error("svzero: this job was sliced for %s mode and the printer is in %s mode. Refused before heating. svzero_mode_switch restarts Klipper in %s mode and starts this job again, and logs to svzero_mode_switch.log if it cannot." % (job_mode, machine_mode, job_mode))}
    {% elif job_mode != machine_mode %}
        # Without the component, say exactly what to rename. Standard mode is no
        # mode file; any other mode is its own file beside the pack.
        {% set how = ("rename svzero-mode-%s.cfg to svzero-mode-%s.cfg.off" % (machine_mode, machine_mode))
                     if job_mode == "standard"
                     else ("rename svzero-mode-%s.cfg.off to svzero-mode-%s.cfg" % (job_mode, job_mode)) %}
        {action_raise_error("svzero: this job was sliced for %s mode and the printer is in %s mode. Refused before heating. Reslice it with the %s printer profile, or %s in the pack's directory and restart Klipper." % (job_mode, machine_mode, machine_mode, how))}
    {% endif %}
    # A mode file states the microsteps it sets. If printer.cfg's own stepper
    # sections come after the pack include, theirs win and the mode is only a
    # name, so the job is refused rather than printed at the wrong resolution.
    {% set want_steps = p.mode_microsteps|default(0)|int %}
    {% set settings = printer.configfile.settings %}
    {% set have_steps = settings.stepper_x.microsteps|int if 'stepper_x' in settings else want_steps %}
    {% if want_steps and have_steps != want_steps %}
        {action_raise_error("svzero: %s mode is selected but stepper_x runs %d microsteps, not the %d it sets. The pack include comes before printer.cfg's stepper sections; move it after them, as INSTALL.md places it. Refused before heating." % (machine_mode, have_steps, want_steps))}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SVZERO_PACK VARIABLE=seen VALUE=1
    {% if want and want != p.version %}
        RESPOND PREFIX="svzero" MSG="profile expects pack {want}, installed pack is {p.version}. Not fatal -- check the release notes if something behaves oddly."
    {% endif %}

# Report the machine mode, or ask svzero_mode_switch for another one. With no
# job attached the component switches and restarts Klipper, and starts nothing.
[gcode_macro SVZERO_MODE]
description: Report the machine mode; MODE=<name> asks svzero_mode_switch to switch (restarts Klipper when idle).
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set machine_mode = p.mode|default("standard")|string|lower %}
    {% set want = params.MODE|default("")|string|lower %}
    {% if not want %}
        RESPOND PREFIX="svzero" MSG="machine mode {machine_mode}, automatic switching {'on' if p.mode_switch|default(False) else 'off'}"
    {% elif want == machine_mode %}
        RESPOND PREFIX="svzero" MSG="already in {machine_mode} mode"
    {% elif not p.mode_switch|default(False) %}
        RESPOND PREFIX="svzero" MSG="automatic switching is off (no svzero_mode_switch component). Rename the {want} mode file by hand and restart Klipper."
    {% else %}
        {action_call_remote_method("svzero_mode_switch", mode=want, filename="")}
        RESPOND PREFIX="svzero" MSG="asked svzero_mode_switch for {want} mode. Klipper restarts once the printer is idle and cold."
    {% endif %}

# Called by START_PRINT. Warns when a job arrived without SVZERO_REQUIRE, which
# means it was sliced by a profile that predates the handshake or by a stock
# one. In standard mode everything still runs; the values simply come from
# inference rather than from the slicer. In any other mode the job is refused:
# it cannot show it was sliced for this configuration. That check runs at
# START_PRINT, after the slicer's own heating, because an unidentified job
# reaches the pack no earlier. A third-party job that never calls START_PRINT
# is not caught here at all.
[gcode_macro _SVZERO_CHECK_PROFILE]
description: Warn once per job if the slicer never identified itself; refuse it outside standard mode.
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set machine_mode = p.mode|default("standard")|string|lower %}
    {% if p.seen|int == 0 %}
        {% if machine_mode != "standard" %}
            {action_raise_error("svzero: this job did not say which mode it was sliced for, and the printer is in %s mode, which runs only jobs sliced for it. Refused." % machine_mode)}
        {% endif %}
        RESPOND PREFIX="svzero" MSG="this job was not sliced by an rpcyan SV Zero profile ({p.version} installed). Chamber, material and silicone nozzle wipe temperatures fall back to inference."
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SVZERO_PACK VARIABLE=seen VALUE=0

# END SOURCE: klipper/config/svzero_pack.cfg

# Chamber control by PI-regulated exhaust fan. The hardware file claims the fan
# and the chamber thermistor; on 1.4.x it also REPLACES a stock section, which
# that file explains.

# BEGIN SOURCE: klipper/config/chamber_fan_hw_1.4.x.cfg
# Chamber control — hardware sections for 1.4.x (tested on 1.4.7)
#
# YOU MUST DELETE A STOCK SECTION FIRST. 1.4.x ships:
#
#   [temperature_fan exhaust_fan]     <- printer.cfg ~263 on 1.4.7
#   pin: PB0                          <- the exhaust fan
#   sensor_type: EPCOS 100K B57560G104F
#   sensor_pin: PC4                   <- the chamber thermistor
#
# That single section is both halves of what this mod replaces: it is the
# watermark controller responsible for the banding and the noise, and it holds
# the chamber thermistor. It claims PB0 and PC4, so leaving it in place while
# adding the sections below is fatal — pins.py raises "pin PB0 used multiple
# times in config". Comment it out or delete it.
#
# There is no way to keep it and override it: a temperature_fan cannot be driven
# by SET_FAN_SPEED, and it cannot be converted into a fan_generic in place.
#
# Do NOT confuse this with [fan_generic fan3] on PE14. On 1.4.x fan3 is a
# different, unrelated fan. The name fan3 means different hardware on 1.3.7.
#
#   [include chamber_fan_hw_1.4.x.cfg]
#   [include chamber_fan.cfg]

[gcode_macro _CH_HW]
variable_fan: "exhaust_fan"
gcode:

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 80

[fan_generic exhaust_fan]
pin: PB0
tachometer_pin: PB1
tachometer_ppr: 2                # Gekkio scope measurement, 2026-06-01
tachometer_poll_interval: 0.0019 # was 0.0046, which aliased at higher speed
hardware_pwm: false              # sw PWM, so cycle_time is actually honoured
cycle_time: 0.07                 # chosen by long-dwell minimum, not cold start
# Published floor, as on the curtain fan: a request below it turns the fan off
# instead of leaving it powered and stalled. That includes a Mainsail slider
# or SET_FAN_SPEED outside the chamber loop. 10% held five minutes at 70 ms on
# the bench, but in service one unit failed 13% and holds 14%; 0.15 is one point
# above. The adaptive floor trials in chamber_fan.cfg (ch_floor_autotune, off by
# default) need off_below: 0.00, or every trial below 0.15 reads as a stall.
off_below:  0.15
max_power: 1.0
kick_start_time: 0.40            # ~39 dB(A) measured vs 37 dB(A) background
shutdown_speed: 0.00

# END SOURCE: klipper/config/chamber_fan_hw_1.4.x.cfg

# BEGIN SOURCE: klipper/config/chamber_fan.cfg
# Chamber control by PI-regulated exhaust fan — macros
#
# Forum thread: https://forum.sovol3d.com/t/9025  (rpcyan)
#
# HARDWARE SECTIONS LIVE IN A SEPARATE FILE, and which one you include depends
# on your firmware. See chamber_fan_hw_1.4.x.cfg and chamber_fan_hw_1.3.7.cfg.
# 1.3.7 already wires both the chamber thermistor and the exhaust fan in stock
# printer.cfg, and redefining either is a hard config error.
#
#   printer.cfg (1.4.x):   [include chamber_fan_hw_1.4.x.cfg]
#                          [include chamber_fan.cfg]
#
#   printer.cfg (1.3.7):   ...leave the stock sections alone...
#                          [include chamber_fan_hw_1.3.7.cfg]   <- at the END
#                          [include chamber_fan.cfg]
#
# FAST STATE IS HELD IN RAM, NOT save_variables
#
# Every SAVE_VARIABLE rewrites the whole saved_variables.cfg file
# (klippy/extras/save_variables.py). The loop used to save the integral and the
# duty cycle on every pass; at the old 6 s period that is ~1,200 file rewrites
# an hour, ~24,000 over a 20 h print, for values that are meaningless after a
# restart anyway. Loop state now lives in _CH_STATE as gcode variables, which
# never touch the disk. Only user settings — target, gains, limits — are
# persisted, and those change when you change them.

[gcode_macro _CH_STATE]
description: Volatile loop state. Not saved, and should not be.
variable_integral: 0.0
variable_primed: 0
variable_running: 0
variable_last_duty: 0.0
variable_requested: 0           # 1 = the slicer sent M141 for THIS print
# 1 = that request was M141 S0: the slicer asked for NO chamber control.
# Distinct from never asking. _CHAMBER_AUTOSTART infers a ceiling from the
# bed when nothing asked, which would quietly turn control back on for the
# one profile that deliberately declined it.
variable_control_declined: 0
variable_fan_latched: 0          # physical exhaust output is nonzero
variable_cooling_latched: 0      # chamber demand hysteresis: 5% on, 3% off
variable_active_floor: 0.0       # known-good floor or this print's lower trial
variable_pending_duty: 0.0       # duty to reapply after a stall-retry off pulse
variable_launching: 0            # retry is waiting at zero before hardware kick
variable_guard_grace: 0
variable_stall_low: 0
variable_floor_dwell: 0
variable_last_floor_rpm: 0.0
variable_trial_active: 0
variable_trial_recovered: 0
variable_adapt_print: 0
variable_tach_ok: 1
variable_tach_warned: 0
variable_recovery_attempts: 0
variable_emergency: 0
variable_z_schedule: 0           # print-time stock-sensor confidence schedule
variable_z_phase: 0              # 0 normal, 1 low, 2 bias peak, 3 blend, 4 full PI
variable_z_confidence: 1.0
variable_u_anchor: 0.0            # output at print-start handoff
variable_p_anchor: 0.0            # cooling-only P term at print-start handoff
variable_p_term: 0.0              # current signed P term, for telemetry
variable_control_raw: 0.0         # scheduled or PI demand before floor/hysteresis
variable_full_pi: 1               # 0 until the bumpless transition at full authority
variable_slope_primed: 0
variable_last_chamber_temp: 0.0
variable_last_toolhead_temp: 0.0
variable_chamber_slope: 0.0        # filtered degrees C per minute
variable_toolhead_slope: 0.0       # filtered degrees C per minute
variable_preheat_active: 0
variable_preheat_ready: 0
variable_preheat_target_pending: 0 # one-shot M191 minimum -> M141 target handoff
variable_preheat_z: 0.0
# Frozen telemetry vocabulary. These are status labels only in Stage 4B.
# preheat_phase: 0 NONE, 1 BASELINE, 2 BOOST, 3 COAST, 4 COMPAT_START,
#                5 HANDOFF, 6 PRINT, 7 ABORTED
# preheat_result: 0 NONE, 1 COMPATIBILITY, 2 QUALIFIED, 3 ABORTED
# observer_source: 0 STOCK_UNCALIBRATED, 1 COLD_NOZZLE,
#                  2 ANCHORED_STOCK, 3 REFERENCE_SHADOW
# proxy_invalid_reason: 0 NONE, 1 TARGET, 2 POWER, 3 ABORTED
# preheat_threshold_policy: 0 NONE, 1 COMPATIBILITY_FLOOR, 2 EXACT_MINIMUM
variable_preheat_phase: 0
variable_preheat_result: 0
variable_observer_source: 0
variable_print_bed_target: None      # final printing target
variable_boost_bed_target: None      # peak scheduled target
variable_boost_coast_eventtime: None # reactor monotonic clock
# boost_coast_reason: 0 NONE_OR_AT_CAP, 1 ETA_SCHEDULE, 2 INVALID_SLOPE,
#                     3 NO_BED_HEADROOM, 4 CHAMBER_READY_DURING_SAMPLE
variable_boost_coast_reason: 0
variable_proxy_valid: 0
variable_proxy_invalid_reason: 0
variable_proxy_anchor: None
variable_stock_anchor: None
variable_bias_anchor: None
variable_handoff_eventtime: None    # Klipper reactor monotonic clock
variable_proxy_start_temp: None
variable_proxy_slope: None
# proxy_validity: 0 NONE, 1 COLD_VALID, 2 WARM_COOLING,
#                 3 WARM_SETTLING, 4 VALID
variable_proxy_validity: 0
variable_proxy_cooling_seen: 0
variable_proxy_valid_dwell: 0.0
variable_preheat_requested_threshold: None
variable_preheat_actual_threshold: None
variable_preheat_threshold_policy: 0
variable_estimated_temp: None
variable_bed_time_remaining: None
variable_chamber_time_remaining: None
variable_chamber_ready_eventtime: None # reactor monotonic clock
variable_bed_ready_eventtime: None     # reactor monotonic clock
variable_print_ready_eventtime: None   # reactor monotonic clock
# Set only when chamber_preheat hands over EARLY on wipe_lead_seconds, so the
# run can be audited afterwards: the ETA it committed on, and the nozzle proxy
# reading at that moment. Both stay None on a normal, confirmed arrival.
#
# THESE MUST BE DECLARED HERE OR THE JOB DIES. SET_GCODE_VARIABLE raises on an
# unknown name, so a module writing a state key that this macro does not
# declare aborts whatever called it. That is precisely what happened on the
# first job after the wipe_lead deploy, 2026-09-08: M191 committed at eta 0.7
# min, _set_state raised "Unknown gcode_macro variable 'wipe_lead_committed'",
# and the print cancelled at the end of the preheat with the nozzle still at
# 45 C. Same class as the 1.4.x filament_sensor_print bug in end_print.cfg.
variable_wipe_lead_committed: None     # seconds of ETA remaining at handover
variable_wipe_lead_noz: None           # nozzle proxy C at handover
variable_veto_latched: 0           # reserved; veto enforcement stays disabled pending data
variable_vent_active: 0            # standalone hot-extruder ventilation owns fan
# Commanded-heat latch. SET when a target of 45 C or more is commanded, HELD
# while the nozzle itself remains at or above 45 C, cleared below that. It is
# not a temperature predicate: a cold nozzle sitting in a warm chamber must
# never open the exhaust, which is what happened on 2026-09-01 when a 47 C
# chamber pushed the idle nozzle past the heatbreak fan's 45 C threshold and
# vented the box through four hours of measurement.
variable_vent_latched: 0
variable_vent_launching: 0         # zero pulse is waiting for retry completion
variable_vent_pending_duty: 0.0
variable_vent_guard_grace: 0
variable_vent_stall_low: 0
variable_vent_recovery_attempts: 0
variable_vent_emergency: 0
variable_vent_tach_warned: 0
gcode:


[gcode_macro _CH_PREHEAT_CLEAR]
description: Clear chamber-preheat telemetry without changing hardware.
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_result VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_bed_target VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=boost_bed_target VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=boost_coast_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=boost_coast_reason VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_anchor VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stock_anchor VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bias_anchor VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=handoff_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_start_temp VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_slope VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_validity VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_cooling_seen VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid_dwell VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_requested_threshold VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_actual_threshold VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_threshold_policy VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bed_time_remaining VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_time_remaining VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_ready_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bed_ready_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_ready_eventtime VALUE=None


[gcode_macro _CH_PREHEAT_ABORT_STATE]
description: Mark an interrupted preheat without changing hardware.
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=7
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_result VALUE=3
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE=3


[gcode_macro _CH_PROXY_ANCHOR]
description: Capture simultaneous post-wait cold-nozzle and stock temperatures.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% if st.proxy_valid|int == 1 %}
        # A nozzle that qualified by Newton projection is still descending, so
        # its live reading is NOT chamber air -- the projected asymptote is.
        # The host extra stores that estimate in proxy_anchor; overwriting it
        # here with the live reading is what produced a -7.18 C bias on
        # 2026-08-26, from a 44.15 C nozzle over 36.97 C air. Prefer the
        # projection when there is one; a cold-nozzle qualification leaves it
        # unset and the live reading is then correct by definition.
        {% set projected = st.proxy_anchor %}
        {% set proxy = projected|float if projected is not none
                       else printer.extruder.temperature|float %}
        {% set stock = printer["temperature_sensor chamber_temp"].temperature|float %}
        {% set bias = stock - proxy %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_anchor VALUE={proxy}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stock_anchor VALUE={stock}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bias_anchor VALUE={bias}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE={proxy}
        RESPOND PREFIX="ch" MSG="observer anchor proxy={proxy|round(2)} stock={stock|round(2)} bias={bias|round(2)} from={'projection' if projected is not none else 'nozzle'}"
    {% endif %}


[gcode_macro _CH_PROXY_INVALIDATE]
description: Hand the observer from the heated nozzle to the anchored stock sensor.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set reason = params.REASON|default(1)|int %}
    {% set anchored = st.proxy_anchor is not none and st.stock_anchor is not none %}
    {% if st.proxy_valid|int == 1 %}
        CHAMBER_RECORD_HANDOFF
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE={reason}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE={5 if anchored else 6}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE={2 if anchored else 0}
        {% if not anchored %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE=None
        {% endif %}
    {% endif %}


[gcode_macro _CHAMBER_LOOP]
gcode:
    {% set st        = printer["gcode_macro _CH_STATE"] %}
    {% set fan       = printer["gcode_macro _CH_HW"].fan %}
    {% set temp      = printer["temperature_sensor chamber_temp"].temperature      %}
    {% set tooltemp  = printer["temperature_sensor Toolhead_Temp"].temperature      %}
    {% set target    = printer.save_variables.variables.ch_target  |default(32.0)  %}
    {% set kp        = printer.save_variables.variables.ch_kp      |default(0.15)  %}
    {% set ki        = printer.save_variables.variables.ch_ki      |default(0.020) %}
    {% set minfan    = printer.save_variables.variables.ch_minfan  |default(0.15)  %}
    {% set maxfan    = printer.save_variables.variables.ch_maxfan  |default(1.00)  %}
    {% set i_max     = printer.save_variables.variables.ch_i_max   |default(0.6)   %}
    {% set delta     = printer.save_variables.variables.ch_auto_off|default(5.0)   %}
    {% set dt        = printer.save_variables.variables.ch_dt      |default(15)    %}
    {% set start     = printer.save_variables.variables.ch_start_request|default(0.05)|float %}
    {% set stop      = printer.save_variables.variables.ch_stop_request |default(0.03)|float %}
    {% set slew      = printer.save_variables.variables.ch_slew_per_loop|default(0.05)|float %}
    {% set i_primed  = st.primed %}
    {% set i_acc     = st.integral %}
    {% set floor     = st.active_floor|float if st.active_floor|float > 0 else minfan %}
    # QUANTISED TO THE NEAREST 1 %, and a floor that rounds to zero means the
    # ventilation floor is OFF -- not "on at zero duty". See _CHAMBER_VENT.
    {% set vent_floor = ((printer.save_variables.variables.ch_vent_floor|default(0.0)|float) * 100)|round(0)|float / 100 %}
    {% set vent_required = (vent_floor > 0.0
                           and (printer.extruder.target|float >= 45.0
                                or (st.vent_latched|int == 1
                                    and printer.extruder.temperature|float >= 45.0))) %}
    {% set keep_running = 1 %}
    {% set proxy_valid = st.proxy_valid|int %}
    {% set observer_source = st.observer_source|int %}
    {% set anchored = st.proxy_anchor is not none and st.stock_anchor is not none %}
    {% set handoff_now = 0 %}

    # A target command normally invalidates the nozzle observer synchronously.
    # Power is the fallback for heater paths that bypass both wrapped commands.
    {% if printer.extruder.power|default(0.0)|float > 0 and proxy_valid == 1 %}
        {% set proxy_valid = 0 %}
        {% set observer_source = 2 if anchored else 0 %}
        {% set handoff_now = 1 %}
        CHAMBER_RECORD_HANDOFF
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE=2
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE={5 if anchored else 6}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE={observer_source}
        {% if not anchored %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE=None
        {% endif %}
    {% endif %}

    {% set error = temp - target %}
    {% set p_full = error * kp %}
    {% set p_cool = [0.0, p_full]|max %}
    {% set z = printer.gcode_move.gcode_position.z|default(0.0, true)|float %}

    # Maintain filtered trend telemetry for the future asymmetric MCU veto.
    # Agreement will never grant more authority than Z permits; disagreement
    # may eventually cap it after thresholds are characterized on tall prints.
    {% set slope_window = printer.save_variables.variables.ch_slope_window|default(60.0)|float %}
    {% set slope_alpha = [1.0, dt / ([dt, slope_window]|max)]|min %}
    {% if st.slope_primed|int == 1 %}
        {% set chamber_raw_slope = (temp - st.last_chamber_temp|float) * 60.0 / dt %}
        {% set toolhead_raw_slope = (tooltemp - st.last_toolhead_temp|float) * 60.0 / dt %}
        {% set chamber_slope = st.chamber_slope|float + slope_alpha * (chamber_raw_slope - st.chamber_slope|float) %}
        {% set toolhead_slope = st.toolhead_slope|float + slope_alpha * (toolhead_raw_slope - st.toolhead_slope|float) %}
    {% else %}
        {% set chamber_slope = 0.0 %}
        {% set toolhead_slope = 0.0 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=slope_primed VALUE=1
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_chamber_temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_toolhead_temp VALUE={tooltemp}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_slope VALUE={chamber_slope}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=toolhead_slope VALUE={toolhead_slope}

    {% if i_primed == 0 and error > 0 %}
        {% set i_primed = 1 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed VALUE=1
        RESPOND PREFIX="ch" MSG="Target reached"
    {% endif %}

    # The stock chamber sensor is corrupted by bed geometry below about 68 mm.
    # During a print, react only to changes from the print-start anchor, with
    # authority scheduled from the measured Z regions. The integral remains
    # frozen until full authority, then is initialized for an exact bumpless
    # transfer. Manual/non-print chamber control retains ordinary PI behavior.
    {% if st.z_schedule|int == 1 %}
        {% set low_gain = printer.save_variables.variables.ch_z_low_gain|default(0.15)|float %}
        {% set mid_gain = printer.save_variables.variables.ch_z_mid_gain|default(0.25)|float %}
        {% set low_end = printer.save_variables.variables.ch_z_low_end|default(40.0)|float %}
        {% set bias_end = printer.save_variables.variables.ch_z_bias_end|default(48.0)|float %}
        {% set full_z = printer.save_variables.variables.ch_z_full|default(68.0)|float %}

        {% if z < low_end %}
            {% set confidence = low_gain %}
            {% set phase = 1 %}
        {% elif z < bias_end %}
            {% set span = [0.001, bias_end - low_end]|max %}
            {% set confidence = low_gain + ((mid_gain - low_gain) * (z - low_end) / span) %}
            {% set phase = 2 %}
        {% elif z < full_z %}
            {% set span = [0.001, full_z - bias_end]|max %}
            {% set confidence = mid_gain + ((1.0 - mid_gain) * (z - bias_end) / span) %}
            {% set phase = 3 %}
        {% else %}
            {% set confidence = 1.0 %}
            {% set phase = 4 %}
        {% endif %}

        {% if phase < 4 %}
            {% set control = st.u_anchor|float + confidence * (p_cool - st.p_anchor|float) %}
            {% set control = [maxfan, [0.0, control]|max]|min %}
        {% elif st.full_pi|int == 0 %}
            # Seed I so P + I is exactly the previously applied output.
            {% set i_acc = st.control_raw|float - p_full %}
            {% set i_acc = [i_max, [0 - i_max, i_acc]|max]|min %}
            {% set control = p_full + i_acc %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE={i_acc}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=1
            RESPOND PREFIX="ch" MSG="Full chamber PI authority at Z{z|round(2)} bumpless I={i_acc|round(3)}"
        {% else %}
            {% if i_primed == 1 %}
                {% set i_acc = i_acc + (error * ki * dt / 60) %}
                {% if i_acc > i_max or i_acc < (0 - i_max) %}
                    RESPOND PREFIX="ch" MSG="Accumulator clamped Ki={ki}"
                    {% set i_acc = [i_max, [0 - i_max, i_acc]|max]|min %}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE={i_acc}
            {% endif %}
            {% set control = p_full + i_acc %}
        {% endif %}
    {% else %}
        {% set confidence = 1.0 %}
        {% set phase = 0 %}
        {% if i_primed == 1 %}
            {% set i_acc = i_acc + (error * ki * dt / 60) %}
            {% if i_acc > i_max or i_acc < (0 - i_max) %}
                RESPOND PREFIX="ch" MSG="Accumulator clamped Ki={ki}"
                {% set i_acc = [i_max, [0 - i_max, i_acc]|max]|min %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE={i_acc}
        {% endif %}
        {% set control = p_full + i_acc %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE={phase}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE={confidence}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_term VALUE={p_full}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE={control}

    # Shadow only in Stage 4C. `error` and every control term above continue to
    # use the raw stock temperature. At handoff delta_stock is zero, so the
    # first anchored estimate equals proxy_anchor without a discontinuity.
    {% if observer_source == 1 and proxy_valid == 1 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE={printer.extruder.temperature|float}
    {% elif observer_source == 2 and anchored %}
        {% set delta_stock = temp - st.stock_anchor|float %}
        {% set estimate = st.proxy_anchor|float + confidence * delta_stock %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE={estimate}
        {% if st.preheat_phase|int == 5 and handoff_now == 0 %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=6
        {% endif %}
    {% endif %}

    # Chamber-demand hysteresis is separate from the physical fan latch. The
    # hot-extruder ventilation floor may keep the rotor turning without
    # activating the adaptive chamber floor or becoming chamber demand.
    {% if control >= start %}
        {% set cooling_latched = 1 %}
    {% elif control <= stop %}
        {% set cooling_latched = 0 %}
    {% else %}
        {% set cooling_latched = st.cooling_latched|int %}
    {% endif %}
    # The cooldown assist used to be a third term here. Since 2026-09-14 the ramp
    # stops this loop when it begins and drives the exhaust itself, so the loop
    # answers only to chamber demand and the hot-nozzle ventilation floor.
    {% set run_required = (cooling_latched == 1 or vent_required) %}
    {% set required_floor = [floor if cooling_latched == 1 else 0.0,
                             vent_floor if vent_required else 0.0]|max %}
    {% set chamber_demand = control if cooling_latched == 1 else 0.0 %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=cooling_latched VALUE={cooling_latched}

    {% if i_primed == 1 %}
        {% if error <= (0 - delta) %}
            RESPOND PREFIX="ch" MSG="Chamber {delta}C below target, chamber control disabled."
            _CHAMBER_OFF
            {% set keep_running = 0 %}
        {% endif %}
    {% endif %}

    {% if keep_running == 1 %}
        {% if st.fan_latched|int == 0 and run_required %}
            # The stable floor is an intentional exception to the slew limit.
            {% set duty = [maxfan, [required_floor, chamber_demand]|max]|min %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=1
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={duty}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={duty}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
            # The fan section supplies the full-power kick. The rotor's slow
            # mechanical ramp makes 0.4 s barely audible, while Zero2 needs it.
            SET_FAN_SPEED FAN={fan} SPEED={duty}
        {% elif st.fan_latched|int == 1 and not run_required %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
            UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION=0
            SET_FAN_SPEED FAN={fan} SPEED=0
        {% elif st.fan_latched|int == 1 %}
            {% set desired = [maxfan, [required_floor, chamber_demand]|max]|min %}
            {% if slew > 0 %}
                {% set duty = [st.last_duty|float + slew, [st.last_duty|float - slew, desired]|max]|min %}
            {% else %}
                {% set duty = desired %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={duty}
            {% if st.launching|int == 0 and st.emergency|int == 0 %}
                SET_FAN_SPEED FAN={fan} SPEED={duty}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={duty}
            {% endif %}
        {% endif %}
    {% endif %}

    {% if printer.save_variables.variables.ch_debug|default(0) == 1 %}
        _CH_STATUS
    {% endif %}

    # Only rearm if still running. _CHAMBER_OFF above may have just stopped us,
    # and an unconditional rearm here would restart the loop it had cancelled.
    {% if keep_running == 1 %}
        UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION={dt}
    {% endif %}


[gcode_macro _CHAMBER_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=running  VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed   VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=cooling_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=recovery_attempts VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_tach_warned VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=0.1
    UPDATE_DELAYED_GCODE ID=CHAMBER_GUARD DURATION=1


[gcode_macro _CHAMBER_OFF]
# Stops the control loop. Deliberately does NOT change ch_target.
#
# This used to end with "M141 S0", and M141 with S<=0 calls _CHAMBER_OFF, so the
# two called each other. Klipper rejects that outright — gcode_macro.py raises
# "Macro %s called recursively" — so every route through _CHAMBER_OFF ended in an
# error. It looked like it worked because M141 S0 was the LAST line, so
# everything useful had already run by the time it threw.
#
# Zeroing the target is M141's job now, and it does it after calling this.
gcode:
    {% set was_preheat = printer["gcode_macro _CH_STATE"].preheat_active|int %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=running  VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed   VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=cooling_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_schedule VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=u_anchor VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_anchor VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_term VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=slope_primed VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_chamber_temp VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_toolhead_temp VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_slope VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=toolhead_slope VALUE=0.0
    {% if was_preheat == 1 %}
        _CH_PREHEAT_ABORT_STATE
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=veto_latched VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_GUARD DURATION=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION=0
    SET_FAN_SPEED FAN={printer["gcode_macro _CH_HW"].fan} SPEED=0
    SAVE_VARIABLE VARIABLE=ch_debug VALUE=0


[delayed_gcode CHAMBER_TIMER]
gcode:
    _CHAMBER_LOOP


[delayed_gcode CHAMBER_RETRY_END]
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% if st.running|int == 1 and st.fan_latched|int == 1 and st.emergency|int == 0 %}
        # A real zero interval makes Klipper's configured kick_start_time fire
        # again even though the logical demand was already nonzero.
        SET_FAN_SPEED FAN={fan} SPEED={st.pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={st.pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
    {% endif %}


[delayed_gcode CHAMBER_GUARD]
gcode:
    _CHAMBER_GUARD


# This supervisor is deliberately independent of chamber PI. It starts within
# one second of a commanded hotend target of 45 C or more, survives lifecycle
# macros that clear fan outputs, and owns tach recovery whenever chamber PI is
# not running.
#
# It deliberately no longer mirrors the stock heatbreak-fan predicate. That
# predicate is `extruder.temperature > heater_temp`, which a hot chamber alone
# satisfies: on 2026-09-01 a 47 C chamber held the idle nozzle above the
# heatbreak fan's 45 C threshold and the exhaust ran at its 11% floor through
# four hours of measurement. Fume extraction follows commanded heat; the
# heatbreak fan keeps its own predicate and is not changed here.
[delayed_gcode CHAMBER_VENT_TIMER]
initial_duration: 1
gcode:
    UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_TIMER DURATION=1
    _CHAMBER_VENT


[gcode_macro _CHAMBER_VENT]
description: Maintain the independent hot-extruder exhaust floor.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set fan_obj = printer["fan_generic " ~ fan] %}
    # QUANTISED TO THE NEAREST 1 %. The rounding IS the deadband: a configured
    # floor below half a percent is not a slow fan, it is no fan, and the
    # nearest real state is off.
    {% set floor = ((printer.save_variables.variables.ch_vent_floor|default(0.0)|float) * 100)|round(0)|float / 100 %}
    {% set hotend_target = params.TARGET|default(printer.extruder.target)|float %}
    {% set latch = 1 if (hotend_target >= 45.0
                         or (st.vent_latched|int == 1
                             and printer.extruder.temperature|float >= 45.0)) else 0 %}
    # A ZERO FLOOR MEANS NOT REQUIRED, and that distinction is load-bearing.
    # Latching `required` on the hotend alone and then commanding SPEED=0 would
    # set vent_active, leave the tach guard watching a fan that is off by
    # design, count three low-rpm samples and hand _CHAMBER_VENT_STALL a stall
    # it would "fail safe" by driving the exhaust to 1.0 -- the exact opposite
    # of what a zero floor asks for. With required false the else-branch below
    # clears every vent flag and commands the fan off once, cleanly.
    # A COOLDOWN RAMP OWNS THE EXHAUST once it is past settle (2026-09-14). This
    # timer runs every second, and left alone it would command the exhaust to
    # its floor while the nozzle is hot, then to zero once it cools below 45 C
    # -- either one stomping the ramp's own duty. So it stands down entirely:
    # nothing required, and no release write either.
    {% set ramp_owns = ('gcode_macro _COOL_STATE' in printer
                        and printer["gcode_macro _COOL_STATE"].active|int == 1
                        and printer["gcode_macro _COOL_STATE"].phase|int == 2) %}
    {% set required = latch == 1 and floor > 0.0 and not ramp_owns %}
    {% set actual = fan_obj.speed|default(0.0)|float %}
    {% set rpm = fan_obj.rpm|default(none) %}
    {% set threshold = printer.save_variables.variables.ch_stall_rpm|default(500)|float %}
    {% set samples = printer.save_variables.variables.ch_stall_samples|default(3)|int %}
    {% set max_rpm = printer.save_variables.variables.ch_tach_max_rpm|default(8000)|float %}

    {% if latch != st.vent_latched|int %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_latched VALUE={latch}
    {% endif %}

    {% if required %}
        {% if st.running|int == 1 %}
            # Chamber PI owns tach recovery while running. Clear any stale
            # standalone state, but immediately repair an external fan-off.
            {% if st.vent_active|int == 1 or st.vent_launching|int == 1 or st.vent_emergency|int == 1 %}
                UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE=0
            {% endif %}
            {% if st.emergency|int == 0 and st.launching|int == 0 and actual < floor %}
                {% set restored = [floor, st.last_duty|float]|max if st.cooling_latched|int == 1 else floor %}
                SET_FAN_SPEED FAN={fan} SPEED={restored}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={restored}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={restored}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=1
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
            {% endif %}
        {% elif st.vent_launching|int == 0 %}
            {% if st.vent_emergency|int == 1 %}
                SET_FAN_SPEED FAN={fan} SPEED=1.0
            {% else %}
                {% if st.vent_active|int == 0 or actual < floor %}
                    {% set duty = [floor, actual]|max %}
                    SET_FAN_SPEED FAN={fan} SPEED={duty}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={duty}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE={duty}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=1
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
                {% elif rpm is none or rpm|float > max_rpm %}
                    {% if st.vent_tach_warned|int == 0 %}
                        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust tach unavailable or implausible"
                        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_tach_warned VALUE=1
                    {% endif %}
                {% elif st.vent_guard_grace|int > 0 %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE={st.vent_guard_grace|int - 1}
                {% elif rpm|float < threshold %}
                    {% set low = st.vent_stall_low|int + 1 %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE={low}
                    {% if low >= samples %}
                        _CHAMBER_VENT_STALL RPM={rpm|float}
                    {% endif %}
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
                {% endif %}
            {% endif %}
        {% endif %}
    {% elif not ramp_owns and st.running|int == 0 and (st.vent_active|int == 1 or st.vent_launching|int == 1 or st.vent_emergency|int == 1) %}
        UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION=0
        SET_FAN_SPEED FAN={fan} SPEED=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_tach_warned VALUE=0
    {% endif %}


[gcode_macro _CHAMBER_VENT_STALL]
description: Retry standalone ventilation once, then fail safe at full output.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set floor = printer.save_variables.variables.ch_vent_floor|default(0.0)|float %}
    {% set raise = printer.save_variables.variables.ch_floor_raise|default(0.01)|float %}
    {% if st.vent_recovery_attempts|int >= 1 %}
        SET_FAN_SPEED FAN={fan} SPEED=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=1
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust failed measured retry, forcing full output"
    {% else %}
        {% set raised = [1.0, floor + raise]|min %}
        SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE={st.vent_recovery_attempts|int + 1}
        SET_FAN_SPEED FAN={fan} SPEED=0
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust floor {floor} stalled at {params.RPM|default(0)} RPM, retrying at {raised}"
        UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION={printer.save_variables.variables.ch_retry_off_time|default(0.25)|float}
    {% endif %}


[delayed_gcode CHAMBER_VENT_RETRY_END]
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set required = (printer.extruder.target|float > 0
                       or printer.extruder.temperature|float > 45.0) %}
    {% if required and st.running|int == 0 %}
        SET_FAN_SPEED FAN={fan} SPEED={st.vent_pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={st.vent_pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
    {% endif %}


[gcode_macro _CHAMBER_GUARD]
description: One-second tach guard and qualified floor-dwell counter.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set fan_obj = printer["fan_generic " ~ fan] %}
    {% set rpm = fan_obj.rpm|default(none) %}
    {% set threshold = printer.save_variables.variables.ch_stall_rpm|default(500)|float %}
    {% set samples = printer.save_variables.variables.ch_stall_samples|default(3)|int %}
    {% set max_rpm = printer.save_variables.variables.ch_tach_max_rpm|default(8000)|float %}
    {% set print_done = printer.print_stats.state in ["complete", "cancelled", "error"] %}

    # A post-print cooldown leaves the loop exactly as the print had it through
    # its settle phase, so a completed job does not stop it here while a ramp is
    # active. Since 2026-09-14 the ramp stops the loop itself when it begins
    # (_COOLDOWN_TAKE_OVER) and drives the exhaust directly. Guarded with
    # `in printer` so chamber_fan.cfg still works without cooldown.cfg.
    {% set cooling = printer['gcode_macro _COOL_STATE'].active|int
                     if 'gcode_macro _COOL_STATE' in printer else 0 %}

    {% if st.running|int == 1 %}
        {% if st.adapt_print|int == 1 and print_done and cooling == 0 %}
            _CHAMBER_OFF
        {% elif st.fan_latched|int == 1 and st.last_duty|float > 0 and st.emergency|int == 0 %}
            {% if rpm is none or rpm|float > max_rpm %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=0
                {% if st.tach_warned|int == 0 %}
                    RESPOND TYPE=error PREFIX="ch" MSG="Exhaust tach unavailable or implausible, downward learning frozen"
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_warned VALUE=1
                {% endif %}
            {% elif st.guard_grace|int > 0 %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={st.guard_grace|int - 1}
            {% elif rpm|float < threshold %}
                {% set low = st.stall_low|int + 1 %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE={low}
                {% if low >= samples %}
                    {% if st.cooling_latched|int == 1 %}
                        _CHAMBER_STALL_RECOVER RPM={rpm|float}
                    {% else %}
                        _CHAMBER_RUNNING_VENT_STALL RPM={rpm|float}
                    {% endif %}
                {% endif %}
            {% else %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
                {% if printer.print_stats.state == "printing"
                      and st.adapt_print|int == 1
                      and st.cooling_latched|int == 1
                      and st.trial_recovered|int == 0
                      and st.launching|int == 0
                      and st.last_duty|float <= st.active_floor|float + 0.005 %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=floor_dwell VALUE={st.floor_dwell|int + 1}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_floor_rpm VALUE={rpm|float}
                {% endif %}
            {% endif %}
        {% endif %}
        {% if not (st.adapt_print|int == 1 and print_done and cooling == 0) %}
            UPDATE_DELAYED_GCODE ID=CHAMBER_GUARD DURATION=1
        {% endif %}
    {% endif %}


[gcode_macro _CHAMBER_RUNNING_VENT_STALL]
description: Retry ventilation-only demand while the chamber loop is active.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set floor = printer.save_variables.variables.ch_vent_floor|default(0.0)|float %}
    {% set raise = printer.save_variables.variables.ch_floor_raise|default(0.01)|float %}
    {% set retry_off = printer.save_variables.variables.ch_retry_off_time|default(0.25)|float %}

    {% if st.vent_recovery_attempts|int >= 1 %}
        SET_FAN_SPEED FAN={fan} SPEED=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=0
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust failed measured retry under chamber control, forcing full output"
    {% else %}
        {% set raised = [1.0, floor + raise]|min %}
        SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE={st.vent_recovery_attempts|int + 1}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=1
        SET_FAN_SPEED FAN={fan} SPEED=0
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust floor {floor} stalled under chamber control at {params.RPM|default(0)} RPM, retrying at {raised}"
        UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION={retry_off}
    {% endif %}


[gcode_macro _CHAMBER_STALL_RECOVER]
description: Revert a failed trial or raise a failed known-good floor, then retry once.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set known = printer.save_variables.variables.ch_minfan|default(0.15)|float %}
    {% set raise = printer.save_variables.variables.ch_floor_raise|default(0.01)|float %}
    {% set retry_prints = printer.save_variables.variables.ch_floor_retry_prints|default(10)|int %}
    {% set retry_off = printer.save_variables.variables.ch_retry_off_time|default(0.25)|float %}

    {% if st.recovery_attempts|int >= 1 %}
        SET_FAN_SPEED FAN={fan} SPEED=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=0
        RESPOND TYPE=error PREFIX="ch" MSG="Exhaust failed measured retry, forcing full output and freezing learning"
    {% else %}
        {% if st.trial_active|int == 1 %}
            {% set recovered_floor = known %}
            SAVE_VARIABLE VARIABLE=ch_floor_failed VALUE={st.active_floor|float}
            SAVE_VARIABLE VARIABLE=ch_floor_cooldown VALUE={retry_prints}
            SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=-1
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_active VALUE=0
            RESPOND TYPE=error PREFIX="ch" MSG="Trial floor {st.active_floor|float} stalled at {params.RPM|default(0)} RPM, reverting to {known}"
        {% else %}
            {% set recovered_floor = [1.0, known + raise]|min %}
            SAVE_VARIABLE VARIABLE=ch_minfan VALUE={recovered_floor}
            SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=-2
            RESPOND TYPE=error PREFIX="ch" MSG="Known floor {known} stalled at {params.RPM|default(0)} RPM, raising to {recovered_floor}"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=active_floor VALUE={recovered_floor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={recovered_floor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_recovered VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=recovery_attempts VALUE={st.recovery_attempts|int + 1}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=1
        SET_FAN_SPEED FAN={fan} SPEED=0
        UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION={retry_off}
    {% endif %}


[gcode_macro _CH_ADAPT_FINISH]
description: Promote only a floor that the preceding print actually exercised.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set required = printer.save_variables.variables.ch_floor_dwell|default(120)|int %}
    {% set cooldown = printer.save_variables.variables.ch_floor_cooldown|default(0)|int %}
    {% set qualified = (st.adapt_print|int == 1
                         and st.floor_dwell|int >= required
                         and st.tach_ok|int == 1
                         and st.trial_recovered|int == 0) %}

    {% if qualified and st.trial_active|int == 1 %}
        SAVE_VARIABLE VARIABLE=ch_minfan VALUE={st.active_floor|float}
        SAVE_VARIABLE VARIABLE=ch_floor_last_rpm VALUE={st.last_floor_rpm|float}
        SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=1
        RESPOND PREFIX="ch" MSG="Qualified {st.active_floor|float} floor after {st.floor_dwell|int}s, promoted for the next print"
    {% elif qualified and cooldown > 0 %}
        SAVE_VARIABLE VARIABLE=ch_floor_cooldown VALUE={cooldown - 1}
        SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=2
        RESPOND PREFIX="ch" MSG="Known floor qualified, failed-floor cooldown now {cooldown - 1} prints"
    {% elif st.adapt_print|int == 1 and st.floor_dwell|int < required %}
        SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=0
        RESPOND PREFIX="ch" MSG="No floor learning, only {st.floor_dwell|int} of {required}s qualified dwell"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=adapt_print VALUE=0


[gcode_macro _CH_ADAPT_BEGIN]
description: Select this print's known-good floor or one bounded lower trial.
# ADAPTIVE FLOOR TRIALS ARE OPT-IN: SAVE_VARIABLE VARIABLE=ch_floor_autotune
# VALUE=1. Each qualified trial saves a floor ch_floor_step lower, down to
# ch_floor_lower_limit, so the floor can end up below anything this unit has
# held in service, and a stall mid-print is how a trial fails. A trial below
# the fan section's off_below reads as a stall, so set off_below: 0.00 first.
gcode:
    {% set enabled = printer.save_variables.variables.ch_floor_autotune|default(0)|int %}
    {% set known = printer.save_variables.variables.ch_minfan|default(0.15)|float %}
    {% set step = printer.save_variables.variables.ch_floor_step|default(0.005)|float %}
    {% set lower = printer.save_variables.variables.ch_floor_lower_limit|default(0.09)|float %}
    {% set cooldown = printer.save_variables.variables.ch_floor_cooldown|default(0)|int %}
    {% set candidate = [lower, known - step]|max %}
    {% set is_trial = 1 if enabled == 1 and cooldown <= 0 and candidate < known else 0 %}
    {% set active = candidate if is_trial == 1 else known %}

    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=active_floor VALUE={active}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=floor_dwell VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_floor_rpm VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_active VALUE={is_trial}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_recovered VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=adapt_print VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_warned VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=recovery_attempts VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=0
    {% if is_trial == 1 %}
        RESPOND PREFIX="ch" MSG="Adaptive floor trial {active}, known-good {known}"
    {% else %}
        RESPOND PREFIX="ch" MSG="Adaptive floor {active}, lowering cooldown {cooldown}"
    {% endif %}


[gcode_macro _CH_Z_BEGIN]
description: Capture the print-start anchor for Z-scheduled chamber control.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set enabled = printer.save_variables.variables.ch_z_schedule|default(1)|int %}
    {% if enabled == 1 %}
        {% set temp = printer["temperature_sensor chamber_temp"].temperature|float %}
        {% set target = printer.save_variables.variables.ch_target|default(32.0)|float %}
        {% set kp = printer.save_variables.variables.ch_kp|default(0.15)|float %}
        {% set maxfan = printer.save_variables.variables.ch_maxfan|default(1.00)|float %}
        {% set p_anchor = [0.0, kp * (temp - target)]|max %}
        {% set u_anchor = [maxfan, [0.0, st.control_raw|float]|max]|min if st.running|int == 1 else 0.0 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_schedule VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE={printer.save_variables.variables.ch_z_low_gain|default(0.15)|float}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=u_anchor VALUE={u_anchor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_anchor VALUE={p_anchor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_term VALUE={kp * (temp - target)}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE={u_anchor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=slope_primed VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=veto_latched VALUE=0
        RESPOND PREFIX="ch" MSG="Z schedule anchored output={u_anchor|round(3)} P={p_anchor|round(3)} max={maxfan|round(3)}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_schedule VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=1
    {% endif %}


[gcode_macro _CHAMBER_ADAPT_STATUS]
description: Report persistent and current-print exhaust-floor learning state.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set sv = printer.save_variables.variables %}
    RESPOND PREFIX="ch" MSG="adaptive={sv.ch_floor_autotune|default(0)|int} known={sv.ch_minfan|default(0.15)|float} active={st.active_floor|float} trial={st.trial_active|int} dwell={st.floor_dwell|int}s cooldown={sv.ch_floor_cooldown|default(0)|int} failed={sv.ch_floor_failed|default(0)|float} result={sv.ch_floor_last_result|default(0)|int} tach_ok={st.tach_ok|int} recoveries={st.recovery_attempts|int} cooling={st.cooling_latched|int} vent={sv.ch_vent_floor|default(0.0)|float},{st.vent_active|int},{st.vent_recovery_attempts|int},{st.vent_emergency|int} zphase={st.z_phase|int} confidence={st.z_confidence|float|round(3)} raw={st.control_raw|float|round(3)} preheat={st.preheat_active|int},{st.preheat_ready|int},{st.preheat_phase|int},{st.preheat_result|int} observer={st.observer_source|int} proxy={st.proxy_valid|int},{st.proxy_invalid_reason|int} anchor={st.proxy_anchor},{st.stock_anchor},{st.bias_anchor} estimate={st.estimated_temp} veto={st.veto_latched|int}"


[gcode_macro _CHAMBER_CONFIG]
# Every SAVE_VARIABLE here used to be reached only if the one before it
# succeeded, and the first two referenced variables that were never defined:
# {target} where trgt was set, and {i_max} where maxi was set. Klipper's Jinja
# renders an undefined name as the empty string, so the command became
# "SAVE_VARIABLE VARIABLE=ch_target VALUE=" and save_variables rejected it with
# "Unable to parse '' as a literal". The macro aborted on its first line, so
# none of the seven settings were ever written.
gcode:
    {% set trgt = params.TARGET|default(printer.save_variables.variables.ch_target|default(32.0))|float %}
    {% set kp   = params.KP    |default(printer.save_variables.variables.ch_kp    |default(0.30))|float %}
    {% set minf = params.MINFAN|default(printer.save_variables.variables.ch_minfan|default(0.15))|float %}
    {% set maxf = params.MAXFAN|default(printer.save_variables.variables.ch_maxfan|default(1.00))|float %}
    {% set ki   = params.KI    |default(printer.save_variables.variables.ch_ki    |default(0.00))|float %}
    {% set maxi = params.I_MAX |default(printer.save_variables.variables.ch_i_max |default(0.30))|float %}
    {% set dt   = params.LOOP  |default(printer.save_variables.variables.ch_dt    |default(15  ))|float %}
    {% set vent = params.VENTFAN|default(printer.save_variables.variables.ch_vent_floor|default(0.0))|float %}

    SAVE_VARIABLE VARIABLE=ch_target  VALUE={trgt}
    SAVE_VARIABLE VARIABLE=ch_kp      VALUE={kp}
    SAVE_VARIABLE VARIABLE=ch_minfan  VALUE={minf}
    SAVE_VARIABLE VARIABLE=ch_maxfan  VALUE={maxf}
    SAVE_VARIABLE VARIABLE=ch_ki      VALUE={ki}
    SAVE_VARIABLE VARIABLE=ch_i_max   VALUE={maxi}
    SAVE_VARIABLE VARIABLE=ch_dt      VALUE={dt}
    SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={vent}

    RESPOND PREFIX="ch" MSG="Config updated: T={trgt} Kp={kp} Ki={ki} clamp={maxi} min={minf} vent={vent} max={maxf} loop={dt}s"



[gcode_macro _CHAMBER_VENT_CONFIG]
description: Set the persistent hot-extruder ventilation floor.
gcode:
    {% set floor = params.FLOOR|default(printer.save_variables.variables.ch_vent_floor|default(0.0))|float %}
    # ZERO IS NOW LEGAL and means no ventilation floor at all. It used to raise,
    # which is why the floor could only ever be turned down and not off.
    {% if floor < 0 or floor > 1 %}
        {action_raise_error("_CHAMBER_VENT_CONFIG FLOOR must be between zero and one")}
    {% else %}
        {% set snapped = (floor * 100)|round(0)|float / 100 %}
        SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={snapped}
        RESPOND PREFIX="ch" MSG="Hot-extruder ventilation floor set to {snapped}{' -- OFF, no ventilation floor' if snapped <= 0 else ''}"
    {% endif %}


[gcode_macro _CHAMBER_Z_CONFIG]
description: Configure print-time stock-sensor confidence scheduling.
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set enabled = params.ENABLE|default(sv.ch_z_schedule|default(1))|int %}
    {% set low_gain = params.LOW_GAIN|default(sv.ch_z_low_gain|default(0.15))|float %}
    {% set mid_gain = params.MID_GAIN|default(sv.ch_z_mid_gain|default(0.25))|float %}
    {% set low_end = params.LOW_END|default(sv.ch_z_low_end|default(40.0))|float %}
    {% set bias_end = params.BIAS_END|default(sv.ch_z_bias_end|default(48.0))|float %}
    {% set full_z = params.FULL_Z|default(sv.ch_z_full|default(68.0))|float %}
    {% set slew = params.SLEW|default(sv.ch_slew_per_loop|default(0.05))|float %}
    {% set slope_window = params.SLOPE_WINDOW|default(sv.ch_slope_window|default(60.0))|float %}

    {% if enabled not in [0, 1] %}
        {action_raise_error("ENABLE must be 0 or 1")}
    {% elif low_gain < 0 or low_gain > mid_gain or mid_gain > 1 %}
        {action_raise_error("Require 0 <= LOW_GAIN <= MID_GAIN <= 1")}
    {% elif low_end < 0 or bias_end <= low_end or full_z <= bias_end %}
        {action_raise_error("Require 0 <= LOW_END < BIAS_END < FULL_Z")}
    {% elif slew < 0 or slew > 1 %}
        {action_raise_error("SLEW must be between 0 and 1 per loop")}
    {% elif slope_window <= 0 %}
        {action_raise_error("SLOPE_WINDOW must be greater than zero seconds")}
    {% endif %}

    SAVE_VARIABLE VARIABLE=ch_z_schedule VALUE={enabled}
    SAVE_VARIABLE VARIABLE=ch_z_low_gain VALUE={low_gain}
    SAVE_VARIABLE VARIABLE=ch_z_mid_gain VALUE={mid_gain}
    SAVE_VARIABLE VARIABLE=ch_z_low_end VALUE={low_end}
    SAVE_VARIABLE VARIABLE=ch_z_bias_end VALUE={bias_end}
    SAVE_VARIABLE VARIABLE=ch_z_full VALUE={full_z}
    SAVE_VARIABLE VARIABLE=ch_slew_per_loop VALUE={slew}
    SAVE_VARIABLE VARIABLE=ch_slope_window VALUE={slope_window}
    RESPOND PREFIX="ch" MSG="Z schedule enabled={enabled} gains={low_gain},{mid_gain},1 Z={low_end},{bias_end},{full_z} slew={slew} slope_window={slope_window}s"


[gcode_macro _CH_STATUS]
gcode:
    {% set st   =  printer["gcode_macro _CH_STATE"] %}
    # default(0, true) not default(0): current_layer is None when idle, which is
    # defined-but-falsy, so plain default() leaves it and the CSV logs "None".
    {% set lyr  =  printer.print_stats.info.current_layer|default(0, true)                %}
    {% set sec  =  printer.print_stats.print_duration     |default(0.0)   |int            %}
    {% set fan  =  printer["gcode_macro _CH_HW"].fan                              %}
    {% set rpm  =  printer["fan_generic " ~ fan].rpm      |default(0.0)   |int            %}
    {% set z    =  printer.gcode_move.position.z                          |float|round(2) %}
    {% set i    =  st.integral                                            |float|round(3) %}
    {% set temp =  printer["temperature_sensor chamber_temp"].temperature |float|round(2) %}
    {% set tool =  printer["temperature_sensor Toolhead_Temp"].temperature |float|round(2) %}
    {% set trgt =  printer.save_variables.variables.ch_target             |float|round(0) %}
    {% set err  = (printer.save_variables.variables.ch_kp * (temp - trgt))|float|round(3) %}

    # Percent, once. This was scaled twice — last_duty * 100, then the "rounding"
    # line multiplied by another 1000 and divided by 10 — so a fan at 35% was
    # reported as 3500%.
    {% set duty = (st.last_duty * 1000)|round(0)|int / 10 %}

    # CSV: time_s,Z,temp_C,P,I,fan_pct,rpm,layer,target_C,Z_phase,
    #      confidence,control_raw,u_anchor,p_anchor,toolhead_C,
    #      chamber_slope_Cpm,toolhead_slope_Cpm,preheat_active,preheat_ready,
    #      preheat_phase,preheat_result,observer_source,proxy_valid,
    #      proxy_invalid_reason,preheat_Z,veto_latched
    RESPOND PREFIX="ch" MSG=",{sec},{z},{temp},{err},{i},{duty}%,{rpm},{lyr},{trgt},{st.z_phase|int},{st.z_confidence|float|round(3)},{st.control_raw|float|round(3)},{st.u_anchor|float|round(3)},{st.p_anchor|float|round(3)},{tool},{st.chamber_slope|float|round(3)},{st.toolhead_slope|float|round(3)},{st.preheat_active|int},{st.preheat_ready|int},{st.preheat_phase|int},{st.preheat_result|int},{st.observer_source|int},{st.proxy_valid|int},{st.proxy_invalid_reason|int},{st.preheat_z|float|round(2)},{st.veto_latched|int},"


[gcode_macro _CH_STATUS_LOOP]
gcode:
    {% set debug = params.DEBUG|default(0)|float %}
    {% set olddebug = printer.save_variables.variables.ch_debug|default(0)|float %}
    {% if debug != olddebug %}
         SAVE_VARIABLE VARIABLE=ch_debug VALUE={debug}
    {% endif %}

    {% if printer["gcode_macro _CH_STATE"].running == 1 %}
        _CH_STATUS
        {% set dt = printer.save_variables.variables.ch_dt|default(15) %}
        UPDATE_DELAYED_GCODE ID=CH_STATUS_TIMER DURATION={dt}
    {% else %}
        RESPOND PREFIX="ch" MSG="_CH_STATUS_LOOP: chamber PID not running"
    {% endif %}


[delayed_gcode CH_STATUS_TIMER]
gcode:
    _CH_STATUS_LOOP


[gcode_macro _CH_RESET_I]
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    RESPOND PREFIX="ch" MSG="Accumulator/Integral reset."


# Delayed G-code cannot acquire the G-code mutex during M109's blocking wait.
# Sovol's existing M109 override calls M104 before TEMPERATURE_WAIT, so hook
# M104 and start ventilation synchronously before that wait. The one-second
# supervisor handles direct nonblocking heater API calls, lifecycle reassertion
# and cooldown.
[gcode_macro M104]
rename_existing: M99104
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        _CH_PROXY_INVALIDATE REASON=1
    {% endif %}
    _CHAMBER_VENT TARGET={s}
    M99104 {rawparams}


[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set heater = params.HEATER|default("")|lower %}
    {% set target = params.TARGET|default(0)|float %}
    {% if heater == "extruder" %}
        {% if target > 0 %}
            _CH_PROXY_INVALIDATE REASON=1
        {% endif %}
        _CHAMBER_VENT TARGET={target}
    {% endif %}
    SET_HEATER_TEMPERATURE_BASE {rawparams}


[gcode_macro M141]
description: Set a nonblocking chamber cooling ceiling.
gcode:
    {% set s = params.S|default(0)|float %}
    {% set st = printer["gcode_macro _CH_STATE"] %}
    # A RUNNING COOLDOWN RAMP OWNS THE CEILING. Orca appends `M141 S0` after our
    # machine_end_gcode whenever the machine declares chamber control -- it is
    # the slicer's own line, not ours, so it cannot be removed by editing the
    # end G-code, and PrusaSlicer and the stock profiles do the same thing.
    #
    # On 2026-09-03 it landed one second after a 43-minute ABS ramp armed and
    # took the chamber leg with it. Deferred rather than refused: the slicer is
    # asking for the chamber to be off when the job is over, and _COOLDOWN_FINISH
    # ends every ramp with _CHAMBER_OFF and ch_target zero, so honouring it at the
    # end is exactly what the slicer meant. An operator who genuinely wants the
    # ceiling now runs COOLDOWN_ABORT first, which is already the documented way
    # to take the machine back.
    #
    # Guarded with `in printer` so chamber_fan.cfg still stands alone without
    # cooldown.cfg installed.
    {% set cooling = printer["gcode_macro _COOL_STATE"].active|int
                     if 'gcode_macro _COOL_STATE' in printer else 0 %}

    {% if cooling == 1 %}
        RESPOND PREFIX="M141:" MSG="ceiling {s}C deferred, a cooldown ramp owns the exhaust until it finishes. COOLDOWN_ABORT to take it back"
    {% elif s <= 0 %}
        _CHAMBER_OFF
        _CH_PREHEAT_CLEAR
        SAVE_VARIABLE VARIABLE=ch_target VALUE=0
        # A zero target is a decision, not silence. Say so, or START_PRINT's
        # bed inference reads it as a profile that never mentioned the chamber
        # and turns the loop back on at 55 C behind an ABS bed.
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=1
        RESPOND PREFIX="M141:" MSG="cooling ceiling={s}C off"
    {% else %}
        # A standard M191-minimum then M141-target pair must retain the
        # just-captured cold-nozzle anchor. Any standalone M141 starts clean.
        {% if st.preheat_target_pending|int != 1 %}
            _CH_PREHEAT_CLEAR
        {% endif %}
        SAVE_VARIABLE VARIABLE=ch_target VALUE={s}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0
        _CHAMBER_ON
        RESPOND PREFIX="M141:" MSG="nonblocking cooling ceiling={s}C"
    {% endif %}


[gcode_macro _PREFLIGHT]
description: Job-start gate. Runs before any heater is commanded.
gcode:
    # Orca's "Upload and Print" is one Moonraker call, so Mainsail's start
    # dialog -- and the Spoolman checks mounted only there -- never opens.
    # The spool_guard extra runs the same checks where the workflow cannot
    # skip them. It is optional: a printer without it prints as before, which
    # is what the published profiles require.
    {% if printer.spool_guard is defined %}
        SPOOL_GUARD
    {% endif %}
    # A machine-specific start-of-job hook, run only if one is defined: for
    # example lights on for the whole start, which nothing else can do once
    # M191's soak holds the G-code queue (2026-10-13). The pack defines none.
    {% if 'gcode_macro _SVZERO_PRINT_START_HOOK' in printer %}
        _SVZERO_PRINT_START_HOOK
    {% endif %}


[gcode_macro M191]
description: Rough-home, park and wait using the optional nozzle qualifier or rear sensor.
gcode:
    # Klipper does not apply extended KEY=VALUE parsing to a TRADITIONAL
    # g-code name, and gcode.py's is_traditional_gcode("M191") is true: a
    # letter followed by a number. _process_commands therefore splits the line
    # on ([A-Z_]+|[A-Z*/]) and keeps whatever follows the key, so `STIR=1`
    # arrives as the string "=1". "=1"|float is 0.0, silently, which is how
    # every KEY=VALUE argument to M191 has always been zero: the stir fan was
    # commanded to 0% and BOOST never engaged. It only became visible when
    # COAST_RATE gained a `must be greater than zero` check and aborted a
    # print. Bare positional arguments like S33 and Z15 were never affected.
    # Normalize once here so already-sliced files keep working unchanged.
    {% set p = {} %}
    {% for key, value in params.items() %}
        {% set _ = p.update({key: value[1:] if value.startswith('=') else value}) %}
    {% endfor %}

    # MARLIN'S S AND R (gcode/temp/M141_M191.cpp). S<t> sets the chamber
    # target and waits only while heating. R<t> sets it and waits whichever way
    # the chamber has to go. With both, S wins: Marlin reads R only when S is
    # absent. Here the target is the exhaust ceiling, as M141 sets it, and the
    # heating wait is the qualified soak. Two deliberate differences: a bare
    # M191, a no-op in Marlin, keeps the pack's compatibility soak (22 C floor,
    # 32 C target), which our Orca profile sends when chamber control is
    # unticked; and S0 or R0 turns chamber control off without waiting.
    {% set s_passed = p.S is defined %}
    {% set r_passed = p.R is defined %}
    {% set tol_passed = p.TOL is defined %}
    {% set exact = s_passed or r_passed %}
    {% set minimum = (p.S if s_passed else p.R if r_passed else 22)|float %}
    {% set target = minimum if exact else 32.0 %}
    {% set chamber_now = printer["temperature_sensor chamber_temp"].temperature|float
                         if "temperature_sensor chamber_temp" in printer else none %}
    # Marlin's wants_to_cool: R, and the chamber above the target.
    {% set r_cooling = r_passed and not s_passed and chamber_now is not none
                       and chamber_now > minimum %}
    {% set park = p.Z    |default(printer.save_variables.variables.ch_preheat_z|default(15.0))|float %}
    {% set stir = p.STIR |default(printer.save_variables.variables.ch_preheat_stir|default(1.0))|float %}
    # 2026-08-24 salt tray: actual Z16 minus 1 mm tray = bed-equivalent Z15.
    # 15% was the lowest command with consistent grain motion. Zero disables
    # stirring; any enabled stir must remain at or above that observed floor.
    # 0.25 is the measured fan0 proxy floor: below it the near-plate nozzle and
    # the rear sensor disagree by more than 1 C, so the stirred-nozzle observer
    # M191 depends on stops being trustworthy. The previous 0.15 was a
    # placeholder borrowed from the curtain fan on PE11, a different fan on a
    # different header. See notes/data/chamber-preheat/README.md.
    {% set stir_floor = 0.25 %}
    # BED BOOST IS THE DEFAULT (operator, 2026-10-13): with the preheat helper,
    # the plate runs above its print target while the chamber climbs, then
    # comes back before printing. BOOST=0 turns it off for one wait. Without
    # the helper there is no boost; the native wait leaves the bed alone.
    {% set boost = p.BOOST|default(1)|int %}
    # Effectively unbounded: the ceiling is now the extra's absolute max_bed_temp.
    # A file that still passes MAX_BOOST is honoured, which nerfs it to that.
    {% set max_boost = p.MAX_BOOST|default(1000.0)|float %}
    {% set coast_rate = p.COAST_RATE|default(1.0)|float %}
    {% set initial_boost = p.INITIAL_BOOST|default(5.0)|float %}
    {% set filter_alpha = p.FILTER_ALPHA|default(0.25)|float %}
    {% set bed_target = printer.heater_bed.target|float %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set park_x = p.X|default((xmin + xmax) / 2.0)|float %}
    {% set park_y = p.Y|default((ymin + ymax) / 2.0)|float %}
    {% set result = 2 if exact else 1 %}
    {% set phase = 1 if exact else 4 %}
    {% set threshold_policy = 2 if exact else 1 %}
    # Words for the console, numbers for telemetry. ch_preheat_threshold_policy
    # and ch_preheat_result stay numeric wire values; only what an operator
    # reads changes.

    # TOL was this pack's own tolerance before 2026-08-24. Marlin ignores an
    # argument it does not know, and so does this, aloud.
    {% if tol_passed %}
        RESPOND PREFIX="M191:" MSG="TOL is not an M191 argument (it was this pack's before 2026-08-24) and is ignored"
    {% endif %}
    {% if minimum <= 0 %}
        M141 S0
        _CH_PREHEAT_ABORT_STATE
    {% elif r_cooling and 'chamber_preheat' not in printer %}
        # Refused, not skipped. Marlin's cooling wait gives up once the chamber
        # stops falling, and a macro cannot measure that, so without the helper
        # the only waits on offer are one that may never end and none at all.
        # Starting the job anyway would print in a chamber the slicer asked to
        # be cooler, and say nothing. Nothing is changed before refusing.
        {action_raise_error("M191 R%s: the chamber is %.1fC, above the target, and waiting for it to cool needs the Python preheat helper ([chamber_preheat]). Install it, or let the chamber cool below %sC and start the job again." % (minimum, chamber_now, minimum))}
    {% elif r_cooling %}
        # R, cooling: the target becomes the exhaust ceiling and the wait runs
        # until the chamber has come down to it. No homing or parking -- the
        # soak parks so the cold nozzle can read the air, and this wait reads
        # the rear sensor.
        M141 S{minimum}
        RESPOND PREFIX="M191:" MSG="chamber {chamber_now|round(1)}C, waiting for it to cool to {minimum}C, or until it stops falling"
        CHAMBER_COOL_WAIT MAXIMUM={minimum} FAN={printer["gcode_macro _CH_HW"].fan}
    {% elif park < 5.0 or park > printer.toolhead.axis_maximum.z|float - 5.0 %}
        {action_raise_error("M191 Z must stay between 5mm and 5mm below axis maximum")}
    {% elif park_x < xmin or park_x > xmax or park_y < ymin or park_y > ymax %}
        {action_raise_error("M191 X and Y must stay within the configured axis limits")}
    {% elif stir < 0 or stir > 1 %}
        {action_raise_error("M191 STIR must be between 0 and 1")}
    {% elif stir > 0 and stir < stir_floor %}
        {action_raise_error("M191 STIR must be zero or at least the measured 0.25 floor")}
    {% elif boost not in [0, 1] %}
        {action_raise_error("M191 BOOST must be 0 or 1")}
    {% elif max_boost < 0 %}
        {action_raise_error("M191 MAX_BOOST must be at least zero")}
    {% elif coast_rate <= 0 %}
        {action_raise_error("M191 COAST_RATE must be greater than zero")}
    {% elif initial_boost < 0 or initial_boost > max_boost %}
        {action_raise_error("M191 INITIAL_BOOST must be between zero and MAX_BOOST")}
    {% elif filter_alpha <= 0 or filter_alpha > 1 %}
        {action_raise_error("M191 FILTER_ALPHA must be greater than zero and at most one")}
    {% else %}
        # M191 is the intentional soak path. Keep the exhaust off while adding
        # heat, preserve the cold hotend as an independent air observer, and
        # move only before the blocking wait. START_PRINT performs calibration
        # and bed mesh after this macro returns.
        _CHAMBER_OFF
        _CH_PREHEAT_CLEAR
        SAVE_VARIABLE VARIABLE=ch_target VALUE={target}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_z VALUE={park}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE={phase}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=1
        # The host qualifier sets this immediately for a cold start, or only
        # after a warm nozzle's filtered cooling trend has ended.
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_requested_threshold VALUE={target}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_actual_threshold VALUE={minimum}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_threshold_policy VALUE={threshold_policy}
        {% if bed_target > 0 %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_bed_target VALUE={bed_target}
        {% endif %}
        M104 S0
        SET_FAN_SPEED FAN=fan2 SPEED=0
        G28
        G90
        G0 Z{park} F900
        G0 X{park_x} Y{park_y} F6000
        # Console lines are for the person waiting: what is happening, in
        # words, with units. The numbers behind them stay in _CH_STATE and the
        # extra's status, where the observer and telemetry read them.
        RESPOND PREFIX="M191:" MSG="parked at X{park_x} Y{park_y} Z{park}, part fan stirring at {(stir * 100)|round|int}%"
        {% if exact %}
            RESPOND PREFIX="M191:" MSG="waiting for the chamber to reach {minimum}C, the slicer's {'minimum' if s_passed else 'target'}"
        {% else %}
            RESPOND PREFIX="M191:" MSG="waiting for the chamber to reach {minimum}C, the floor for a bare M191"
        {% endif %}
        {% if boost == 1 and bed_target > 0 and 'chamber_preheat' in printer %}
            RESPOND PREFIX="M191:" MSG="bed boost on: the bed may run above {bed_target}C{(' by up to %gC' % max_boost) if max_boost < 1000 else ', up to the preheat ceiling,'} while the chamber climbs, and is back at its print target before printing. BOOST=0 turns it off"
        {% endif %}
        # THE WIPE LEAD, LEARNED. chamber_preheat's wipe_lead_seconds is the
        # operator's CEILING: how early M191 may hand over so the heat/wipe/cool
        # lands on the chamber minimum. The safe lead is bounded by the SHORTEST
        # wipe the machine actually performs, and that is measured -- every
        # CLEAN_NOZZLE reports its own duration through _BRUSH_MARK_DONE, which
        # keeps the running minimum in wipe_seconds_min.
        #
        # Same shape as the exhaust stall-floor hunt: a value in save_variables,
        # an autotune flag, and learning that only ever moves in the SAFE
        # direction. Here safe is DOWN. min() of the two means an observation
        # can only ever pull the lead in, never push it past what the operator
        # configured -- so a hot restart that wipes in 60 s quietly drops the
        # lead to 48 without anyone having to notice, while a long wipe never
        # licenses a longer lead than was asked for.
        #
        # The margin exists because the minimum is a sample, not a bound. Set
        # wipe_lead_autotune 0 to pin the configured value and ignore what the
        # machine reports.
        {% set cfg_lead = printer.configfile.settings.chamber_preheat.wipe_lead_seconds|default(0.0)|float
                          if 'chamber_preheat' in printer.configfile.settings else 0.0 %}
        {% set learn_on = printer.save_variables.variables.wipe_lead_autotune|default(1)|int %}
        {% set w_min = printer.save_variables.variables.wipe_seconds_min|default(0.0)|float %}
        {% set w_margin = printer.save_variables.variables.wipe_lead_margin|default(0.8)|float %}
        {% set lead = [cfg_lead, (w_min * w_margin)]|min if (learn_on == 1 and w_min > 0) else cfg_lead %}
        {% if cfg_lead > 0 and learn_on == 1 and w_min > 0 %}
            RESPOND PREFIX="M191:" MSG="nozzle wipe starts {lead|round|int} s before the chamber is due (configured {cfg_lead|round|int} s, shortest wipe so far {w_min|round|int} s)"
        {% elif cfg_lead > 0 %}
            RESPOND PREFIX="M191:" MSG="nozzle wipe starts {lead|round|int} s before the chamber is due"
        {% endif %}
        {% if 'chamber_preheat' in printer %}
            CHAMBER_PREHEAT_WAIT MINIMUM={minimum} BED_TARGET={bed_target} STIR={stir} POLICY={threshold_policy} BOOST={boost if bed_target > 0 else 0} MAX_BOOST={max_boost} COAST_RATE={coast_rate} INITIAL_BOOST={initial_boost} FILTER_ALPHA={filter_alpha} WIPE_LEAD={lead|round(1)}
            # Render only after the host qualifier has completed the wait.
            _CH_PROXY_ANCHOR
        {% else %}
            # Native fallback: the rear thermistor is less representative of
            # air near the part, but it is available without a Python extra.
            # Do not claim a qualified nozzle proxy or perform a bed boost.
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
            RESPOND PREFIX="M191:" MSG="no Python preheat helper, so waiting on the rear chamber sensor, with no bed boost or early wipe"
            SET_FAN_SPEED FAN=fan0 SPEED={stir}
            # Flush the queued fan callback before TEMPERATURE_WAIT blocks.
            M400
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={minimum}
            SET_FAN_SPEED FAN=fan0 SPEED=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE={1 if s_passed else 0}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_result VALUE={result if 'chamber_preheat' in printer else 1}
        RESPOND PREFIX="M191:" MSG="wait for {minimum}C finished, read by {'the nozzle' if 'chamber_preheat' in printer else 'the rear sensor'}"
    {% endif %}


[gcode_macro _CHAMBER_AUTOSTART]
# Called from START_PRINT. Everything lives here rather than in Macro.cfg so the
# edit to Sovol's file is a single line -- Macro.cfg is overwritten by
# factory_resets.sh, so the less of this that lives there, the better.
#
# If the slicer asked for a chamber temperature this print, honour it. Otherwise
# infer one from the bed temperature, which the slicer always sets.
#
# WHY THE REQUEST FLAG. ch_target is persisted, and nothing zeroes it at the end
# of a print -- the loop's auto-off stops the fan but deliberately leaves the
# target alone. So "ch_target > 0" does not mean "the slicer asked", it means
# "somebody asked, possibly three prints ago". A PETG target of 45 would then
# silently carry into the next PLA print and the fan would never run. M141 sets
# `requested` in RAM and this consumes it, so an override lasts exactly one print.
#
# NO ";" "#" OR "*" IN A RESPOND MESSAGE. Klipper's extended-command regex ends
# the argument list at any of them (gcode.py extended_r, args group is
# "[^#*;]*?"), so the closing quote is never seen and shlex raises -- the whole
# command dies with "Malformed command". A semicolon in this very macro's
# "no bed target; Sovol default" is how that was found.
#
# INFERENCE. This controller only cools, so the target is really a chamber
# ceiling. Boundaries sit between Sovol's own bed temperatures: PLA/Silk 65,
# PETG and TPU 85, ABS 100, PC 110.
gcode:
    {% set st  = printer["gcode_macro _CH_STATE"] %}
    {% set cur = printer.save_variables.variables.ch_target|default(0.0)|float %}
    {% set bed = printer.heater_bed.target|default(0.0)|float %}
    # Computed here, not inside the branch below: Jinja's {% set %} does not
    # escape the if-block it is written in, so a flag assigned there is gone by
    # the time the _CHAMBER_ON at the end of this macro would test it.
    {% set declined = 1 if (st.requested|int == 1
                            and st.control_declined|int == 1) else 0 %}

    # A cooldown ramp from the previous job may still be walking the bed and
    # chamber DOWN. It has to die before this print commands anything up, and
    # this runs from Sovol's own START_PRINT, so every profile reaches it --
    # including stock ones that never call COOLDOWN_ARM.
    {% if 'gcode_macro _COOL_STATE' in printer %}
        COOLDOWN_ABORT
    {% endif %}

    # These execute in order: finish the previous print from volatile evidence,
    # then choose this print's bounded trial before _CHAMBER_ON starts the loop.
    _CH_ADAPT_FINISH
    _CH_ADAPT_BEGIN
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0

    {% if declined == 1 %}
        # Orca Target 0 with activation on. The profile asked for no thermal
        # chamber control and gets none -- no inference, no loop.
        RESPOND PREFIX="ch" MSG="START_PRINT: chamber control off, as requested by the slicer"
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=0
        _CHAMBER_OFF
    {% elif st.requested == 1 and cur > 0 %}
        RESPOND PREFIX="ch" MSG="START_PRINT: chamber target {cur}C, as requested by the slicer"
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=0
    {% else %}
        {% if bed <= 0 %}
            {% set t = 32.0 %}
            {% set why = "no bed target, Sovol default" %}
        {% elif bed <= 70 %}
            {% set t = 32.0 %}
            {% set why = "bed " ~ bed|int ~ "C, PLA-class" %}
        {% elif bed <= 90 %}
            {% set t = 45.0 %}
            {% set why = "bed " ~ bed|int ~ "C, PETG/TPU-class" %}
        {% else %}
            {% set t = 55.0 %}
            {% set why = "bed " ~ bed|int ~ "C, ABS/PC-class" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=ch_target VALUE={t}
        RESPOND PREFIX="ch" MSG="START_PRINT: chamber ceiling {t}C inferred ({why})"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=6
    {% if st.proxy_valid|int != 1 and st.observer_source|int != 2 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
    {% endif %}
    {% if declined == 0 %}
        _CH_Z_BEGIN
        _CHAMBER_ON
    {% endif %}

# END SOURCE: klipper/config/chamber_fan.cfg

# Curtain fan electrical settings, from the 2026-08-17 characterization
# campaign: 30 ms PWM period so a low duty is actually honoured, a 100 ms kick
# so it starts from rest, and the PE13 tachometer so a stall is visible instead
# of assumed. Overrides the stock [fan_generic fan2] rather than adding a
# section -- same pin PE11 on both firmwares, so one file serves both. Needed
# by cooldown.cfg's blended throttle, which drives fan2 as the second stage.

# BEGIN SOURCE: klipper/config/curtain_fan.cfg
# Rear-curtain / auxiliary fan electrical configuration selected by the
# 2026-08-17 two-printer characterization campaign. This overrides the stock
# [fan_generic fan2] section when included after printer.cfg's stock section.
# See notes/runbook-curtain-fan.md.

[fan_generic fan2]
pin: PE11
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.030
kick_start_time: 0.100
# Published floor. A slicer M106 P2 below this turns the fan off instead of
# leaving it powered and stalled. Measured 2026-08-17: 14% held five minutes
# at 30 ms on both units, 15% at 10-15 ms; 0.15 is one point above the bench
# floor, and in-service floors run higher than bench ones. cooldown.cfg
# never asks for less than its curtain_min of 0.20.
off_below: 0.15
tachometer_pin: ^PE13
tachometer_ppr: 2
tachometer_poll_interval: 0.0012

# END SOURCE: klipper/config/curtain_fan.cfg

# Hotend fan tach: two pulses per revolution. Sovol's stock section says
# tachometer_ppr: 1, so the UI showed twice the real speed. Display only; the
# stock 1.3 ms poll counts to ~11,500 rpm at 2, above the fan's ~8,400.
[heater_fan hotend_fan]
tachometer_ppr: 2

# Overrides of Sovol's own macros. MUST follow Macro.cfg, which printer.cfg
# includes far above this line.

# BEGIN SOURCE: klipper/config/nozzle_brush.cfg
# CLEAN_NOZZLE — hybrid: park-and-heat, heater off, graded scrub, probe-temp floor
#
# Include AFTER Macro.cfg. Includes apply linearly and duplicate sections merge
# with the later one winning, so this overrides Sovol's CLEAN_NOZZLE without
# editing their file, which factory_resets.sh overwrites.
#
# SEQUENCE
#
#   1. park OVER THE PAD, then wait for the cleaning temperature
#      -- SET_CLEAN_TEMP MATERIAL= selects it and starts heating earlier in
#         the released slicer sequence; CLEAN_NOZZLE TEMP= can override it
#      -- parking controls ooze during this wait, not the earlier heat-up
#   2. retract at cleaning temperature; pad depth uses the taught pad_top
#      -- no initial datum tap
#      <- the ONLY point in the whole routine where E is legal
#   3. heater OFF
#   4. scrub while it falls: rotating lanes, and three gradients running
#      together -- fast->slow, shallow->deep, overtravel->none
#   5. target probe_temp partway through, so it is a floor rather than a hope
#   6. hold OVER THE PAD for the probe_temp wait, not hovering at the tap point
#   7. move to the final probe point, run the configured probe, and lift
#      -- START_PRINT subsequently performs Z calibration, Z homing and mesh
#   8. caller reheats to print temperature and calls PURGE_LINE, which returns
#      the recorded debt at the purge position; _BRUSH_PRIME is a retired stub
#
# WHY THE RETRACT IS WHERE IT IS -- THE ONE REAL CONSTRAINT
#
# Zero2 has min_extrude_temp: 150, and the brushing window runs from the cleaning
# temperature down to probe_temp.
# Klipper refuses any E move below that limit, so a retract or prime ANYWHERE in
# the heater-off window raises "Extrude below minimum temp" and aborts the macro
# WITH THE NOZZLE BURIED IN THE BRUSH. That is a worse failure than not
# retracting at all.
#
# So the retract happens at clean_temp, above the limit with margin, before the
# heater goes off; and the prime does not happen here at all. It happens after
# the caller reaches print temperature, via PURGE_LINE, which returns the
# recorded scrub/end-retract debt. Nothing extrudes between those two points.
#
# The cleaning temperature must therefore clear min_extrude_temp with margin: at
# exactly the limit a PID undershoot of a tenth of a degree is the difference
# between a retract and an aborted macro. The macro refuses to retract below it
# rather than aborting mid-scrub.
#
# TEMPERATURE POLICY
#
# Four published positions existed and Sovol's was the worst of them: heat to
# 200, wipe, then wait to cool to 130, fully serial. This takes coreystup's
# heater-off (the PID stops driving, so it falls as fast as the hardware allows),
# ss1gohan13's never-go-hot (a material-appropriate temperature, not a flat 200),
# the speed/depth gradient from 0dysseusRex's brass-wire-brush macro, and the
# scrub-during-the-ramp idea
# from cardoc/Liberty4Ever/vladv -- the whole scrub happens inside the cooldown
# that used to be dead time. See notes/kb/nozzle-wiping.md for the comparison.

# MATERIAL-AWARE CLEANING TEMPERATURE. Moved here from the slicer's start
# G-code on 2026-09-05, and the move is about failure modes rather than tidiness.
#
# It used to be a generated if/elsif ladder in machine_start_gcode that ended in
#
#     SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=clean_temp VALUE=170
#
# which is the ONE line in the whole published profile that turns a missing macro
# pack into an aborted job. SET_GCODE_VARIABLE is a mux command keyed on MACRO
# (gcode_macro.py:139), so with no _BRUSH defined Klipper raises "The value
# '_BRUSH' is not valid for MACRO" and the print stops. Every other command we
# emit is an ordinary macro call, and an unknown one only warns --
# gcode.py:305 is respond_info, not an exception.
#
# So the slicer now NAMES THE MATERIAL and the table lives here, which is the
# same shape COOLDOWN_ARM already uses and for the same reason: one table serves
# every slicer, the spool can name the material when no slicer does, and a
# profile that meets a printer without the pack degrades to a warning.
#
# The curve is unchanged and still PROPOSED, not measured: 20 + 2/3*(first layer
# - 20) rounded up to 5, anchored on PC 290 -> 200. Fallback 200 is Sovol's own
# flat cleaning temperature -- vendor behaviour when we know nothing. Keys are
# matched exactly after normalising, then by prefix over `order`, longest first,
# so "PLA+" and "pla-silk" land on pla and petg is never swallowed by pet.
[gcode_macro _BRUSH_CLEAN_TEMPS]
description: Material -> nozzle cleaning temperature. Data, not a command.
variable_table: {
        "pla": 170,
        "tpu": 175,
        "petg": 185,
        "abs": 195,
        "asa": 195,
        "pc": 200
    }
variable_order: ["petg", "abs", "asa", "pla", "tpu", "pc"]
variable_default: 200
gcode:

[gcode_macro SET_CLEAN_TEMP]
description: Name the material; set the brush cleaning temperature and start heating.
gcode:
    {% set t = printer["gcode_macro _BRUSH_CLEAN_TEMPS"] %}
    {% set lowered = params.MATERIAL|default("")|lower %}
    # Same normalisation as COOLDOWN_ARM, deliberately: two tables keyed the same
    # way so one spool name cannot resolve differently in each.
    {% set clean = lowered|replace("+", "")|replace("-", "")|replace(" ", "")|replace("_", "")|replace("/", "") %}
    {% set exact = t.table.get(clean) %}
    {% set ns = namespace(temp=exact, key=clean if exact is not none else "") %}
    {% if ns.temp is none %}
        {% for k in t.order %}
            {% if ns.temp is none and clean.startswith(k) %}
                {% set ns.temp = t.table.get(k) %}
                {% set ns.key = k %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% set temp = ns.temp|default(t.default)|float if ns.temp is not none else t.default|float %}
    # TEMP= overrides the table outright, for a commissioning run.
    {% set temp = params.TEMP|default(temp)|float %}
    SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=clean_temp VALUE={temp}
    # The head start. This is why the call sits early in the start G-code rather
    # than inside CLEAN_NOZZLE: the nozzle wants to be near temperature by the
    # time the brush sequence reaches it.
    #
    # BUT NOT ALL THE WAY WHILE THE BED IS STILL MOVING (operator, 2026-10-13).
    # The slicer's M190 comes next, and a bed more than 3 C off its target --
    # coming down from a chamber-preheat boost, or still heating -- holds the
    # nozzle there hot. On Zero2's 2026-10-13 frontcase that was 1.8 min at
    # 195 C over the park point while the plate fell from 120 C: ooze before
    # the brush. Until the bed is close the nozzle goes to probe_temp, where it
    # does not flow, and CLEAN_NOZZLE's own M109 takes it the rest of the way,
    # about 15 s.
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set bed_off = printer.heater_bed.target|float > 0
                     and (printer.heater_bed.temperature|float - printer.heater_bed.target|float)|abs > 3.0 %}
    {% set now = [temp, b.probe_temp|float]|min if bed_off else temp %}
    M104 S{now|round(0)|int}
    {% set why = ("explicit TEMP=" if params.TEMP is defined
                  else (ns.key if ns.key else "unknown material, stock fallback")) %}
    {% set hold = (", nozzle held at " ~ now|round(0)|int ~ "C until the bed is at its target") if bed_off else "" %}
    RESPOND PREFIX="brush" MSG="silicone wipe at {temp|round(0)|int}C ({why}){hold}"

# INFERRING THE WIPE TEMPERATURE WHEN NO SLICER SAID.
#
# Relocating the table into the pack removed the only hard dependency in the
# published profile, but it also removed the slicer's ability to size the
# opening temperature spike on a job it did not slice. This puts that back
# without the slicer, in the order of how much each source actually knows:
#
#   1. the slicer, via SET_CLEAN_TEMP MATERIAL=  -- a claim about THIS job
#   2. the SPOOL, via spool_guard's latched material -- a claim about what is
#      loaded, which is what a fresh spool knows and a fresh printer does not
#   3. the LAST PRINT's nozzle temperature, persisted by END_PRINT -- a claim
#      about what this machine was doing recently
#   4. nothing, and CLEAN_NOZZLE falls back to _BRUSH.retract_temp
#
# So the genuinely blind case shrinks to one job: a printer that has never run
# this pack AND has no spool registered AND was not sliced by our profile.
#
# The curve at step 3 is the same one behind the table -- 20 + 2/3*(T - 20),
# rounded up to 5 -- applied to the printing temperature rather than the first
# layer temperature, which is where the table was anchored. Those differ by a
# few degrees on most materials, and the result is a floor to clean at, not a
# setpoint to hold, so the approximation is the cheap part. Being 5 C cool costs
# a slower wipe; the table remains authoritative whenever the material is known.
[gcode_macro _BRUSH_INFER_CLEAN_TEMP]
description: Set the wipe temperature from the spool, else from the last print.
gcode:
    {% set spool = printer.spool_guard.material
                   if 'spool_guard' in printer and printer.spool_guard.material
                   else "" %}
    {% set last = printer.save_variables.variables.last_nozzle_temp|default(0)|float %}
    {% if spool %}
        # Reuses SET_CLEAN_TEMP so the table is consulted in exactly one place.
        SET_CLEAN_TEMP MATERIAL={spool}
    {% elif last > 0 %}
        {% set curve = (((20.0 + (2.0/3.0) * (last - 20.0)) / 5.0)|round(0, 'ceil')) * 5 %}
        SET_CLEAN_TEMP TEMP={curve}
        RESPOND PREFIX="brush" MSG="no material named - inferred {curve|round(0)|int}C from the last print's {last|round(0)|int}C nozzle"
    {% else %}
        RESPOND PREFIX="brush" MSG="no material, no spool and no print history - wiping at the stock fallback"
    {% endif %}

[gcode_macro _BRUSH]
description: Geometry and behaviour for CLEAN_NOZZLE. Edit here, not in the macro.
# --- brush footprint: BOUNDS PLUS MARGIN -----------------------------------
# ss1gohan13's _FELT_WIPE idea. State where the PAD IS, once, and let the macro
# derive the usable area by insetting the margin. Two things fall out that
# hardcoded stroke coordinates do not give you:
#   * the macro uses all of the pad it is told about, automatically, so widening
#     coverage is a measurement rather than a rewrite;
#   * it cannot walk off the edge, because every stroke is derived from the
#     bounds rather than typed next to them.
#
# TAUGHT ON ZERO2, 2026-08-17, by jogging the nozzle tip to each corner
# (_BRUSH_CORNER / _BRUSH_TEACH). Not calipers, not the vendor listing.
#
#   corner 1 front-left   X -10.0  Y  6.5  Z 0.2
#   corner 2 front-right  X  -7.3  Y  5.5  Z 0.2
#   corner 3 back-right   X  -7.3  Y 36.0  Z 0.3   <- hardest to see, softest number
#   corner 4 back-left    X -10.0  Y 39.0  Z 0.2
#
# X -10.0 IS THE MACHINE, NOT THE PAD. position_min, position_endstop and the
# jog limit all agree at -10, so the carriage cannot go further left and the
# silicone continues past where the nozzle can reach. The usable width is
# therefore bounded by X travel, and the vendor's 4.8 mm is an upper bound we
# will never see. 2.7 mm reachable against the 1.0 mm stock uses.
#
# Y 5.5..39.0 is 33.5 mm against the vendor's listed 32.8, which corroborates the
# listing. The left edge measures 32.5 mm (corner 4 - corner 1) and the right
# edge 30.5 mm (corner 3 - corner 2); the 2 mm disagreement is corner 3, which
# was reported hard to judge, so trust the left edge.
variable_pad_x_min: -10.0
variable_pad_x_max: -7.3
variable_pad_y_min: 5.5
variable_pad_y_max: 39.0
variable_margin: 0.4           # inset from the pad edges
# The left edge needs NO margin: X -10 is the endstop, so the machine physically
# cannot overshoot it, and the silicone continues past it anyway. Spending 0.4 mm
# of a 2.7 mm band defending against an impossible failure is the difference
# between 1.9 and 2.3 mm of usable brush.
variable_margin_x_min: 0.0
variable_lanes: 5
# NET depth below where RUN_PROBE_PRESSURE parks the nozzle. NEGATIVE IS DEEPER.
#
# THERE IS ONLY ONE Z FRAME, which is worth stating because it looks like two.
# RUN_PROBE_PRESSURE calls run_probe and DISCARDS the result -- no set_position,
# no datum reset (probe_pressure.py:83-86). run_probe retracts only BETWEEN
# samples, so after the last one the nozzle is left sitting at the tap target's
# trigger height. The tap is a positioning move, not a second datum. Everything
# is the homed frame throughout, where Z0 is the nozzle at the bed (eddy
# z_offset 3.5, and G28 does leave Z reading 3.5).
#
# CORRECTED 2026-08-17. These were -2.4 and -1.8 because stock's G-code contains
# "G1 Z-2.4" and that was read as a depth. It is a RELATIVE MOVE following a
# "G1 Z2" lift, so stock NET engagement is -0.4. This macro was set to run 2.0mm
# deeper than stock while its comments claimed to match it, and stage 4 would
# have driven that into the brush at first contact.
#
# -0.4 is the stock-equivalent and the safe starting point. Liberty4Ever reports
# half the nozzle buried already at stock depth, and the taught pad top sits at
# Z +0.2 in the homed frame.
#
# GOING DEEPER IS THE LEVER for brushing the nozzle cone rather than just the
# tip, which is the stated goal. stepper_z position_min is -5, so there is room.
# Increase deliberately in small steps AFTER stage 4 passes at stock depth, not
# by inheriting a number from a misread.
# ABSOLUTE Z. Depth is referenced to the taught pad top, NOT to a tap.
# A tap measures whatever is on the nozzle -- which is the point of the datum
# tap, and exactly why it must not set the scrub depth: 1.1 mm of crud made the
# tap read 1.1 mm high and the scrub ran 1.1 mm shallow, so the deposit disabled
# the routine meant to remove it. Absolute Z is immune to that. Its own exposure
# is Z-homing drift (the plate at bed centre), which is one variable instead of
# two and is what _BRUSH_TEACH re-measures.
variable_immersion: 1.2        # deepest pass, mm BELOW pad_top. 2 mm peels the pad
variable_air_rise: 1.5         # highest pass, mm ABOVE pad_top -- the crud-strike band
# Park-and-heat height, mm ABOVE pad_top -- same frame as air_rise, NOT a depth.
# 0.0 sits the tip at the taught bristle top. Until 2026-09-08 stage D1 heated at
# park_z (5.0), nearly 5 mm clear of the bristles, so the heat-up ooze D1 exists
# to capture never touched the pad. Whether this hovers or presses lightly is
# inside Z-homing drift and is deliberately not resolved: either is fine, and
# both beat heating in mid-air.
variable_heat_air: 0.0
# Runtime: wall-clock seconds into the job when CLEAN_NOZZLE began, so
# _BRUSH_MARK_DONE can subtract and report how long the wipe actually took.
# That number is what chamber_preheat's wipe_lead_seconds wants, and guessing
# it would defeat the point of scheduling against it.
variable_t_start: -1.0
variable_air_wipes: 1          # passes in that band
# --- depth by immersion, measured on Zero2 2026-08-17 ---------------------
# Both numbers below are measurements, not guesses, and together they turn depth
# into arithmetic:
#   pad_top   taught by jogging the nozzle tip to the pad corners (stage 3)
#   tap_park  where RUN_PROBE_PRESSURE leaves the nozzle, derived in stage 4
#             from the absolute Z reached while scrubbing at a known z_deep
#
#   immersion = pad_top - (tap_park + z_deep)
#   so  z_deep = pad_top - immersion - tap_park
#
# Pass IMMERSION=<mm> to CLEAN_NOZZLE and it computes z_deep and z_shallow from
# these. Without it the configured z_deep/z_shallow above are used unchanged.
# Re-measure both if the nozzle is changed: a different nozzle length moves the
# tap park, and a different brush moves the pad top.
variable_pad_top: 0.2
variable_tap_park: 0.47        # LEGACY: no longer sets depth. Kept for _BRUSH_TEACH_REPORT

# CEILING FOUND BY TEST, 2026-08-17: at 2.0 mm immersion the pad STARTS LIFTING
# OFF ITS MOUNT. That is the binding constraint, and it is adhesion rather than
# nozzle geometry or machine travel -- position_min leaves 5 mm and an MK8 cone
# is 3.5-4 mm, so neither runs out first. Usable window is roughly 0.13 mm
# (stock-equivalent) to under 2 mm. The shipped default is 1.2 mm, tested.
# Another machine will have its own ceiling; this number does not transfer.
variable_lift: 2.0
# --- motion ----------------------------------------------------------------
variable_wipes: 11             # passes in the pad itself, pad_top down to immersion
variable_cross: 3              # cross-grain sweeps along X
variable_cross_every: 2        # interleave a cross after every N full passes (0 = all at the end)
variable_feed: 1800            # legacy flat feed; used when feed_start/end are 0
variable_feed_cross: 900
# Speed gradient, after the brass-brush strategy: knock debris off fast, then
# finish slow while the nozzle is coldest and the bristles bite hardest.
# Geometric, so the ratio between consecutive passes is constant.
variable_feed_start: 3000      # first pass -- fast and shallow
variable_feed_end: 900         # last pass -- slow and deep (15 mm/s)
# Nozzle geometry. y_overtravel is in MULTIPLES of nozzle_d: run the tip clear
# of the pad end so the bristles close behind it and wipe the trailing face.
# It FADES to zero as the passes get deeper, because the mount lip beyond the
# pad ends has never been measured. Raising this needs a teach stage first.
variable_nozzle_d: 4.0         # MK8 cone diameter at the wiping height
variable_y_overtravel: 1.0     # 1.0 = one full nozzle_d (4.0 mm) past each end
variable_x_over: 0.0           # extra +X past pad_x_max. POSTPONED (D3) -- the bed is right there
# Hard axis limits, mirrored from printer.cfg so overtravel can be clamped here
# rather than trusting Klipper to error out mid-scrub with the nozzle engaged.
variable_axis_y_min: -2.0      # stepper_y position_min
variable_axis_y_max: 152.5     # stepper_y position_max
variable_axis_x_max: 155.0     # stepper_x position_max (the BED is the real limit)
# --- filament --------------------------------------------------------------
variable_retract_mm: 3.0       # 0 disables this scrub retract and its debt
variable_retract_f: 2700
variable_owed_max: 10.0        # sanity clamp on the stored end-of-print debt
variable_retracted: 0.0        # runtime: scrub debt for PURGE_LINE to return
# --- temperature -----------------------------------------------------------
# Cleaning temperature. The slicer calls SET_CLEAN_TEMP MATERIAL=<name>.
# CLEAN_NOZZLE TEMP=<n> is a direct-call override. With no selection we fall
# back to Sovol's stock cleaning temperature rather than to our old fixed 155,
# because 200 is the value every stock profile has always used and is safe for
# every material the machine handles.
#   The retract happens AT this temperature (it must clear min_extrude_temp).
#   The scrub then happens during the coast down to probe_temp.
variable_retract_temp: 200     # last-resort fallback. Stock cleaning temperature
variable_clean_temp: 0         # runtime: set by the slicer's start G-code before
                               # START_PRINT, which calls CLEAN_NOZZLE without
                               # arguments so TEMP= cannot reach it. 0 = unset.
variable_min_extrude_temp: 150 # mirrored from [extruder]; retract is refused below it
variable_probe_temp: 150       # floor during the scrub, and the tap temperature
                               # 150 (was 130) per D4: 0dysseusRex probes his load cell
                               # at 150. Revert to 130 if tap spread degrades.
variable_off_fraction: 0.6     # share of the scrub done with the heater fully off
# --- probe -----------------------------------------------------------------
# 1.3.7/1.3.8: RUN_PROBE_PRESSURE. 1.4.0+: RUN_PROBE_VIR_CONTACT, an eddy
# measurement whose sensor sits -19.8 from the nozzle and leaves the plate before
# the nozzle does -- so on 1.4.x use tap_x 30, tap_y 30 and do NOT move it left.
variable_probe: "RUN_PROBE_PRESSURE"
# The datum tap is taken on a DIRTY nozzle on purpose -- it reports where the
# crud surface is, which is the surface the first pass has to clear. Precision
# against an unknown blob is meaningless, and repeated samples just press the
# debris we are about to wipe off. One sample.
#   NOTE: with SAMPLES=1 Klipper's run_probe skips the inter-sample lift (the
#   retract is guarded by "if len(positions) < sample_count"), so the nozzle is
#   left resting on the target until the next move. That is fine here and is
#   why the retract and lift follow immediately.
#   Blank this string on 1.4.x if RUN_PROBE_VIR_CONTACT rejects SAMPLES.
variable_probe_datum_args: "SAMPLES=1"
variable_tap_x: -1.0
# Vergo's fix (forum t/8051): never probe where something was previously
# deposited. The datum tap runs on a DIRTY nozzle and can leave crud on the tap
# target; the clean tap must not then read it back. So they sit 2 mm apart,
# straddling the nominal point rather than both landing on it.
#   NOTE: the target's extent has never been measured. These are +/-1 mm from a
#   point known to work. Widening them needs a teach stage first.
variable_tap_dirty_dx: -1.0    # datum tap, 1 mm left of nominal
variable_tap_clean_dx: 1.0     # final tap, 1 mm right of nominal
variable_tap_y: 20.0
# Sanity window for where the tap may leave the nozzle. KEPT even though the
# probe now medians 7 samples, because the two catch different things: the median
# and tolerance handle samples that DISAGREE, and this handles samples that all
# AGREE on a wrong value -- a stuck or mis-tared sensor, which no amount of
# repetition detects. Five good taps on Zero2
# fell between 0.374 and 0.479; a sixth returned 20.2825 and the macro believed
# it, so the scrub ran ~19 mm above the brush. A tap that reads HIGH wastes a
# clean; one that reads LOW drives the nozzle into the pad or its mount, so both
# ends are checked. Sovol's own z_offset_calibration retries until two taps agree
# within 0.03 mm, which is the same admission that a single tap is not
# trustworthy -- stock CLEAN_NOZZLE simply never noticed because its 0.4 mm
# engagement makes a bad tap harmless.
# Plausibility window for the datum tap. Wide ON PURPOSE: it spans the bed's
# THERMAL STATE, not measurement noise. Z homes by probing the plate at centre
# (safe_z_home 96,76.2), so Z0 is the plate surface, while the tap target is a
# separate bed-mounted object near the front-left. The two move apart as the bed
# heats. Measured on Zero2:
#     cold, 26 C bed   tap = 1.59 .. 1.65   (repeatability 0.002 .. 0.024)
#     hot, in service  tap = 0.41 .. 0.47   (commissioning, 7-sample medians)
# ~1.2 mm of legitimate travel. The window must clear both ends or a manual
# cold run aborts; it still catches the failure it was written for, a tap that
# returned 20.28 and sent the macro scrubbing 19 mm of air.
variable_tap_min: -0.5
variable_tap_max: 2.5
# --- dry run ---------------------------------------------------------------
# CLEAN_NOZZLE DRY=1 rehearses the pattern in free air: same XY, same feeds, same
# Z deltas, lifted to dry_z. No heater, no probe, no extrusion. It runs the real
# code path rather than a copy, which is the only version worth trusting.
variable_dry_z: 50.0
variable_teach_z: 5.0          # height _BRUSH_CORNER parks at while you eyeball it
variable_park_z: 5.0           # safe absolute Z for hovering over the pad (D1/D2)
gcode:


[gcode_macro CLEAN_NOZZLE]
description: Scrub the nozzle during a heater-off cooldown, ending at probe temp.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set lanes = [b.lanes, 1]|max %}
    {% set lane0 = printer.save_variables.variables.nb_lane|default(0)|int %}
    {% set off_wipes = (b.wipes * b.off_fraction)|round(0)|int %}
    # Commissioning parameters. Each stage adds exactly one new risk, so they
    # compose rather than forking the code -- the thing being rehearsed is always
    # the real macro. See notes/runbook-brush-commissioning.md.
    #   DRY=1      no contact at all; the whole pattern in free air at DRY_Z
    #   DRY_Z=n    where that air pass happens
    #   HEAT=0     no heater commands. IMPLIES no extrusion: below
    #              min_extrude_temp Klipper refuses E and would abort the macro
    #              with the nozzle in the brush
    #   SPEED=n    percent of normal feed, for watching real contact slowly
    {% set dry = params.DRY|default(0)|int %}
    {% set dz  = params.DRY_Z|default(b.dry_z)|float %}
    {% set heat = params.HEAT|default(1)|int %}
    {% set sc = [params.SPEED|default(100)|float, 1.0]|max / 100.0 %}
    # IMMERSION=<mm> below the taught pad top. Overrides the configured value.
    {% set imm = params.IMMERSION|default(b.immersion)|float %}
    # Cleaning temperature is the SLICER's to choose, per material. Absent a
    # TEMP=, fall back to the value the slicer stored, then to Sovol's stock
    # cleaning temperature -- an unparameterised caller gets vendor behaviour.
    {% set slicer_temp = b.clean_temp|float %}
    {% set clean_temp = params.TEMP|default(slicer_temp if slicer_temp > 0 else b.retract_temp)|float %}
    {% if heat and b.retract_mm > 0 and clean_temp < b.min_extrude_temp %}
        { action_raise_error("CLEAN_NOZZLE: TEMP=%.0f is below min_extrude_temp %.0f, "
          "so the retract would abort the macro with the nozzle in the brush. "
          "Raise TEMP or set _BRUSH retract_mm to 0."|format(clean_temp, b.min_extrude_temp)) }
    {% endif %}
    {% set z_top = b.pad_top + b.air_rise %}
    {% set z_bot = b.pad_top - imm %}
    {% if z_bot < -4.5 %}
        { action_raise_error("CLEAN_NOZZLE: immersion %.2f puts the nozzle at Z %.2f, "
          "past stepper_z position_min -5"|format(imm, z_bot)) }
    {% endif %}
    {% set feed = (b.feed * sc)|round(0)|int %}
    {% set feed_cross = (b.feed_cross * sc)|round(0)|int %}
    {% set feed_z = (600 * sc)|round(0)|int %}
    {% set wet_e = (not dry) and heat %}

    # Usable area derived from the pad bounds, inset by the margin.
    {% set x_min = b.pad_x_min + b.margin_x_min %}
    {% set x_max = [b.pad_x_max - b.margin + b.x_over, b.axis_x_max]|min %}
    {% set y_min = b.pad_y_min + b.margin %}
    {% set y_max = b.pad_y_max - b.margin %}
    {% if x_max <= x_min or y_max <= y_min %}
        { action_raise_error("CLEAN_NOZZLE: margin %.2f leaves no usable pad area "
          "between the bounds. Check _BRUSH pad_x/pad_y and margin."|format(b.margin)) }
    {% endif %}

    # Restores G90/G91 and M82/M83 by mechanism rather than by remembering to,
    # so an error path cannot leave the machine in relative mode for whatever
    # runs next. See AGENTS.md, Motion mode in macros.
    # Stamp the start. Rendered here, which IS the start -- Klipper renders a
    # macro completely before executing any of it, so a second read at the
    # bottom of this same macro would return this same value, not the later
    # one. That is why the elapsed time is computed by a SEPARATE macro, which
    # renders when it is called.
    SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=t_start VALUE={printer.print_stats.total_duration}
    SAVE_GCODE_STATE NAME=clean_nozzle
    BED_MESH_CLEAR
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

    {% if not heat and not dry %}
        RESPOND PREFIX="brush" MSG="COLD CONTACT RUN at {(sc*100)|round(0)|int}% speed, immersion {imm|round(2)}mm, bottom Z{z_bot|round(2)}"
    {% endif %}
    {% if dry %}
        RESPOND PREFIX="brush" MSG="DRY RUN at Z{dz} - no heater, no probe, no extrusion"
        G90
        G1 Z{dz + b.lift} F1200
    {% else %}
        # 1. D1: park over the pad BEFORE the blocking temperature wait, so
        #    remaining heat-up ooze lands in the bristles. SET_CLEAN_TEMP may
        #    already have started heating in the slicer's earlier preamble.
        #    Park-and-heat: HandyDoodads' idea (forum, 2025-12-17).
        #    Travel HIGH, then descend -- the descent is the last move, so the
        #    low height is only ever held over the pad and never crossed to.
        G90
        G1 Z{b.park_z} F1200
        G1 X{(x_min + x_max) / 2} Y{(y_min + y_max) / 2} F9000
        G1 Z{"%.3f"|format(b.pad_top + b.heat_air)} F1200
        {% if heat %}M109 S{clean_temp}{% endif %}

        # 2. TAPLESS. No datum tap: depth comes from the taught pad_top in
        #    absolute Z, so nothing about this routine depends on what is
        #    currently stuck to the nozzle. The only legal extrusion follows.
        # Retract for the scrub. UNCONDITIONAL and always the same amount --
        # the cross-job debt deliberately does NOT modulate this. Whatever the
        # stored state says, the nozzle arrives at the brush retracted by
        # exactly retract_mm from wherever it started, so brush behaviour is
        # identical every print and does not depend on bookkeeping that a manual
        # load, a filament change or a power cut can invalidate.
        #
        # The debt is settled later instead, by PURGE_LINE, at PRINTING
        # temperature at the purge position -- which is the one place
        # in the job where pushing filament out of the nozzle is the intent
        # rather than a mess. Any error in the stored value therefore lands in
        # the purge line, which tolerates it, instead of at the brush.
        {% if b.retract_mm > 0 and wet_e %}
            M83
            G1 E-{b.retract_mm} F{b.retract_f}
            SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=retracted VALUE={b.retract_mm}
        {% endif %}

        # 3. Heater off. Not a lower target -- the PID stops driving entirely, so
        #    the nozzle falls as fast as the hardware allows and no residual power
        #    keeps it oozing onto the brush it is being cleaned against.
        {% if heat %}SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0{% endif %}

        # Traverse clear, then descend to the first (highest) pass.
        G90
        G1 Z{b.park_z} F1200
    {% endif %}
    G1 X{x_min} Y{y_min} F9000
    # Absolute Z throughout the pattern. The pad top is a taught ABSOLUTE
    # height, so referencing depth to it needs no relative bookkeeping and no
    # datum to drift. Enters ABOVE the pad and works down.
    G90
    G1 Z{"%.3f"|format(z_top if not dry else dz)} F{feed_z}

    # 4-5. Full-length passes, in ABSOLUTE Z, as two ramps.
    #
    #   CRUD-STRIKE BAND -- air_wipes passes from pad_top + air_rise down toward
    #   pad_top, coarse steps. On a clean nozzle these brush air and cost only
    #   time, of which the heater-off coast has plenty. On a nozzle carrying a
    #   solidified deposit they strike it EARLY and at the top of the speed
    #   ramp, where contact is glancing rather than a full-depth plunge into
    #   something that should not be there. This is the band the old tap-relative
    #   scheme could never reach: crud lifted the datum, so the pattern moved up
    #   with it and stroked the air above the deposit instead of through it.
    #
    #   PAD BAND -- wipes passes from just under pad_top down to pad_top minus
    #   the immersion, fine steps. This is the real clean.
    #
    # Speed, overtravel and lane rotation run across BOTH bands as one sequence.
    {% set n_air = [b.air_wipes, 0]|max %}
    {% set n_pad = [b.wipes, 1]|max %}
    {% set n = n_air + n_pad %}
    {% set graded = b.feed_start > 0 and b.feed_end > 0 %}
    {% set fr = (b.feed_end / b.feed_start) ** (1.0 / (n - 1)) if graded and n > 1 else 1.0 %}
    {% for i in range(n) %}
        {% if i == off_wipes and not dry and heat %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={b.probe_temp}
        {% endif %}
        {% set t = (i / (n - 1)) if n > 1 else 1.0 %}
        {% set lane = (lane0 + i) % lanes %}
        {% set x = x_min + (x_max - x_min) * lane / (lanes - 1 if lanes > 1 else 1) %}
        # Coarse above the pad, fine within it. Both descend.
        {% if i < n_air %}
            {% set z = b.pad_top + b.air_rise * (n_air - i) / n_air %}
        {% else %}
            {% set z = b.pad_top - imm * (i - n_air + 1) / n_pad %}
        {% endif %}
        {% set f = ((b.feed_start * (fr ** i)) if graded else b.feed) %}
        {% set f = ([f * sc, 30]|max)|round(0)|int %}
        # Overtravel fades with depth: the tip clears the pad end while it is
        # still high, and stays inside the taught bounds once it is deep.
        {% set ot = b.nozzle_d * b.y_overtravel * (1.0 - t) %}
        {% set y_hi = [y_max + ot, b.axis_y_max]|min %}
        {% set y_lo = [y_min - ot, b.axis_y_min]|max %}
        G1 Z{"%.3f"|format(z if not dry else dz)} F{feed_z}
        G1 X{"%.3f"|format(x)} Y{"%.3f"|format(y_hi if i % 2 == 0 else y_lo)} F{f}
        # Interleaved cross-grain. Every pass above runs along the bristles and
        # flattens them that way; these attack from the side and are the only
        # motion that cleans the nozzle's X faces.
        {% if b.cross_every > 0 and (i + 1) % b.cross_every == 0 and (i + 1) < n %}
            {% set yc = y_min + (y_max - y_min) * (((i // b.cross_every) % 3) + 0.5) / 3 %}
            G1 Y{"%.3f"|format(yc)} F{f}
            G1 X{"%.3f"|format(x_max)} F{f}
            G1 X{"%.3f"|format(x_min)} F{f}
            G1 X{"%.3f"|format(x)} F{f}
        {% endif %}
    {% endfor %}

    # Trailing cross-grain sweeps, at the final (deepest, slowest) setting.
    {% for j in range(b.cross) %}
        {% set y = y_min + (y_max - y_min) * (j + 0.5) / b.cross %}
        G1 X{x_min} Y{"%.3f"|format(y)} F{feed_cross}
        G1 X{"%.3f"|format(x_max)} F{feed_cross}
        G1 X{x_min} F{feed_cross}
    {% endfor %}

    {% if not dry %}
        SAVE_VARIABLE VARIABLE=nb_lane VALUE={(lane0 + b.air_wipes + b.wipes) % lanes}
    {% endif %}

    # 6. Wait over the pad, then probe and lift. This final cleaning probe is
    #    separate from the caller's subsequent Z calibration, homing and mesh.
    G90
    {% if dry %}
        G1 Z{dz} F1200
        G1 X{b.tap_x} F9000
        RESPOND PREFIX="brush" MSG="DRY RUN complete - lane index NOT advanced"
    {% else %}
        # D2. Wait for probe_temp HOLDING OVER THE PAD rather than hovering at
        #     the tap point. Whatever still oozes during the wait lands in the
        #     bristles; at the tap point it would land on the plate, next to the
        #     coordinate we are about to measure.
        G91
        G1 Z{b.lift} F1200
        G90
        {% if heat %}
            M106 S255
            M109 S{b.probe_temp}
            M106 S0
        {% endif %}
        G1 Z3 F1200
        G1 X{b.tap_x + b.tap_clean_dx} Y{b.tap_y} F9000
        {b.probe}
        G1 Z5 F1200
    {% endif %}
    RESTORE_GCODE_STATE NAME=clean_nozzle
    _BRUSH_MARK_DONE


[gcode_macro _BRUSH_PRIME]
description: RETIRED — prime is now inside PURGE_LINE. Kept as a no-op stub.
# The prime used to run here, in mid-air at Z5, between reaching print
# temperature and traveling to the purge location. That deposited a blob on the
# plate before the purge ring. The debt (scrub retract + end-of-print retract)
# is now returned INSIDE PURGE_LINE, stationary at bead height, immediately
# before the first purge extrusion. See purge_line.cfg.
#
# This stub is kept so existing slicer profiles and G-code files that call
# _BRUSH_PRIME do not error. It does nothing.
gcode:
    RESPOND PREFIX="brush" MSG="_BRUSH_PRIME is retired - prime now handled by PURGE_LINE"


[gcode_macro _BRUSH_STATUS]
description: Report brush geometry, coverage and the current indices.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    RESPOND PREFIX="brush" MSG="pad {b.pad_x_max - b.pad_x_min}mm inset {b.margin} over {b.lanes} lanes, {b.air_wipes} air + {b.wipes} pad passes plus {b.cross} cross"
    RESPOND PREFIX="brush" MSG="absolute Z: strike from {b.pad_top + b.air_rise} down to {b.pad_top - b.immersion}, pad top {b.pad_top}"
    RESPOND PREFIX="brush" MSG="index {printer.save_variables.variables.nb_lane|default(0)}, owed {b.retracted}mm, end debt {printer.save_variables.variables.end_retract|default(0)}mm"


[gcode_macro _BRUSH_RESET_LANE]
description: Restart the lane and depth rotation at 0.
gcode:
    SAVE_VARIABLE VARIABLE=nb_lane VALUE=0
    RESPOND PREFIX="brush" MSG="rotation reset"


[gcode_macro _BRUSH_CORNER]
description: Park above a corner of the brush pad so it can be eyeballed and jogged.
# Stage 3 of commissioning. The pad bounds in _BRUSH are the stock CONTACT band,
# not a measurement, and everything about coverage is blocked on knowing the real
# extent. This drives to each declared corner at teach_z so the aim can be judged
# by eye, jogged, and then recorded with _BRUSH_TEACH.
#
# It deliberately does not descend to contact. Getting close without touching is
# the whole point.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set n = params.CORNER|default(1)|int %}
    {% set z = params.Z|default(b.teach_z)|float %}
    {% set x = b.pad_x_min if n in [1, 4] else b.pad_x_max %}
    {% set y = b.pad_y_min if n in [1, 2] else b.pad_y_max %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("_BRUSH_CORNER: home first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=brush_corner
    G90
    G1 Z{[z + 5, 5]|max} F1200
    G1 X{x} Y{y} F3000
    G1 Z{z} F600
    RESPOND PREFIX="brush" MSG="corner {n} of 4 at X{x} Y{y} Z{z}. Jog to the true corner, then _BRUSH_TEACH CORNER={n}"
    RESTORE_GCODE_STATE NAME=brush_corner


[gcode_macro _BRUSH_TEACH]
description: Record the jogged position as a pad corner. Reports, does not apply.
# Writes to save_variables and prints the resulting bounds. It deliberately does
# NOT rewrite _BRUSH: the config stays the authority, so a stray jog cannot
# silently move the brush geometry. Paste the reported values in when all four
# corners agree.
gcode:
    {% set n = params.CORNER|default(1)|int %}
    {% set x = printer.gcode_move.gcode_position.x %}
    {% set y = printer.gcode_move.gcode_position.y %}
    {% set z = printer.gcode_move.gcode_position.z %}
    SAVE_VARIABLE VARIABLE=nb_corner{n}_x VALUE={x|round(3)}
    SAVE_VARIABLE VARIABLE=nb_corner{n}_y VALUE={y|round(3)}
    SAVE_VARIABLE VARIABLE=nb_corner{n}_z VALUE={z|round(3)}
    RESPOND PREFIX="brush" MSG="corner {n} taught at X{x|round(3)} Y{y|round(3)} Z{z|round(3)}"


[gcode_macro _BRUSH_TEACH_REPORT]
description: Print the pad bounds implied by the taught corners.
gcode:
    {% set v = printer.save_variables.variables %}
    {% set xs = [v.nb_corner1_x|default(0), v.nb_corner2_x|default(0), v.nb_corner3_x|default(0), v.nb_corner4_x|default(0)] %}
    {% set ys = [v.nb_corner1_y|default(0), v.nb_corner2_y|default(0), v.nb_corner3_y|default(0), v.nb_corner4_y|default(0)] %}
    {% set zs = [v.nb_corner1_z|default(0), v.nb_corner2_z|default(0), v.nb_corner3_z|default(0), v.nb_corner4_z|default(0)] %}
    RESPOND PREFIX="brush" MSG="taught pad_x_min {xs|min} pad_x_max {xs|max} pad_y_min {ys|min} pad_y_max {ys|max}"
    # Z is recorded per corner but is NOT a pad bound. It is the pad top height
    # above the homed Z datum, and the spread across four corners is how level
    # the brush sits. A large spread means the scrub depth varies across the pad
    # and z_deep cannot be a single number.
    RESPOND PREFIX="brush" MSG="taught Z per corner {zs} - spread {(zs|max - zs|min)|round(3)}mm"
    RESPOND PREFIX="brush" MSG="paste into _BRUSH and set margin 0.5. Current config says {printer['gcode_macro _BRUSH'].pad_x_min}..{printer['gcode_macro _BRUSH'].pad_x_max}"


[gcode_macro _BRUSH_CHECK_TAP]
description: Reject an implausible tap before anything moves at depth.
# MUST be a separate macro. Klipper renders a macro's whole template BEFORE
# executing any of its lines, so a {printer...} read inside CLEAN_NOZZLE would
# report the position from before the tap ran. A nested macro is rendered when
# the calling line executes, which is the only way to see post-tap state.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set z = printer.gcode_move.gcode_position.z|float %}
    {% if z < b.tap_min or z > b.tap_max %}
        { action_raise_error("CLEAN_NOZZLE: tap returned Z %.3f, outside the plausible "
          "%.2f..%.2f window. Refusing to scrub -- at this reading the pass would be "
          "%.1f mm off the pad. Check the nozzle is clean and retry."
          |format(z, b.tap_min, b.tap_max, z - b.pad_top)) }
    {% endif %}


[gcode_macro _BRUSH_MARK_DONE]
description: Report how long the wipe took, for chamber_preheat's wipe_lead_seconds.
# SEPARATE MACRO ON PURPOSE. Klipper renders a macro completely before running
# any of it, so CLEAN_NOZZLE cannot read the clock at its own end -- both reads
# would return the value from render time. This one renders when it is called,
# which is after the wipe.
#
# The number it prints is the one chamber_preheat wants. wipe_lead_seconds
# defaults to 0 (off) precisely so it is set from a measurement rather than an
# estimate: with it set, M191 hands over that many seconds before the chamber
# minimum so the heat/wipe/cool lands ON the minimum instead of starting there.
#
# Saved as well as printed, because the useful comparison is across jobs -- a
# cold start and a warm restart do not wipe for the same length of time.
#
# THE LEAD MUST BE SET FROM THE SHORTEST OF THEM, NOT THE LONGEST. Write L for
# the lead and W for how long the wipe really takes. M191 hands over when the
# chamber is L seconds out, so the wipe ends L - W seconds relative to arrival:
#
#   W  > L   wipe ends AFTER the chamber arrives  -- safe, just less reclaimed
#   W == L   exactly just-in-time
#   W  < L   wipe ends BEFORE it arrives -- the first layer starts cold, and
#            nothing re-checks, because the nozzle proxy is gone
#
# So the error is one-sided and only one direction is survivable. Take the
# minimum observed W and stay under it.
gcode:
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set t0 = b.t_start|float %}
    {% set now = printer.print_stats.total_duration|float %}
    {% if t0 >= 0 and now > t0 %}
        {% set took = now - t0 %}
        {% set prev = printer.save_variables.variables.wipe_seconds_min|default(0.0)|float %}
        SAVE_VARIABLE VARIABLE=wipe_seconds VALUE={took|round(1)}
        {% if prev <= 0 or took < prev %}
            # The RUNNING MINIMUM is what the lead is bounded by, so it only
            # ever ratchets down. A stale-low minimum is conservative and
            # therefore safe; a stale-high one would not be, which is why this
            # never rises on its own. Clear wipe_seconds_min by hand after
            # changing the brush or the clean temperature.
            SAVE_VARIABLE VARIABLE=wipe_seconds_min VALUE={took|round(1)}
            RESPOND PREFIX="brush" MSG="wipe took {took|round(1)}s -- new shortest, M191 lead now bounded by it"
        {% else %}
            RESPOND PREFIX="brush" MSG="wipe took {took|round(1)}s (shortest still {prev|round(1)}s)"
        {% endif %}
    {% else %}
        RESPOND PREFIX="brush" MSG="wipe duration not measurable outside a print"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=t_start VALUE=-1.0

# END SOURCE: klipper/config/nozzle_brush.cfg
# Stock 1.4.x probes the plate with the eddy sensor, not the bed load cell.
# Keep the sensor on the plate at Sovol's stock contact location.
[gcode_macro _BRUSH]
variable_probe: "RUN_PROBE_VIR_CONTACT"
variable_probe_datum_args: ""
variable_tap_x: 30.0
variable_tap_y: 30.0
variable_tap_clean_dx: 0.0


# BEGIN SOURCE: klipper/config/purge_line.cfg
# PURGE_LINE — a circular purge placed next to the print, with real fallbacks
#
# Include AFTER Macro.cfg. Call it from the slicer's start G-code, AFTER the
# nozzle is at printing temperature, passing the numbers only the slicer knows.
#
# DIVISION OF LABOUR
#
# The slicer owns the filament and passes it in. The macro owns the geometry and
# the machine state. Neither hardcodes the other's business:
#
#   slicer -> VOL_MAX  filament_max_volumetric_speed. 21 for PLA, 3.2 for TPU.
#             FIL_D    filament diameter, to convert volume to E length.
#             CLEAR    how far to stay off the print: skirt distance plus its
#                      width, which only the slicer knows.
#   macro  -> where there is room, what the mesh covers, where the brush is,
#             what the objects are, and what to do when none of it fits.
#
# This is the answer to purge macros that hardcode a purge_amount and a flow
# rate: those two numbers are exactly the filament's business, and passing them
# costs one line per slicer.
#
# WHY A CIRCLE
#
# It has no corners, so there is no acceleration transient and no pressure-advance
# spike in the middle of the move that is supposed to be settling pressure. It is
# also compact: a fat bead makes the circle small, which is the opposite of the
# usual argument against fat purge lines. Klipper draws it as one G3 -- full
# circles are supported when the target equals the current position
# (gcode_arcs.py:125-130) -- and [gcode_arcs] is enabled in stock printer.cfg.
#
# VOLUME IS A MACHINE PROPERTY, RATE IS A FILAMENT PROPERTY
#
# How much must pass to flush the previous material and reach steady pressure is
# governed by melt-zone volume, not by what is loaded. How FAST it may pass is
# entirely the filament's. So volume is fixed here and rate comes from VOL_MAX,
# and the length falls out of the two. Scaling purge LENGTH with filament is the
# wrong correlation: TPU wants the same material moved slower, not less of it.
#
# DEPENDS ON OBJECT LABELLING. The slicer must emit EXCLUDE_OBJECT_DEFINE
# (PrusaSlicer: gcode_label_objects = firmware; Orca: exclude_object = 1).
# Without it printer.exclude_object.objects is empty, this falls back to a fixed
# location, and Sovol's own BED_MESH_CALIBRATE ADAPTIVE=1 is equally inert.

[gcode_macro _PURGE]
description: Geometry and machine limits for PURGE_LINE. Edit here.
# --- how much, and how fat ---------------------------------------------------
# volume is the machine property. bead_w x bead_h is the choice: fatter is
# shorter, stiffer and easier to peel, and shrinks the circle. The old pack used
# an effective 0.481 mm3/mm, about 5.7x nominal and ~1.9 mm wide; this is
# deliberately less extreme at 0.448, about 5.3x nominal and 1.4 mm wide.
# Bead size sets the circle: 40 mm3 over 0.448 mm2 is 89 mm of bead, a 28 mm
# circle. Thinning the bead makes the circle GROW, which is the opposite of the
# usual intuition and the reason not to thin it much further.
# Purge volume as vol_b + vol_k * nozzle^2, fitted through 40 mm3 at 0.4 and
# 60 mm3 at 1.0. The melt zone above the nozzle does not change with orifice, so
# the volume should not scale linearly -- but a wider orifice does hold more, so
# a flat number is wrong too. Quadratic in diameter because that is what tracks
# the orifice AREA. Gives 37.1 / 40 / 44.8 / 51.4 / 60 across 0.2 to 1.0.
#   k = (60 - 40) / (1.0^2 - 0.4^2) = 23.8095
#   b = 40 - k * 0.4^2              = 36.1905
# The endpoints are chosen, not measured. Nothing above 0.4 has been tested.
variable_vol_b: 36.1905
variable_vol_k: 23.8095
# Bead scales with the nozzle rather than being fixed, so the same volume lays a
# proportionate bead on every nozzle instead of a 1.4 mm sausage from a 0.2.
variable_bead_w_ratio: 3.5    # bead width  = ratio x nozzle diameter
variable_bead_h_ratio: 0.8    # bead height = ratio x nozzle diameter
# AT LEAST ONE FULL LAP AND A HALF, on every nozzle (operator, 2026-10-13): a
# complete ring, with the start blob opposite the part. From 0.8 up the volume
# at 3.5 x nozzle is too short a bead for that -- 28.7 mm at 0.8, 15.1 at 1.4 --
# so it used to be ONE half circle. Those nozzles now take the widest bead,
# down to this ratio, whose lap and a half at r_min holds the volume: 2.38 x at
# 0.8, 1.81 at 1.0, the floor at 1.2 and 1.4. At the floor the lap and a half is
# laid anyway, over the volume: 71.5 mm3 against 70.5 at 1.2, 102.5 against
# 82.9 at 1.4. 0.2 to 0.6 are unchanged.
variable_bead_w_min_ratio: 1.5
# CONCENTRIC RINGS. Volume is a machine property, so a finer nozzle needs the
# same volume laid as a thinner, much longer bead -- 357 mm at 0.2 mm against
# 89 mm at 0.4. As one circle that is a 57 mm monster. Rings keep the footprint
# bounded: the macro picks the fewest rings whose combined circumference carries
# the length while staying inside r_max, and links them with a short radial
# extrusion so the whole thing lifts as ONE piece.
variable_r_max: 12.0
variable_r_min: 3.0
variable_max_rings: 8
variable_tip: 0.2              # advance to seat the tip, rolled in with the prime
# THE PRIME IS ROLLED, NOT DUMPED (operator, 2026-10-13). The debt and the tip
# go back while the nozzle travels the outer circle into the ring start, never
# standing still, so whatever the nozzle gives up lands on the ring rather than
# in a start blob. Enough half laps that the roll never extrudes faster per mm
# than the ring itself -- the hand-off into the ring then only ever steps UP --
# up to this many; past it the roll runs faster per mm instead.
variable_roll_halves_max: 4
variable_retract_after: 0.4
# --- keep-out ----------------------------------------------------------------
variable_clear: 4.0            # default gap to the print; slicer CLEAR overrides
# Extra gap beyond CLEAR, in bead widths. The slicer's CLEAR covers skirt and
# brim, but exclude_object reports the OBJECT polygon and a raft extends past it,
# which is how the ring came to touch a temperature tower's raft. Counted in the
# placement decision, not just the positioning, so a ring that no longer fits
# with the gap falls back rather than overlapping.
variable_ring_gap_beads: 2.0
variable_edge: 2.0             # keep off the printable edge
variable_line_x_max: 150.4     # right edge of the fallback strip
# --- the plate ---------------------------------------------------------------
# Printable area as Sovol declares it. The machine REACHES further -- X -10..155,
# Y -2..152.5 -- but that space holds the brush and the tap target, not plate,
# so nothing here purges outside the printable area. See notes/kb/purge-lines.md.
variable_bed_min_x: 0.0
variable_bed_max_x: 152.4
variable_bed_min_y: 0.0
variable_bed_max_y: 152.4
# The mesh only covers 12,12..132,140. The margins outside it are real plate,
# just uncompensated, so Z there is an extrapolation of the nearest mesh edge.
# Good enough for a purge, not for a part -- which is why it is the fallback.
variable_fallback_x: 138.0     # out-and-back line lives in the unmeshed right margin
variable_fallback_len: 40.0
# --- motion ------------------------------------------------------------------
variable_travel_f: 12000
variable_max_speed: 25.0       # mm/s ceiling regardless of VOL_MAX
# PURGE_LINE DRY=1 rehearses placement and motion at dry_z with no extrusion.
variable_dry_z: 50.0
gcode:


[gcode_macro PURGE_LINE]
description: Circular purge beside the print. Falls back to a line, then to nothing.
gcode:
    {% set p = printer["gcode_macro _PURGE"] %}
    {% set vol_max = params.VOL_MAX|default(10.0)|float %}
    {% set fil_d   = params.FIL_D|default(1.75)|float %}
    {% set clear   = params.CLEAR|default(p.clear)|float %}
    {% set volume  = params.VOLUME|default(0)|float %}
    {% set dry     = params.DRY|default(0)|int %}

    # PRIME — absorb the debt from CLEAN_NOZZLE's scrub retract and END_PRINT's
    # end-of-print retract. These used to be returned by a separate _BRUSH_PRIME
    # call in mid-air at Z5, which deposited a blob before the purge, and then
    # stationary at the purge start, which deposited one AT the purge. A ring
    # now rolls it in along its own outer circle (roll_halves_max, above); the
    # line fallback still returns it at its start point.
    {% set brush = printer["gcode_macro _BRUSH"] %}
    {% set scrub = brush.retracted|float %}
    {% set owed_raw = printer.save_variables.variables.end_retract|default(0)|float %}
    {% set end_owed = [[owed_raw, 0]|max, brush.owed_max]|min %}
    {% set prime_total = scrub + end_owed %}


    {% set noz = params.NOZZLE|default(0.4)|float %}
    {% set bead_h = p.bead_h_ratio * noz %}
    {% set volume = volume if volume > 0 else (p.vol_b + p.vol_k * noz * noz) %}
    # The widest bead, up to bead_w_ratio x nozzle, whose lap and a half at r_min
    # holds the volume. That path is 2*pi*(r_min + w) + pi*r_min + w, so with
    # volume = path * w * bead_h, w solves (2*pi + 1)*w^2 + 3*pi*r_min*w =
    # volume / bead_h. Never thinner than bead_w_min_ratio x nozzle.
    {% set qa = 2 * 3.14159265 + 1 %}
    {% set qb = 3 * 3.14159265 * p.r_min %}
    {% set w_fit = ((qb * qb + 4 * qa * volume / bead_h) ** 0.5 - qb) / (2 * qa) %}
    {% set bead_w = [[p.bead_w_ratio * noz, w_fit]|min, p.bead_w_min_ratio * noz]|max %}
    {% set bead = bead_w * bead_h %}
    {% set zw = p.dry_z if dry else bead_h %}
    {% set length = volume / bead %}
    {% set fil_a = 3.14159265 / 4 * fil_d * fil_d %}
    {% set clear = clear + p.ring_gap_beads * bead_w %}

    # Fewest rings that carry `length` inside r_max.
    #
    # THE LAST LAP IS A HALF LAP. Start and end must be 180 degrees apart (see
    # the drawing block below), so the innermost ring sweeps pi rather than 2pi
    # and the arithmetic is not the plain sum of circumferences. With A the sum
    # of the radii and r_in the innermost,
    #
    #     arc = 2*pi*A - pi*r_in = 2*pi*(A - r_in/2)
    #
    # and substituting A = n*r - w*n*(n-1)/2 and r_in = r - w*(n-1) gives
    #
    #     S = r*(n - 1/2) - w*(n-1)^2/2        where S = length / (2*pi)
    #
    # so r = (S + w*(n-1)^2/2) / (n - 1/2). Requiring r <= r_max turns that into
    # (w/2)*n^2 - (w + r_max)*n + (w + r_max)/2 + S <= 0; take the smaller root
    # and round up. Closed form, because Jinja cannot carry state through a loop
    # without the namespace extension Klipper does not enable.
    #
    # The half lap is why the radius grows: a single ring now needs r = 2*S
    # where a full circle needed r = S, so the same volume pushes harder against
    # r_max and lands on a higher n. That is the intended trade -- an extra lap
    # is cheap, and a dragged blob is not.
    {% set S = length / (2 * 3.14159265) %}
    {% set b = bead_w + p.r_max %}
    {% set disc = b * b - bead_w * (b + 2 * S) %}
    {% set n_raw = (((b - (disc ** 0.5)) / bead_w) | round(0, 'ceil') | int) if disc >= 0 else 99 %}
    # Two rings at least: a full lap, then the half lap.
    {% set n = [[n_raw, 2] | max, p.max_rings] | min %}
    # The n-1 radial step-ins EXTRUDE, so they are part of the purge volume and
    # the arcs only have to carry what is left. Subtracting them here is a
    # pre-existing correction, not a new one: `path` has always included the
    # links while S was solved from the full requested length, so every
    # multi-ring purge over-extruded by bead_w*(n-1)*bead. Worst at a fat bead
    # on few rings -- measured 3.7% over on a 0.6 nozzle at n=2, against 1% on
    # a 0.2 at n=6. Safe to fold in after n is chosen: it only ever SHRINKS the
    # radius, so the r <= r_max test that picked n cannot be invalidated.
    {% set S = [(length - bead_w * (n - 1)), 0.0]|max / (2 * 3.14159265) %}
    {% set r_ideal = (S + bead_w * (n - 1) * (n - 1) / 2) / (n - 0.5) %}
    {% set radius = [r_ideal, p.r_min + bead_w * (n - 1)] | max %}
    {% set r_in = radius - bead_w * (n - 1) %}

    # Actual path, which is what E must match -- not the requested volume. The
    # ring count, the r_min clamp and the half lap all move the real length off
    # the nominal. n-1 full circles, one half circle, n-1 radial step-ins.
    {% set path = 2 * 3.14159265 * (n * radius - bead_w * n * (n - 1) / 2 - r_in / 2) + bead_w * (n - 1) %}
    {% set e_tot = path * bead / fil_a %}

    # Velocity from first principles, smallest of three limits:
    #   flow   the filament's volumetric ceiling over this bead cross-section
    #   accel  a circle of radius r at speed v needs v^2/r of centripetal
    #          acceleration, so v <= sqrt(a * r) on the TIGHTEST ring
    #   cap    a flat ceiling for sanity
    {% set accel = printer.toolhead.max_accel|float %}
    {% set v_flow = vol_max / bead %}
    {% set v_acc = (accel * [r_in, 0.1]|max) ** 0.5 %}
    {% set speed = [[v_flow, v_acc]|min, p.max_speed]|min %}
    {% set feed = (speed * 60)|round(0)|int %}

    # Objects come from exclude_object, which needs the slicer to label them.
    #
    # Flattened with sum(start=[]) rather than a {% do %} append: Klipper builds
    # its Jinja environment as jinja2.Environment('{%', '%}', '{', '}') with NO
    # extensions (gcode_macro.py:74), so the `do` tag does not exist and a config
    # using it fails to load and HALTS THE PRINTER. Anything validated offline
    # must use that exact environment.
    {% set objs = printer.exclude_object.objects if printer.exclude_object is defined else [] %}
    {% set pts = objs|map(attribute='polygon')|sum(start=[]) %}
    {% set have = pts|length > 0 %}
    {% set xs = pts|map(attribute='0')|list %}
    {% set ys = pts|map(attribute='1')|list %}
    {% set ox0 = xs|min if have else 0.0 %}
    {% set ox1 = xs|max if have else 0.0 %}
    {% set oy0 = ys|min if have else 0.0 %}
    {% set oy1 = ys|max if have else 0.0 %}

    # Usable centre range for a circle of this radius.
    {% set lo_x = p.bed_min_x + p.edge + radius %}
    {% set hi_x = p.bed_max_x - p.edge - radius %}
    {% set lo_y = p.bed_min_y + p.edge + radius %}
    {% set hi_y = p.bed_max_y - p.edge - radius %}

    # PLACEMENT PREFERENCE, in order: SE, SSE, ESE, SW, NE.
    # South is the front of the machine (low Y), east is the right (high X). SE
    # is first because it faces the camera, so the purge is visible in a
    # timelapse or a remote check without moving anything to look at it.
    # Corner placements clear the object in BOTH axes; edge placements in one.
    #
    # The two edge placements are biased toward SE rather than centred on the
    # object. A ring centred on the object's midline sits square-on to the
    # camera and square-on to its neighbours; pulled toward the SE corner it
    # stays in the same clearance band but reads better as a distinct target.
    # SSE is south of the object at its EAST end, ESE is east of it at its
    # SOUTH end -- so each degrades from SE along one axis only, instead of
    # jumping to the middle of an edge.
    # Bias points: the object's east edge for SSE, its south edge for ESE,
    # each clamped into the usable centre range for a circle of this radius.
    {% set cx_sse = [[ ox1, lo_x ]|max, hi_x]|min %}
    {% set cy_ese = [[ oy0, lo_y ]|max, hi_y]|min %}
    {% set e_x = ox1 + clear + radius %}
    {% set w_x = ox0 - clear - radius %}
    {% set s_y = oy0 - clear - radius %}
    {% set n_y = oy1 + clear + radius %}
    {% set ok_e = e_x >= lo_x and e_x <= hi_x %}
    {% set ok_w = w_x >= lo_x and w_x <= hi_x %}
    {% set ok_s = s_y >= lo_y and s_y <= hi_y %}
    {% set ok_n = n_y >= lo_y and n_y <= hi_y %}

    {% if not have %}
        {% set cx = hi_x %}{% set cy = lo_y %}{% set how = "no labelled objects, SE of the bed" %}
    {% elif ok_e and ok_s %}
        {% set cx = e_x %}{% set cy = s_y %}{% set how = "SE corner" %}
    {% elif ok_s %}
        {% set cx = cx_sse %}{% set cy = s_y %}{% set how = "SSE" %}
    {% elif ok_e %}
        {% set cx = e_x %}{% set cy = cy_ese %}{% set how = "ESE" %}
    {% elif ok_w and ok_s %}
        {% set cx = w_x %}{% set cy = s_y %}{% set how = "SW corner" %}
    {% elif ok_e and ok_n %}
        {% set cx = e_x %}{% set cy = n_y %}{% set how = "NE corner" %}
    {% else %}
        {% set cx = -1 %}{% set cy = -1 %}{% set how = "none" %}
    {% endif %}

    SAVE_GCODE_STATE NAME=purge_line
    G90
    M83

    {% if disc >= 0 and n <= p.max_rings and cx >= 0 %}
        # START FAR FROM THE PART, END NEAR IT -- 180 degrees apart.
        #
        # Both ends of the purge leave a blob: `tip` advances to seat the tip
        # before the first move, and `retract_after` pulls back at the last.
        # Until 2026-09-08 the ring started and ended at the SAME point, the one
        # nearest the object, so the two blobs merged into one larger deposit --
        # and the exit travel to the print then drove straight through it and
        # dragged it. Observed on an ABS job 2026-09-07.
        #
        # Splitting them is most of the fix, and which way round is the rest.
        # The END goes nearest the part, because that is the shortest possible
        # travel from the purge into the first layer. The START therefore goes
        # opposite: it is where the rolled prime hands over to the ring, and it
        # is not crossed on the way out.
        #
        # `u` is the unit vector from ring centre toward the NEAREST point of
        # the object box -- no trig needed, it is just the offset over its own
        # length. Near is +u, far is -u.
        #
        # Cost, stated plainly: the seams of the full circles now sit on the far
        # side, which is the side facing the camera. That is a worse timelapse
        # and a better print, and the print wins.
        {% set nx = [[cx, ox0]|max, ox1]|min if have else cx %}
        {% set ny = [[cy, oy0]|max, oy1]|min if have else cy + 1 %}
        {% set dx = nx - cx %}{% set dy = ny - cy %}
        {% set dlen = [((dx * dx + dy * dy) ** 0.5), 0.001]|max %}
        {% set ux = dx / dlen %}{% set uy = dy / dlen %}
        {% set sx = cx - radius * ux %}{% set sy = cy - radius * uy %}
        {% set ex = cx + r_in * ux %}{% set ey = cy + r_in * uy %}
        RESPOND PREFIX="purge" MSG="ring n={n} cx={cx|round(3)} cy={cy|round(3)} r_out={radius|round(3)} r_in={r_in|round(3)} step={bead_w|round(3)} bead={bead_w|round(3)}x{bead_h|round(3)} vol={(path * bead)|round(2)} place={how} start={sx|round(3)},{sy|round(3)} end={ex|round(3)},{ey|round(3)} dry={dry}"
        RESPOND PREFIX="purge" MSG="ring speed={speed|round(2)} limits flow={v_flow|round(1)} accel={v_acc|round(1)} cap={p.max_speed}"
        # ROLL THE PRIME IN. Debt plus tip, as a length of ring path at the
        # ring's own E per mm, decides how many half laps of the outer circle
        # carry it: enough that the roll is never richer per mm than the ring.
        # Half laps, because a half circle ends opposite its start and needs no
        # trig -- the roll begins at +u for an odd count and at the ring start
        # itself for an even one, and always ends at the start, still turning
        # the way the ring turns. Over roll_halves_max the roll gets richer.
        {% set roll_e = 0.0 if dry else prime_total + p.tip %}
        {% set e_mm = bead / fil_a %}
        {% set half = 3.14159265 * radius %}
        {% set halves = [[((prime_total + p.tip) / e_mm / half)|round(0, 'ceil')|int, 1]|max, p.roll_halves_max|int]|min %}
        {% set roll_x = sx if halves % 2 == 0 else cx + radius * ux %}
        {% set roll_y = sy if halves % 2 == 0 else cy + radius * uy %}
        G1 Z{zw + 2} F600
        G1 X{roll_x|round(3)} Y{roll_y|round(3)} F{p.travel_f}
        G1 Z{zw} F600
        RESPOND PREFIX="purge" MSG="roll halves={halves} len={(halves * half)|round(2)} e={roll_e|round(3)} e_mm={(roll_e / (halves * half))|round(4)} ring_e_mm={e_mm|round(4)}"
        {% for j in range(halves) %}
            {% set to_start = (halves - 1 - j) % 2 == 0 %}
            {% set tx = sx if to_start else cx + radius * ux %}
            {% set ty = sy if to_start else cy + radius * uy %}
            {% set ki = (0 - radius * ux) if to_start else radius * ux %}
            {% set kj = (0 - radius * uy) if to_start else radius * uy %}
            G3 X{tx|round(3)} Y{ty|round(3)} I{ki|round(3)} J{kj|round(3)} {% if not dry %}E{(roll_e / halves)|round(4)} {% endif %}F{feed}
        {% endfor %}
        {% if not dry and prime_total > 0 %}
            SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=retracted VALUE=0
            {% if end_owed > 0 %}SAVE_VARIABLE VARIABLE=end_retract VALUE=0{% endif %}
            RESPOND PREFIX="purge" MSG="primed {"%.3f"|format(prime_total)}mm = {scrub} scrub + {end_owed} end debt, rolled over {halves} half laps"
        {% endif %}
        # Concentric rings, outermost first. Every ring but the last is a full
        # circle, and the radial step-ins happen at the FAR point, so the whole
        # purge still lifts as ONE piece rather than as n loose loops.
        #
        # EACH FULL CIRCLE IS TWO HALVES, since 2026-10-13. It was one G3 with
        # its end on its start, which Klipper draws as a full circle only when
        # its computed sweep is exactly 0.0 (gcode_arcs.py:125). The sweep is
        # an atan2 of a cross product taken after subtracting and re-adding the
        # centre, so float residue decides: about 1e-16 one way wraps to 2*pi,
        # the other way stays at 1e-16 -- no arc at all, and the whole ring's E
        # pushed out where the nozzle stands. Replayed on the backcase,
        # casemount and Benchy jobs of 2026-10-12, the outer ring swept 5.2e-16
        # rad and its 27.6 mm3 went into the start blob; the purge that showed
        # was the half lap. A half circle ends opposite its start, which atan2
        # resolves to pi either way.
        #
        # The innermost ring is a HALF circle, far to near. That is what puts
        # the end 180 degrees from the start; the ring arithmetic above already
        # accounts for its pi rather than 2pi.
        #
        # I/J are the offset from the current point to the centre. At the far
        # point that is +r*u, where the old near-point version used -r*u.
        {% for i in range(n) %}
            {% set r_i = radius - bead_w * i %}
            {% set fx = cx - r_i * ux %}{% set fy = cy - r_i * uy %}
            {% if i > 0 %}
                G1 X{fx|round(3)} Y{fy|round(3)} {% if not dry %}E{(bead_w * bead / fil_a)|round(4)} {% endif %}F{feed}
            {% endif %}
            {% if i < n - 1 %}
                G3 X{(cx + r_i * ux)|round(3)} Y{(cy + r_i * uy)|round(3)} I{(r_i * ux)|round(3)} J{(r_i * uy)|round(3)} {% if not dry %}E{(3.14159265 * r_i * bead / fil_a)|round(4)} {% endif %}F{feed}
                G3 X{fx|round(3)} Y{fy|round(3)} I{(0 - r_i * ux)|round(3)} J{(0 - r_i * uy)|round(3)} {% if not dry %}E{(3.14159265 * r_i * bead / fil_a)|round(4)} {% endif %}F{feed}
            {% else %}
                G3 X{(cx + r_i * ux)|round(3)} Y{(cy + r_i * uy)|round(3)} I{(r_i * ux)|round(3)} J{(r_i * uy)|round(3)} {% if not dry %}E{(3.14159265 * r_i * bead / fil_a)|round(4)} {% endif %}F{feed}
            {% endif %}
        {% endfor %}
        {% if not dry %}G1 E-{p.retract_after} F1800{% endif %}
        G1 Z{zw + 2} F600

    {% else %}
        # LINE FALLBACK, tried S, E, W, then N -- south first for the same
        # camera-facing reason as the circle, north last because it is furthest
        # from view and closest to the gantry.
        #
        # Each edge offers a BAND (perpendicular, holds the passes) and a RUN
        # (along the edge, the length of one pass). Passes are counted from the
        # bead length, so a fine nozzle serpentines rather than drawing one
        # impossible stroke, and the edge is rejected if the band cannot hold
        # them.
        {% set s_band = (oy0 - clear) - (p.bed_min_y + p.edge) if have else p.bed_max_y - p.bed_min_y - 2 * p.edge %}
        {% set n_band = (p.bed_max_y - p.edge) - (oy1 + clear) if have else 0 %}
        {% set e_band = (p.bed_max_x - p.edge) - (ox1 + clear) if have else 0 %}
        {% set w_band = (ox0 - clear) - (p.bed_min_x + p.edge) if have else 0 %}
        {% set run_x = p.bed_max_x - p.bed_min_x - 2 * p.edge %}
        {% set run_y = p.bed_max_y - p.bed_min_y - 2 * p.edge %}
        {% set need_x = ((length / run_x) | round(0, 'ceil') | int) %}
        {% set need_y = ((length / run_y) | round(0, 'ceil') | int) %}

        {% if s_band >= need_x * bead_w and run_x > 10 %}
            {% set axis = "X" %}{% set edge = "S" %}
            {% set n_pass = need_x %}
            {% set a0 = p.bed_min_x + p.edge %}{% set a1 = p.bed_max_x - p.edge %}
            {% set b0 = p.bed_min_y + p.edge %}
        {% elif e_band >= need_y * bead_w and run_y > 10 %}
            {% set axis = "Y" %}{% set edge = "E" %}
            {% set n_pass = need_y %}
            {% set a0 = p.bed_min_y + p.edge %}{% set a1 = p.bed_max_y - p.edge %}
            {% set b0 = p.bed_max_x - p.edge - bead_w * (need_y - 1) %}
        {% elif w_band >= need_y * bead_w and run_y > 10 %}
            {% set axis = "Y" %}{% set edge = "W" %}
            {% set n_pass = need_y %}
            {% set a0 = p.bed_min_y + p.edge %}{% set a1 = p.bed_max_y - p.edge %}
            {% set b0 = p.bed_min_x + p.edge %}
        {% elif n_band >= need_x * bead_w and run_x > 10 %}
            {% set axis = "X" %}{% set edge = "N" %}
            {% set n_pass = need_x %}
            {% set a0 = p.bed_min_x + p.edge %}{% set a1 = p.bed_max_x - p.edge %}
            {% set b0 = p.bed_max_y - p.edge - bead_w * (need_x - 1) %}
        {% else %}
            {% set axis = "" %}{% set edge = "none" %}{% set n_pass = 0 %}
            {% set a0 = 0 %}{% set a1 = 0 %}{% set b0 = 0 %}
        {% endif %}

        {% if n_pass > 0 %}
            # Same enumeration as the ring, so the line is as findable by machine
            # vision: the pass endpoints, the step between them, and the bounding
            # box are all stated rather than left to be inferred from the G-code.
            # The last pass is TRIMMED to the remainder. Whole passes at the full
            # run length over-purge by up to one pass -- 49.9 mm3 against a 37.1
            # target on a 0.2 nozzle, a third too much -- because the pass count
            # has to round up. Only the final leg is short, so the serpentine
            # still reads as a block to a camera.
            {% set run = a1 - a0 %}
            {% set rem_raw = length - run * (n_pass - 1) %}
            {% set rem = rem_raw if rem_raw > 0.001 else run %}
            {% set e_leg = run * bead / fil_a %}
            {% set b1 = b0 + bead_w * (n_pass - 1) %}
            {% set last = (a0 + rem) if (n_pass - 1) % 2 == 0 else (a1 - rem) %}
            RESPOND PREFIX="purge" MSG="line n={n_pass} axis={axis} place={edge} step={bead_w|round(3)} bead={bead_w|round(3)}x{bead_h|round(3)} vol={((run * (n_pass - 1) + rem + bead_w * (n_pass - 1)) * bead)|round(2)} speed={speed|round(2)} dry={dry}"
            {% if axis == "X" %}
                RESPOND PREFIX="purge" MSG="line start={a0|round(3)},{b0|round(3)} end={last|round(3)},{b1|round(3)} bbox={a0|round(3)},{b0|round(3)},{a1|round(3)},{b1|round(3)}"
            {% else %}
                RESPOND PREFIX="purge" MSG="line start={b0|round(3)},{a0|round(3)} end={b1|round(3)},{last|round(3)} bbox={b0|round(3)},{a0|round(3)},{b1|round(3)},{a1|round(3)}"
            {% endif %}
            G1 Z{zw + 2} F600
            {% if axis == "X" %}
                G1 X{a0|round(3)} Y{b0|round(3)} F{p.travel_f}
            {% else %}
                G1 X{b0|round(3)} Y{a0|round(3)} F{p.travel_f}
            {% endif %}
            G1 Z{zw} F600
            {% if not dry and prime_total > 0 %}
                G1 E{"%.3f"|format(prime_total)} F{brush.retract_f}
                SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=retracted VALUE=0
                {% if end_owed > 0 %}SAVE_VARIABLE VARIABLE=end_retract VALUE=0{% endif %}
                RESPOND PREFIX="purge" MSG="primed {"%.3f"|format(prime_total)}mm = {scrub} scrub + {end_owed} end debt"
            {% endif %}
            {% if not dry %}G1 E{p.tip} F300{% endif %}
            {% for i in range(n_pass) %}
                {% set off = b0 + bead_w * i %}
                {% set last_leg = (i == n_pass - 1) %}
                {% set span = rem if last_leg else run %}
                {% set to = (a0 + span) if i % 2 == 0 else (a1 - span) %}
                {% set e_this = (span * bead / fil_a) %}
                {% if i > 0 %}
                    {% if axis == "X" %}G1 Y{off|round(3)} {% else %}G1 X{off|round(3)} {% endif %}{% if not dry %}E{(bead_w * bead / fil_a)|round(4)} {% endif %}F{feed}
                {% endif %}
                {% if axis == "X" %}G1 X{to|round(3)} {% else %}G1 Y{to|round(3)} {% endif %}{% if not dry %}E{e_this|round(4)} {% endif %}F{feed}
            {% endfor %}
            {% if not dry %}G1 E-{p.retract_after} F1800{% endif %}
            G1 Z{zw + 2} F600
        {% else %}
            # Truly full is truly full. Say so rather than purging onto the part,
            # off the plate, or somewhere the next object will pave over. The
            # prime is still returned so the filament is at its nominal position
            # for the first extrusion command, which serves as the prime.
            {% if not dry and prime_total > 0 %}
                G1 E{"%.3f"|format(prime_total)} F{brush.retract_f}
                SET_GCODE_VARIABLE MACRO=_BRUSH VARIABLE=retracted VALUE=0
                {% if end_owed > 0 %}SAVE_VARIABLE VARIABLE=end_retract VALUE=0{% endif %}
                RESPOND PREFIX="purge" MSG="primed {"%.3f"|format(prime_total)}mm (no purge placed)"
            {% endif %}
            RESPOND PREFIX="purge" MSG="BED FULL - no purge placed. First layer starts unprimed."
        {% endif %}
    {% endif %}

    RESTORE_GCODE_STATE NAME=purge_line


[gcode_macro _PURGE_STATUS]
description: Report what PURGE_LINE would do with the current settings.
gcode:
    {% set p = printer["gcode_macro _PURGE"] %}
    {% set noz = params.NOZZLE|default(0.4)|float %}
    {% set volume = p.vol_b + p.vol_k * noz * noz %}
    {% set qa = 2 * 3.14159265 + 1 %}
    {% set qb = 3 * 3.14159265 * p.r_min %}
    {% set w_fit = ((qb * qb + 4 * qa * volume / (p.bead_h_ratio * noz)) ** 0.5 - qb) / (2 * qa) %}
    {% set bead_w = [[p.bead_w_ratio * noz, w_fit]|min, p.bead_w_min_ratio * noz]|max %}
    {% set bead = bead_w * p.bead_h_ratio * noz %}
    {% set length = volume / bead %}
    RESPOND PREFIX="purge" MSG="nozzle={noz} vol={volume|round(2)} bead={bead_w|round(3)}x{(p.bead_h_ratio*noz)|round(3)} area={bead|round(4)} length={length|round(1)} (vol = {p.vol_b} plus {p.vol_k} n squared)"
    RESPOND PREFIX="purge" MSG="objects labelled: {printer.exclude_object.objects|length if printer.exclude_object is defined else 'exclude_object not loaded'}"

# END SOURCE: klipper/config/purge_line.cfg

# BEGIN SOURCE: klipper/config/cancel_print.cfg
# CANCEL_PRINT — make the shutdown survive an unhomed cancel
#
# Include AFTER Macro.cfg. Includes apply linearly and duplicate sections merge
# with the later one winning (configfile.py uses RawConfigParser(strict=False)),
# so this overrides Sovol's CANCEL_PRINT without editing their file, which
# factory_resets.sh overwrites. `rename_existing` is deliberately not repeated:
# it is already set on the merged section by Macro.cfg.
#
# WHY THIS EXISTS
#
# Sovol's CANCEL_PRINT retracts, lifts Z and parks XY with no homed check, and
# it does that BEFORE turning anything off:
#
#     G1 Z+10 F3000          <- "Must home axis first" on an unhomed machine
#     G90
#     G1 X{x_park} Y{y_park} F9000
#     TURN_OFF_HEATERS       <- never reached, because the move above threw
#     ALL_FAN_OFF
#     CLEAR_PAUSE
#     PRINT_END
#     M84
#
# A G-code error abandons the rest of the rendered script, so cancelling before
# G28 completes leaves the heaters commanded, the fans running, the steppers
# enabled and the power-loss state uncleared. Observed 2026-08-25 when
# SPOOL_GUARD refused a job from the first line of the start G-code: nothing was
# hot yet, so nothing was harmed, but PRINT_END demonstrably did not run.
#
# Two deviations from stock, both deliberate:
#
#   1. Everything that turns things off runs first, and unconditionally. None
#      of TURN_OFF_HEATERS, ALL_FAN_OFF, CLEAR_PAUSE, PRINT_END or M84 moves
#      the toolhead, so none of them can throw the way a move can. Cleanup then
#      survives any motion failure, not only this one.
#   2. The retract, lift and park happen only with all three axes homed. On an
#      unhomed machine they are skipped silently rather than throwing.
#
# Sovol also announces "Cancel Print Success!" through action_respond_info,
# which Jinja evaluates while RENDERING the template -- so it printed before the
# move that then failed, claiming success for a cancel that had not happened.
# RESPOND runs at execution time instead, so it is only seen if the macro
# actually reaches the end.

[gcode_macro CANCEL_PRINT]
description: Cancel the print, shutting down safely even if nothing is homed.
gcode:
    {% set x_park = printer['gcode_macro _global_var'].cancel_park.x|float %}
    {% set y_park = printer['gcode_macro _global_var'].cancel_park.y|float %}
    {% set z_lift_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance %}
    {% set e_retract = printer['gcode_macro _global_var'].cancel_park.e|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}
    {% set homed = printer.toolhead.homed_axes|lower == "xyz" %}

    CANCEL_PRINT_BASE

    # Cancel never ramps, and it kills a ramp already running. A cancel is the
    # one case where the reason for stopping is unknown -- a thermal fault, a
    # fan stall, an operator watching something go wrong -- so the controlled
    # cooldown's assumption that this was a healthy finished print does not
    # hold. This must come before TURN_OFF_HEATERS so no scheduled tick can
    # re-command a heater afterwards.
    {% if 'gcode_macro _COOL_STATE' in printer %}
        COOLDOWN_ABORT
    {% endif %}

    # Forget the cancelled job's handshake. START_PRINT normally clears it, but
    # a job cancelled during heat-up never gets there, and a stale flag would
    # let the next, unidentified job past the mode check in svzero_pack.cfg.
    {% if 'gcode_macro _SVZERO_PACK' in printer %}
        SET_GCODE_VARIABLE MACRO=_SVZERO_PACK VARIABLE=seen VALUE=0
    {% endif %}

    # The sliced tier's square corner velocity goes with the job, as in END_PRINT.
    # Not a move, so it cannot throw on an unhomed machine.
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}

    # Off first. Sovol put these last, behind a move that can throw.
    TURN_OFF_HEATERS
    ALL_FAN_OFF
    CLEAR_PAUSE
    PRINT_END

    {% set skipped = [] %}
    {% if homed %}
        G91
        # `enabled`, not `enable` -- Sovol has this one right here, unlike
        # END_PRINT. See notes/kb/end-of-print.md.
        {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
              printer['filament_switch_sensor filament_sensor'].filament_detected == True
        %}
            {% if (printer.extruder.target != 0 and
                   printer.extruder.temperature >= printer.extruder.target and
                   printer.extruder.temperature >= e_mintemp)
            %}
                G1 E-{e_retract} F500
            {% else %}
                {% set null = skipped.append('retract') %}
            {% endif %}
        {% endif %}

        {% if (printer.gcode_move.position.z + 10) < z_lift_max %}
            G1 Z+10 F3000
        {% else %}
            G1 Z+{(z_lift_max - printer.gcode_move.position.z)} F3000
        {% endif %}
        G90
        G1 X{x_park} Y{y_park} F9000
    {% else %}
        {% set null = skipped.append('lift and park, not homed') %}
    {% endif %}

    M84

    # One line, and only at execution time. Sovol used action_respond_info,
    # which Jinja evaluates while rendering, so its "Success!" printed before
    # the move that then failed.
    RESPOND PREFIX="CANCEL:" MSG="outputs off{% if skipped %} - skipped {skipped|join(', ')}{% endif %}"

# END SOURCE: klipper/config/cancel_print.cfg

# BEGIN SOURCE: klipper/config/end_print.cfg
# END_PRINT — restore Sovol's own end-of-print retract, and record it as a debt
#
# Include AFTER Macro.cfg. Includes apply linearly and duplicate sections merge
# with the later one winning (configfile.py uses RawConfigParser(strict=False)),
# so this overrides Sovol's END_PRINT without editing their file, which
# factory_resets.sh overwrites.
#
# WHY THIS EXISTS
#
# Sovol's END_PRINT already contains a 4 mm retract. It has never run on any
# Zero. The guard reads
#
#     printer['filament_switch_sensor filament_sensor'].enable == True
#
# but Klipper's filament_switch_sensor exposes `enabled`, not `enable`. The
# missing attribute renders as Undefined, Undefined == True is False, and the
# block has no else -- so it is skipped unconditionally, on every print, on every
# firmware from 1.3.7 through 1.4.7. See notes/kb/end-of-print.md.
#
# The consequence is not cosmetic: every print ends with a full melt zone at
# temperature, the nozzle oozes a bead as it cools, and that bead solidifies on
# the tip. The next print therefore starts against OLD HARD CRUD rather than
# fresh ooze -- which the brush displaces without liberating, and which ends up
# on the purge ring.
#
# STOCKALIKE. This is Sovol's structure and Sovol's numbers. The only changes are
# the corrected attribute name and the debt bookkeeping. The 1.4.7 homed_axes
# wrapper is kept because it is strictly safer and harmless on 1.3.7.
#
# THE DEBT
#
# A retract at the end of a job has to be given back at the start of the NEXT
# one, so it cannot live in a gcode_macro variable -- those do not survive the
# restart in between. It goes to save_variables, alongside nb_lane, and
# CLEAN_NOZZLE returns it. CLEAN_NOZZLE is called by Sovol's own START_PRINT, so
# the whole cycle closes with NO slicer involvement and works with any profile,
# including Sovol's stock ones.
#
# It is SET, never accumulated. If the debt is never returned -- a print sliced
# somewhere that does not reach CLEAN_NOZZLE -- the next END_PRINT overwrites it
# with the same 4 mm rather than growing it without bound.

[gcode_macro _END_PRINT_CFG]
description: Settings for the END_PRINT override. Edit here, not in the macro.
variable_retract_mm: 4.0       # Sovol's own intent: 2 mm, then 2 mm with a 0.2 Z lift
variable_retract_f: 2700
gcode:

[gcode_macro END_PRINT]
description: Finish the print, retract as Sovol intended, and record the debt.
variable_state: 'normal'
gcode:
    {% set c = printer["gcode_macro _END_PRINT_CFG"] %}
    {% set z_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance|int %}
    {% set e_mintemp  = printer.configfile.settings['extruder'].min_extrude_temp %}

    # COOLDOWN. Decided here, before anything is turned off, because the inputs
    # are the print's own live setpoints and TURN_OFF_HEATERS destroys them. The
    # bed target is still this print's, and ch_target is whatever M141 last set.
    # Neither is carried across a job boundary, so neither can go stale.
    #
    # Default ON: Sovol's single-step drop to ambient is not behaviour worth
    # preserving. cooldown.cfg is optional and the guard makes an installation
    # without it identical to before.
    {% set cool_ok = 'gcode_macro _COOL_STATE' in printer %}
    {% set cool_final = printer["gcode_macro _COOL_STATE"].p_final|float
                        if cool_ok and printer["gcode_macro _COOL_STATE"].policy_set|int == 1
                        else (printer["gcode_macro _COOLDOWN_CFG"].final|float if cool_ok else 0.0) %}
    {% set ramp = (cool_ok
                   and printer.save_variables.variables.cool_enable|default(1)|int == 1
                   and (printer.heater_bed.target|float > cool_final
                        or printer.save_variables.variables.ch_target|default(0.0)|float > cool_final)) %}

    M117 Finish Print!!!
    # REMEMBER WHAT THIS PRINT RAN AT, so the next one can infer a wipe
    # temperature without the slicer. Captured here because the extruder target
    # is still live at END_PRINT -- the retract guard below depends on exactly
    # that, and saved_variables carrying end_retract = 4.0 is the evidence it
    # holds. The slicer's own M104 S0 arrives after this macro, not before.
    #
    # Persisted rather than kept in RAM: the whole point is to survive the
    # restart between jobs, which is the same reason the retract debt lives
    # here. Only ever a fallback -- a job that names its material still wins.
    {% if printer.extruder.target|float > 0 %}
        SAVE_VARIABLE VARIABLE=last_nozzle_temp VALUE={printer.extruder.target|float|round(0)}
    {% endif %}
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        G91
        # `enabled`, not `enable`. That single character is the whole fix.
        {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
            printer['filament_switch_sensor filament_sensor'].filament_detected == True
        %}
            # Stock also tested `temperature >= target`. Under PID at steady
            # state the reading oscillates either side of the target, so that
            # clause is a coin flip -- it would retract on roughly half of all
            # prints, at random. Print 1 lost its retract to exactly this. What
            # the test is FOR is "the heater is meant to be on, and we are hot
            # enough to extrude", and the two remaining clauses say that
            # precisely. Second deliberate deviation from stock, after `enabled`.
            {% if (printer.extruder.target != 0 and
                printer.extruder.temperature >= e_mintemp)
            %}
                # Sovol's split move, preserved: half the retract, then the rest
                # combined with a small Z lift so the tip leaves the surface
                # while it is still pulling back.
                M83
                G1 E-{c.retract_mm / 2} F{c.retract_f}
                G1 E-{c.retract_mm / 2} Z0.2 F2400
                SAVE_VARIABLE VARIABLE=end_retract VALUE={c.retract_mm}
                RESPOND PREFIX="endprint" MSG="retracted {c.retract_mm}mm - CLEAN_NOZZLE will return it next job"
            {% endif %}
        {% endif %}

        # Stock's relative 10 mm lift, for a ramp and for a plain finish alike.
        #
        # The ramp USED to park at a fixed high Z, reasoning that the stock
        # chamber sensor is corrupted by bed geometry below about 68 mm, so a
        # ramp left wherever the print ended would measure a different chamber
        # on a short print than on a tall one. Removed 2026-09-03 on the
        # operator's call, and the argument against it is the stronger one: that
        # corruption is present through the whole preheat and the whole print
        # too. Parking high for the cooldown does not fix a sensor, it just
        # makes the cooldown the one phase measured differently from the rest.
        #
        # It also cost something real. The park fires from END_PRINT before
        # _COOLDOWN_START has run, so a ramp that then fails to start -- as one
        # did, to a stray M141 S0 -- leaves the machine parked at Z100 for
        # nothing. And it gave the end-of-print observer a different camera
        # geometry on ramping prints than on non-ramping ones, which is exactly
        # the confound that campaign exists to avoid.
        {% if (printer.gcode_move.position.z + 10) < z_max %}
            G1 Z+10 F3000
        {% else %}
            G1 Z+{(z_max - printer.gcode_move.position.z)} F3000
        {% endif %}
        G90
        G1 X-2 Y152.5 F9000
    {% endif %}
    # Square corner velocity back to printer.cfg's. The sliced tier set its own
    # with SET_VELOCITY_LIMIT, which assigns rather than clamps, and nothing else
    # resets it: the next job, a manual move or a macro would inherit it.
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}
    ALL_FAN_OFF
    # Extruder only when a ramp follows: the bed and, if fitted, the chamber
    # heater stay commanded and _COOLDOWN_START takes ownership of them. It is
    # responsible for TURN_OFF_HEATERS in every path where it does not schedule
    # one, so this macro always ends in a defined thermal state.
    #
    # M104 S0 goes through chamber_fan.cfg's wrapper, which hands the exhaust
    # vent floor TARGET=0 -- the floor then persists on its own terms until the
    # nozzle passes 45 C, independently of the ramp. That is deliberate: it is a
    # FUME behaviour, not a chamber-control one.
    #
    # NOT a heatbreak one either, which this comment used to claim. The vent
    # floor is an addition of ours and its only purpose is extracting fumes
    # while the hotend is hot. It borrows 45 C from the stock heatbreak fan's
    # trigger because that was a convenient threshold, and borrowing a number is
    # not sharing a purpose -- chamber_fan.cfg says so directly: "Fume
    # extraction follows commanded heat; the heatbreak fan keeps its own
    # predicate and is not changed here." The heatbreak fan is untouched by any
    # of this.
    {% if ramp %}
        M104 S0
    {% else %}
        TURN_OFF_HEATERS
    {% endif %}
    M220 S100
    M221 S100
    # 1.4.x only. Zero2's 1.3.7 _global_var has no such variable and
    # SET_GCODE_VARIABLE raises on an unknown name, which aborted the rest of
    # this macro -- CLEAR_PAUSE, PRINT_END and M84 never ran, and the job was
    # reported cancelled. Guarded so one file serves both firmwares.
    {% if 'filament_sensor_print' in printer['gcode_macro _global_var'] %}
        SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=filament_sensor_print VALUE=False
    {% endif %}
    CLEAR_PAUSE
    PRINT_END
    M84 X Y Z E
    # Last, so every cleanup step above has already run whatever the ramp does.
    {% if ramp %}
        _COOLDOWN_START
    {% endif %}
    {action_respond_info("Finish Print!")}

# END SOURCE: klipper/config/end_print.cfg

# BEGIN SOURCE: klipper/config/filament_load.cfg
# LOAD_FILAMENT / UNLOAD_FILAMENT — Sovol's macros plus end_retract clearing
#
# Include AFTER Macro.cfg. Overrides both macros to clear the end-of-print
# retract debt in save_variables. When the user manually loads or unloads
# filament via the touchscreen, the previous print's retract debt is stale:
# the filament has been manually seated and the stored 4 mm debt would
# over-prime on the next job. Both macros clear it.
#
# UNLOAD is STOCKALIKE — Sovol's own code, unchanged, plus the SAVE_VARIABLE.
#
# LOAD carries one further change: a G1 E8.4 after Sovol's E45/E30, which is the
# MEASURED shortfall of their purge on a colour change, not a guess. The comment
# at that line has the arithmetic and the caveat. Said here because a header that
# claims "unchanged" is how a real deviation stops being reviewed.

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            M117 Nozzle heating...
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        M117 Extruding...
        G91
        G1 E45 F300
        G1 E30 F150
        # THE ONE ADDITION TO SOVOL'S SEQUENCE, and it is a measurement.
        #
        # `E45 F300 / E30 F150` is byte-identical across SV06 ACE, SV06 ACE
        # PLUS, SV08, SV08 MAX and the Zero -- a bed-slinger, a 500 mm CoreXY
        # and a 152 mm box all told to extrude the same 75 mm. It was never
        # re-derived for this machine.
        #
        # Loading black ABS over yellow PLA on 2026-09-03 left HALF THE PURGE
        # RING still yellow. PURGE_LINE logged that ring at 40.63 mm3, so the
        # changeover was still running about 20.3 mm3 into it -- 8.4 mm of
        # 1.75 mm filament, which is what this line adds.
        #
        # Why it is that short: the 30 mm purge leg is 72.2 mm3, and the Zero's
        # melt zone is reportedly 32 mm long (cardoc, forum 2025-05-08,
        # unverified -- notes/kb/toolhead-lineage.md). At a 1.85-2.00 mm bore
        # that is 86-100 mm3, so the stock purge does not sweep the melt zone
        # even ONCE. Half a yellow ring is the expected result, not a near miss.
        #
        # 8.4 mm is deliberately NOT the textbook fix. A colour change wants
        # three to five melt volumes, 113-189 mm, and this is the measured
        # shortfall for the one transition observed rather than a general
        # answer. The number to settle before going further is how much of the
        # 45 mm fast leg is TRANSIT rather than purge: with a 32 mm melt zone
        # the gear-to-nozzle path could be near 55 mm, in which case E45 never
        # reaches the nozzle and the real purge is under 20 mm. Load with the
        # nozzle hot and count extrusion until material appears; two minutes.
        G1 E8.4 F150
        G90
        M400
        M117 Extrude Finish
        M400
        # Clear the end-of-print retract debt. The user just manually loaded
        # filament, so whatever position it was retracted to is no longer relevant.
        SAVE_VARIABLE VARIABLE=end_retract VALUE=0
        {% if current_target_temp == 0 or printer.print_stats.state != "paused"%}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't load filament during printing!!!")}
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            M117 Nozzle heating...
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        M117 Retracting...
        G91
        G1 E+25 F300
        G1 E-10 F1500
        G1 E-20 F600
        M400
        G4 P3000
        G1 E-50 F300
        G90
        M400
        M117 Retract Finish
        M400
        # Clear the end-of-print retract debt. The user just manually unloaded
        # filament, so the stored debt is stale.
        SAVE_VARIABLE VARIABLE=end_retract VALUE=0
        {% if current_target_temp == 0 or printer.print_stats.state != "paused"%}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}

# END SOURCE: klipper/config/filament_load.cfg

# BEGIN SOURCE: klipper/config/orca_compat.cfg
# Slicer compatibility shims — commands slicers emit that stock Klipper lacks
#
# Include AFTER Macro.cfg. Nothing here changes machine behaviour; each macro
# absorbs a command that a slicer emits unconditionally and Klipper would
# otherwise reject, so a real error in the console stays worth reading.

# OrcaSlicer emits a tool-select before the first layer even on a single-extruder
# machine. It is not in our filament presets -- checked, zero of 24 contain it --
# so it comes from Orca's own G-code writer and cannot be switched off in a
# profile. Klipper has no T0, so every Orca job logs
#
#     Unknown command:"T0"
#
# once at the start. Harmless, but it trains you to ignore console errors, which
# is the actual cost. A no-op absorbs it.
#
# Deliberately does NOT set an active extruder: this machine has one, Klipper
# already selects it, and ACTIVATE_EXTRUDER here would be a real state change
# in a shim whose whole purpose is to change nothing.
[gcode_macro T0]
description: No-op. Absorbs OrcaSlicer's single-extruder tool select.
gcode:
    # intentionally empty

# END SOURCE: klipper/config/orca_compat.cfg

# Post-print controlled cooldown. MUST follow chamber_fan.cfg and end_print.cfg:
# END_PRINT guards on _COOL_STATE existing, and the ramp stops chamber_fan.cfg's
# loop when it begins and drives the exhaust fan that file names.

# BEGIN SOURCE: klipper/config/cooldown.cfg
# Post-print controlled cooldown — synchronized bed and chamber ramp
#
# Include AFTER Macro.cfg, chamber_fan.cfg and end_print.cfg. Optional: a
# printer without this file prints exactly as before, because END_PRINT and
# CANCEL_PRINT both guard on `'gcode_macro _COOL_STATE' in printer`.
#
# WHAT IT DOES
#
# Sovol's END_PRINT drops the bed and the chamber from print temperature to
# ambient in one step. This holds both on a scheduled descent to a common
# endpoint so the part and the plate contract together instead of the part
# shrinking against a plate still held at 110 C.
#
# NOT ANNEALING. PC's Tg is around 147 C and it prints on a 110 C plate, so the
# part is already glassy before the ramp starts and no stress relaxation is
# available at these temperatures. What the ramp buys is a smaller part-to-plate
# differential, no exhaust draft across one face, and a smaller top-to-bottom
# gradient. The re-warm destress cycle some community macros run afterwards is
# deliberately NOT implemented here.
#
# THE ARITHMETIC, recovered from the 2026-01-02 design. See
# notes/design-end-print-cooldown.md.
#
#   t_total = max((C0 - final) / chamber_rate, (B0 - final) / bed_rate)
#   rc      = (C0 - final) / t_total          actual chamber rate
#   rb      = (B0 - final) / t_total          actual bed rate
#
# Taking the max means the SLOWER constraint governs and the other is slowed to
# match, so both arrive at the endpoint together and neither cap is violated.
# The 40/70 edge case is why: a chamber-only schedule there would demand
# 10.5 C/min from the bed.
#
# TWO ACTUATOR MODELS, one macro.
#
# With a chamber heater installed the trajectory is a real setpoint: the heater
# gets it, and the exhaust ceiling is held `deadband` degrees ABOVE it so the
# exhaust is only ever a brake against overshoot. Without that gap a watermark
# heater with max_delta 1.0 drives to T+1 while the exhaust PI vents above T,
# and the two burn power into the room for the length of the ramp.
#
# Without a chamber heater the exhaust is the only actuator and it can only
# cool, so the trajectory is a CEILING: the chamber falls passively and the fan
# runs only when the chamber is lagging the schedule. Same arithmetic, same
# state machine, and the fan is idle for most of a normal descent.
#
# WHY NOT M141 PER STEP
#
# M141 is the right user-facing command and the wrong per-tick one, twice over.
# It calls _CHAMBER_ON, which zeroes the PI integral and the priming flags -- so
# re-issuing it every 40 s would reset the chamber controller roughly fifty
# times across one ramp. And it sets _CH_STATE.requested, the RAM flag
# _CHAMBER_AUTOSTART consumes to mean "the slicer asked for this chamber target
# THIS print"; leaving it set would make the next print believe the slicer had
# requested a 37 C ceiling. The loop re-reads ch_target from save_variables on
# every iteration, so writing it directly moves the ceiling with no side
# effects at all.

[gcode_macro _COOLDOWN_CFG]
description: Settings for the post-print cooldown ramp. Edit here, not in the macros.
# Common endpoint for bed and chamber. Operational, not a Tg calculation:
# below anything that matters here, above room temperature so the ramp is not
# servoing to ambient, and a clean point to release active control.
variable_final: 35.0
# Maxima on the COMMANDED target descent, not guarantees about measured
# temperature. COOLDOWN_ARM BED_RATE= overrides them for one print.
# 0 = no chamber leg, matching every row of _COOLDOWN_MATERIALS. This is the
# fallback used when NO material was identified, and leaving it at 1.5 would
# have meant an unidentified spool still ran a chamber ramp that every named
# material had opted out of -- which is also the path the last real ramp took,
# with material "default".
variable_chamber_rate: 0.0
# ONE BED RATE FOR EVERY MATERIAL, since 2026-10-12 (operator): 3 C/min. The
# material rows used to carry their own, 1.0 to 5.0; they now set only the
# endpoint. Above about 85 C the plate falls faster than this on its own and the
# heater brakes it; below, it falls slower and the fan assist makes up what it
# can. A slower descent is one override away, in a file of your own:
#
#     [gcode_macro _COOLDOWN_CFG]
#     variable_bed_rate: 1.0
variable_bed_rate: 3.0
# Nominal chamber quantum. The real step is derived from the achieved rate and
# the cadence, so this only sets how fine the staircase is. At the recovered
# 1.5 C/min it produces the original 1 C every 40 s.
variable_chamber_step: 1.0
# How far above the chamber-heater setpoint the exhaust ceiling sits. Ignored
# entirely when no chamber heater is installed.
variable_deadband: 2.0
# SETTLE PHASE: the bed holds its print target until the NOZZLE HAS COOLED TO
# THE BED, then the ramp begins (operator, 2026-09-14). Once the hotend is no
# hotter than the plate it is no longer adding heat above it, so there is
# nothing left to wait for -- a few minutes after a hot ABS nozzle is switched
# off.
#
# It used to wait for the chamber to go flat, and that was not useful. The
# slope first came from the chamber loop, which reads 0.0 whenever the loop is
# off, so settle ended at its 3-minute floor regardless. Measured from the
# sensor instead, it held print 2 of 2026-09-14 for 10.5 min against the 10-min
# cap, bed at 100 C, with the chamber still falling when the ramp started.
#
# settle_max stays as a backstop, so a nozzle that never reads below the bed --
# a missing sensor, a reheated hotend -- cannot hold the plate indefinitely.
variable_settle_max: 600
# 5 s, down from 15 on 2026-10-13: the ramp's first step is taken on the tick
# that sees the nozzle reach the bed, so this is how late that step can be.
variable_settle_tick: 5
# park_z IS GONE, not merely unset. END_PRINT parked at a fixed high Z for the
# whole ramp, reasoning that the stock chamber sensor is corrupted by bed
# geometry below about 68 mm. Removed 2026-09-03: that corruption is present
# through the preheat and the print too, so parking high for the cooldown does
# not fix a sensor, it only makes the cooldown the one phase measured
# differently. Deleted rather than defaulted to zero, because a knob left
# sitting here is an invitation to switch the behaviour back on without
# re-reading why it went.
# Absolute watchdog. Whatever else happens, heaters are off by here.
variable_max_seconds: 5400
# Report once when the bed is coasting this far above its commanded setpoint:
# natural loss is slower than the schedule, so the trajectory is aspirational
# and the bed heater has no authority left. Informational, not an abort -- the
# target keeps descending and the bed catches up.
variable_coast_delta: 5.0
# Any larger disagreement between what we last commanded and what the heater
# actually holds means somebody else moved it. Abort rather than fight them.
variable_override_delta: 0.5
# Head-room added to the idle_timeout extension. See _COOLDOWN_TICK.
variable_idle_margin: 300
# HOW OFTEN THE RAMP RE-EVALUATES, in seconds. Decoupled from the step size on
# 2026-09-05. It used to be that the tick period WAS the schedule: each tick
# subtracted one c_step from the last commanded value, so the only way to get a
# finer descent was a shorter step, and the only way to get a shorter step was
# a faster tick. `interval` therefore had to be ~104 s to make a 1 C chamber
# step come out at 1.5 C/min, and the console went silent for that whole time.
#
# The commanded value is now a function of ELAPSED SECONDS -- c0 - rate * t --
# so this only sets how often that function is sampled and how promptly the
# assist and the abort guards see the world. Granularity of the descent no
# longer depends on it at all.
variable_ramp_tick: 15
# How often to say something while SETTLING. The ramp reports once per degree
# of measured bed instead; see the progress block in _COOLDOWN_TICK. The macro
# has no wall clock -- Klipper's Jinja environment exposes no time-of-day -- so
# progress is reported as minutes remaining rather than as a finish time.
variable_report_seconds: 60
# The shortest span the plate's own cooling rate is measured over, for the
# ramp's time-left estimate. The per-minute lines it replaced used 60 s, and
# their figure rose between lines on a third of them.
variable_eta_window: 240
gcode:

# THE MATERIAL TABLE LIVES HERE, not in the slicer.
#
# It used to be generated into the start G-code from
# source/filament-cooldown.json, which meant the numbers existed twice and a
# print sliced anywhere else silently got the generic row. Now the slicer only
# NAMES the material and Klipper owns the policy, so the same print gets the
# same descent from Orca, from PrusaSlicer, from Sovol's stock profile, or from
# no slicer involvement at all -- the spool itself can name it.
#
# Keys are normalize_material() output from spool_guard.py: lowercased with
# non-alphanumerics stripped. Matched exactly, then by prefix over `order`,
# which is sorted longest-first so "plaplus" lands on PLA and "petg" is never
# swallowed by a shorter key.
#
# THE BED RATE IS ONE NUMBER, _COOLDOWN_CFG.bed_rate, since 2026-10-12. Rates
# are maxima on the COMMANDED descent, read against the MEASURED passive decay
# curve in notes/data/cooldown/zero2-passive-decay-20260903.md:
#
#   bed 90-100 C  5.06 C/min     50-60 C  1.02
#       80- 90    3.46           40-50    0.58
#       70- 80    2.61           30-40    0.22
#       60- 70    1.84           20-30    0.07
#
# A commanded rate BELOW that curve is one the bed heater can hold, and it
# brakes the descent. A rate ABOVE it is one the bed cannot follow unaided, and
# it is the assist's job to make up -- see _COOLDOWN_ASSIST_CFG. The old
# recovered default of 5.0 C/min sat above the curve everywhere below 90 C,
# which is why it did nothing. The rows below set each material's endpoint.

[gcode_macro _COOLDOWN_MATERIALS]
description: Per-material descent policy. Data, not a command.
# THE CHAMBER LEG IS OFF. All chamber rates are 0, so every ramp is bed-only.
#
# Operator's call, 2026-09-08: "the chamber rampdown is irrelevant, focus on the
# bed". The reasoning is sound and the measurement supports it. The chamber has
# no heater on this machine, so a descending chamber CEILING is not a
# temperature schedule at all -- it is a request to the exhaust PI loop, which
# already has the forced-cooling assist as a far more direct handle on the same
# fan. And the chamber tracks the plate anyway: it is the plate that heats it.
# Scheduling both legs was asking two controllers to chase one physical
# coupling.
#
# It also removes an entire failure class. A chamber leg CLAIMS the ceiling, so
# any other writer of ch_target aborts the ramp -- which is exactly what killed
# the 2026-09-07 ABS cooldown on its first tick. With chamber 0 and the assist
# idle, ch_claimed is false and there is nothing to collide over.
#
# The rates are kept here rather than deleted, at 0, because the column is the
# record of what the policy USED to be and re-enabling one material is then a
# one-number change. Previous values, C/min: abs 1.0, asa 1.0, pc 0.8,
# petg 1.5, pla 2.0, tpu 1.5, pa 2.0.
#
# THE BED COLUMN IS GONE, for the same reason in reverse: one bed rate for every
# material, in _COOLDOWN_CFG (operator, 2026-10-12). Its last values, C/min:
# abs 1.5, asa 1.5, pc 1.0, petg 2.0, pla 3.0, tpu 2.0, pa 5.0.
variable_table: {
        "abs":  {"final": 35.0, "chamber": 0.0},
        "asa":  {"final": 35.0, "chamber": 0.0},
        "pc":   {"final": 35.0, "chamber": 0.0},
        "petg": {"final": 35.0, "chamber": 0.0},
        "pla":  {"final": 30.0, "chamber": 0.0},
        "tpu":  {"final": 35.0, "chamber": 0.0},
        "pa":   {"final": 35.0, "chamber": 0.0}
    }
variable_order: ["petg", "abs", "asa", "pla", "tpu", "pc", "pa"]
gcode:
    {% set m = printer["gcode_macro _COOLDOWN_MATERIALS"] %}
    RESPOND PREFIX="cooldown:" MSG="materials {m.table|length} rows, order {m.order|join(' ')}"

# FORCED-COOLING ASSIST -- the other half of the authority.
#
# The bed heater can only ever SLOW the descent: it holds the plate above where
# losses alone would take it. Past the point where the commanded rate crosses
# the passive curve the heater has nothing left to give, and the schedule simply
# runs away underneath the real temperature. That crossover is at 62 C for ABS
# at 1.5 C/min, and everything below it was uncontrolled.
#
# The two fans cool. They are the only actuators that can pull the bed BELOW its
# passive curve, and they are what lets a schedule be tracked rather than merely
# braked. Both are gated, because forced air across a part is also the warp
# mechanism the whole ramp exists to avoid:
#
#   the exhaust  -- the curtain waits until the exhaust is at its ceiling.
#                   bed_ceiling can add a temperature gate on the curtain; it
#                   is off by default (see EXHAUST FIRST below).
#   lead         -- the assist aims the bed this far AHEAD of the schedule line
#                   and engages as soon as it is not, once the heater is idle.
#
# THE EXHAUST IS NOT DRIVEN DIRECTLY. On this machine it is _CH_HW.fan, owned by
# the chamber PI loop, and a direct SET_FAN_SPEED would be overwritten on that
# loop's next tick and would fight it in between. The ramp already owns
# ch_target, so the assist pulls the chamber CEILING down instead and lets the
# PI spend the fan. That composes with the controller rather than racing it.
#
# CURTAIN ON BY DEFAULT since 2.1.0 (operator, 2026-10-13). It is the actuator
# with real authority over the bed -- it blows across the plate rather than
# venting the box, 1.3 to 3.4 times the exhaust's cooling depending on the
# plate's height -- and so also the one that could hurt a part. It shipped off
# while its strength was a placeholder. With k(Z) measured, it comes in only
# once the exhaust is at its ceiling, and carries only what the exhaust cannot.
# curtain_enable: 0 puts the exhaust back on its own.

[gcode_macro _COOLDOWN_ASSIST_CFG]
description: Forced-cooling assist settings. Data, not a command.
variable_exhaust_enable: 1
variable_curtain_enable: 1
# NEVER LATE UNLESS THE FANS ARE AT FULL (operator, 2026-10-13). The bed is
# aimed `lead` C ahead of the schedule line, not behind it. Until then the
# assist engaged 1 C behind the line and its PI settled there, and the five
# Zero2 ramps since 2026-09-14 ran more than 0.2 C behind the line for 67-73 %
# of the ramp, a fan at full for almost none of it. By band: above 75 C, 32-40 %
# late, mean +0.11 to +0.15 C, the rounded whole-degree target sitting up to
# 0.5 C above the line (the target now leads it, see _COOLDOWN_TICK); 55-75 C,
# 83-92 % late, mean +0.4 to +0.6 C, the assist engaging late; below 55 C,
# 100 % late, mean +0.84 to +1.25 C, the PI holding the 1 C it was told to.
#
# 0.25 C of lead puts the bed heater to work for the last quarter of each
# whole-degree step: the target leads the line by up to 1 C, so a bed held a
# quarter-degree ahead of the line meets its target only as the next step
# comes due. That blip is the authority indicator -- a heater that fires now
# and then means the fans are cooling enough -- and the integral does not climb
# while it fires.
variable_lead: 0.25
# Engage once the error against that aim, now or projected, is above error_on;
# release (with assist_latch 0 only) once it is below -error_off. In C.
variable_error_on: 0.0
variable_error_off: 0.3
# ---- PI ON THE SCHEDULE ERROR, 2026-09-13 --------------------------------
#
#   demand = exhaust_floor + assist_kp * (err + lead) + I
#
# in exhaust-equivalent duty, clamped to [exhaust_floor, exhaust_max], or to
# exhaust_max + k * curtain_max while the curtain is allowed. I grows by
# assist_ki * (err + lead) per minute while the assist is engaged, with
# anti-windup, and never grows while the bed heater is firing; see
# _COOLDOWN_TICK for the rules.
#
# Replaces exhaust_span, a proportional band of 5 C that left 5 C of standing
# error with both fans near 0.4 on Zero2's curtain cooldowns. With the operator's
# rule -- a large error puts the fans at their ceiling -- kp 0.75 takes the
# exhaust from its floor to full 1.15 C behind the aim, and both fans to full
# 2.5 C behind it. ki 0.25 per C per minute gives an integral time kp / ki of
# 3 min, about three times the 30-60 s the plate took to answer the curtain step
# on 2026-09-13. Both are STARTING POINTS, not tuned values.
variable_assist_kp: 0.75
variable_assist_ki: 0.25
# Bed heater duty at or below which the assist may engage, on the error or on
# its projection. Above it the heater still has authority, whatever the error
# says: the first 1 C ramp step reads as a 1 C error before the heater has
# answered it (Zero2, 2026-09-14, heater at 17 %).
variable_authority_power: 0.02
# 0 means "use ch_minfan", the adaptively-learned duty at which this rotor
# reliably turns. Commanding less than that is commanding a stalled fan.
variable_exhaust_min: 0.0
variable_exhaust_max: 1.0

# ---- EXHAUST FIRST, CURTAIN IN RESERVE ------------------------------------
#
# REVISED 2026-10-13, on the operator's call: the curtain comes in once the
# exhaust has hit its ceiling, at any bed temperature. "At slow ramp rates this
# will leave the curtain off longer, but if a higher ramp is requested, it
# should do everything it can to hit it."
#
# The ladder, in exhaust-equivalent rpm (see curtain_strength_factor):
#
#   A  demand <= exhaust ceiling   exhaust = demand, curtain = 0
#   ~  the exhaust at its ceiling  the curtain LATCHES IN at its floor and the
#                                  exhaust steps down by what that adds,
#                                  k * curtain_floor, so total cooling is
#                                  unchanged across the handover: a swap, as
#                                  gentle as the floors allow (operator,
#                                  2026-10-13). At k 3 the curtain's floor is
#                                  worth most of the exhaust's range, so the
#                                  exhaust lands near its own floor.
#   B  above that                  the exhaust climbs back to its ceiling
#                                  first, then the curtain carries the rest,
#                                  (demand - exhaust ceiling) / k, up to
#                                  curtain_max.
#
# Coming back down, the curtain gives back first, to its floor, where
# curtain_hold keeps it; then the exhaust comes off its ceiling.
#
# What this replaces. From 2026-09-08 the curtain came in at a knee,
# exhaust_floor + k * curtain_floor, with the exhaust stepping DOWN to its floor
# as the curtain stepped up, and both then climbing together: two fans gently
# rather than one loudly. And from 2026-09-03 bed_ceiling (60 C) kept the
# curtain off a hot plate entirely. On the published-default ramp of
# 2026-10-13 (3 C/min, Zero2) the gate cost the schedule: from 75 to 60 C the
# exhaust ran at 97 % and the bed fell a degree behind with the curtain held
# off (notes/data/cooldown-published-20261013 in the project's repository). 60 C was
# the heater-authority crossing of ABS at 1.5 C/min, chosen by hand on
# 2026-09-03, never a measured limit for the part.
#
# MEASURED, 2026-10-13, AND IT DEPENDS ON THE BED HEIGHT. k is how much one
# fan cools the plate against the other. It used to be a placeholder of 1.0,
# taken as a ratio of DUTIES. It is now a ratio of measured strengths, and the
# blend below runs in each fan's own RPM rather than in duty, because cooling
# follows airflow, and airflow follows rpm far more closely than the PWM
# number does (operator, 2026-10-13). Each fan's rpm comes from its mapped
# duty curve, as a fraction of its rpm at the duty the strengths were measured
# at.
#
# The strengths: plate held at 80 C, box closed, fan0 off, toolhead parked
# where END_PRINT parks, each fan at 0.95 duty in bracketed 7-min blocks, two
# replicates per height (mean half-spread 0.8 W). The extra bed-heater power
# each fan forced, in W, measured and fitted (notes/data/fan-strength-20261013):
#
#   Z mm               12     40     75    115    150
#   exhaust          15.6   14.4   12.4   12.9   11.8
#     fit           15.11  14.40  13.51  12.49  11.60    15.41 - 0.0254 Z
#   curtain          53.4   37.2   20.9   16.9   19.7
#     fit           54.14  34.50  23.53  18.75  17.19    16.13 + 51.90 exp(-Z/38.5)
#   k measured       3.42   2.58   1.69   1.31   1.67
#   k fitted         3.58   2.40   1.74   1.50   1.48
#
# k is the ratio of the two fits at the plate's present Z, which during a
# cooldown is the part's height plus END_PRINT's 10 mm, clamped to 0-155. The
# exhaust barely cares where the plate is. The curtain blows across it: a 16 W
# far field, plus a jet that a plate high in the box takes full on and that
# halves every 27 mm of descent. The fit's residual is 2.2 W rms against 0.8 W
# of replicate scatter -- the real fall between Z40 and Z75 is sharper than one
# exponential -- and it smooths over Z115's low reading. This is what the
# 2026-09-13 handover and the 2026-10-12 refits kept saying, "k is above 1,
# but by how much the ramps cannot tell".
#
# curtain_strength_factor is now a TRIM on the measured k: 1.0 uses it as
# measured. If a handover dips, lower it; if it overshoots, raise it. The
# product is clamped to 0.05 from below; a curtain worth nothing is
# curtain_enable: 0, not a factor of zero.
variable_exhaust_w0: 15.41
variable_exhaust_w_per_mm: -0.0254
variable_curtain_w_far: 16.13
variable_curtain_w_near: 51.90
variable_curtain_w_mm: 38.5
variable_strength_duty: 0.95
# Duty to rpm, Zero2, tach at 2 pulses per rev. Exhaust: kb/mods/exhaust-fan-pid.md
# (stalls below 0.10). Curtain: fan-characterization/curtain-cooling-zero2-20260817
# and runbook-curtain-fan.md (749 rpm at its 0.14 cold-start floor). The run of
# 2026-10-13 read 7050 and 9010 rpm at 0.95, against 7094 and 9040 from these.
variable_exhaust_curve_duty: [0.0, 0.10, 0.12, 0.25, 0.50, 1.00]
variable_exhaust_curve_rpm: [0.0, 1925.0, 2113.0, 3015.0, 4456.0, 7387.0]
variable_curtain_curve_duty: [0.0, 0.14, 0.15, 0.20, 0.30, 0.40, 0.50, 0.65, 0.80, 1.00]
variable_curtain_curve_rpm: [0.0, 749.0, 1166.0, 2500.0, 3847.0, 4925.0, 5882.0, 7068.0, 8094.0, 9356.0]
variable_curtain_strength_factor: 1.0
# Where the curtain latches in. 0 DERIVES IT as the exhaust's ceiling,
# exhaust_max, read through its curve (2026-10-13). Same idiom as exhaust_min: 0
# above. Like demand, it is in exhaust rpm as a fraction of its rpm at
# strength_duty, not in duty. A lower figure brings the curtain in earlier, at
# its floor with the exhaust giving back the difference.
variable_curtain_latch: 0
# ONCE ON, THE CURTAIN STAYS ON for the rest of the ramp, at its floor or
# above (operator, 2026-10-12). The exhaust has held its floor this way since
# 2026-09-07 (assist_latch below); this does the same for the curtain.
#
# The release band was not enough. After it went to 0.15 on 2026-09-14, every
# curtain cooldown on Zero2 still dropped the curtain and took it back: the
# 2026-09-14 smooth-reference run, 2026-09-18 and the 2026-10-13 (UTC) casemount
# once each, the 2026-10-13 backcase twice, each time 1.0 to 1.8 min after it
# came on, with the bed 50-59 C. The handover adds more cooling than it takes away --
# the backcase ramp latched at demand 0.34 and released at 0.17 a minute later,
# still about 1 C behind the schedule -- which says k is above 1, but by how
# much the ramps cannot tell; see curtain_strength_factor. Holding the curtain
# makes that question one of how fast the plate falls, not whether the fans
# chatter: if the plate gets ahead of the schedule, the bed heater holds it.
# 0 brings back the release band below.
variable_curtain_hold: 1
# Release band, used only with curtain_hold: 0. 0.15, up from 0.05 on
# 2026-09-14. At assist_kp 0.75, 0.05 of demand is 0.07 C of error -- inside
# the bed sensor's own noise -- and on that day's ABS cooldown the curtain
# latched and released 8 times in 8 minutes. 0.15 is 0.2 C.
variable_curtain_unlatch: 0.15
# Lowest duty this rotor was MEASURED turning at: 20% -> 2500 rpm, 2026-08-17.
# Nothing below that was ever tried, so it is a floor of evidence rather than a
# floor of the hardware. NOT the exhaust's 0.13 -- that is a different fan with
# a different learned stall point, and borrowing it would put this one at a duty
# nobody has seen it start from.
variable_curtain_min: 0.20
# curtain_span is gone, 2026-09-13: one demand, driven by the PI, covers both
# fans, so there is no second band to size.
#
# Lowering curtain_max re-parks the burden on the exhaust: the curtain stops at
# its cap and the exhaust resumes climbing alone. It also lowers the ceiling on
# demand, exhaust_max + k * curtain_max.
variable_curtain_max: 1.0
# OPTIONAL, AND OFF: 0 means no temperature gate (operator, 2026-10-13). The
# curtain waits for the exhaust to reach its ceiling instead, at any bed
# temperature. Set a temperature to keep the curtain off above it; it gates the
# curtain only, never the exhaust. It was 60 C from 2026-09-03 to 2026-10-13.
variable_bed_ceiling: 0.0
# ---- LATCH, FLOOR AND RUN-AHEAD -------------------------------------------
#
# Observed 2026-09-07: the assist toggled the exhaust fully on and fully off as
# the error crossed back and forth, and the ramp then FINISHED with the plate at
# 40 C against a 35 C endpoint -- because `done` tested the COMMANDED value,
# which had reached 35 on schedule, rather than the plate, which had not.
#
# Three changes, and they are the same three the blended throttle already makes
# for the two fans:
#
#   LATCH    once the assist has engaged it stays engaged for the rest of the
#            ramp. Releasing to zero and re-engaging is the toggling; there is
#            nothing to be gained by it, because the schedule only ever gets
#            harder from here.
#   FLOOR    while latched the exhaust never returns below its stall floor. It
#            modulates between floor and max instead of between OFF and max.
#   AHEAD    engage on the error PROJECTED assist_lookahead seconds out, not on
#            the error now. The plate's thermal lag is the whole problem; by the
#            time the error is real the fan is already late.
variable_assist_latch: 1
variable_assist_lookahead: 30.0
# The ramp is not over until the PLATE is at the endpoint. finish_grace bounds
# how long it may keep trying past the schedule before giving up and saying so.
# finish_tolerance 0, down from 1.0 (operator, 2026-10-13): the endpoint is the
# endpoint. At 1.0 the published-default ramp on Zero2 stopped with the plate at
# 35.6 C on the first tick under 36. Kept as a setting, for now.
variable_finish_tolerance: 0.0
variable_finish_grace: 900.0
gcode:
    {% set a = printer["gcode_macro _COOLDOWN_ASSIST_CFG"] %}
    RESPOND PREFIX="cooldown:" MSG="assist exhaust={a.exhaust_enable|int} curtain={a.curtain_enable|int} lead={a.lead}C on={a.error_on}C off={a.error_off}C ceiling={a.bed_ceiling}C"


[gcode_macro _COOL_STATE]
description: Volatile cooldown state. Not saved, and must not be.
# Volatile ON PURPOSE. This is the _CHAMBER_AUTOSTART pattern: a persisted value
# does not mean "this print asked", it means "somebody asked, possibly three
# prints ago". Everything here dies with a Klipper restart and is consumed on
# use, so an omitted COOLDOWN_ARM falls back to the default policy rather than
# silently reusing the last print's.
variable_active: 0
variable_phase: 0
variable_policy_set: 0
variable_p_final: 35.0
variable_p_chamber_rate: 1.5
variable_p_bed_rate: 5.0
variable_c0: 0.0
variable_b0: 0.0
variable_c_cmd: 0.0
variable_b_cmd: 0.0
variable_c_step: 0.0
variable_b_step: 0.0
variable_interval: 40.0
# THE SCHEDULE ITSELF, in C/min, and its total length in seconds. These are what
# the descent is actually computed from since 2026-09-05; c_step and b_step are
# retained because `c_step > 0` is the chamber-leg predicate used throughout
# this file and because _COOLDOWN_STATUS reports them, but nothing derives a
# commanded temperature from them any more.
variable_c_rate: 0.0
variable_b_rate: 0.0
variable_total_s: 0.0
# Seconds-elapsed stamp of the last settle progress line, so settling is
# reported every report_seconds rather than every tick.
variable_last_report: 0
# The last whole degree of bed the ramp has reported. The ramp says one line per
# degree passed; this only ever falls, so a plate hovering on a boundary cannot
# repeat a line.
variable_last_degree: 0
variable_has_heater: 0
variable_elapsed: 0
variable_settle_elapsed: 0
variable_idle_restore: 1800.0
variable_coast_warned: 0
# Resolved once at _COOLDOWN_START and reported, so the console line says which
# policy actually ran rather than leaving it to be inferred from three numbers.
variable_material: "default"
# Whether COOLDOWN_ARM supplied explicit rates. Naming a material is the normal
# case; passing numbers is the experiment case, and it wins.
variable_rates_set: 0
# Assist state. `assist` is the hysteresis latch, not a request.
variable_assist: 0
variable_assist_curtain: 0.0
variable_assist_exhaust: 0.0
# 1 once the blended throttle has handed the marginal cooling to the curtain.
# Held across ticks so the release can carry hysteresis; see _COOLDOWN_ASSIST_CFG.
variable_curtain_latched: 0
# Last value handed to SET_IDLE_TIMEOUT. Klipper's idle_timeout.py answers every
# one with "Timeout set to N s" on the console, and the ramp re-sent the SAME
# number every 15 s tick -- four identical lines a minute for the whole descent.
# Written on change only, like the bed target and the assist floor above it.
variable_idle_set: 0.0
# 1 once the assist has engaged at any point in this ramp. Latched, so the
# exhaust holds its floor instead of switching off and on again.
variable_assist_latched: 0
# Previous tick's schedule error, for the run-ahead projection.
variable_prev_err: 0.0
# The assist PI's integral term, in exhaust-equivalent duty. Zeroed on every
# engagement and at start and clear; see _COOLDOWN_TICK.
variable_assist_i: 0.0
# Seconds spent past the scheduled end waiting for the plate to actually arrive.
variable_overrun_s: 0.0
# A bed sample and the elapsed time it was taken at, for the MEASURED cooling
# rate. The console ETA used to be pure schedule arithmetic -- total_s minus
# elapsed -- which is a promise, not an estimate, and it read 0 while the plate
# was still five degrees out. These let it report what the plate is actually
# doing once there is enough of it to divide by. Two anchors, the older one
# measured from and the newer one taking its place each eta_window; meas_rate,
# C/min, is the last rate measured, 0 until there is one; eta_last and
# eta_last_at are the last line's time-left figure, in seconds, and when it was
# said. See the progress block in _COOLDOWN_TICK.
variable_eta_bed: 0.0
variable_eta_at: 0.0
variable_eta_bed_b: 0.0
variable_eta_at_b: 0.0
variable_meas_rate: 0.0
variable_eta_last: 0.0
variable_eta_last_at: 0.0
# Bed heater duty summed over the ramp ticks since the last progress line, and
# their count: the line reports the average, the assist's authority indicator.
variable_heat_sum: 0.0
variable_heat_n: 0
# WHAT WE LAST WROTE to ch_target, rather than what we would recompute. The
# override check compares against this: with the assist pulling the ceiling
# below the schedule, a recomputed expectation no longer matches what is on
# disk, and the ramp would abort itself believing the operator had moved it.
variable_ch_written: 0.0
gcode:


[gcode_macro COOLDOWN_ARM]
description: Record this print's cooldown policy. Consumed by END_PRINT.
# Called from the start G-code, next to the generated CLEAN_TEMP block and from
# the same source table. Omitting it is safe and supported: END_PRINT then uses
# the _COOLDOWN_CFG default row, which is the recovered generic design, and the
# print's own bed and chamber temperatures still set the severity.
gcode:
    {% set cfg = printer["gcode_macro _COOLDOWN_CFG"] %}
    {% set explicit = params.FINAL is defined or params.CHAMBER_RATE is defined
                      or params.BED_RATE is defined %}
    {% set final = params.FINAL|default(cfg.final)|float %}
    {% set rc = params.CHAMBER_RATE|default(cfg.chamber_rate)|float %}
    {% set rb = params.BED_RATE|default(cfg.bed_rate)|float %}

    # A ZERO CHAMBER RATE IS LEGAL AND MEANS "NO CHAMBER LEG" -- it is now the
    # shipped default for every material. A zero or negative BED rate is still
    # nonsense: the bed leg is the whole ramp, and a zero there would ask for a
    # descent that never descends. Negative is rejected on both.
    {% if rb <= 0 or rc < 0 %}
        {action_raise_error("COOLDOWN_ARM: bed rate must be greater than zero, chamber rate must not be negative")}
    {% endif %}

    # MATERIAL IS NOW STORED, and naming it is the normal way to use this
    # command. It used to be echoed and discarded, because the policy arrived as
    # three numbers generated into the start G-code. The numbers live in
    # _COOLDOWN_MATERIALS now, so the same print gets the same descent from any
    # slicer -- or from none, when the spool names the material instead.
    #
    # The quoting is the trap the old comment warned about, and it is real:
    # SET_GCODE_VARIABLE runs VALUE through ast.literal_eval, so a bare word
    # raises and a string needs quotes that survive shlex. Single-outside,
    # double-inside is the form that works, as _LIGHT_STATE already does.
    {% set lowered = params.MATERIAL|default("")|lower %}
    {% set clean = lowered|replace("+", "")|replace("-", "")|replace(" ", "")|replace("_", "")|replace("/", "") %}
    {% set name = clean if clean else "default" %}

    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"{name}"'
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=policy_set VALUE=1
    {% if explicit %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_final VALUE={final}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_chamber_rate VALUE={rc}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_bed_rate VALUE={rb}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=1
        RESPOND PREFIX="cooldown:" MSG="armed for {name}: bed {rb}C/min to {final}C, as given"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=0
        RESPOND PREFIX="cooldown:" MSG="armed for {name}"
    {% endif %}


[gcode_macro _COOLDOWN_START]
description: Begin the synchronized bed and chamber cooldown ramp.
# Called by END_PRINT INSTEAD OF TURN_OFF_HEATERS, and responsible for turning
# them off itself in every path that does not schedule a ramp. END_PRINT has
# already zeroed the extruder with M104 S0 by this point; the bed and, if
# fitted, the chamber heater are still commanded.
gcode:
    {% set cfg = printer["gcode_macro _COOLDOWN_CFG"] %}
    {% set st  = printer["gcode_macro _COOL_STATE"] %}
    {% set sv  = printer.save_variables.variables %}

    # WHICH MATERIAL, in precedence order. The slicer wins when it named one,
    # because a profile naming a material is a claim about THIS job; the spool is
    # a claim about what is loaded, which is almost always the same thing and
    # occasionally is not.
    #
    # spool_guard latched the spool's material into RAM at print start, when it
    # fetched it to check the job against it. Reading it here costs nothing and
    # needs no HTTP call from inside a macro hours later. Guarded with `in
    # printer` so a machine without that extra still runs this file.
    {% set armed = st.material if st.policy_set|int == 1 else "default" %}
    {% set from_spool = printer.spool_guard.material if 'spool_guard' in printer and printer.spool_guard.material else "" %}
    {% set material = armed if armed != "default" else (from_spool if from_spool else "default") %}
    {% set source = "slicer" if armed != "default" else ("spool" if from_spool else "default") %}

    # Exact key, then longest-first prefix, so "plaplus" finds PLA and "petg" is
    # never captured by a shorter row.
    {% set mt = printer["gcode_macro _COOLDOWN_MATERIALS"] %}
    {% set found = namespace(row=None, key="default") %}
    {% if material in mt.table %}
        {% set found.row = mt.table[material] %}
        {% set found.key = material %}
    {% else %}
        {% for key in mt.order %}
            {% if found.row is none and material.startswith(key) %}
                {% set found.row = mt.table[key] %}
                {% set found.key = key %}
            {% endif %}
        {% endfor %}
    {% endif %}

    # Explicit rates count only INSIDE an arming. Belt and braces against the
    # half-armed state: policy_set cleared while rates_set survived would
    # otherwise let one experiment's numbers govern every later print.
    {% set explicit = st.policy_set|int == 1 and st.rates_set|int == 1 %}
    {% set final = st.p_final|float if explicit else (found.row.final|float if found.row else cfg.final|float) %}
    {% set rc_max = st.p_chamber_rate|float if explicit else (found.row.chamber|float if found.row else cfg.chamber_rate|float) %}
    # One bed rate for every material since 2026-10-12; the row sets the endpoint.
    {% set rb_max = st.p_bed_rate|float if explicit else cfg.bed_rate|float %}

    {% set b0 = printer.heater_bed.target|float %}
    # THE COOLDOWN DOES NOT CONTROL THE CHAMBER, since 2026-09-14 (operator).
    # There is no chamber leg any more, whatever the policy row or COOLDOWN_ARM
    # says: no ch_target schedule, no chamber heater setpoint, no chamber loop.
    # When the ramp begins, _COOLDOWN_TAKE_OVER stops every chamber controller
    # and the assist drives the exhaust and curtain itself. c0 is the live
    # chamber reading, carried for the console and nothing else.
    {% set ch_live = printer["temperature_sensor chamber_temp"].temperature|float
                     if 'temperature_sensor chamber_temp' in printer else 0.0 %}
    {% set c0 = ch_live %}
    {% set has_heater = 0 %}

    # cd is zero, so t_ch and rc below are zero and the schedule is the bed
    # alone. The structure is kept so a chamber rate can be reported as ignored.
    {% set cd = 0.0 %}
    {% set bd = [b0 - final, 0.0]|max %}
    # A ZERO RATE MEANS "NO LEG", and it has to be tested BEFORE the division.
    # Testing only the delta divided by zero the moment the chamber rates went
    # to 0 for the bed-only policy: cd is 9.3 C on a 44 -> 35 ramp, so the
    # `cd > 0` guard passed and rc_max was 0. END_PRINT then died with
    # "ZeroDivisionError: float division by zero" and the ramp never armed.
    {% set t_ch = (cd / rc_max) if (cd > 0 and rc_max > 0) else 0.0 %}
    {% set t_bed = (bd / rb_max) if (bd > 0 and rb_max > 0) else 0.0 %}
    {% set t_total = [t_ch, t_bed]|max %}

    {% if t_total <= 0 %}
        TURN_OFF_HEATERS
        RESPOND PREFIX="cooldown:" MSG="nothing to do, the bed is already at or below {final|round(0)|int}C"
    {% else %}
        # Same test again, and not only to avoid dividing. t_total is the
        # SLOWER leg's duration, so without the rate guard a disabled chamber
        # leg would be handed a brand-new non-zero rate here and run after all
        # -- the one thing the zero was meant to express.
        {% set rc = (cd / t_total) if (cd > 0 and rc_max > 0) else 0.0 %}
        {% set rb = (bd / t_total) if (bd > 0 and rb_max > 0) else 0.0 %}
        # Cadence comes from whichever axis is actually moving. Clamped so a
        # very slow schedule does not sit silent for minutes and a very fast one
        # does not flood the queue.
        {% set drive = rc if rc > 0 else rb %}
        {% set interval = [[60.0 * cfg.chamber_step|float / drive, 10.0]|max, 120.0]|min %}
        {% set c_step = rc * interval / 60.0 %}
        {% set b_step = rb * interval / 60.0 %}

        # Klipper renders a macro completely before executing any of it, so a
        # Jinja failure above means NOTHING here ran -- including the timeout
        # extension -- and the stock idle_timeout remains as the backstop.
        # Extend it only once the schedule is known to be sound.
        {% set idle_restore = printer.configfile.settings.idle_timeout.timeout|float
                              if 'idle_timeout' in printer.configfile.settings else 1800.0 %}

        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=phase VALUE=1
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c0 VALUE={c0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b0 VALUE={b0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_cmd VALUE={c0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_cmd VALUE={b0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=p_final VALUE={final}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_step VALUE={c_step}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_step VALUE={b_step}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=interval VALUE={interval}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_rate VALUE={rc}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_rate VALUE={rb}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=total_s VALUE={t_total * 60.0}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=has_heater VALUE={has_heater}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=elapsed VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=settle_elapsed VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=coast_warned VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=idle_restore VALUE={idle_restore}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"{found.key}"'
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_curtain VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_exhaust VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=curtain_latched VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_latched VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=prev_err VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_i VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=overrun_s VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed_b VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at_b VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=meas_rate VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_last VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_last_at VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=heat_sum VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=heat_n VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_degree VALUE={b0|int}

        # NOTHING ABOUT THE CHAMBER IS TOUCHED HERE. The settle phase leaves
        # whatever the print left running; _COOLDOWN_TAKE_OVER stops it all when
        # the ramp begins. The old ramp started the chamber loop, claimed
        # ch_target and set the chamber heater here, and every one of those
        # couplings produced a failure of its own -- a full-speed exhaust off a
        # zero target (2026-09-03), a self-abort on the first tick (2026-09-07),
        # a 0.20/min rate limit on the assist and a PI cycling against a
        # stand-in target (2026-09-13).
        {% if rc_max > 0 %}
            RESPOND PREFIX="cooldown:" MSG="chamber rate {rc_max}C/min ignored, the cooldown does not control the chamber"
        {% endif %}

        SET_IDLE_TIMEOUT TIMEOUT={(t_total * 60.0) + cfg.settle_max|float + cfg.idle_margin|float}
        UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.settle_tick}
        # Which policy ran, in words: the material and who named it, or why
        # none applied.
        {% set policy = (found.key ~ " from the " ~ source) if found.row
                        else ("no material named" if material == "default"
                              else material ~ " is not in the material table") %}
        RESPOND PREFIX="cooldown:" MSG="bed {b0|round(0)|int}C to {final|round(0)|int}C at {rb|round(1)}C/min, {t_total|round(0)|int} min on schedule ({policy})"
        # SAY THAT THE HOLD IS DELIBERATE. Phase 1 holds the print's own targets
        # for up to settle_max -- ten minutes by default -- and until 2026-09-05
        # it said nothing at all for the whole of it. The operator reasonably
        # read a silent console with a still-hot bed as a hung cooldown.
        RESPOND PREFIX="cooldown:" MSG="holding the bed at {b0|round(0)|int}C until the nozzle cools to it, at most {(cfg.settle_max|float / 60.0)|round(0)|int} min"
    {% endif %}


[delayed_gcode COOLDOWN_TIMER]
gcode:
    _COOLDOWN_TICK


[gcode_macro _COOLDOWN_TICK]
description: One settle or ramp step. Rescheduled by COOLDOWN_TIMER.
gcode:
    # Piecewise-linear lookup, held flat past either end. Used for the fan
    # curves both ways: duty to rpm and back.
    {% macro lerp(xs, ys, x) %}{% set ns = namespace(v=(ys[0] if x <= xs[0] else ys[-1])) %}{% for i in range(xs|length - 1) %}{% if xs[i] <= x and x <= xs[i + 1] %}{% set ns.v = ys[i] + (ys[i + 1] - ys[i]) * (x - xs[i]) / (xs[i + 1] - xs[i]) %}{% endif %}{% endfor %}{ns.v}{% endmacro %}
    {% set cfg = printer["gcode_macro _COOLDOWN_CFG"] %}
    {% set st  = printer["gcode_macro _COOL_STATE"] %}
    {% set final = st.p_final|float %}
    {% set bed_temp = printer.heater_bed.temperature|float %}
    {% set bed_target = printer.heater_bed.target|float %}
    # No chamber override guard, since 2026-09-14. The ramp no longer writes or
    # claims ch_target, so a changed or released ceiling is not the ramp's
    # business: M141 defers while a ramp runs, and nothing here watches it.

    {% if st.active|int == 1 %}
        # A new job has taken the machine. START_PRINT calls COOLDOWN_ABORT
        # through _CHAMBER_AUTOSTART, but a stale tick must never outlive it and
        # pull a preheating bed back down.
        {% if printer.print_stats.state == "printing" %}
            # KEEP_POLICY: this print may already have armed itself behind the
            # same blocking wait that delayed this tick. See _COOLDOWN_CLEAR.
            _COOLDOWN_CLEAR KEEP_POLICY=1
            RESPOND PREFIX="cooldown:" MSG="stopped, a new print has started"

        # Somebody moved the bed setpoint out from under us. Explicit abort
        # beats silently overwriting an operator's command on the next tick.
        {% elif (bed_target - st.b_cmd|float)|abs > cfg.override_delta|float %}
            _COOLDOWN_CLEAR
            RESPOND PREFIX="cooldown:" MSG="stopped, the bed target changed to {bed_target|round(0)|int}C outside the cooldown"

        {% elif st.elapsed|int >= cfg.max_seconds|int %}
            _COOLDOWN_FINISH
            RESPOND PREFIX="cooldown:" MSG="stopped by the watchdog after {(st.elapsed|int / 60)|round(0)|int} min, heaters off"

        {% elif st.phase|int == 1 %}
            # SETTLE. Hold the print's own targets until the nozzle has cooled
            # to the bed, then begin the ramp. See _COOLDOWN_CFG for why this
            # replaced waiting on the chamber slope.
            {% set elapsed = st.settle_elapsed|int + cfg.settle_tick|int %}
            {% set nozzle = printer.extruder.temperature|float %}
            {% set cooled = nozzle <= bed_temp %}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=settle_elapsed VALUE={elapsed}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=elapsed VALUE={st.elapsed|int + cfg.settle_tick|int}

            {% set took = "under a minute" if elapsed < 60 else ((elapsed / 60.0)|round(0)|int ~ " min") %}
            {% if cooled or elapsed >= cfg.settle_max|int %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=phase VALUE=2
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE=0
                # Per-degree progress counts down from the plate as the ramp
                # finds it, and the rate measurement starts here too.
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_degree VALUE={bed_temp|round(0, 'floor')|int}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed VALUE={bed_temp|round(2)}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at VALUE=0
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed_b VALUE={bed_temp|round(2)}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at_b VALUE=0
                _COOLDOWN_TAKE_OVER
                # THE FIRST STEP IS NOW, not a tick from now (operator,
                # 2026-10-13): the first ramp tick runs at once, at ramp time 0,
                # and its target is already a degree below the print's.
                UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION=0.1
                {% if cooled %}
                    RESPOND PREFIX="cooldown:" MSG="the nozzle has cooled to the bed ({nozzle|round(0)|int}C) after {took}, ramp starting. Chamber control is off, the cooldown runs the fans."
                {% else %}
                    # The backstop. A nozzle still above the bed after settle_max
                    # is a reheated hotend or a bad reading, not a slow cool, so
                    # say which number it stopped on.
                    RESPOND PREFIX="cooldown:" MSG="the nozzle is still at {nozzle|round(0)|int}C, above the bed, after {took}. Ramp starting anyway. Chamber control is off, the cooldown runs the fans."
                {% endif %}
            {% else %}
                # Progress, paced by report_seconds rather than by the tick.
                # Names the two things that end this phase so a watching
                # operator can see which one it is waiting on.
                {% if elapsed - st.last_report|int >= cfg.report_seconds|int %}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_report VALUE={elapsed}
                    RESPOND PREFIX="cooldown:" MSG="holding the bed at {bed_temp|round(0)|int}C, nozzle {nozzle|round(0)|int}C. The ramp starts when the nozzle reaches the bed, {((cfg.settle_max|int - elapsed) / 60.0)|round(0)|int} min at most."
                {% endif %}
                UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.settle_tick}
            {% endif %}

        {% else %}
            # RAMP. One step on each axis, snapped to the endpoint.
            #
            # SNAP, NOT CLAMP. A plain max() leaves the last step at 35.0000001
            # when the step size does not divide the span exactly -- 50 C of bed
            # in 15 steps of 3.3333 lands just above the endpoint in binary
            # floating point. The ramp then spends one extra whole interval
            # commanding a value it has effectively already reached. Snapping
            # inside a tolerance ends it on the tick the arithmetic intended.
            # DRIVEN BY ELAPSED SECONDS, NOT BY AN ACCUMULATOR, since
            # 2026-09-05, and COMMANDED IN WHOLE DEGREES.
            #
            # The old form subtracted one step per tick from the last commanded
            # value. That coupled three things that have no business being
            # coupled: the resolution of the descent, the period of the tick,
            # and how often the abort guards and the assist got to look at the
            # machine. Holding 1.5 C/min with a 1 C step forced a 104 s tick, so
            # the assist could not respond and the console could not speak for
            # nearly two minutes at a time.
            #
            # The schedule is now the straight line it always described --
            # c0 - rate * t -- sampled every ramp_tick. Rounding that line to an
            # integer is what produces the steps, so a 1.5 C/min chamber still
            # moves in 1 C increments about every 40 s while the loop itself runs
            # four times a minute. Error against the ideal line is bounded by
            # half a degree and never accumulates, which the old form could not
            # promise: it re-derived each value from the previous one, so every
            # skipped or doubled tick was a permanent offset in the trajectory.
            #
            # Integer commands are also the honest resolution. The PID reports
            # to 0.01 C but the plate is 300 W across a small casting and the
            # measured passive curve is quoted per 10 C band; a commanded 81.8
            # was arithmetic showing through, not control.
            {% set tick = cfg.ramp_tick|int %}
            # Seconds since the ramp began, at THIS tick: 0 on the first one,
            # which runs the moment settle ends. elapsed advances by a tick at
            # the end of each, for the wait until the next.
            {% set ramp_s = st.elapsed|int - st.settle_elapsed|int %}
            {% set c_ideal = st.c0|float - st.c_rate|float * ramp_s / 60.0 %}
            {% set b_ideal = st.b0|float - st.b_rate|float * ramp_s / 60.0 %}
            # A zero rate means that axis has no leg in this ramp, so it is
            # already at the endpoint as far as `done` is concerned -- the same
            # thing the old snap did for a bed-only ramp carrying c0 = 0.
            {% set c_next = final if (st.c_rate|float <= 0.0 or c_ideal <= final) else [c_ideal|round(0)|float, final]|max %}
            # THE WHOLE-DEGREE TARGET LEADS THE LINE, since 2026-10-13: the next
            # degree down as soon as the line reaches the current one, so it is
            # always between 0 and 1 C below the line and steps the moment the
            # line crosses a degree, starting at ramp time 0. It used to round,
            # which put it up to 0.5 C ABOVE the line, and a bed held to it was
            # late by that much at every temperature. The 1e-6 keeps a line
            # landing exactly on a degree from stepping a tick late.
            {% set b_next = final if (st.b_rate|float <= 0.0 or b_ideal <= final + 1.0)
                            else [(b_ideal - 0.000001)|round(0, 'ceil') - 1.0, final]|max %}
            # THE RAMP IS OVER WHEN THE PLATE ARRIVES, NOT WHEN THE SCHEDULE
            # RUNS OUT. Testing the commanded value finished a 2026-09-07 ramp
            # with the plate at 40 C against a 35 C endpoint: b_next had reached
            # 35 exactly on time, so `done` fired, the assist released and the
            # remaining 5 C were simply abandoned. Now the schedule ending only
            # opens the overrun, and finish_grace bounds how long that may run.
            {% set sched_done = (c_next <= final) and (b_next <= final) %}
            {% set plate_there = bed_temp <= final + printer["gcode_macro _COOLDOWN_ASSIST_CFG"].finish_tolerance|float %}
            {% set overrun = st.overrun_s|float + (tick if sched_done else 0) %}
            {% set gave_up = overrun >= printer["gcode_macro _COOLDOWN_ASSIST_CFG"].finish_grace|float %}
            {% set done = sched_done and (plate_there or gave_up) %}
            {% set remain_s = [st.total_s|float - ramp_s, 0]|max %}

            # ASSIST. A positive error means the bed is BEHIND the schedule --
            # falling more slowly than commanded -- which is exactly the regime
            # where the heater has nothing left to give and only forced air can
            # close the gap. Below the ceiling and past the threshold, the fans
            # take over from the heater; the two never fight, because they act in
            # opposite directions on opposite sides of the error.
            {% set acfg = printer["gcode_macro _COOLDOWN_ASSIST_CFG"] %}
            # AGAINST THE SMOOTH SCHEDULE, NOT THE STEP, since 2026-09-14. The bed
            # is commanded in whole degrees, so b_next moves 1 C every 40 s at
            # 1.5 C/min. Measured against it the error is a 1 C sawtooth, and at
            # assist_kp 0.75 every step swung demand by 0.75: on that day's real
            # ABS cooldown the exhaust changed 71 times in 31 min, 73 % of them
            # reversals, 57 of them within 20 s of a target step, and the curtain
            # latched and released 8 times in 8 min. It was also the step that
            # engaged the assist on the first ramp tick. b_ideal is the line
            # b_next rounds from; the heater keeps its integer M140 below.
            {% set b_ref = final if st.b_rate|float <= 0.0 else [b_ideal, final]|max %}
            {% set err = bed_temp - b_ref %}
            # The aim is lead C ahead of the line; `over` is how far behind
            # that aim the bed is, and is what the PI and the engage test use.
            {% set over = err + acfg.lead|float %}
            {% set threshold = (0.0 - acfg.error_off|float) if st.assist|int == 1 else acfg.error_on|float %}
            # RUN AHEAD. The plate lags; by the time the error is real the fan
            # is already late. Project it forward by assist_lookahead seconds at
            # the rate it is currently moving, and engage on that.
            #
            # BUT ONLY ONCE THE HEATER HAS LET GO, since 2026-09-13. On both
            # curtain cooldowns that day the projection crossed the threshold at the
            # settle-to-ramp handover, 3.3-3.5 min in, with the plate at 124 C
            # and the heater still drawing 30-60 W. assist_latch then held the
            # exhaust on for the whole descent -- extraction from print
            # temperature, over a part. A projection is a guess about losing
            # authority; heater power at its floor is the fact of it, so the
            # guess is only allowed to act once the fact agrees.
            #
            # AND THE SAME GATE ON THE ERROR ITSELF. The first version gated
            # only the projection, and the next run engaged at 3.3 min anyway:
            # "assist engaged at bed 124.0C, 1.0C behind schedule", heater at
            # 17 %. err is taken against b_next -- the step this tick is ABOUT
            # to command -- so the first 1 C step of every ramp reads as a 1 C
            # error before the heater has seen the new setpoint. A positive
            # error only means lost authority once the heater agrees.
            {% set err_rate = (err - st.prev_err|float) / (tick if tick > 0 else 1) %}
            {% set over_ahead = over + err_rate * acfg.assist_lookahead|float %}
            {% set heat = printer.heater_bed.power|default(0.0)|float %}
            {% set heater_idle = heat <= acfg.authority_power|float %}
            # AND THE BED ABOVE THE TARGET THE HEATER LAST HAD. With the aim
            # ahead of the line, a bed exactly on the line already reads as
            # behind -- which is where every ramp starts, at its print target.
            # Below or at its last target the heater can still hold it; above
            # it, the heater has nothing left to give, which is what engaging
            # means.
            {% set lost = heater_idle and bed_temp > st.b_cmd|float %}
            # LATCH. Once engaged it stays engaged for the rest of the ramp --
            # the schedule only gets harder from here, so releasing to zero and
            # re-engaging is pure toggling.
            {% set assist_on = 1 if (lost and ([over, over_ahead]|max) > threshold)
                               else (1 if (acfg.assist_latch|int == 1
                                           and st.assist_latched|int == 1) else 0) %}

            # THE TRIGGER IS THE ERROR. Rewritten 2026-09-05.
            #
            # A POSITIVE ERROR IS THE DEFINITION OF LOST AUTHORITY. The bed
            # heater can only ADD heat, so while it is modulating it is holding
            # the plate UP to a schedule that is falling faster than the plate
            # would on its own. The moment the plate is above its commanded
            # value the heater is already at zero power and has nothing left --
            # only moving air can close the gap. So the trigger is the error
            # itself, at error_on rather than at some fixed temperature.
            #
            # This is not a new rule so much as a derived one. Against the
            # measured passive curve, ABS on a 1.5 C/min bed leg loses authority
            # where passive loss drops below that -- the 50-60 C band, at 1.02
            # C/min. The old fixed bed_ceiling of 60 C was that crossing,
            # hard-coded for one material. Derived from the error it now lands
            # in the right place for PC, PETG and PLA too, whose legs and plates
            # cross elsewhere.
            #
            # THE EXHAUST GOES FIRST AND STARTS AT THE STALL FLOOR. exhaust_min
            # of 0 means "use ch_minfan", the adaptively-learned duty at which
            # this particular rotor reliably turns -- there is no point
            # commanding less, and the old design commanded far more: it yanked
            # the chamber ceiling to (chamber - 6), which saturates the PI, so
            # the exhaust had exactly two states and slammed to 100% the instant
            # it engaged. Demand now starts at the stall floor and is driven by
            # the PI below.
            {% set e_min = acfg.exhaust_min|float if acfg.exhaust_min|float > 0.0
                           else printer.save_variables.variables.ch_minfan|default(0.15)|float %}
            {% set e_max = acfg.exhaust_max|float %}

            # ONE DEMAND, THEN A SPLIT. The two fans used to be two independent
            # proportional bands, which meant the schedule could not say how
            # much cooling it wanted -- only how far along each fan's own ramp
            # it was. Now the error produces a single demand in
            # exhaust-equivalent duty and the ladder decides who delivers it.
            # That is what lets the handover conserve total cooling instead of
            # stepping it.
            #
            # bed_ceiling gates THE CURTAIN ONLY, and never the exhaust. The two
            # are different actions on different air: extraction is safe on a
            # hot part, a draft across one is what cracks and warps it. With the
            # curtain gated off there is no ladder at all and the exhaust carries
            # the whole demand, up to exhaust_max.
            #
            # IN RPM, NOT DUTY, since 2026-10-13. Every quantity from here to the
            # fan writes -- floors, ceilings, the knee, demand, the integral -- is
            # a fan's rpm as a fraction of its rpm at strength_duty, read off its
            # mapped curve. k is the measured curtain-over-exhaust strength at the
            # plate's Z (see curtain_strength_factor). The split below is
            # unchanged; only its units are. The two duties are read back off the
            # curves just before they are written.
            {% set ecd = acfg.exhaust_curve_duty %}{% set ecr = acfg.exhaust_curve_rpm %}
            {% set ccd = acfg.curtain_curve_duty %}{% set ccr = acfg.curtain_curve_rpm %}
            {% set ref_e = lerp(ecd, ecr, acfg.strength_duty|float)|float %}
            {% set ref_c = lerp(ccd, ccr, acfg.strength_duty|float)|float %}
            {% set z_now = printer.toolhead.position[2]|float %}
            {% set z_fit = [[z_now, 0.0]|max, 155.0]|min %}
            {% set w_e = acfg.exhaust_w0|float + acfg.exhaust_w_per_mm|float * z_fit %}
            {% set w_c = acfg.curtain_w_far|float + acfg.curtain_w_near|float * 2.718281828 ** (0.0 - z_fit / acfg.curtain_w_mm|float) %}
            {% set k = [w_c / w_e * acfg.curtain_strength_factor|float, 0.05]|max %}
            {% set e_min = lerp(ecd, ecr, e_min)|float / ref_e %}
            {% set e_max = lerp(ecd, ecr, e_max)|float / ref_e %}
            {% set c_min = lerp(ccd, ccr, acfg.curtain_min|float)|float / ref_c %}
            {% set c_max = lerp(ccd, ccr, acfg.curtain_max|float)|float / ref_c %}
            {% set c_min_cfg = c_min %}
            {% set latch = acfg.curtain_latch|float if acfg.curtain_latch|float > 0.0
                           else e_max %}
            {% set c_ok = (acfg.curtain_enable|int == 1
                           and (acfg.bed_ceiling|float <= 0.0 or bed_temp <= acfg.bed_ceiling|float)) %}
            # PI ON THE SCHEDULE ERROR, 2026-09-13.
            #
            #   demand = e_min + assist_kp * over + I,  over = err + lead
            #
            # clamped to [e_min, top], where top is e_max alone or e_max +
            # k * c_max with the curtain allowed. The curtain changes WHO
            # delivers a demand, never how much is asked for: one gain either
            # way.
            #
            # WHY. Two curtain-on cooldowns on Zero2 that day ran this as a
            # pure proportional band, 0.172 demand per C, and it behaved like
            # one: a standing error was the only thing holding the fans up. 5 C
            # behind left them near 0.4 and 0.45; on the first run, squeezed
            # further by a since-removed second band, 5.5 C behind held the
            # exhaust at 0.34 and the curtain never ran (notes/data/cooldown/
            # zero2-curtain-cooldown-20260913). A large error should put the
            # fans at their ceiling, and a small one that persists should not be
            # tolerated forever. So: far more proportional gain, and an integral.
            #
            # THE INTEGRAL carries only while the assist was already engaged, so
            # every engagement starts from zero. It does not accumulate while the
            # push would deepen a saturation -- demand at top with the error
            # still positive, or at the floor with it negative -- and it is held
            # in [0, top - e_min]. A negative integral would hold the fans below
            # their floor-plus-P response the next time the error returns, which
            # is windup in the other direction. The reference is the aim, lead C
            # ahead of the line: past it the bed has reached its whole-degree
            # target and the heater is holding it, so the integral bleeds off
            # and, while the heater fires, does not climb.
            {% set top = (e_max + k * c_max) if c_ok else e_max %}
            {% set p_term = acfg.assist_kp|float * over %}
            {% set i_prev = st.assist_i|float if st.assist|int == 1 else 0.0 %}
            {% set unclamped = e_min + p_term + i_prev %}
            {% set wind_up = over > 0.0 and unclamped >= top %}
            {% set wind_down = over < 0.0 and unclamped <= e_min %}
            # And no climb while the bed heater fires: the heater working means
            # the fans are already cooling enough (operator, 2026-10-13).
            {% set i_raw = acfg.assist_ki|float * over * tick / 60.0 %}
            {% set i_step = 0.0 if (assist_on != 1 or wind_up or wind_down)
                            else ([i_raw, 0.0]|min if not heater_idle else i_raw) %}
            {% set i_next = ([[i_prev + i_step, 0.0]|max, top - e_min]|min) if assist_on == 1 else 0.0 %}
            {% set demand = [[e_min + p_term + i_next, e_min]|max, top]|min %}
            # FULL TO THE ENDPOINT (operator, 2026-10-13). Once the schedule has
            # run out the line sits at final, so the error is only the plate's
            # height above it, and the PI let the fans back off as the plate
            # closed in: 100 % to 93 % (exhaust) and 87 % (curtain) over the last
            # 0.4 C of the published-default ramp on Zero2. Past the schedule the
            # bed is late by definition, so both fans stay at their ceiling until
            # it arrives or finish_grace runs out.
            {% if sched_done and assist_on == 1 %}
                {% set demand = top %}
            {% endif %}

            # LATCHED once the exhaust is at its ceiling. With curtain_hold, once on
            # it stays on for the rest of the ramp; without it, the release sits
            # curtain_unlatch below the engage.
            {% set was = st.curtain_latched|int %}
            {% set held = was == 1 and acfg.curtain_hold|int == 1 %}
            {% set latched = 1 if (c_ok and assist_on == 1
                                   and (demand >= latch or held
                                        or (was == 1 and demand >= latch - acfg.curtain_unlatch|float)))
                              else 0 %}
            {% if assist_on != 1 or acfg.exhaust_enable|int != 1 %}
                {% set exhaust = 0.0 %}
                {% set curtain = 0.0 %}
            {% elif latched != 1 %}
                # The floor is the point of the latch: a fan that has been asked
                # for once is held at its lowest reliable duty rather than
                # switched off, so the next demand starts from moving air.
                {% set exhaust = [[demand, e_max]|min,
                                  e_min if st.assist_latched|int == 1 else 0.0]|max %}
                {% set curtain = 0.0 %}
            {% else %}
                # A SWAP AT THE HANDOVER, then the exhaust first. The curtain enters
                # at its floor and the exhaust gives back what that adds, so
                # e + k * c == demand across the latch wherever neither fan is on a
                # floor or ceiling (operator, 2026-10-13: "otherwise it's not a
                # gentle transition at all"). Above that the exhaust climbs back
                # to its ceiling, then the curtain carries the rest.
                {% set curtain = [[(demand - e_max) / k, c_max]|min, c_min]|max %}
                {% set exhaust = [[demand - k * curtain, e_max]|min, e_min]|max %}
            {% endif %}
            # Back to duty, each off its own curve. A floor round-trips to itself.
            {% set exhaust = (lerp(ecr, ecd, exhaust * ref_e)|float) if exhaust > 0.0 else 0.0 %}
            {% set curtain = (lerp(ccr, ccd, curtain * ref_c)|float) if curtain > 0.0 else 0.0 %}

            # ONLY WHEN IT MOVES. At a 15 s tick an unconditional M140 would
            # re-command an unchanged integer four times a minute for the whole
            # descent. The abort guard compares the live bed target against
            # b_cmd, and both are only ever updated together, so skipping the
            # write cannot desynchronise them.
            {% if (b_next - st.b_cmd|float)|abs > 0.001 %}
                M140 S{b_next|round(0)|int}
            {% endif %}

            # THE RAMP DRIVES THE EXHAUST ITSELF, since 2026-09-14. It used to ask
            # the chamber loop for a floor, and the loop rate-limits its output
            # to ch_slew_per_loop -- 0.05 per 15 s pass, 0.20/min -- so the PI's
            # full-duty request took 3.5 min to arrive on 2026-09-13 and 2.3 min
            # to come back down at the curtain handover. That limit was written
            # for the chamber loop's Z-scheduled print control and was never
            # meant for this. The loop is stopped when the ramp begins, so a
            # direct write is the only writer.
            #
            # REASSERTED EVERY TICK while the assist is engaged or still holds a
            # duty, rather than on change. SET_FAN_SPEED writes nothing to disk,
            # and anything that touches the fan between ticks is corrected within
            # one tick instead of being left standing for the rest of the ramp.
            {% if assist_on == 1 or st.assist_exhaust|float > 0 %}
                SET_FAN_SPEED FAN={printer["gcode_macro _CH_HW"].fan} SPEED={exhaust|round(3)}
            {% endif %}
            {% if (exhaust - st.assist_exhaust|float)|abs > 0.0005 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_exhaust VALUE={exhaust|round(3)}
            {% endif %}
            {% if (curtain - st.assist_curtain|float)|abs > 0.01 %}
                SET_FAN_SPEED FAN=fan2 SPEED={curtain|round(3)}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_curtain VALUE={curtain|round(3)}
            {% endif %}
            {% if latched != was %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=curtain_latched VALUE={latched}
                {% set how = ("on: exhaust " ~ (exhaust * 100)|round(0)|int ~ "%, curtain " ~ (curtain * 100)|round(0)|int ~ "% (k " ~ k|round(2) ~ " at Z " ~ z_now|round(1) ~ ")")
                             if latched == 1 else ("off: exhaust " ~ (exhaust * 100)|round(0)|int ~ "%") %}
                RESPOND PREFIX="cooldown:" MSG="curtain fan {how}"
            {% endif %}
            {% if assist_on != st.assist|int %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist VALUE={assist_on}
                {% if assist_on == 1 %}
                    {% set duties = "exhaust " ~ (exhaust * 100)|round(0)|int ~ "%"
                                    ~ ((", curtain " ~ (curtain * 100)|round(0)|int ~ "%") if curtain > 0 else "") %}
                    {% set where = (err|abs|round(1) ~ "C " ~ ("behind" if err > 0 else "ahead of") ~ " the schedule") %}
                    RESPOND PREFIX="cooldown:" MSG="fan assist on at bed {bed_temp|round(0)|int}C, {where}, heater idle: {duties}"
                {% else %}
                    RESPOND PREFIX="cooldown:" MSG="fan assist off at bed {bed_temp|round(0)|int}C, back on schedule"
                {% endif %}
            {% endif %}

            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=c_cmd VALUE={c_next}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=b_cmd VALUE={b_next}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=elapsed VALUE={st.elapsed|int + tick}
            {% if (err - st.prev_err|float)|abs > 0.005 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=prev_err VALUE={err|round(3)}
            {% endif %}
            {% if (i_next - st.assist_i|float)|abs > 0.0005 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_i VALUE={i_next|round(4)}
            {% endif %}
            {% if overrun != st.overrun_s|float %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=overrun_s VALUE={overrun}
            {% endif %}
            {% if assist_on == 1 and st.assist_latched|int == 0 %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_latched VALUE=1
            {% endif %}

            # The bed heater has no authority left once natural loss is slower
            # than the schedule. Said once, not every step -- and it now says
            # whether anything can be done about it, because with the assist
            # available this is a recoverable condition rather than a dead end.
            {% if bed_temp > b_next + cfg.coast_delta|float and st.coast_warned|int == 0 %}
                {% set remedy = "the fans are helping" if (exhaust > 0 or curtain > 0)
                                else ("fan assist is turned off" if acfg.exhaust_enable|int != 1
                                      else "the fans start once the bed heater is idle") %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=coast_warned VALUE=1
                RESPOND PREFIX="cooldown:" MSG="the bed ({bed_temp|round(0)|int}C) is cooling slower than the schedule ({b_next|round(0)|int}C), {remedy}"
            {% endif %}

            # PROGRESS, ONE LINE PER DEGREE OF MEASURED BED, since 2026-10-12.
            # It was one line a minute: the 2026-09-14 ABS ramps, re-sampled
            # that way, skip 19 of their 65 degrees, and the time left -- the
            # plate's slope over the last 60 s, while its target steps 1 C every
            # 40 s -- rose between lines on 14 of 42 of them. Now every whole
            # degree the plate passes gets a line, one each when a tick passes
            # two, so a faster rate gets more lines rather than coarser ones.
            #
            # TIME LEFT is the slower of two estimates. The schedule is right
            # while the heater still holds the plate to it. The plate's own rate
            # is right once it falls behind, which at 3 C/min is most of the way
            # down; it is measured from an anchor between one and two
            # eta_window spans old, two anchors leapfrogging so the span never
            # starts over from nothing. Neither estimate runs past the end of
            # the schedule plus finish_grace, where the ramp gives up, and each
            # line moves 30 % of the way from the last line's figure (less the
            # time since) to the new one.
            #
            # Replayed on the five recorded ramps, it never rose between lines,
            # and it read within 0.2 min on the two that kept to the schedule.
            # It cannot see the slow last degrees coming: on the three that
            # ran over it read 7 to 14 min short.
            # The bed heater's average duty since the last line rides on each
            # one: a heater that fires now and then is the sign the fans are
            # cooling enough; one stuck at 0 % with the fans up is the sign
            # they are not.
            {% set heat_sum = st.heat_sum|float + heat %}
            {% set heat_n = st.heat_n|int + 1 %}
            {% set reached = bed_temp|round(0, 'floor')|int %}
            {% set said = not done and reached < st.last_degree|int %}
            {% if said %}
                {% set win = cfg.eta_window|float %}
                {% set span = ramp_s - st.eta_at|float %}
                {% set rate_now = ((st.eta_bed|float - bed_temp) * 60.0 / span) if span >= win else st.meas_rate|float %}
                {% set arrive = final + acfg.finish_tolerance|float %}
                {% set meas_s = ((bed_temp - arrive) * 60.0 / rate_now) if (rate_now > 0.01 and bed_temp > arrive) else 0.0 %}
                {% set limit_s = remain_s + [acfg.finish_grace|float - overrun, 0.0]|max %}
                {% set carried = [st.eta_last|float - (ramp_s - st.eta_last_at|float), 0.0]|max %}
                {% set smooth = st.eta_last|float > 0 %}
                {% set fans = ", heater " ~ (heat_sum * 100.0 / heat_n)|round(0)|int ~ "%"
                              ~ ("" if (exhaust <= 0 and curtain <= 0)
                                 else (", exhaust " ~ (exhaust * 100)|round(0)|int ~ "%"
                                       ~ ((", curtain " ~ (curtain * 100)|round(0)|int ~ "%") if curtain > 0 else ""))) %}
                {% for deg in range(st.last_degree|int - 1, reached - 1, -1) %}
                    {% set sched_s = (([deg, b_ideal, final]|max - final) * 60.0 / st.b_rate|float) if st.b_rate|float > 0 else 0.0 %}
                    {% set raw = [[sched_s, meas_s]|max, limit_s]|min %}
                    {% set eta_s = (0.3 * raw + 0.7 * carried) if smooth else raw %}
                    {% set left = "under a minute" if eta_s < 60 else ("about " ~ (eta_s / 60.0)|round(0)|int ~ " min") %}
                    RESPOND PREFIX="cooldown:" MSG="bed {deg}C, {left} to {final|round(0)|int}C{fans}"
                {% endfor %}
                # The last line's figure, carried to the next one.
                {% set sched_s = (([reached, b_ideal, final]|max - final) * 60.0 / st.b_rate|float) if st.b_rate|float > 0 else 0.0 %}
                {% set raw = [[sched_s, meas_s]|max, limit_s]|min %}
                {% set eta_s = (0.3 * raw + 0.7 * carried) if smooth else raw %}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=last_degree VALUE={reached}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_last VALUE={eta_s|round(1)}
                SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_last_at VALUE={ramp_s}
                {% if span >= win %}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=meas_rate VALUE={rate_now|round(3)}
                {% endif %}
                {% if ramp_s - st.eta_at_b|float >= win %}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed VALUE={st.eta_bed_b|float|round(2)}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at VALUE={st.eta_at_b|float}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_bed_b VALUE={bed_temp|round(2)}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=eta_at_b VALUE={ramp_s}
                {% endif %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=heat_sum VALUE={0.0 if said else heat_sum|round(4)}
            SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=heat_n VALUE={0 if said else heat_n}

            # Said once: from here the ramp waits for the plate, for at most
            # finish_grace, and the per-degree lines carry on.
            {% if sched_done and not done and st.overrun_s|float == 0 %}
                RESPOND PREFIX="cooldown:" MSG="schedule finished with the bed at {bed_temp|round(0)|int}C, waiting up to {(acfg.finish_grace|float / 60.0)|round(0)|int} min for it to reach {(final + acfg.finish_tolerance|float)|round(0)|int}C"
            {% endif %}
            {% if done %}
                _COOLDOWN_FINISH
                {% if gave_up and not plate_there %}
                    RESPOND PREFIX="cooldown:" MSG="stopped with the bed at {bed_temp|round(0)|int}C, {(overrun / 60.0)|round(0)|int} min past the schedule. Heaters off."
                {% else %}
                    RESPOND PREFIX="cooldown:" MSG="done, bed {bed_temp|round(0)|int}C after {(st.elapsed|int / 60)|round(0)|int} min. Heaters off."
                {% endif %}
            {% else %}
                {% set idle_want = cfg.idle_margin|float + cfg.ramp_tick|float * 4 %}
                {% if (idle_want - st.idle_set|float)|abs > 0.01 %}
                    SET_IDLE_TIMEOUT TIMEOUT={idle_want}
                    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=idle_set VALUE={idle_want}
                {% endif %}
                UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION={cfg.ramp_tick}
            {% endif %}
        {% endif %}
    {% endif %}


[gcode_macro _COOLDOWN_TAKE_OVER]
description: At ramp start, stop every chamber controller so the ramp alone drives its fans.
# THE COOLDOWN HAS NOTHING TO DO WITH CHAMBER CONTROL (operator, 2026-09-14),
# and any controller still running is disabled once the ramp begins.
#
# Called on the settle-to-ramp transition, never earlier: settle holds what the
# print left running while the chamber absorbs the hotend. From here on the
# ramp is the only writer of the exhaust and curtain.
#
#   _CHAMBER_OFF    the chamber PI loop, its stall guard and retry timers, and
#                  the exhaust itself -- zero until the assist asks for it.
#   chamber heater setpoint to 0, where one is fitted.
#   _CHAMBER_VENT  stands down on its own while a ramp is in phase 2; it runs
#                  every second and would otherwise command the exhaust to its
#                  floor, or to zero once the nozzle drops below 45 C.
#
# Before this, the ramp drove the exhaust THROUGH the chamber loop: a stand-in
# target written every tick, and an assist floor fed into the loop's rate-limited
# output. On 2026-09-13 that cost 3.5 min to reach full duty and made the loop's
# own PI cycle the exhaust 0.14 -> 0.19 -> 0.14 against the stand-in target.
gcode:
    _CHAMBER_OFF
    {% if 'heater_generic chamber_heater' in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}


[gcode_macro _COOLDOWN_CLEAR]
description: Release ramp state and the timeout extension without touching heaters.
# Used by the abort paths, where whoever interrupted the ramp -- a new print, an
# operator, CANCEL_PRINT -- owns the heaters from that moment on. Turning them
# off here would fight them, which is exactly the failure this avoids.
#
# KEEP_POLICY=1 IS FOR THE NEW-PRINT ABORT, and it exists because of an ordering
# hazard that is invisible until a ramp and a print overlap.
#
# A blocking wait in the start G-code -- M191 is minutes long -- stalls the whole
# gcode stream, delayed_gcode included. So a ramp still ticking when a print
# begins does not abort promptly: its tick queues up behind the wait, alongside
# that print's own COOLDOWN_ARM. Whichever lands second wins, and if it is the
# tick then a plain clear ERASES the policy the new print just armed for itself.
# The result is a print that silently descends on the default row.
#
# Clearing the ramp MECHANICS is always right here. Clearing the POLICY is only
# right when nothing has armed a new one, which the new-print path cannot know.
gcode:
    {% set keep = params.KEEP_POLICY|default(0)|int %}
    {% set st = printer["gcode_macro _COOL_STATE"] %}
    UPDATE_DELAYED_GCODE ID=COOLDOWN_TIMER DURATION=0
    # Give the curtain back only if this ramp ever took it. On the abort paths
    # something else already owns the machine, and zeroing a fan we never
    # touched would stomp whatever it had set.
    {% if st.assist_curtain|float > 0 %}
        SET_FAN_SPEED FAN=fan2 SPEED=0
    {% endif %}
    # Same rule for the exhaust, which the ramp drives directly: zero it only if
    # this ramp raised it.
    {% if st.assist_exhaust|float > 0 %}
        SET_FAN_SPEED FAN={printer["gcode_macro _CH_HW"].fan} SPEED=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist VALUE=0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_curtain VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_exhaust VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=curtain_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=assist_i VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=phase VALUE=0
    {% if keep == 0 %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=policy_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"default"'
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={st.idle_restore}


[gcode_macro _COOLDOWN_FINISH]
description: End the ramp, release every heater and stop the chamber loop.
gcode:
    _COOLDOWN_CLEAR
    TURN_OFF_HEATERS
    # The slicer's end-of-job M141 S0 was deferred while the ramp ran, so honour
    # it here: chamber loop off and ch_target zero, rather than leaving the
    # print's ceiling for the next job to inherit.
    _CHAMBER_OFF
    SAVE_VARIABLE VARIABLE=ch_target VALUE=0
    _CH_PREHEAT_CLEAR
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=0


[gcode_macro COOLDOWN_ABORT]
description: Stop any running cooldown ramp. Leaves heaters as they are.
gcode:
    {% if printer["gcode_macro _COOL_STATE"].active|int == 1 %}
        _COOLDOWN_CLEAR
        RESPOND PREFIX="cooldown:" MSG="stopped"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=policy_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=rates_set VALUE=0
        SET_GCODE_VARIABLE MACRO=_COOL_STATE VARIABLE=material VALUE='"default"'
    {% endif %}


[gcode_macro _COOLDOWN_CONFIG]
description: Enable or disable the post-print cooldown ramp persistently.
gcode:
    {% if params.ENABLE is defined %}
        SAVE_VARIABLE VARIABLE=cool_enable VALUE={params.ENABLE|int}
    {% endif %}
    {% set on = printer.save_variables.variables.cool_enable|default(1)|int == 1 %}
    RESPOND PREFIX="cooldown:" MSG="{'on after every print' if on else 'off'} (_COOLDOWN_CONFIG ENABLE=0 or 1)"


[gcode_macro _COOLDOWN_STATUS]
description: Report cooldown policy and live ramp state.
gcode:
    {% set st = printer["gcode_macro _COOL_STATE"] %}
    {% set a = printer["gcode_macro _COOLDOWN_ASSIST_CFG"] %}
    RESPOND PREFIX="cooldown:" MSG="enable={printer.save_variables.variables.cool_enable|default(1)|int} active={st.active|int} phase={st.phase|int} material={st.material} policy={st.policy_set|int} rates={st.rates_set|int} heater={st.has_heater|int} end={st.p_final|float} cmd={st.b_cmd|float|round(1)},{st.c_cmd|float|round(1)} rate={st.b_rate|float|round(2)},{st.c_rate|float|round(2)}C/min leg={st.b_step|float|round(2)},{st.c_step|float|round(2)} tick={printer["gcode_macro _COOLDOWN_CFG"].ramp_tick|int}s elapsed={st.elapsed|int}s settle={st.settle_elapsed|int}s of {st.total_s|float|round(0)|int}s"
    RESPOND PREFIX="cooldown:" MSG="assist on={st.assist|int} exhaust={st.assist_exhaust|float|round(2)} curtain={st.assist_curtain|float|round(2)} I={st.assist_i|float|round(3)} exhaust_enable={a.exhaust_enable|int} curtain_enable={a.curtain_enable|int} ceiling={a.bed_ceiling|float|round(0)|int}C"

# END SOURCE: klipper/config/cooldown.cfg

# START_PRINT override: clean, recheck the bed target, calibrate Z, mesh and park.
# Public profiles also wait before calling it. MUST follow nozzle_brush.cfg.

# BEGIN SOURCE: klipper/config/start_print.cfg
# START_PRINT — clean, settle the bed, calibrate Z, mesh, and park for heating
#
# Include AFTER Macro.cfg and after nozzle_brush.cfg. Includes apply linearly
# and duplicate sections merge with the later one winning
# (configfile.py uses RawConfigParser(strict=False)), so this overrides Sovol's
# START_PRINT without editing their file, which factory_resets.sh overwrites.
#
# RELEASED STARTUP ORDER
#
# Public slicer profiles set bed/chamber policy, select the cleaning material,
# and wait with M190 BEFORE calling START_PRINT. That early wait is deliberate:
# the same profiles must work with stock Sovol macros when this pack is absent.
# SET_CLEAN_TEMP also starts nozzle heating before that early bed wait.
#
# This replacement cleans, optionally tunes the camera, waits for the current
# bed target again, calibrates Z, rehomes Z and meshes. CLEAN_NOZZLE uses a
# taught pad height without an initial datum tap, but DOES probe after wiping.
# That final cleaning probe is separate from Z_OFFSET_CALIBRATION below.
#
# After mesh, release any chamber-helper bed carry and park over the pad.
# The slicer then heats to printing temperature and calls PURGE_LINE, which
# owns the purge placement and the return of cleaning/end-retract debt.
#
# Earlier comments described overlapping cleaning with the bed's final coast
# after chamber preheat. The released profiles retain their early M190 and do
# not depend on that overlap. Removing it requires reviewing the complete
# sequence, including the cleaner's final probe. See docs/STARTUP.md.

[gcode_macro START_PRINT]
description: Clean the nozzle, settle the bed, calibrate Z and mesh, then park for heating.
gcode:
    # Say so when the slicer never identified itself. Inert if svzero_pack.cfg
    # is not installed: the guard checks for the section before calling.
    {% if 'gcode_macro _SVZERO_PACK' in printer %}_SVZERO_CHECK_PROFILE{% endif %}
    {% if printer.save_variables.variables.was_interrupted|float == True %}
        PRINT_END #Clear the last printed power-off information
        CHANG_ROOT_MAIN
        SET_DISPLAY_TEXT
    {% endif %}
    _CHAMBER_AUTOSTART   # chamber_fan.cfg: honour M141, else infer from bed
    CLEAR_PAUSE
    M117 Clean Nozzle
    # No slicer named a material, so ask the spool, then the last print. Guarded
    # on the section existing so a partial install just skips it, and on
    # clean_temp being unset so a job that DID name its material always wins.
    {% if 'gcode_macro _BRUSH_INFER_CLEAN_TEMP' in printer
          and printer["gcode_macro _BRUSH"].clean_temp|float <= 0 %}
        _BRUSH_INFER_CLEAN_TEMP
    {% endif %}
    CLEAN_NOZZLE
    # Measure the stationary scene after cleaning, before calibration and mesh.
    # The optional extra pins manual exposure and searches a bounded set of
    # white-strip/exposure pairs. It never moves or changes a heater target.
    {% if 'camera_tune' in printer %}
        CAMERA_TUNE STARTUP=1
    {% endif %}
    # NOT rounded, and the target is re-sent unchanged rather than recomputed.
    # chamber_preheat releases the plate to target + bed_carry, a deliberate
    # fractional offset sized against PID_SETTLE_DELTA; rounding here would
    # silently discard it and command a different bed than the preheat chose.
    {% set bed = printer.heater_bed.target|float %}
    {% if bed > 0 %}
        M117 Bed Settle
        M190 S{bed}
    {% endif %}
    SET_GCODE_OFFSET Z=0
    M117 Eddy Calibration
    # EXTRUDER_TEMP IS PASSED, and not passing it was costing a plateau and a
    # decision. z_offset_calibration.py defaults it to 130 and then blocks on
    # M109, so a start that only sent BED_TEMP went 195 -> 150 -> 130 -> 280:
    # CLEAN_NOZZLE ends its scrub at probe_temp, the calibration pulled the
    # nozzle down another 20 C, waited for it, and only then reheated to print.
    # Measured on the 2026-09-04 ABS job at about 1.5 minutes of pure wait.
    #
    # Worse than the time, it silently reverted a deliberate choice. probe_temp
    # was raised 130 -> 150 because 0dysseusRex probes his load cell at 150
    # (nozzle_brush.cfg), and the tap was happening at 130 regardless. Sending
    # probe_temp makes the tap temperature one number in one place, and the
    # M109 returns immediately because the nozzle is already there.
    # Guarded like end_print.cfg guards _COOL_STATE: the pack is modular, and a
    # machine without nozzle_brush.cfg must still run this. The fallback is
    # z_offset_calibration.py's OWN default, so an installation without the
    # brush behaves exactly as it did before this line existed.
    # `|default` rather than an `in printer` test: the section can be present
    # while the variable is not, and only the filter survives both. The fallback
    # is z_offset_calibration.py's OWN default, so an installation without
    # nozzle_brush.cfg behaves exactly as it did before this line existed.
    {% set probe_temp = printer["gcode_macro _BRUSH"].probe_temp|default(130.0)|float %}
    # Select the calibration path from the configured probe object.
    #
    # Stock 1.3.7 configures probe_pressure and an eddy sensor. Stock 1.4.x
    # uses eddy contact instead; the physical load cell may still be present.
    # Their z_offset_calibration.py implementations differ.
    #
    # In the preserved 1.3.7 implementation, METHOD=force_overlay bypasses
    # the already-calibrated/default-method skip. It runs load-cell reference
    # work AND eddy calibration, not just a scalar SET_GCODE_OFFSET operation.
    #
    # On 1.4.7, any non-default METHOD would likewise bypass the skip and
    # force contact calibration on every start. Leave METHOD at its default
    # when probe_pressure is absent so that firmware can skip existing data.
    {% if 'probe_pressure' in printer %}
        Z_OFFSET_CALIBRATION METHOD=force_overlay BED_TEMP={printer.heater_bed.target} EXTRUDER_TEMP={probe_temp}
    {% else %}
        Z_OFFSET_CALIBRATION BED_TEMP={printer.heater_bed.target} EXTRUDER_TEMP={probe_temp}
    {% endif %}
    G28 Z
    M117 Mesh Calibration
    BED_MESH_CALIBRATE
    # DROP bed_carry NOW THAT PROBING IS DONE. chamber_preheat leaves the plate
    # at target + bed_carry, which is right for the wipe, the tap and the mesh --
    # the extra half degree nudges the chamber and stays inside
    # PID_SETTLE_DELTA -- but the PRINT should run on the number the slicer
    # asked for. Without this the whole job ran 0.5 C hot and the console said
    # 100.5 where the profile said 100.
    #
    # One-shot: the value is consumed and cleared, so a job that never called
    # M191 has nothing to restore and this is inert.
    # print_bed_target is written by M191 (chamber_fan.cfg) and cleared to the
    # STRING "None" by the reset path, so it cannot be |float'd unguarded.
    {% set raw_bed = printer["gcode_macro _CH_STATE"].print_bed_target %}
    {% set real_bed = raw_bed|float if raw_bed not in (None, "None", "") else 0.0 %}
    {% if real_bed > 0 and (printer.heater_bed.target|float - real_bed)|abs > 0.01 %}
        M140 S{real_bed}
        RESPOND PREFIX="preheat" MSG="bed back to the printing target {real_bed}C, carry released"
    {% endif %}
    {% if real_bed > 0 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_bed_target VALUE=0.0
    {% endif %}
    # PARK OVER THE BRUSH FOR THE FINAL HEAT-UP.
    #
    # The slicer's M104/M109 to first-layer temperature runs immediately after
    # this macro returns, and the ramp from probe_temp to 280 C on ABS produces
    # a real bead. Until now it happened wherever BED_MESH_CALIBRATE left the
    # toolhead, which on the 2026-09-07 job was inside the part volume.
    #
    # The pad is the right catcher and it already exists for this: it is at
    # NEGATIVE X, off the front-left of the plate, so nothing that drips here
    # can land on the print. Existing retraction does not eliminate heat-up
    # ooze; keeping the wait over the pad controls where that material lands.
    #
    # Z FIRST, THEN XY. The mesh leaves the nozzle near the plate; moving X to
    # -8.65 at that height would drag it across the bed and off the front edge.
    # The start G-code's own `G1 Z5` follows this and is harmless: same axis,
    # same direction, already there.
    {% set b = printer["gcode_macro _BRUSH"] %}
    {% set park_x = (b.pad_x_min|float + b.pad_x_max|float) / 2.0 %}
    {% set park_y = (b.pad_y_min|float + b.pad_y_max|float) / 2.0 %}
    G90
    G1 Z5 F600
    G1 X{park_x|round(2)} Y{park_y|round(2)} F6000
    RESPOND PREFIX="start" MSG="parked over the brush for the heat-up, ooze lands on the pad"

    save_last_file
    # STOCK IS `M117 {last_file}` AND IT HAS NEVER SHOWN ANYTHING. `last_file`
    # is a save_variable (plr.cfg writes it), not a Jinja global, so the bare
    # name is Undefined and Klipper renders Undefined as an empty string rather
    # than raising -- an M117 with no argument, on every print since launch.
    #
    # Reading it back through printer.save_variables would be wrong too, and
    # more subtly: Klipper renders a macro completely before executing any of
    # it, so the value here would be the one save_last_file wrote LAST job, not
    # the one on the line above. print_stats.filename is already this job's and
    # is correct at render time.
    M117 {printer.print_stats.filename}

# END SOURCE: klipper/config/start_print.cfg

# Personal overrides are opt-in. Include your own file last in printer.cfg,
# after any optional Python config it modifies. A personal file can declare
# Python sections, so auto-including one would defeat the macro-only fallback.

# MACHINE MODE, last, so a mode file overrides printer.cfg's stepper sections
# and everything above. No match is standard mode; svzero-mode-precision.cfg
# beside this file selects precision (docs/PRECISION.md). The one wildcard in
# the pack, and the one include the release builder leaves for Klipper rather
# than inlining: which mode file is present is the operator's choice at runtime.
[include svzero-mode-*.cfg]

# END SOURCE: klipper/config/svzero-1.4.x.cfg
