# BEGIN SOURCE: klipper/config/chamber_preheat.cfg
# Host-side stirred-nozzle qualifier and optional bed-boost planner for M191.
#
# Install klipper/chamber_preheat.py in ~/klipper/klippy/extras/ and include
# this optional file after the firmware-matched macro-pack include. When enabled,
# M191 uses the extra to qualify the nozzle as a chamber proxy. Without this
# section, the native macros wait on the rear sensor and do not boost the bed.
#
# A one-minute cold-nozzle sample uses an exponential moving average of 5 s
# rate increments to produce a linear chamber ETA. The bed begins at +5 C,
# then uses the lesser of 10 C and remaining minutes at 1 C/min. It holds at
# +10 while the filtered ETA exceeds ten minutes. After the first decrease,
# filtered ETA may hold the command but never raise it; downward slew is capped
# at 1 C/min. M191 can override all four policy values per call. Python owns the
# live wait because TEMPERATURE_WAIT holds Klipper's G-code mutex, so delayed
# G-code/Jinja cannot alter the bed target concurrently.

[chamber_preheat]
# bed_wait and wipe_lead_seconds are NOT SET HERE ANY MORE. Both are now the
# module's own defaults -- bed_wait False, wipe_lead_seconds 45 -- so this file
# carries the published stance and nothing else. The operator's higher lead is
# an override in svzero-personal.cfg, which is included last and is not in the
# publish manifest. See notes/personal-tuning-register.md.
#
# Why they became defaults rather than staying operator-only:
#
#   bed_wait  M191 has two phases -- wait for the chamber minimum, then wait
#             for the boosted plate to coast back to target. The second ran 90 s
#             with nothing else happening, measured 2026-09-07, while
#             START_PRINT's next act is a wipe that needs no plate. The M190
#             already in front of the probe absorbs the coast. The one
#             precondition is that such an M190 exists; ours does.
#
#   wipe_lead Hands over early so the heat/wipe/cool LANDS on the chamber
#             minimum instead of starting from it. The error is one-sided --
#             too large a lead starts the first layer cold and nothing
#             re-checks -- so the published 45 sits well under the 97.0 s wipe
#             actually measured here, and the learned bound in chamber_fan.cfg
#             can only pull it lower.
slope_sample_seconds: 60
update_seconds: 5
minimum_rate: 0.02
# Absolute plate ceiling, not a boost magnitude: a magnitude cap does not
# survive changing the printing bed target. Raised 100 -> 124 on 2026-09-01:
# 100 was a PLA-era limit on what the chamber should see, not a limit of the
# plate, and ABS wants every watt the bed has.
#
# ###########################################################################
# ONE VALUE LIVES HERE NOW. Lowered 124 -> 120 on 2026-09-03, on the operator's
# call, and that COLLAPSES THE RELEASE/TUNED SPLIT this block used to describe.
#
# 120 was already what the published pack shipped, because Sovol's own user
# manual V1.3 states "Hot bed temperature <=120 C" -- their firmware's
# max_temp: 125 is 5 C above their own published spec, and a pack that ships
# past the vendor's number is asking a stranger's plate to do something the
# vendor does not claim it does. 124 was the tuned value Zero2 ran during the
# cold-start campaign, and swapping the two at packaging time was a MANUAL step
# and therefore a trap. There is nothing left to swap.
#
# The margin matters more than it used to. Under the "hold" boost policy the
# plate is COMMANDED to this ceiling in one step rather than eased into it over
# minutes, so overshoot is no longer damped by the approach. max_temp: 125 is a
# Klipper SHUTDOWN threshold, not a clamp -- passing it aborts the print.
#
# 124 left one degree. Measured overshoot at the 124 anchor was +0.295 and
# +0.397 (notes/data/pid-tuning/zero2.csv, 2026-09-03): inside a degree, but
# only just, and measured from full-power autotune limit cycles rather than
# from this controller answering a step. 120 leaves five degrees, which makes
# the question stop mattering rather than making it close.
#
# The plate is not the constraint either way: the vendor's own thermal cutoff is
# a KSD-9700 at 135 C (notes/kb/heated-bed.md). max_temp is.
# ###########################################################################
max_bed_temp: 120
# BOOST MAGNITUDE CAP, live again at 25 C from 2026-09-04. The plate may go to
# `bed_target + 25`, and max_bed_temp above still clamps that absolutely, so the
# effective cap is min(120, bed + 25).
#
# The two are answering different questions and both are needed. max_bed_temp
# protects the PLATE and must not scale with anything. max_bed_boost bounds what
# the boost COSTS TO UNWIND: the plate falls at roughly 5 C/min passively
# (notes/data/cooldown/zero2-passive-decay-20260903.md) and M190 blocks until it
# is within PID_SETTLE_DELTA of target, so every degree of boost is twelve
# seconds the print waits at the end of the preheat. 25 C is five minutes.
#
# Left at 1000 it was inert, and the absolute ceiling became a per-material cap
# by accident rather than by choice -- backwards, because it handed the most
# boost authority to the material with the least use for it:
#
#   PC   bed 110  headroom 10   PETG bed 85  headroom 35
#   ABS  bed 100  headroom 20   PLA  bed 65  headroom 55
#
# At 25 C: ABS and PC are unchanged, both still clamping at 120. PETG and TPU
# reach 110, PLA 90 instead of 120 -- five minutes of unwind instead of eleven.
#
# ANCHORED TO THE BED ON PURPOSE, AND ONLY THIS IS. The boost is a bed action
# and its cost scales with how far the bed was pushed, so the bed is the right
# reference for it. The CHAMBER is a different matter: every shipped profile now
# declares activate_chamber_temp_control with its own chamber_minimal_temperature
# and chamber_temperature, so M141 sets `requested` and _CHAMBER_AUTOSTART's
# bed-derived inference is bypassed entirely.
#
# That distinction is what keeps a future COLD-PLATE profile honest. The
# inference buckets on Sovol's own bed temperatures -- 70 and 90 C boundaries --
# so a cryoplate profile printing at bed 25 would be filed as PLA whatever it
# actually is. It never gets the chance, because a profile inheriting from our
# material bases carries explicit chamber values and the inference only runs when
# the slicer said nothing. A cryoplate profile built from scratch MUST declare
# them; that is the one rule, and it is the same rule that already applies to any
# profile that wants a chamber it did not ask for.
max_bed_boost: 25
# EVERYTHING FROM HERE TO slope_confidence BELONGS TO THE "eta" BOOST POLICY,
# which is no longer the default. Left in place, uncommented and unset, because
# `boost_policy: eta` in this section brings the whole planner back and these are
# its knobs. Under the shipped "hold" policy none of them do anything: the plate
# is commanded to max_bed_temp on the first tick and released to the printing
# target the moment the chamber crosses its minimum, so there is no climb to
# rate-limit, no turn to schedule and no descent to pace.
#
# Why the default moved, 2026-09-03: observed on a real ABS print, the planner
# took the plate 111 -> 124 at 3 C/min and then spent about twenty minutes
# walking it back down at the 1 C/min coast floor -- with the heater holding it
# UP, since passive loss up there is nearer 5 C/min. It reached its target and
# sat idle while the chamber ETA still read 4 to 11 minutes. Every minute of
# that descent is a minute the plate is below the ceiling and heating the
# chamber less, so the schedule delays the arrival it is waiting for. Replayed
# through the test fixture the two policies are 120 bed commands against 2.
#
# Two monotonic legs: the plate climbs at climb_rate until the ETA says it must
# turn around, then falls at coast_rate. coast_rate also scales how many degrees
# of boost one minute of ETA buys -- two meanings on one knob, to be separated.
climb_rate: 3
# Before any ETA exists the plate ramps blind at climb_rate rather than holding
# the opening guess, commanded in whole degrees so the moves read cleanly.
blind_step: 1
blind_step_seconds: 20
# How far the blind ramp may run unaided. A trend normally appears within a
# couple of minutes; this only bounds a nozzle that never yields one.
blind_max: 15
# Ease into the plateau instead of arriving at full rate: inside this many
# minutes of the ceiling the climb steps down 3 -> 2 -> 1 C/min, one per minute.
climb_ease_minutes: 2
# The turn is a threshold crossing on a noisy signal, so it fires on the ETA's
# downward blips and turns the plate early and low. Deciding it on the highest
# ETA seen in this window resists that; the descent still floors on the live
# value so it never holds on a stale one. Longer is more aggressive: replayed,
# 360 s reached the plate ceiling and cut the bed margin to 6 s.
turn_eta_window: 180
# NOT an "eta" knob -- bed_carry applies under both policies, because it exists
# for Klipper's PID settle window rather than for any schedule.
# The plate settles here rather than exactly on the printing target: nozzle and
# motion after the soak add their own heat, and a small bump nudges the end of
# the chamber rise. It CANNOT be raised to buy more of that: Klipper's PID
# check_busy tests the absolute error against PID_SETTLE_DELTA = 1.0, so the
# M190 that follows M191 blocks while a hotter plate cools. A carry of exactly
# 1.0 sits on that boundary -- 2026-08-26 cleared it by 0.01 C. Capped at 0.9.
bed_carry: 0.5
# Hold the maximum for a beat before turning around.
peak_plateau: 60
# The approach ETA is unbiased but jumpy. Smooth it before acting on it.
eta_alpha: 0.25
# coast_rate is a FLOOR on the descent, not a target: a plate still ramping when
# the print starts carries a gradient and cups. Arriving early is soak time, not
# waste. descent_max_rate applies only at or past the deadline, where the plate
# must come down hard -- the bed is never allowed to be later than the chamber.
descent_max_rate: 6
# Pause the descent only when the chamber has demonstrably slowed: the smoothed
# ETA growing by at least this many minutes since the last sample. Replayed
# across two soaks this holds ~10% of the descent; 0.5 gives ~16%, 1.0 gives ~5%.
eta_grow_hold: 0.75
coast_rate: 1
initial_bed_boost: 5
rate_filter_alpha: 0.25
# Qualification: the regressed nozzle slope must reach this band from below
# and then hold for the settle dwell before the nozzle is a chamber proxy.
ready_slope: -0.02
# Fallback only. A nozzle that cooled from above, flattened to within the
# regression's own uncertainty of zero, and sits above the threshold qualifies
# at once: the standard error answers "has it settled" better than a clock.
# 30, lowered from 60 on 2026-09-07. The slope band and its standard error
# already decide whether the nozzle has settled; the dwell is only there to stop
# a momentary flat reading counting as one. A full minute of it delayed the bed
# boost by the same minute, on a machine where the boost is the whole point of
# qualifying early.
settle_dwell: 30
qualify_timeout: 900
# Trailing regression window for the slope, and the number of standard errors
# assumed in the chamber's favour when sizing a boost. Measured nozzle noise is
# 0.10-0.18 C against a 0.2-0.5 C/min trend, so a short window is all noise.
slope_window_seconds: 120
slope_confidence: 2
# Newton-cooling projection. A still-cooling nozzle whose extrapolated
# destination already clears the minimum by this margin qualifies immediately,
# so a warm printer is not charged for the descent. Admitted only for a clearly
# decaying nozzle with a plausible time constant and enough span: replayed
# without those guards, the four recorded cold starts overshot the true
# settling point by +62 to +125 C. Set asymptote_margin to 0 to disable.
asymptote_margin: 2
asymptote_min_decay: 0.10
asymptote_tau_min: 30
asymptote_tau_max: 1800
asymptote_drop_max: 60
asymptote_min_span: 60

# The slope worth scheduling a boost against, distinct from minimum_rate above
# which only decides whether an ETA is displayable. A trailing regression lags a
# chamber whose slope is still climbing, so committing too early reads the ETA
# far too long. Not the safety mechanism: sizing from the earliest plausible
# arrival is, with boost_fraction as the margin.
# 0.02 matches minimum_rate deliberately: during development the aim is the
# earliest and largest boost the ETA will justify, to learn the machine's time
# constants. Raise it once those are understood -- a trailing regression lags a
# chamber whose slope is still climbing, so a low threshold reads the ETA long
# and steps up further than a settled estimate would.
boost_min_rate: 0.02

# Land the bed back on its printing setpoint this far ahead of the chamber
# reaching its minimum. Waiting on the bed is always wasted time. With no lead
# the 2026-08-26 run held the print open 15 s past chamber readiness.
bed_lead_seconds: 60

# Smallest first boost worth committing. Near the end of a soak a fraction of a
# degree is churn on the bed for no useful heat.
min_boost_step: 0.5

# Fraction of the apparent headroom actually committed to a boost. Halving it
# was the conservative first pass; on 2026-08-25 it held the bed only ~20 s
# past chamber readiness, so the operator asked for the full headroom back.
boost_fraction: 1.0

# Seed the slope window from Moonraker's temperature store, the same 1200
# one-second samples Mainsail scrolls. An idle machine then qualifies at once
# instead of spending ~148 s re-deriving a flat line. Optional: any failure
# just costs the normal wait.
history_seconds: 300
history_interval: 1.0
history_match_tolerance: 2
moonraker_url: http://127.0.0.1:7125
moonraker_timeout: 5
max_temp_margin: 1
bed_ready_tolerance: 0.5
report_seconds: 30

# END SOURCE: klipper/config/chamber_preheat.cfg

# BEGIN SOURCE: klipper/config/spool_guard.cfg
# Pre-flight Spoolman gate for M191-era start G-code.
#
# Install klipper/spool_guard.py in ~/klipper/klippy/extras/ and include this
# optional file after the firmware-matched macro-pack include. Generated start
# G-code calls _PREFLIGHT before heating, which calls SPOOL_GUARD only when this
# extra is enabled. Without it, printing proceeds without spool validation.
#
# This exists because Orca's "Upload and Print" is a single Moonraker call that
# never opens Mainsail's start dialog, where the equivalent checks live. See
# notes/kb/spool-preflight.md.

[spool_guard]
# Set False to disable the gate entirely without removing the include.
enabled: True
# Moonraker answers both the job metadata and the Spoolman proxy.
moonraker_url: http://127.0.0.1:7125
# Per-request timeout. The command allows three requests plus a second.
timeout: 8
# Extra grams required beyond the sliced estimate. Zero matches Mainsail.
margin: 0
# Compare Spoolman's material against the G-code's filament type.
check_material: True

# A refusal arms a one-shot override for that exact job: start the same file
# again within this many seconds and it prints. Mainsail's own Spoolman warning
# cannot serve as the click-through, because it is advisory and both it and an
# Orca upload-and-print reach Klipper as the same SDCARD_PRINT_FILE -- the
# printer cannot tell which one asked. Zero disables the override.
override_window: 300

# SPOOL_GUARD FILE="<uploaded name>" dry-runs the check against any job
# without starting it, and deliberately does NOT arm the override.
# SPOOL_GUARD BYPASS=1 skips the gate for one call.


# END SOURCE: klipper/config/spool_guard.cfg

# END SOURCE: klipper/config/svzero-python.cfg
