    values:
      default_print: 0.20mm (Standard)
  - condition: tool.nozzle_diameter == 0.5
    id: pm9LEV5Sh1o3Iu2Izh/mbA
    values:
      default_print: 0.25mm (Standard)
  - condition: tool.nozzle_diameter == 0.6
    id: DyhUKsNPwyNcmKHlIetFDw
    values:
      default_print: 0.3mm (Standard)
  - condition: tool.nozzle_diameter == 0.8
    id: WcwoQRPHT7IEhPHBg72IZQ
    values:
      default_print: 0.4mm (Standard)
  - condition: tool.nozzle_diameter == 1
    id: vja1yXy8VcgsfyD9UwKYMw
    values:
      default_print: 0.6mm (Standard)
  - condition: tool.nozzle_diameter == 1.2
    id: PNIXwvZGWf8XSsBq6F9ocQ
    values:
      default_print: 0.5mm (Standard)
  - condition: tool.nozzle_diameter == 1.4
    id: oPg6dDNgovSlSboX74vTJg
    values:
      default_print: 0.7mm (Standard)
