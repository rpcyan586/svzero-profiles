kind: filament
id: bcCfu8TbVP9Yri4e/5mxqQ
name: SV Zero ABS
condition: printer.base_model == "SVZERO"
values:
  filament_notes: 'Imported from Orca JSON (SV Zero ABS). | [8M]: toolhead-scope values from SV08 MAX
    (shared toolhead) | [PT1000]: nozzle temperatures rebased from Sovol''s sensor curve (temperature
    270->261, first_layer_temperature 280->271)'
  filament_colour: '#1FA7C1'
  filament_max_volumetric_speed: 20.0
  slowdown_below_layer_time: 8
  temperature: 261
  first_layer_temperature: 271
  extrusion_multiplier: 0.98
  filament_type: ABS
  filament_diameter: 1.75
  filament_cost: 30.0
  filament_density: 1.04
  bed_temperature: 100
  first_layer_bed_temperature: 100
  max_fan_speed: 30
  fan_below_layer_time: 30
  full_fan_speed_layer: 3
  min_print_speed: 10.0
  bridge_fan_speed: 100
  chamber_temperature: 60
  chamber_minimal_temperature: 45
  start_filament_gcode: '; Material-specific Z offset: + means farther from bed

    SET_GCODE_OFFSET Z_ADJUST=0.000 MOVE=1

    SET_PRESSURE_ADVANCE ADVANCE=0'
  min_fan_speed: 10
  filament_shrinkage_compensation_xy: 0.8%
  filament_shrinkage_compensation_z: 0.8%
