# Pre-flight Spoolman gate for M191-era start G-code.
#
# Install klipper/spool_guard.py in ~/klipper/klippy/extras/ and include this
# file from printer.cfg. The generated start G-code calls SPOOL_GUARD as its
# first line, before any heater is commanded, so a rejected job costs nothing.
#
# This exists because Orca's "Upload and Print" is a single Moonraker call that
# never opens Mainsail's start dialog, where the equivalent checks live. See
# notes/kb/spool-preflight.md.

[spool_guard]
# Set False to disable the gate entirely without removing the include.
enabled: True
# Moonraker answers both the job metadata and the Spoolman proxy.
moonraker_url: http://127.0.0.1:7125
# Per-request timeout. The command allows three requests plus a second.
timeout: 8
# Extra grams required beyond the sliced estimate. Zero matches Mainsail.
margin: 0
# Compare Spoolman's material against the G-code's filament type.
check_material: True

# SPOOL_GUARD FILE="<uploaded name>" dry-runs the check against any job
# without starting it. SPOOL_GUARD BYPASS=1 skips the gate for one call.

