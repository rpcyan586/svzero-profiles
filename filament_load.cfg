# LOAD_FILAMENT / UNLOAD_FILAMENT — Sovol's macros plus end_retract clearing
#
# Include AFTER Macro.cfg. Overrides both macros to clear the end-of-print
# retract debt in save_variables. When the user manually loads or unloads
# filament via the touchscreen, the previous print's retract debt is stale:
# the filament has been manually seated and the stored 4 mm debt would
# over-prime on the next job. Both macros clear it.
#
# UNLOAD is STOCKALIKE — Sovol's own code, unchanged, plus the SAVE_VARIABLE.
#
# LOAD carries one further change: a G1 E8.4 after Sovol's E45/E30, which is the
# MEASURED shortfall of their purge on a colour change, not a guess. The comment
# at that line has the arithmetic and the caveat. Said here because a header that
# claims "unchanged" is how a real deviation stops being reviewed.

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            M117 Nozzle heating...
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        M117 Extruding...
        G91
        G1 E45 F300
        G1 E30 F150
        # THE ONE ADDITION TO SOVOL'S SEQUENCE, and it is a measurement.
        #
        # `E45 F300 / E30 F150` is byte-identical across SV06 ACE, SV06 ACE
        # PLUS, SV08, SV08 MAX and the Zero -- a bed-slinger, a 500 mm CoreXY
        # and a 152 mm box all told to extrude the same 75 mm. It was never
        # re-derived for this machine.
        #
        # Loading black ABS over yellow PLA on 2026-09-03 left HALF THE PURGE
        # RING still yellow. PURGE_LINE logged that ring at 40.63 mm3, so the
        # changeover was still running about 20.3 mm3 into it -- 8.4 mm of
        # 1.75 mm filament, which is what this line adds.
        #
        # Why it is that short: the 30 mm purge leg is 72.2 mm3, and the Zero's
        # melt zone is reportedly 32 mm long (cardoc, forum 2025-05-08,
        # unverified -- notes/kb/toolhead-lineage.md). At a 1.85-2.00 mm bore
        # that is 86-100 mm3, so the stock purge does not sweep the melt zone
        # even ONCE. Half a yellow ring is the expected result, not a near miss.
        #
        # 8.4 mm is deliberately NOT the textbook fix. A colour change wants
        # three to five melt volumes, 113-189 mm, and this is the measured
        # shortfall for the one transition observed rather than a general
        # answer. The number to settle before going further is how much of the
        # 45 mm fast leg is TRANSIT rather than purge: with a 32 mm melt zone
        # the gear-to-nozzle path could be near 55 mm, in which case E45 never
        # reaches the nozzle and the real purge is under 20 mm. Load with the
        # nozzle hot and count extrusion until material appears; two minutes.
        G1 E8.4 F150
        G90
        M400
        M117 Extrude Finish
        M400
        # Clear the end-of-print retract debt. The user just manually loaded
        # filament, so whatever position it was retracted to is no longer relevant.
        SAVE_VARIABLE VARIABLE=end_retract VALUE=0
        {% if current_target_temp == 0 or printer.print_stats.state != "paused"%}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't load filament during printing!!!")}
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            M117 Nozzle heating...
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        M117 Retracting...
        G91
        G1 E+25 F300
        G1 E-10 F1500
        G1 E-20 F600
        M400
        G4 P3000
        G1 E-50 F300
        G90
        M400
        M117 Retract Finish
        M400
        # Clear the end-of-print retract debt. The user just manually unloaded
        # filament, so the stored debt is stale.
        SAVE_VARIABLE VARIABLE=end_retract VALUE=0
        {% if current_target_temp == 0 or printer.print_stats.state != "paused"%}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}
