# Optional local camera/lighting tuner. Requires camera-runtime.service and
# klipper/camera_tune.py plus the pack's existing klipper/moonraker.py helper.
# No MCU firmware, motion, homing or heater changes. No GPU dependency at print time.
[camera_tune]
enabled: True
service_url: http://127.0.0.1:8091
max_seconds: 35
