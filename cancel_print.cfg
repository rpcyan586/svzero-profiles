# CANCEL_PRINT — make the shutdown survive an unhomed cancel
#
# Include AFTER Macro.cfg. Includes apply linearly and duplicate sections merge
# with the later one winning (configfile.py uses RawConfigParser(strict=False)),
# so this overrides Sovol's CANCEL_PRINT without editing their file, which
# factory_resets.sh overwrites. `rename_existing` is deliberately not repeated:
# it is already set on the merged section by Macro.cfg.
#
# WHY THIS EXISTS
#
# Sovol's CANCEL_PRINT retracts, lifts Z and parks XY with no homed check, and
# it does that BEFORE turning anything off:
#
#     G1 Z+10 F3000          <- "Must home axis first" on an unhomed machine
#     G90
#     G1 X{x_park} Y{y_park} F9000
#     TURN_OFF_HEATERS       <- never reached, because the move above threw
#     ALL_FAN_OFF
#     CLEAR_PAUSE
#     PRINT_END
#     M84
#
# A G-code error abandons the rest of the rendered script, so cancelling before
# G28 completes leaves the heaters commanded, the fans running, the steppers
# enabled and the power-loss state uncleared. Observed 2026-08-25 when
# SPOOL_GUARD refused a job from the first line of the start G-code: nothing was
# hot yet, so nothing was harmed, but PRINT_END demonstrably did not run.
#
# Two deviations from stock, both deliberate:
#
#   1. Everything that turns things off runs first, and unconditionally. None
#      of TURN_OFF_HEATERS, ALL_FAN_OFF, CLEAR_PAUSE, PRINT_END or M84 moves
#      the toolhead, so none of them can throw the way a move can. Cleanup then
#      survives any motion failure, not only this one.
#   2. The retract, lift and park happen only with all three axes homed. On an
#      unhomed machine they are skipped silently rather than throwing.
#
# Sovol also announces "Cancel Print Success!" through action_respond_info,
# which Jinja evaluates while RENDERING the template -- so it printed before the
# move that then failed, claiming success for a cancel that had not happened.
# RESPOND runs at execution time instead, so it is only seen if the macro
# actually reaches the end.

[gcode_macro CANCEL_PRINT]
description: Cancel the print, shutting down safely even if nothing is homed.
gcode:
    {% set x_park = printer['gcode_macro _global_var'].cancel_park.x|float %}
    {% set y_park = printer['gcode_macro _global_var'].cancel_park.y|float %}
    {% set z_lift_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance %}
    {% set e_retract = printer['gcode_macro _global_var'].cancel_park.e|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}
    {% set homed = printer.toolhead.homed_axes|lower == "xyz" %}

    CANCEL_PRINT_BASE

    # Cancel never ramps, and it kills a ramp already running. A cancel is the
    # one case where the reason for stopping is unknown -- a thermal fault, a
    # fan stall, an operator watching something go wrong -- so the controlled
    # cooldown's assumption that this was a healthy finished print does not
    # hold. This must come before TURN_OFF_HEATERS so no scheduled tick can
    # re-command a heater afterwards.
    {% if 'gcode_macro _COOL_STATE' in printer %}
        COOLDOWN_ABORT
    {% endif %}

    # Off first. Sovol put these last, behind a move that can throw.
    TURN_OFF_HEATERS
    ALL_FAN_OFF
    CLEAR_PAUSE
    PRINT_END

    {% set skipped = [] %}
    {% if homed %}
        G91
        # `enabled`, not `enable` -- Sovol has this one right here, unlike
        # END_PRINT. See notes/kb/end-of-print.md.
        {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
              printer['filament_switch_sensor filament_sensor'].filament_detected == True
        %}
            {% if (printer.extruder.target != 0 and
                   printer.extruder.temperature >= printer.extruder.target and
                   printer.extruder.temperature >= e_mintemp)
            %}
                G1 E-{e_retract} F500
            {% else %}
                {% set null = skipped.append('retract') %}
            {% endif %}
        {% endif %}

        {% if (printer.gcode_move.position.z + 10) < z_lift_max %}
            G1 Z+10 F3000
        {% else %}
            G1 Z+{(z_lift_max - printer.gcode_move.position.z)} F3000
        {% endif %}
        G90
        G1 X{x_park} Y{y_park} F9000
    {% else %}
        {% set null = skipped.append('lift and park, not homed') %}
    {% endif %}

    M84

    # One line, and only at execution time. Sovol used action_respond_info,
    # which Jinja evaluates while rendering, so its "Success!" printed before
    # the move that then failed.
    RESPOND PREFIX="CANCEL:" MSG="outputs off{% if skipped %} - skipped {skipped|join(', ')}{% endif %}"
