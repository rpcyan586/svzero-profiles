# SV Zero macro pack -- identity and the profile/pack handshake.
#
# Included by svzero-1.3.7.cfg and svzero-1.4.x.cfg. Nothing else needs it, and
# nothing in the pack depends on it, so an installation that drops this file
# still works -- it just stops warning about mismatches.
#
# WHY A HANDSHAKE
#
# The profiles and the macro pack are two downloads that can drift apart, and
# BOTH directions are survivable but silent:
#
#   PROFILE WITHOUT PACK. Every pack-dependent command we emit is an ordinary
#   macro call, and Klipper answers an unknown one with respond_info, not an
#   exception (gcode.py:305) -- it prints "Unknown command" and CARRIES ON. So a
#   stock printer running our profile prints without the chamber wait, the
#   preflight or the cooldown ramp, and says so only in lines a user scrolls
#   past. (Until 2026-09-05 there was one exception: the clean-temp handoff used
#   SET_GCODE_VARIABLE MACRO=_BRUSH, a mux command that RAISES when the macro is
#   absent, so a missing pack aborted the job. That is why the table moved into
#   nozzle_brush.cfg.)
#
#   PACK WITHOUT PROFILE. Mostly designed for and mostly fine: END_PRINT and
#   CLEAN_NOZZLE override Sovol's own and close the retract-debt cycle with no
#   slicer involvement, CHAMBER_AUTOSTART infers a chamber target from the bed
#   temperature when nothing was declared, and the cooldown falls back to its
#   material table. What is lost is quiet -- the chamber minimum, the material
#   name and the clean temperature all revert to inference.
#
# So the handshake NEVER ABORTS. It makes both drifts say so, once, in a line
# that names what to do about it. Degrading gracefully is the requirement;
# degrading silently is the bug.

[gcode_macro _SVZERO_PACK]
description: Pack identity. Read by SVZERO_REQUIRE; edit only when releasing.
# Bump on any change that alters what the start G-code may rely on. Compared as
# a plain string: a mismatch is a warning, never a refusal, because a pack newer
# than the profile is the normal state during development and is almost always
# fine.
variable_version: "1.0.4"
# Set by SVZERO_REQUIRE, cleared by START_PRINT once it has been read. This is
# how the pack notices a job that never introduced itself.
variable_seen: 0
gcode:

[gcode_macro SVZERO_REQUIRE]
description: Announce which profile sliced this job, so drift is visible.
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% set want = params.VERSION|default("")|string %}
    SET_GCODE_VARIABLE MACRO=_SVZERO_PACK VARIABLE=seen VALUE=1
    {% if want and want != p.version %}
        RESPOND PREFIX="svzero" MSG="profile expects pack {want}, installed pack is {p.version}. Not fatal -- check the release notes if something behaves oddly."
    {% endif %}

# Called by START_PRINT. Warns when a job arrived without SVZERO_REQUIRE, which
# means it was sliced by a profile that predates the handshake or by a stock
# one. Everything still runs; the values simply come from inference rather than
# from the slicer.
[gcode_macro _SVZERO_CHECK_PROFILE]
description: Warn once per job if the slicer never identified itself.
gcode:
    {% set p = printer["gcode_macro _SVZERO_PACK"] %}
    {% if p.seen|int == 0 %}
        RESPOND PREFIX="svzero" MSG="this job was not sliced by an rpcyan SV Zero profile ({p.version} installed). Chamber, material and silicone nozzle wipe temperatures fall back to inference."
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SVZERO_PACK VARIABLE=seen VALUE=0
