name: Validate public profiles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/verify.py
      - run: python tools/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-downloads
          path: dist/
