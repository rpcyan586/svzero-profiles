# Chamber control by PI-regulated exhaust fan — macros
#
# Forum thread: https://forum.sovol3d.com/t/9025  (rpcyan)
#
# HARDWARE SECTIONS LIVE IN A SEPARATE FILE, and which one you include depends
# on your firmware. See chamber_fan_hw_1.4.x.cfg and chamber_fan_hw_1.3.7.cfg.
# 1.3.7 already wires both the chamber thermistor and the exhaust fan in stock
# printer.cfg, and redefining either is a hard config error.
#
#   printer.cfg (1.4.x):   [include chamber_fan_hw_1.4.x.cfg]
#                          [include chamber_fan.cfg]
#
#   printer.cfg (1.3.7):   ...leave the stock sections alone...
#                          [include chamber_fan_hw_1.3.7.cfg]   <- at the END
#                          [include chamber_fan.cfg]
#
# FAST STATE IS HELD IN RAM, NOT save_variables
#
# Every SAVE_VARIABLE rewrites the whole saved_variables.cfg file
# (klippy/extras/save_variables.py). The loop used to save the integral and the
# duty cycle on every pass; at the old 6 s period that is ~1,200 file rewrites
# an hour, ~24,000 over a 20 h print, for values that are meaningless after a
# restart anyway. Loop state now lives in _CH_STATE as gcode variables, which
# never touch the disk. Only user settings — target, gains, limits — are
# persisted, and those change when you change them.

[gcode_macro _CH_STATE]
description: Volatile loop state. Not saved, and should not be.
variable_integral: 0.0
variable_primed: 0
variable_running: 0
variable_last_duty: 0.0
variable_requested: 0           # 1 = the slicer sent M141 for THIS print
# 1 = that request was M141 S0: the slicer asked for NO chamber control.
# Distinct from never asking. _CHAMBER_AUTOSTART infers a ceiling from the
# bed when nothing asked, which would quietly turn control back on for the
# one profile that deliberately declined it.
variable_control_declined: 0
variable_fan_latched: 0          # physical exhaust output is nonzero
variable_cooling_latched: 0      # chamber demand hysteresis: 5% on, 3% off
variable_active_floor: 0.0       # known-good floor or this print's lower trial
variable_pending_duty: 0.0       # duty to reapply after a stall-retry off pulse
variable_launching: 0            # retry is waiting at zero before hardware kick
variable_guard_grace: 0
variable_stall_low: 0
variable_floor_dwell: 0
variable_last_floor_rpm: 0.0
variable_trial_active: 0
variable_trial_recovered: 0
variable_adapt_print: 0
variable_tach_ok: 1
variable_tach_warned: 0
variable_recovery_attempts: 0
variable_emergency: 0
variable_z_schedule: 0           # print-time stock-sensor confidence schedule
variable_z_phase: 0              # 0 normal, 1 low, 2 bias peak, 3 blend, 4 full PI
variable_z_confidence: 1.0
variable_u_anchor: 0.0            # output at print-start handoff
variable_p_anchor: 0.0            # cooling-only P term at print-start handoff
variable_p_term: 0.0              # current signed P term, for telemetry
variable_control_raw: 0.0         # scheduled or PI demand before floor/hysteresis
variable_full_pi: 1               # 0 until the bumpless transition at full authority
variable_slope_primed: 0
variable_last_chamber_temp: 0.0
variable_last_toolhead_temp: 0.0
variable_chamber_slope: 0.0        # filtered degrees C per minute
variable_toolhead_slope: 0.0       # filtered degrees C per minute
variable_preheat_active: 0
variable_preheat_ready: 0
variable_preheat_target_pending: 0 # one-shot M191 minimum -> M141 target handoff
variable_preheat_z: 0.0
# Frozen telemetry vocabulary. These are status labels only in Stage 4B.
# preheat_phase: 0 NONE, 1 BASELINE, 2 BOOST, 3 COAST, 4 COMPAT_START,
#                5 HANDOFF, 6 PRINT, 7 ABORTED
# preheat_result: 0 NONE, 1 COMPATIBILITY, 2 QUALIFIED, 3 ABORTED
# observer_source: 0 STOCK_UNCALIBRATED, 1 COLD_NOZZLE,
#                  2 ANCHORED_STOCK, 3 REFERENCE_SHADOW
# proxy_invalid_reason: 0 NONE, 1 TARGET, 2 POWER, 3 ABORTED
# preheat_threshold_policy: 0 NONE, 1 COMPATIBILITY_FLOOR, 2 EXACT_MINIMUM
variable_preheat_phase: 0
variable_preheat_result: 0
variable_observer_source: 0
variable_print_bed_target: None      # final printing target
variable_boost_bed_target: None      # peak scheduled target
variable_boost_coast_eventtime: None # reactor monotonic clock
# boost_coast_reason: 0 NONE_OR_AT_CAP, 1 ETA_SCHEDULE, 2 INVALID_SLOPE,
#                     3 NO_BED_HEADROOM, 4 CHAMBER_READY_DURING_SAMPLE
variable_boost_coast_reason: 0
variable_proxy_valid: 0
variable_proxy_invalid_reason: 0
variable_proxy_anchor: None
variable_stock_anchor: None
variable_bias_anchor: None
variable_handoff_eventtime: None    # Klipper reactor monotonic clock
variable_proxy_start_temp: None
variable_proxy_slope: None
# proxy_validity: 0 NONE, 1 COLD_VALID, 2 WARM_COOLING,
#                 3 WARM_SETTLING, 4 VALID
variable_proxy_validity: 0
variable_proxy_cooling_seen: 0
variable_proxy_valid_dwell: 0.0
variable_preheat_requested_threshold: None
variable_preheat_actual_threshold: None
variable_preheat_threshold_policy: 0
variable_estimated_temp: None
variable_bed_time_remaining: None
variable_chamber_time_remaining: None
variable_chamber_ready_eventtime: None # reactor monotonic clock
variable_bed_ready_eventtime: None     # reactor monotonic clock
variable_print_ready_eventtime: None   # reactor monotonic clock
# Set only when chamber_preheat hands over EARLY on wipe_lead_seconds, so the
# run can be audited afterwards: the ETA it committed on, and the nozzle proxy
# reading at that moment. Both stay None on a normal, confirmed arrival.
#
# THESE MUST BE DECLARED HERE OR THE JOB DIES. SET_GCODE_VARIABLE raises on an
# unknown name, so a module writing a state key that this macro does not
# declare aborts whatever called it. That is precisely what happened on the
# first job after the wipe_lead deploy, 2026-09-08: M191 committed at eta 0.7
# min, _set_state raised "Unknown gcode_macro variable 'wipe_lead_committed'",
# and the print cancelled at the end of the preheat with the nozzle still at
# 45 C. Same class as the 1.4.x filament_sensor_print bug in end_print.cfg.
variable_wipe_lead_committed: None     # seconds of ETA remaining at handover
variable_wipe_lead_noz: None           # nozzle proxy C at handover
variable_veto_latched: 0           # reserved; veto enforcement stays disabled pending data
variable_vent_active: 0            # standalone hot-extruder ventilation owns fan
# Commanded-heat latch. SET when a target of 45 C or more is commanded, HELD
# while the nozzle itself remains at or above 45 C, cleared below that. It is
# not a temperature predicate: a cold nozzle sitting in a warm chamber must
# never open the exhaust, which is what happened on 2026-09-01 when a 47 C
# chamber pushed the idle nozzle past the heatbreak fan's 45 C threshold and
# vented the box through four hours of measurement.
variable_vent_latched: 0
variable_vent_launching: 0         # zero pulse is waiting for retry completion
variable_vent_pending_duty: 0.0
variable_vent_guard_grace: 0
variable_vent_stall_low: 0
variable_vent_recovery_attempts: 0
variable_vent_emergency: 0
variable_vent_tach_warned: 0
gcode:


[gcode_macro _CH_PREHEAT_CLEAR]
description: Clear chamber-preheat telemetry without changing hardware.
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_result VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_bed_target VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=boost_bed_target VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=boost_coast_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=boost_coast_reason VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_anchor VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stock_anchor VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bias_anchor VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=handoff_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_start_temp VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_slope VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_validity VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_cooling_seen VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid_dwell VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_requested_threshold VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_actual_threshold VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_threshold_policy VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bed_time_remaining VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_time_remaining VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_ready_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bed_ready_eventtime VALUE=None
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_ready_eventtime VALUE=None


[gcode_macro _CH_PREHEAT_ABORT_STATE]
description: Mark an interrupted preheat without changing hardware.
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=7
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_result VALUE=3
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE=3


[gcode_macro _CH_PROXY_ANCHOR]
description: Capture simultaneous post-wait cold-nozzle and stock temperatures.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% if st.proxy_valid|int == 1 %}
        # A nozzle that qualified by Newton projection is still descending, so
        # its live reading is NOT chamber air -- the projected asymptote is.
        # The host extra stores that estimate in proxy_anchor; overwriting it
        # here with the live reading is what produced a -7.18 C bias on
        # 2026-08-26, from a 44.15 C nozzle over 36.97 C air. Prefer the
        # projection when there is one; a cold-nozzle qualification leaves it
        # unset and the live reading is then correct by definition.
        {% set projected = st.proxy_anchor %}
        {% set proxy = projected|float if projected is not none
                       else printer.extruder.temperature|float %}
        {% set stock = printer["temperature_sensor chamber_temp"].temperature|float %}
        {% set bias = stock - proxy %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_anchor VALUE={proxy}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stock_anchor VALUE={stock}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=bias_anchor VALUE={bias}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE={proxy}
        RESPOND PREFIX="ch" MSG="observer anchor proxy={proxy|round(2)} stock={stock|round(2)} bias={bias|round(2)} from={'projection' if projected is not none else 'nozzle'}"
    {% endif %}


[gcode_macro _CH_PROXY_INVALIDATE]
description: Hand the observer from the heated nozzle to the anchored stock sensor.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set reason = params.REASON|default(1)|int %}
    {% set anchored = st.proxy_anchor is not none and st.stock_anchor is not none %}
    {% if st.proxy_valid|int == 1 %}
        CHAMBER_RECORD_HANDOFF
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE={reason}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE={5 if anchored else 6}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE={2 if anchored else 0}
        {% if not anchored %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE=None
        {% endif %}
    {% endif %}


[gcode_macro _CHAMBER_LOOP]
gcode:
    {% set st        = printer["gcode_macro _CH_STATE"] %}
    {% set fan       = printer["gcode_macro _CH_HW"].fan %}
    {% set temp      = printer["temperature_sensor chamber_temp"].temperature      %}
    {% set tooltemp  = printer["temperature_sensor Toolhead_Temp"].temperature      %}
    {% set target    = printer.save_variables.variables.ch_target  |default(32.0)  %}
    {% set kp        = printer.save_variables.variables.ch_kp      |default(0.15)  %}
    {% set ki        = printer.save_variables.variables.ch_ki      |default(0.020) %}
    {% set minfan    = printer.save_variables.variables.ch_minfan  |default(0.13)  %}
    {% set maxfan    = printer.save_variables.variables.ch_maxfan  |default(1.00)  %}
    {% set i_max     = printer.save_variables.variables.ch_i_max   |default(0.6)   %}
    {% set delta     = printer.save_variables.variables.ch_auto_off|default(5.0)   %}
    {% set dt        = printer.save_variables.variables.ch_dt      |default(15)    %}
    {% set start     = printer.save_variables.variables.ch_start_request|default(0.05)|float %}
    {% set stop      = printer.save_variables.variables.ch_stop_request |default(0.03)|float %}
    {% set slew      = printer.save_variables.variables.ch_slew_per_loop|default(0.05)|float %}
    {% set i_primed  = st.primed %}
    {% set i_acc     = st.integral %}
    {% set floor     = st.active_floor|float if st.active_floor|float > 0 else minfan %}
    # QUANTISED TO THE NEAREST 1 %, and a floor that rounds to zero means the
    # ventilation floor is OFF -- not "on at zero duty". See _CHAMBER_VENT.
    {% set vent_floor = ((printer.save_variables.variables.ch_vent_floor|default(0.0)|float) * 100)|round(0)|float / 100 %}
    {% set vent_required = (vent_floor > 0.0
                           and (printer.extruder.target|float >= 45.0
                                or (st.vent_latched|int == 1
                                    and printer.extruder.temperature|float >= 45.0))) %}
    {% set keep_running = 1 %}
    {% set proxy_valid = st.proxy_valid|int %}
    {% set observer_source = st.observer_source|int %}
    {% set anchored = st.proxy_anchor is not none and st.stock_anchor is not none %}
    {% set handoff_now = 0 %}

    # A target command normally invalidates the nozzle observer synchronously.
    # Power is the fallback for heater paths that bypass both wrapped commands.
    {% if printer.extruder.power|default(0.0)|float > 0 and proxy_valid == 1 %}
        {% set proxy_valid = 0 %}
        {% set observer_source = 2 if anchored else 0 %}
        {% set handoff_now = 1 %}
        CHAMBER_RECORD_HANDOFF
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_invalid_reason VALUE=2
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE={5 if anchored else 6}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE={observer_source}
        {% if not anchored %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE=None
        {% endif %}
    {% endif %}

    {% set error = temp - target %}
    {% set p_full = error * kp %}
    {% set p_cool = [0.0, p_full]|max %}
    {% set z = printer.gcode_move.gcode_position.z|default(0.0, true)|float %}

    # Maintain filtered trend telemetry for the future asymmetric MCU veto.
    # Agreement will never grant more authority than Z permits; disagreement
    # may eventually cap it after thresholds are characterized on tall prints.
    {% set slope_window = printer.save_variables.variables.ch_slope_window|default(60.0)|float %}
    {% set slope_alpha = [1.0, dt / ([dt, slope_window]|max)]|min %}
    {% if st.slope_primed|int == 1 %}
        {% set chamber_raw_slope = (temp - st.last_chamber_temp|float) * 60.0 / dt %}
        {% set toolhead_raw_slope = (tooltemp - st.last_toolhead_temp|float) * 60.0 / dt %}
        {% set chamber_slope = st.chamber_slope|float + slope_alpha * (chamber_raw_slope - st.chamber_slope|float) %}
        {% set toolhead_slope = st.toolhead_slope|float + slope_alpha * (toolhead_raw_slope - st.toolhead_slope|float) %}
    {% else %}
        {% set chamber_slope = 0.0 %}
        {% set toolhead_slope = 0.0 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=slope_primed VALUE=1
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_chamber_temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_toolhead_temp VALUE={tooltemp}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_slope VALUE={chamber_slope}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=toolhead_slope VALUE={toolhead_slope}

    {% if i_primed == 0 and error > 0 %}
        {% set i_primed = 1 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed VALUE=1
        RESPOND PREFIX="ch" MSG="Target reached"
    {% endif %}

    # The stock chamber sensor is corrupted by bed geometry below about 68 mm.
    # During a print, react only to changes from the print-start anchor, with
    # authority scheduled from the measured Z regions. The integral remains
    # frozen until full authority, then is initialized for an exact bumpless
    # transfer. Manual/non-print chamber control retains ordinary PI behavior.
    {% if st.z_schedule|int == 1 %}
        {% set low_gain = printer.save_variables.variables.ch_z_low_gain|default(0.15)|float %}
        {% set mid_gain = printer.save_variables.variables.ch_z_mid_gain|default(0.25)|float %}
        {% set low_end = printer.save_variables.variables.ch_z_low_end|default(40.0)|float %}
        {% set bias_end = printer.save_variables.variables.ch_z_bias_end|default(48.0)|float %}
        {% set full_z = printer.save_variables.variables.ch_z_full|default(68.0)|float %}

        {% if z < low_end %}
            {% set confidence = low_gain %}
            {% set phase = 1 %}
        {% elif z < bias_end %}
            {% set span = [0.001, bias_end - low_end]|max %}
            {% set confidence = low_gain + ((mid_gain - low_gain) * (z - low_end) / span) %}
            {% set phase = 2 %}
        {% elif z < full_z %}
            {% set span = [0.001, full_z - bias_end]|max %}
            {% set confidence = mid_gain + ((1.0 - mid_gain) * (z - bias_end) / span) %}
            {% set phase = 3 %}
        {% else %}
            {% set confidence = 1.0 %}
            {% set phase = 4 %}
        {% endif %}

        {% if phase < 4 %}
            {% set control = st.u_anchor|float + confidence * (p_cool - st.p_anchor|float) %}
            {% set control = [maxfan, [0.0, control]|max]|min %}
        {% elif st.full_pi|int == 0 %}
            # Seed I so P + I is exactly the previously applied output.
            {% set i_acc = st.control_raw|float - p_full %}
            {% set i_acc = [i_max, [0 - i_max, i_acc]|max]|min %}
            {% set control = p_full + i_acc %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE={i_acc}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=1
            RESPOND PREFIX="ch" MSG="Full chamber PI authority at Z{z|round(2)} bumpless I={i_acc|round(3)}"
        {% else %}
            {% if i_primed == 1 %}
                {% set i_acc = i_acc + (error * ki * dt / 60) %}
                {% if i_acc > i_max or i_acc < (0 - i_max) %}
                    RESPOND PREFIX="ch" MSG="Accumulator clamped Ki={ki}"
                    {% set i_acc = [i_max, [0 - i_max, i_acc]|max]|min %}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE={i_acc}
            {% endif %}
            {% set control = p_full + i_acc %}
        {% endif %}
    {% else %}
        {% set confidence = 1.0 %}
        {% set phase = 0 %}
        {% if i_primed == 1 %}
            {% set i_acc = i_acc + (error * ki * dt / 60) %}
            {% if i_acc > i_max or i_acc < (0 - i_max) %}
                RESPOND PREFIX="ch" MSG="Accumulator clamped Ki={ki}"
                {% set i_acc = [i_max, [0 - i_max, i_acc]|max]|min %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE={i_acc}
        {% endif %}
        {% set control = p_full + i_acc %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE={phase}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE={confidence}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_term VALUE={p_full}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE={control}

    # Shadow only in Stage 4C. `error` and every control term above continue to
    # use the raw stock temperature. At handoff delta_stock is zero, so the
    # first anchored estimate equals proxy_anchor without a discontinuity.
    {% if observer_source == 1 and proxy_valid == 1 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE={printer.extruder.temperature|float}
    {% elif observer_source == 2 and anchored %}
        {% set delta_stock = temp - st.stock_anchor|float %}
        {% set estimate = st.proxy_anchor|float + confidence * delta_stock %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=estimated_temp VALUE={estimate}
        {% if st.preheat_phase|int == 5 and handoff_now == 0 %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=6
        {% endif %}
    {% endif %}

    # Chamber-demand hysteresis is separate from the physical fan latch. The
    # hot-extruder ventilation floor may keep the rotor turning without
    # activating the adaptive chamber floor or becoming chamber demand.
    {% if control >= start %}
        {% set cooling_latched = 1 %}
    {% elif control <= stop %}
        {% set cooling_latched = 0 %}
    {% else %}
        {% set cooling_latched = st.cooling_latched|int %}
    {% endif %}
    # The cooldown assist used to be a third term here. Since 2026-09-14 the ramp
    # stops this loop when it begins and drives the exhaust itself, so the loop
    # answers only to chamber demand and the hot-nozzle ventilation floor.
    {% set run_required = (cooling_latched == 1 or vent_required) %}
    {% set required_floor = [floor if cooling_latched == 1 else 0.0,
                             vent_floor if vent_required else 0.0]|max %}
    {% set chamber_demand = control if cooling_latched == 1 else 0.0 %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=cooling_latched VALUE={cooling_latched}

    {% if i_primed == 1 %}
        {% if error <= (0 - delta) %}
            RESPOND PREFIX="ch" MSG="Chamber {delta}C below target, chamber control disabled."
            CHAMBER_OFF
            {% set keep_running = 0 %}
        {% endif %}
    {% endif %}

    {% if keep_running == 1 %}
        {% if st.fan_latched|int == 0 and run_required %}
            # The stable floor is an intentional exception to the slew limit.
            {% set duty = [maxfan, [required_floor, chamber_demand]|max]|min %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=1
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={duty}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={duty}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
            # The fan section supplies the full-power kick. The rotor's slow
            # mechanical ramp makes 0.4 s barely audible, while Zero2 needs it.
            SET_FAN_SPEED FAN={fan} SPEED={duty}
        {% elif st.fan_latched|int == 1 and not run_required %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
            UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION=0
            SET_FAN_SPEED FAN={fan} SPEED=0
        {% elif st.fan_latched|int == 1 %}
            {% set desired = [maxfan, [required_floor, chamber_demand]|max]|min %}
            {% if slew > 0 %}
                {% set duty = [st.last_duty|float + slew, [st.last_duty|float - slew, desired]|max]|min %}
            {% else %}
                {% set duty = desired %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={duty}
            {% if st.launching|int == 0 and st.emergency|int == 0 %}
                SET_FAN_SPEED FAN={fan} SPEED={duty}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={duty}
            {% endif %}
        {% endif %}
    {% endif %}

    {% if printer.save_variables.variables.ch_debug|default(0) == 1 %}
        _CH_STATUS
    {% endif %}

    # Only rearm if still running. CHAMBER_OFF above may have just stopped us,
    # and an unconditional rearm here would restart the loop it had cancelled.
    {% if keep_running == 1 %}
        UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION={dt}
    {% endif %}


[gcode_macro CHAMBER_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=running  VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed   VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=cooling_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=recovery_attempts VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_tach_warned VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=0.1
    UPDATE_DELAYED_GCODE ID=CHAMBER_GUARD DURATION=1


[gcode_macro CHAMBER_OFF]
# Stops the control loop. Deliberately does NOT change ch_target.
#
# This used to end with "M141 S0", and M141 with S<=0 calls CHAMBER_OFF, so the
# two called each other. Klipper rejects that outright — gcode_macro.py raises
# "Macro %s called recursively" — so every route through CHAMBER_OFF ended in an
# error. It looked like it worked because M141 S0 was the LAST line, so
# everything useful had already run by the time it threw.
#
# Zeroing the target is M141's job now, and it does it after calling this.
gcode:
    {% set was_preheat = printer["gcode_macro _CH_STATE"].preheat_active|int %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=running  VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed   VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=cooling_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_schedule VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=u_anchor VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_anchor VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_term VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=slope_primed VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_chamber_temp VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_toolhead_temp VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=chamber_slope VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=toolhead_slope VALUE=0.0
    {% if was_preheat == 1 %}
        _CH_PREHEAT_ABORT_STATE
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=veto_latched VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_GUARD DURATION=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION=0
    SET_FAN_SPEED FAN={printer["gcode_macro _CH_HW"].fan} SPEED=0
    SAVE_VARIABLE VARIABLE=ch_debug VALUE=0


[delayed_gcode CHAMBER_TIMER]
gcode:
    _CHAMBER_LOOP


[delayed_gcode CHAMBER_RETRY_END]
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% if st.running|int == 1 and st.fan_latched|int == 1 and st.emergency|int == 0 %}
        # A real zero interval makes Klipper's configured kick_start_time fire
        # again even though the logical demand was already nonzero.
        SET_FAN_SPEED FAN={fan} SPEED={st.pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={st.pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
    {% endif %}


[delayed_gcode CHAMBER_GUARD]
gcode:
    _CHAMBER_GUARD


# This supervisor is deliberately independent of chamber PI. It starts within
# one second of a commanded hotend target of 45 C or more, survives lifecycle
# macros that clear fan outputs, and owns tach recovery whenever chamber PI is
# not running.
#
# It deliberately no longer mirrors the stock heatbreak-fan predicate. That
# predicate is `extruder.temperature > heater_temp`, which a hot chamber alone
# satisfies: on 2026-09-01 a 47 C chamber held the idle nozzle above the
# heatbreak fan's 45 C threshold and the exhaust ran at its 11% floor through
# four hours of measurement. Fume extraction follows commanded heat; the
# heatbreak fan keeps its own predicate and is not changed here.
[delayed_gcode CHAMBER_VENT_TIMER]
initial_duration: 1
gcode:
    UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_TIMER DURATION=1
    _CHAMBER_VENT


[gcode_macro _CHAMBER_VENT]
description: Maintain the independent hot-extruder exhaust floor.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set fan_obj = printer["fan_generic " ~ fan] %}
    # QUANTISED TO THE NEAREST 1 %. The rounding IS the deadband: a configured
    # floor below half a percent is not a slow fan, it is no fan, and the
    # nearest real state is off.
    {% set floor = ((printer.save_variables.variables.ch_vent_floor|default(0.0)|float) * 100)|round(0)|float / 100 %}
    {% set hotend_target = params.TARGET|default(printer.extruder.target)|float %}
    {% set latch = 1 if (hotend_target >= 45.0
                         or (st.vent_latched|int == 1
                             and printer.extruder.temperature|float >= 45.0)) else 0 %}
    # A ZERO FLOOR MEANS NOT REQUIRED, and that distinction is load-bearing.
    # Latching `required` on the hotend alone and then commanding SPEED=0 would
    # set vent_active, leave the tach guard watching a fan that is off by
    # design, count three low-rpm samples and hand _CHAMBER_VENT_STALL a stall
    # it would "fail safe" by driving the exhaust to 1.0 -- the exact opposite
    # of what a zero floor asks for. With required false the else-branch below
    # clears every vent flag and commands the fan off once, cleanly.
    # A COOLDOWN RAMP OWNS THE EXHAUST once it is past settle (2026-09-14). This
    # timer runs every second, and left alone it would command the exhaust to
    # its floor while the nozzle is hot, then to zero once it cools below 45 C
    # -- either one stomping the ramp's own duty. So it stands down entirely:
    # nothing required, and no release write either.
    {% set ramp_owns = ('gcode_macro _COOL_STATE' in printer
                        and printer["gcode_macro _COOL_STATE"].active|int == 1
                        and printer["gcode_macro _COOL_STATE"].phase|int == 2) %}
    {% set required = latch == 1 and floor > 0.0 and not ramp_owns %}
    {% set actual = fan_obj.speed|default(0.0)|float %}
    {% set rpm = fan_obj.rpm|default(none) %}
    {% set threshold = printer.save_variables.variables.ch_stall_rpm|default(500)|float %}
    {% set samples = printer.save_variables.variables.ch_stall_samples|default(3)|int %}
    {% set max_rpm = printer.save_variables.variables.ch_tach_max_rpm|default(8000)|float %}

    {% if latch != st.vent_latched|int %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_latched VALUE={latch}
    {% endif %}

    {% if required %}
        {% if st.running|int == 1 %}
            # Chamber PI owns tach recovery while running. Clear any stale
            # standalone state, but immediately repair an external fan-off.
            {% if st.vent_active|int == 1 or st.vent_launching|int == 1 or st.vent_emergency|int == 1 %}
                UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE=0
            {% endif %}
            {% if st.emergency|int == 0 and st.launching|int == 0 and actual < floor %}
                {% set restored = [floor, st.last_duty|float]|max if st.cooling_latched|int == 1 else floor %}
                SET_FAN_SPEED FAN={fan} SPEED={restored}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={restored}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={restored}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=fan_latched VALUE=1
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
            {% endif %}
        {% elif st.vent_launching|int == 0 %}
            {% if st.vent_emergency|int == 1 %}
                SET_FAN_SPEED FAN={fan} SPEED=1.0
            {% else %}
                {% if st.vent_active|int == 0 or actual < floor %}
                    {% set duty = [floor, actual]|max %}
                    SET_FAN_SPEED FAN={fan} SPEED={duty}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={duty}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE={duty}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=1
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
                {% elif rpm is none or rpm|float > max_rpm %}
                    {% if st.vent_tach_warned|int == 0 %}
                        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust tach unavailable or implausible"
                        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_tach_warned VALUE=1
                    {% endif %}
                {% elif st.vent_guard_grace|int > 0 %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE={st.vent_guard_grace|int - 1}
                {% elif rpm|float < threshold %}
                    {% set low = st.vent_stall_low|int + 1 %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE={low}
                    {% if low >= samples %}
                        _CHAMBER_VENT_STALL RPM={rpm|float}
                    {% endif %}
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
                {% endif %}
            {% endif %}
        {% endif %}
    {% elif not ramp_owns and st.running|int == 0 and (st.vent_active|int == 1 or st.vent_launching|int == 1 or st.vent_emergency|int == 1) %}
        UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION=0
        SET_FAN_SPEED FAN={fan} SPEED=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_tach_warned VALUE=0
    {% endif %}


[gcode_macro _CHAMBER_VENT_STALL]
description: Retry standalone ventilation once, then fail safe at full output.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set floor = printer.save_variables.variables.ch_vent_floor|default(0.0)|float %}
    {% set raise = printer.save_variables.variables.ch_floor_raise|default(0.01)|float %}
    {% if st.vent_recovery_attempts|int >= 1 %}
        SET_FAN_SPEED FAN={fan} SPEED=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_emergency VALUE=1
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust failed measured retry, forcing full output"
    {% else %}
        {% set raised = [1.0, floor + raise]|min %}
        SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_pending_duty VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE={st.vent_recovery_attempts|int + 1}
        SET_FAN_SPEED FAN={fan} SPEED=0
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust floor {floor} stalled at {params.RPM|default(0)} RPM, retrying at {raised}"
        UPDATE_DELAYED_GCODE ID=CHAMBER_VENT_RETRY_END DURATION={printer.save_variables.variables.ch_retry_off_time|default(0.25)|float}
    {% endif %}


[delayed_gcode CHAMBER_VENT_RETRY_END]
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set required = (printer.extruder.target|float > 0
                       or printer.extruder.temperature|float > 45.0) %}
    {% if required and st.running|int == 0 %}
        SET_FAN_SPEED FAN={fan} SPEED={st.vent_pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={st.vent_pending_duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_guard_grace VALUE={printer.save_variables.variables.ch_start_grace|default(2)|int}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_launching VALUE=0
    {% endif %}


[gcode_macro _CHAMBER_GUARD]
description: One-second tach guard and qualified floor-dwell counter.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set fan_obj = printer["fan_generic " ~ fan] %}
    {% set rpm = fan_obj.rpm|default(none) %}
    {% set threshold = printer.save_variables.variables.ch_stall_rpm|default(500)|float %}
    {% set samples = printer.save_variables.variables.ch_stall_samples|default(3)|int %}
    {% set max_rpm = printer.save_variables.variables.ch_tach_max_rpm|default(8000)|float %}
    {% set print_done = printer.print_stats.state in ["complete", "cancelled", "error"] %}

    # A post-print cooldown leaves the loop exactly as the print had it through
    # its settle phase, so a completed job does not stop it here while a ramp is
    # active. Since 2026-09-14 the ramp stops the loop itself when it begins
    # (_COOLDOWN_TAKE_OVER) and drives the exhaust directly. Guarded with
    # `in printer` so chamber_fan.cfg still works without cooldown.cfg.
    {% set cooling = printer['gcode_macro _COOL_STATE'].active|int
                     if 'gcode_macro _COOL_STATE' in printer else 0 %}

    {% if st.running|int == 1 %}
        {% if st.adapt_print|int == 1 and print_done and cooling == 0 %}
            CHAMBER_OFF
        {% elif st.fan_latched|int == 1 and st.last_duty|float > 0 and st.emergency|int == 0 %}
            {% if rpm is none or rpm|float > max_rpm %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=0
                {% if st.tach_warned|int == 0 %}
                    RESPOND TYPE=error PREFIX="ch" MSG="Exhaust tach unavailable or implausible, downward learning frozen"
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_warned VALUE=1
                {% endif %}
            {% elif st.guard_grace|int > 0 %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=guard_grace VALUE={st.guard_grace|int - 1}
            {% elif rpm|float < threshold %}
                {% set low = st.stall_low|int + 1 %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE={low}
                {% if low >= samples %}
                    {% if st.cooling_latched|int == 1 %}
                        _CHAMBER_STALL_RECOVER RPM={rpm|float}
                    {% else %}
                        _CHAMBER_RUNNING_VENT_STALL RPM={rpm|float}
                    {% endif %}
                {% endif %}
            {% else %}
                SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
                {% if printer.print_stats.state == "printing"
                      and st.adapt_print|int == 1
                      and st.cooling_latched|int == 1
                      and st.trial_recovered|int == 0
                      and st.launching|int == 0
                      and st.last_duty|float <= st.active_floor|float + 0.005 %}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=floor_dwell VALUE={st.floor_dwell|int + 1}
                    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_floor_rpm VALUE={rpm|float}
                {% endif %}
            {% endif %}
        {% endif %}
        {% if not (st.adapt_print|int == 1 and print_done and cooling == 0) %}
            UPDATE_DELAYED_GCODE ID=CHAMBER_GUARD DURATION=1
        {% endif %}
    {% endif %}


[gcode_macro _CHAMBER_RUNNING_VENT_STALL]
description: Retry ventilation-only demand while the chamber loop is active.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set floor = printer.save_variables.variables.ch_vent_floor|default(0.0)|float %}
    {% set raise = printer.save_variables.variables.ch_floor_raise|default(0.01)|float %}
    {% set retry_off = printer.save_variables.variables.ch_retry_off_time|default(0.25)|float %}

    {% if st.vent_recovery_attempts|int >= 1 %}
        SET_FAN_SPEED FAN={fan} SPEED=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=0
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust failed measured retry under chamber control, forcing full output"
    {% else %}
        {% set raised = [1.0, floor + raise]|min %}
        SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={raised}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=vent_recovery_attempts VALUE={st.vent_recovery_attempts|int + 1}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=1
        SET_FAN_SPEED FAN={fan} SPEED=0
        RESPOND TYPE=error PREFIX="ch" MSG="Hot-extruder exhaust floor {floor} stalled under chamber control at {params.RPM|default(0)} RPM, retrying at {raised}"
        UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION={retry_off}
    {% endif %}


[gcode_macro _CHAMBER_STALL_RECOVER]
description: Revert a failed trial or raise a failed known-good floor, then retry once.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set fan = printer["gcode_macro _CH_HW"].fan %}
    {% set known = printer.save_variables.variables.ch_minfan|default(0.13)|float %}
    {% set raise = printer.save_variables.variables.ch_floor_raise|default(0.01)|float %}
    {% set retry_prints = printer.save_variables.variables.ch_floor_retry_prints|default(10)|int %}
    {% set retry_off = printer.save_variables.variables.ch_retry_off_time|default(0.25)|float %}

    {% if st.recovery_attempts|int >= 1 %}
        SET_FAN_SPEED FAN={fan} SPEED=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=0
        RESPOND TYPE=error PREFIX="ch" MSG="Exhaust failed measured retry, forcing full output and freezing learning"
    {% else %}
        {% if st.trial_active|int == 1 %}
            {% set recovered_floor = known %}
            SAVE_VARIABLE VARIABLE=ch_floor_failed VALUE={st.active_floor|float}
            SAVE_VARIABLE VARIABLE=ch_floor_cooldown VALUE={retry_prints}
            SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=-1
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_active VALUE=0
            RESPOND TYPE=error PREFIX="ch" MSG="Trial floor {st.active_floor|float} stalled at {params.RPM|default(0)} RPM, reverting to {known}"
        {% else %}
            {% set recovered_floor = [1.0, known + raise]|min %}
            SAVE_VARIABLE VARIABLE=ch_minfan VALUE={recovered_floor}
            SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=-2
            RESPOND TYPE=error PREFIX="ch" MSG="Known floor {known} stalled at {params.RPM|default(0)} RPM, raising to {recovered_floor}"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=active_floor VALUE={recovered_floor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=pending_duty VALUE={recovered_floor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_recovered VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=recovery_attempts VALUE={st.recovery_attempts|int + 1}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=stall_low VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=launching VALUE=1
        SET_FAN_SPEED FAN={fan} SPEED=0
        UPDATE_DELAYED_GCODE ID=CHAMBER_RETRY_END DURATION={retry_off}
    {% endif %}


[gcode_macro _CH_ADAPT_FINISH]
description: Promote only a floor that the preceding print actually exercised.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set required = printer.save_variables.variables.ch_floor_dwell|default(120)|int %}
    {% set cooldown = printer.save_variables.variables.ch_floor_cooldown|default(0)|int %}
    {% set qualified = (st.adapt_print|int == 1
                         and st.floor_dwell|int >= required
                         and st.tach_ok|int == 1
                         and st.trial_recovered|int == 0) %}

    {% if qualified and st.trial_active|int == 1 %}
        SAVE_VARIABLE VARIABLE=ch_minfan VALUE={st.active_floor|float}
        SAVE_VARIABLE VARIABLE=ch_floor_last_rpm VALUE={st.last_floor_rpm|float}
        SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=1
        RESPOND PREFIX="ch" MSG="Qualified {st.active_floor|float} floor after {st.floor_dwell|int}s, promoted for the next print"
    {% elif qualified and cooldown > 0 %}
        SAVE_VARIABLE VARIABLE=ch_floor_cooldown VALUE={cooldown - 1}
        SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=2
        RESPOND PREFIX="ch" MSG="Known floor qualified, failed-floor cooldown now {cooldown - 1} prints"
    {% elif st.adapt_print|int == 1 and st.floor_dwell|int < required %}
        SAVE_VARIABLE VARIABLE=ch_floor_last_result VALUE=0
        RESPOND PREFIX="ch" MSG="No floor learning, only {st.floor_dwell|int} of {required}s qualified dwell"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=adapt_print VALUE=0


[gcode_macro _CH_ADAPT_BEGIN]
description: Select this print's known-good floor or one bounded lower trial.
gcode:
    {% set enabled = printer.save_variables.variables.ch_floor_autotune|default(1)|int %}
    {% set known = printer.save_variables.variables.ch_minfan|default(0.13)|float %}
    {% set step = printer.save_variables.variables.ch_floor_step|default(0.005)|float %}
    {% set lower = printer.save_variables.variables.ch_floor_lower_limit|default(0.09)|float %}
    {% set cooldown = printer.save_variables.variables.ch_floor_cooldown|default(0)|int %}
    {% set candidate = [lower, known - step]|max %}
    {% set is_trial = 1 if enabled == 1 and cooldown <= 0 and candidate < known else 0 %}
    {% set active = candidate if is_trial == 1 else known %}

    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=active_floor VALUE={active}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=floor_dwell VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_floor_rpm VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_active VALUE={is_trial}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=trial_recovered VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=adapt_print VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_ok VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=tach_warned VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=recovery_attempts VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=emergency VALUE=0
    {% if is_trial == 1 %}
        RESPOND PREFIX="ch" MSG="Adaptive floor trial {active}, known-good {known}"
    {% else %}
        RESPOND PREFIX="ch" MSG="Adaptive floor {active}, lowering cooldown {cooldown}"
    {% endif %}


[gcode_macro _CH_Z_BEGIN]
description: Capture the print-start anchor for Z-scheduled chamber control.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set enabled = printer.save_variables.variables.ch_z_schedule|default(1)|int %}
    {% if enabled == 1 %}
        {% set temp = printer["temperature_sensor chamber_temp"].temperature|float %}
        {% set target = printer.save_variables.variables.ch_target|default(32.0)|float %}
        {% set kp = printer.save_variables.variables.ch_kp|default(0.15)|float %}
        {% set maxfan = printer.save_variables.variables.ch_maxfan|default(1.00)|float %}
        {% set p_anchor = [0.0, kp * (temp - target)]|max %}
        {% set u_anchor = [maxfan, [0.0, st.control_raw|float]|max]|min if st.running|int == 1 else 0.0 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_schedule VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE={printer.save_variables.variables.ch_z_low_gain|default(0.15)|float}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=u_anchor VALUE={u_anchor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_anchor VALUE={p_anchor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=p_term VALUE={kp * (temp - target)}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_raw VALUE={u_anchor}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=slope_primed VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=veto_latched VALUE=0
        RESPOND PREFIX="ch" MSG="Z schedule anchored output={u_anchor|round(3)} P={p_anchor|round(3)} max={maxfan|round(3)}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_schedule VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=z_confidence VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=full_pi VALUE=1
    {% endif %}


[gcode_macro _CHAMBER_ADAPT_STATUS]
description: Report persistent and current-print exhaust-floor learning state.
gcode:
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set sv = printer.save_variables.variables %}
    RESPOND PREFIX="ch" MSG="adaptive={sv.ch_floor_autotune|default(1)|int} known={sv.ch_minfan|default(0.13)|float} active={st.active_floor|float} trial={st.trial_active|int} dwell={st.floor_dwell|int}s cooldown={sv.ch_floor_cooldown|default(0)|int} failed={sv.ch_floor_failed|default(0)|float} result={sv.ch_floor_last_result|default(0)|int} tach_ok={st.tach_ok|int} recoveries={st.recovery_attempts|int} cooling={st.cooling_latched|int} vent={sv.ch_vent_floor|default(0.0)|float},{st.vent_active|int},{st.vent_recovery_attempts|int},{st.vent_emergency|int} zphase={st.z_phase|int} confidence={st.z_confidence|float|round(3)} raw={st.control_raw|float|round(3)} preheat={st.preheat_active|int},{st.preheat_ready|int},{st.preheat_phase|int},{st.preheat_result|int} observer={st.observer_source|int} proxy={st.proxy_valid|int},{st.proxy_invalid_reason|int} anchor={st.proxy_anchor},{st.stock_anchor},{st.bias_anchor} estimate={st.estimated_temp} veto={st.veto_latched|int}"


[gcode_macro _CHAMBER_CONFIG]
# Every SAVE_VARIABLE here used to be reached only if the one before it
# succeeded, and the first two referenced variables that were never defined:
# {target} where trgt was set, and {i_max} where maxi was set. Klipper's Jinja
# renders an undefined name as the empty string, so the command became
# "SAVE_VARIABLE VARIABLE=ch_target VALUE=" and save_variables rejected it with
# "Unable to parse '' as a literal". The macro aborted on its first line, so
# none of the seven settings were ever written.
gcode:
    {% set trgt = params.TARGET|default(printer.save_variables.variables.ch_target|default(32.0))|float %}
    {% set kp   = params.KP    |default(printer.save_variables.variables.ch_kp    |default(0.30))|float %}
    {% set minf = params.MINFAN|default(printer.save_variables.variables.ch_minfan|default(0.13))|float %}
    {% set maxf = params.MAXFAN|default(printer.save_variables.variables.ch_maxfan|default(1.00))|float %}
    {% set ki   = params.KI    |default(printer.save_variables.variables.ch_ki    |default(0.00))|float %}
    {% set maxi = params.I_MAX |default(printer.save_variables.variables.ch_i_max |default(0.30))|float %}
    {% set dt   = params.LOOP  |default(printer.save_variables.variables.ch_dt    |default(15  ))|float %}
    {% set vent = params.VENTFAN|default(printer.save_variables.variables.ch_vent_floor|default(0.0))|float %}

    SAVE_VARIABLE VARIABLE=ch_target  VALUE={trgt}
    SAVE_VARIABLE VARIABLE=ch_kp      VALUE={kp}
    SAVE_VARIABLE VARIABLE=ch_minfan  VALUE={minf}
    SAVE_VARIABLE VARIABLE=ch_maxfan  VALUE={maxf}
    SAVE_VARIABLE VARIABLE=ch_ki      VALUE={ki}
    SAVE_VARIABLE VARIABLE=ch_i_max   VALUE={maxi}
    SAVE_VARIABLE VARIABLE=ch_dt      VALUE={dt}
    SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={vent}

    RESPOND PREFIX="ch" MSG="Config updated: T={trgt} Kp={kp} Ki={ki} clamp={maxi} min={minf} vent={vent} max={maxf} loop={dt}s"



[gcode_macro _CHAMBER_VENT_CONFIG]
description: Set the persistent hot-extruder ventilation floor.
gcode:
    {% set floor = params.FLOOR|default(printer.save_variables.variables.ch_vent_floor|default(0.0))|float %}
    # ZERO IS NOW LEGAL and means no ventilation floor at all. It used to raise,
    # which is why the floor could only ever be turned down and not off.
    {% if floor < 0 or floor > 1 %}
        {action_raise_error("_CHAMBER_VENT_CONFIG FLOOR must be between zero and one")}
    {% else %}
        {% set snapped = (floor * 100)|round(0)|float / 100 %}
        SAVE_VARIABLE VARIABLE=ch_vent_floor VALUE={snapped}
        RESPOND PREFIX="ch" MSG="Hot-extruder ventilation floor set to {snapped}{' -- OFF, no ventilation floor' if snapped <= 0 else ''}"
    {% endif %}


[gcode_macro _CHAMBER_Z_CONFIG]
description: Configure print-time stock-sensor confidence scheduling.
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set enabled = params.ENABLE|default(sv.ch_z_schedule|default(1))|int %}
    {% set low_gain = params.LOW_GAIN|default(sv.ch_z_low_gain|default(0.15))|float %}
    {% set mid_gain = params.MID_GAIN|default(sv.ch_z_mid_gain|default(0.25))|float %}
    {% set low_end = params.LOW_END|default(sv.ch_z_low_end|default(40.0))|float %}
    {% set bias_end = params.BIAS_END|default(sv.ch_z_bias_end|default(48.0))|float %}
    {% set full_z = params.FULL_Z|default(sv.ch_z_full|default(68.0))|float %}
    {% set slew = params.SLEW|default(sv.ch_slew_per_loop|default(0.05))|float %}
    {% set slope_window = params.SLOPE_WINDOW|default(sv.ch_slope_window|default(60.0))|float %}

    {% if enabled not in [0, 1] %}
        {action_raise_error("ENABLE must be 0 or 1")}
    {% elif low_gain < 0 or low_gain > mid_gain or mid_gain > 1 %}
        {action_raise_error("Require 0 <= LOW_GAIN <= MID_GAIN <= 1")}
    {% elif low_end < 0 or bias_end <= low_end or full_z <= bias_end %}
        {action_raise_error("Require 0 <= LOW_END < BIAS_END < FULL_Z")}
    {% elif slew < 0 or slew > 1 %}
        {action_raise_error("SLEW must be between 0 and 1 per loop")}
    {% elif slope_window <= 0 %}
        {action_raise_error("SLOPE_WINDOW must be greater than zero seconds")}
    {% endif %}

    SAVE_VARIABLE VARIABLE=ch_z_schedule VALUE={enabled}
    SAVE_VARIABLE VARIABLE=ch_z_low_gain VALUE={low_gain}
    SAVE_VARIABLE VARIABLE=ch_z_mid_gain VALUE={mid_gain}
    SAVE_VARIABLE VARIABLE=ch_z_low_end VALUE={low_end}
    SAVE_VARIABLE VARIABLE=ch_z_bias_end VALUE={bias_end}
    SAVE_VARIABLE VARIABLE=ch_z_full VALUE={full_z}
    SAVE_VARIABLE VARIABLE=ch_slew_per_loop VALUE={slew}
    SAVE_VARIABLE VARIABLE=ch_slope_window VALUE={slope_window}
    RESPOND PREFIX="ch" MSG="Z schedule enabled={enabled} gains={low_gain},{mid_gain},1 Z={low_end},{bias_end},{full_z} slew={slew} slope_window={slope_window}s"


[gcode_macro _CH_STATUS]
gcode:
    {% set st   =  printer["gcode_macro _CH_STATE"] %}
    # default(0, true) not default(0): current_layer is None when idle, which is
    # defined-but-falsy, so plain default() leaves it and the CSV logs "None".
    {% set lyr  =  printer.print_stats.info.current_layer|default(0, true)                %}
    {% set sec  =  printer.print_stats.print_duration     |default(0.0)   |int            %}
    {% set fan  =  printer["gcode_macro _CH_HW"].fan                              %}
    {% set rpm  =  printer["fan_generic " ~ fan].rpm      |default(0.0)   |int            %}
    {% set z    =  printer.gcode_move.position.z                          |float|round(2) %}
    {% set i    =  st.integral                                            |float|round(3) %}
    {% set temp =  printer["temperature_sensor chamber_temp"].temperature |float|round(2) %}
    {% set tool =  printer["temperature_sensor Toolhead_Temp"].temperature |float|round(2) %}
    {% set trgt =  printer.save_variables.variables.ch_target             |float|round(0) %}
    {% set err  = (printer.save_variables.variables.ch_kp * (temp - trgt))|float|round(3) %}

    # Percent, once. This was scaled twice — last_duty * 100, then the "rounding"
    # line multiplied by another 1000 and divided by 10 — so a fan at 35% was
    # reported as 3500%.
    {% set duty = (st.last_duty * 1000)|round(0)|int / 10 %}

    # CSV: time_s,Z,temp_C,P,I,fan_pct,rpm,layer,target_C,Z_phase,
    #      confidence,control_raw,u_anchor,p_anchor,toolhead_C,
    #      chamber_slope_Cpm,toolhead_slope_Cpm,preheat_active,preheat_ready,
    #      preheat_phase,preheat_result,observer_source,proxy_valid,
    #      proxy_invalid_reason,preheat_Z,veto_latched
    RESPOND PREFIX="ch" MSG=",{sec},{z},{temp},{err},{i},{duty}%,{rpm},{lyr},{trgt},{st.z_phase|int},{st.z_confidence|float|round(3)},{st.control_raw|float|round(3)},{st.u_anchor|float|round(3)},{st.p_anchor|float|round(3)},{tool},{st.chamber_slope|float|round(3)},{st.toolhead_slope|float|round(3)},{st.preheat_active|int},{st.preheat_ready|int},{st.preheat_phase|int},{st.preheat_result|int},{st.observer_source|int},{st.proxy_valid|int},{st.proxy_invalid_reason|int},{st.preheat_z|float|round(2)},{st.veto_latched|int},"


[gcode_macro _CH_STATUS_LOOP]
gcode:
    {% set debug = params.DEBUG|default(0)|float %}
    {% set olddebug = printer.save_variables.variables.ch_debug|default(0)|float %}
    {% if debug != olddebug %}
         SAVE_VARIABLE VARIABLE=ch_debug VALUE={debug}
    {% endif %}

    {% if printer["gcode_macro _CH_STATE"].running == 1 %}
        _CH_STATUS
        {% set dt = printer.save_variables.variables.ch_dt|default(15) %}
        UPDATE_DELAYED_GCODE ID=CH_STATUS_TIMER DURATION={dt}
    {% else %}
        RESPOND PREFIX="ch" MSG="_CH_STATUS_LOOP: chamber PID not running"
    {% endif %}


[delayed_gcode CH_STATUS_TIMER]
gcode:
    _CH_STATUS_LOOP


[gcode_macro _CH_RESET_I]
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    RESPOND PREFIX="ch" MSG="Accumulator/Integral reset."


# Delayed G-code cannot acquire the G-code mutex during M109's blocking wait.
# Sovol's existing M109 override calls M104 before TEMPERATURE_WAIT, so hook
# M104 and start ventilation synchronously before that wait. The one-second
# supervisor handles direct nonblocking heater API calls, lifecycle reassertion
# and cooldown.
[gcode_macro M104]
rename_existing: M99104
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        _CH_PROXY_INVALIDATE REASON=1
    {% endif %}
    _CHAMBER_VENT TARGET={s}
    M99104 {rawparams}


[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set heater = params.HEATER|default("")|lower %}
    {% set target = params.TARGET|default(0)|float %}
    {% if heater == "extruder" %}
        {% if target > 0 %}
            _CH_PROXY_INVALIDATE REASON=1
        {% endif %}
        _CHAMBER_VENT TARGET={target}
    {% endif %}
    SET_HEATER_TEMPERATURE_BASE {rawparams}


[gcode_macro M141]
description: Set a nonblocking chamber cooling ceiling.
gcode:
    {% set s = params.S|default(0)|float %}
    {% set st = printer["gcode_macro _CH_STATE"] %}
    # A RUNNING COOLDOWN RAMP OWNS THE CEILING. Orca appends `M141 S0` after our
    # machine_end_gcode whenever the machine declares chamber control -- it is
    # the slicer's own line, not ours, so it cannot be removed by editing the
    # end G-code, and PrusaSlicer and the stock profiles do the same thing.
    #
    # On 2026-09-03 it landed one second after a 43-minute ABS ramp armed and
    # took the chamber leg with it. Deferred rather than refused: the slicer is
    # asking for the chamber to be off when the job is over, and _COOLDOWN_FINISH
    # ends every ramp with CHAMBER_OFF and ch_target zero, so honouring it at the
    # end is exactly what the slicer meant. An operator who genuinely wants the
    # ceiling now runs COOLDOWN_ABORT first, which is already the documented way
    # to take the machine back.
    #
    # Guarded with `in printer` so chamber_fan.cfg still stands alone without
    # cooldown.cfg installed.
    {% set cooling = printer["gcode_macro _COOL_STATE"].active|int
                     if 'gcode_macro _COOL_STATE' in printer else 0 %}

    {% if cooling == 1 %}
        RESPOND PREFIX="M141:" MSG="ceiling {s}C deferred, a cooldown ramp owns the exhaust until it finishes. COOLDOWN_ABORT to take it back"
    {% elif s <= 0 %}
        CHAMBER_OFF
        _CH_PREHEAT_CLEAR
        SAVE_VARIABLE VARIABLE=ch_target VALUE=0
        # A zero target is a decision, not silence. Say so, or START_PRINT's
        # bed inference reads it as a profile that never mentioned the chamber
        # and turns the loop back on at 55 C behind an ABS bed.
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=1
        RESPOND PREFIX="M141:" MSG="cooling ceiling={s}C off"
    {% else %}
        # A standard M191-minimum then M141-target pair must retain the
        # just-captured cold-nozzle anchor. Any standalone M141 starts clean.
        {% if st.preheat_target_pending|int != 1 %}
            _CH_PREHEAT_CLEAR
        {% endif %}
        SAVE_VARIABLE VARIABLE=ch_target VALUE={s}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0
        CHAMBER_ON
        RESPOND PREFIX="M141:" MSG="nonblocking cooling ceiling={s}C"
    {% endif %}


[gcode_macro _PREFLIGHT]
description: Job-start gate. Runs before any heater is commanded.
gcode:
    # Orca's "Upload and Print" is one Moonraker call, so Mainsail's start
    # dialog -- and the Spoolman checks mounted only there -- never opens.
    # The spool_guard extra runs the same checks where the workflow cannot
    # skip them. It is optional: a printer without it prints as before, which
    # is what the published profiles require.
    {% if printer.spool_guard is defined %}
        SPOOL_GUARD
    {% endif %}


[gcode_macro M191]
description: Rough-home, park and wait using the optional nozzle qualifier or rear sensor.
gcode:
    # Klipper does not apply extended KEY=VALUE parsing to a TRADITIONAL
    # g-code name, and gcode.py's is_traditional_gcode("M191") is true: a
    # letter followed by a number. _process_commands therefore splits the line
    # on ([A-Z_]+|[A-Z*/]) and keeps whatever follows the key, so `STIR=1`
    # arrives as the string "=1". "=1"|float is 0.0, silently, which is how
    # every KEY=VALUE argument to M191 has always been zero: the stir fan was
    # commanded to 0% and BOOST never engaged. It only became visible when
    # COAST_RATE gained a `must be greater than zero` check and aborted a
    # print. Bare positional arguments like S33 and Z15 were never affected.
    # Normalize once here so already-sliced files keep working unchanged.
    {% set p = {} %}
    {% for key, value in params.items() %}
        {% set _ = p.update({key: value[1:] if value.startswith('=') else value}) %}
    {% endfor %}

    {% set s_passed = p.S is defined %}
    {% set r_passed = p.R is defined %}
    {% set tol_passed = p.TOL is defined %}
    {% set minimum = p.S|default(22)|float %}
    {% set target = minimum if s_passed else 32.0 %}
    {% set park = p.Z    |default(printer.save_variables.variables.ch_preheat_z|default(15.0))|float %}
    {% set stir = p.STIR |default(printer.save_variables.variables.ch_preheat_stir|default(1.0))|float %}
    # 2026-08-24 salt tray: actual Z16 minus 1 mm tray = bed-equivalent Z15.
    # 15% was the lowest command with consistent grain motion. Zero disables
    # stirring; any enabled stir must remain at or above that observed floor.
    # 0.25 is the measured fan0 proxy floor: below it the near-plate nozzle and
    # the rear sensor disagree by more than 1 C, so the stirred-nozzle observer
    # M191 depends on stops being trustworthy. The previous 0.15 was a
    # placeholder borrowed from the curtain fan on PE11, a different fan on a
    # different header. See notes/data/chamber-preheat/README.md.
    {% set stir_floor = 0.25 %}
    {% set boost = p.BOOST|default(0)|int %}
    # Effectively unbounded: the ceiling is now the extra's absolute max_bed_temp.
    # A file that still passes MAX_BOOST is honoured, which nerfs it to that.
    {% set max_boost = p.MAX_BOOST|default(1000.0)|float %}
    {% set coast_rate = p.COAST_RATE|default(1.0)|float %}
    {% set initial_boost = p.INITIAL_BOOST|default(5.0)|float %}
    {% set filter_alpha = p.FILTER_ALPHA|default(0.25)|float %}
    {% set bed_target = printer.heater_bed.target|float %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set park_x = p.X|default((xmin + xmax) / 2.0)|float %}
    {% set park_y = p.Y|default((ymin + ymax) / 2.0)|float %}
    {% set result = 2 if s_passed else 1 %}
    {% set phase = 1 if s_passed else 4 %}
    {% set threshold_policy = 2 if s_passed else 1 %}
    # Words for the console, numbers for telemetry. ch_preheat_threshold_policy
    # and ch_preheat_result stay numeric wire values; only what an operator
    # reads changes.
    {% set policy_name = "exact" if s_passed else "fallback" %}
    {% set result_name = "qualified" if s_passed else "compat" %}

    {% if r_passed or tol_passed %}
        {action_raise_error("M191 accepts only an exact minimum in S; follow it with M141 S<target>")}
    {% elif minimum <= 0 %}
        M141 S0
        _CH_PREHEAT_ABORT_STATE
    {% elif park < 5.0 or park > printer.toolhead.axis_maximum.z|float - 5.0 %}
        {action_raise_error("M191 Z must stay between 5mm and 5mm below axis maximum")}
    {% elif park_x < xmin or park_x > xmax or park_y < ymin or park_y > ymax %}
        {action_raise_error("M191 X and Y must stay within the configured axis limits")}
    {% elif stir < 0 or stir > 1 %}
        {action_raise_error("M191 STIR must be between 0 and 1")}
    {% elif stir > 0 and stir < stir_floor %}
        {action_raise_error("M191 STIR must be zero or at least the measured 0.25 floor")}
    {% elif boost not in [0, 1] %}
        {action_raise_error("M191 BOOST must be 0 or 1")}
    {% elif max_boost < 0 %}
        {action_raise_error("M191 MAX_BOOST must be at least zero")}
    {% elif coast_rate <= 0 %}
        {action_raise_error("M191 COAST_RATE must be greater than zero")}
    {% elif initial_boost < 0 or initial_boost > max_boost %}
        {action_raise_error("M191 INITIAL_BOOST must be between zero and MAX_BOOST")}
    {% elif filter_alpha <= 0 or filter_alpha > 1 %}
        {action_raise_error("M191 FILTER_ALPHA must be greater than zero and at most one")}
    {% else %}
        # M191 is the intentional soak path. Keep the exhaust off while adding
        # heat, preserve the cold hotend as an independent air observer, and
        # move only before the blocking wait. START_PRINT performs calibration
        # and bed mesh after this macro returns.
        CHAMBER_OFF
        _CH_PREHEAT_CLEAR
        SAVE_VARIABLE VARIABLE=ch_target VALUE={target}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_z VALUE={park}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE={phase}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=1
        # The host qualifier sets this immediately for a cold start, or only
        # after a warm nozzle's filtered cooling trend has ended.
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=proxy_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_requested_threshold VALUE={target}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_actual_threshold VALUE={minimum}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_threshold_policy VALUE={threshold_policy}
        {% if bed_target > 0 %}
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=print_bed_target VALUE={bed_target}
        {% endif %}
        M104 S0
        SET_FAN_SPEED FAN=fan2 SPEED=0
        G28
        G90
        G0 Z{park} F900
        G0 X{park_x} Y{park_y} F6000
        RESPOND PREFIX="M191:" MSG="rough homed and parked X{park_x} Y{park_y} Z{park} stirring {stir} chamber soak"
        RESPOND PREFIX="M191:" MSG="chamber minimum={minimum}C target={target}C policy={policy_name}"
        {% if boost == 1 and bed_target > 0 and 'chamber_preheat' in printer %}
            RESPOND PREFIX="M191:" MSG="bed boost initial={initial_boost}C cap={max_boost}C coast={coast_rate}C/min rate_alpha={filter_alpha}"
        {% endif %}
        # THE WIPE LEAD, LEARNED. chamber_preheat's wipe_lead_seconds is the
        # operator's CEILING: how early M191 may hand over so the heat/wipe/cool
        # lands on the chamber minimum. The safe lead is bounded by the SHORTEST
        # wipe the machine actually performs, and that is measured -- every
        # CLEAN_NOZZLE reports its own duration through _BRUSH_MARK_DONE, which
        # keeps the running minimum in wipe_seconds_min.
        #
        # Same shape as the exhaust stall-floor hunt: a value in save_variables,
        # an autotune flag, and learning that only ever moves in the SAFE
        # direction. Here safe is DOWN. min() of the two means an observation
        # can only ever pull the lead in, never push it past what the operator
        # configured -- so a hot restart that wipes in 60 s quietly drops the
        # lead to 48 without anyone having to notice, while a long wipe never
        # licenses a longer lead than was asked for.
        #
        # The margin exists because the minimum is a sample, not a bound. Set
        # wipe_lead_autotune 0 to pin the configured value and ignore what the
        # machine reports.
        {% set cfg_lead = printer.configfile.settings.chamber_preheat.wipe_lead_seconds|default(0.0)|float
                          if 'chamber_preheat' in printer.configfile.settings else 0.0 %}
        {% set learn_on = printer.save_variables.variables.wipe_lead_autotune|default(1)|int %}
        {% set w_min = printer.save_variables.variables.wipe_seconds_min|default(0.0)|float %}
        {% set w_margin = printer.save_variables.variables.wipe_lead_margin|default(0.8)|float %}
        {% set lead = [cfg_lead, (w_min * w_margin)]|min if (learn_on == 1 and w_min > 0) else cfg_lead %}
        {% if cfg_lead > 0 %}
            RESPOND PREFIX="M191:" MSG="wipe lead {lead|round(1)}s (configured {cfg_lead|round(1)}, observed min {w_min|round(1)}, margin {w_margin}, autotune {learn_on})"
        {% endif %}
        {% if 'chamber_preheat' in printer %}
            CHAMBER_PREHEAT_WAIT MINIMUM={minimum} BED_TARGET={bed_target} STIR={stir} POLICY={threshold_policy} BOOST={boost if bed_target > 0 else 0} MAX_BOOST={max_boost} COAST_RATE={coast_rate} INITIAL_BOOST={initial_boost} FILTER_ALPHA={filter_alpha} WIPE_LEAD={lead|round(1)}
            # Render only after the host qualifier has completed the wait.
            _CH_PROXY_ANCHOR
        {% else %}
            # Native fallback: the rear thermistor is less representative of
            # air near the part, but it is available without a Python extra.
            # Do not claim a qualified nozzle proxy or perform a bed boost.
            SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
            RESPOND PREFIX="M191:" MSG="Python preheat not enabled - waiting on the rear chamber sensor, no bed boost or early handover"
            SET_FAN_SPEED FAN=fan0 SPEED={stir}
            # Flush the queued fan callback before TEMPERATURE_WAIT blocks.
            M400
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={minimum}
            SET_FAN_SPEED FAN=fan0 SPEED=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_ready VALUE=1
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE={1 if s_passed else 0}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_result VALUE={result if 'chamber_preheat' in printer else 1}
        RESPOND PREFIX="M191:" MSG="soak complete via {'qualified nozzle' if 'chamber_preheat' in printer else 'rear sensor fallback'} at {minimum}C policy={policy_name}"
    {% endif %}


[gcode_macro _CHAMBER_AUTOSTART]
# Called from START_PRINT. Everything lives here rather than in Macro.cfg so the
# edit to Sovol's file is a single line -- Macro.cfg is overwritten by
# factory_resets.sh, so the less of this that lives there, the better.
#
# If the slicer asked for a chamber temperature this print, honour it. Otherwise
# infer one from the bed temperature, which the slicer always sets.
#
# WHY THE REQUEST FLAG. ch_target is persisted, and nothing zeroes it at the end
# of a print -- the loop's auto-off stops the fan but deliberately leaves the
# target alone. So "ch_target > 0" does not mean "the slicer asked", it means
# "somebody asked, possibly three prints ago". A PETG target of 45 would then
# silently carry into the next PLA print and the fan would never run. M141 sets
# `requested` in RAM and this consumes it, so an override lasts exactly one print.
#
# NO ";" "#" OR "*" IN A RESPOND MESSAGE. Klipper's extended-command regex ends
# the argument list at any of them (gcode.py extended_r, args group is
# "[^#*;]*?"), so the closing quote is never seen and shlex raises -- the whole
# command dies with "Malformed command". A semicolon in this very macro's
# "no bed target; Sovol default" is how that was found.
#
# INFERENCE. This controller only cools, so the target is really a chamber
# ceiling. Boundaries sit between Sovol's own bed temperatures: PLA/Silk 65,
# PETG and TPU 85, ABS 100, PC 110.
gcode:
    {% set st  = printer["gcode_macro _CH_STATE"] %}
    {% set cur = printer.save_variables.variables.ch_target|default(0.0)|float %}
    {% set bed = printer.heater_bed.target|default(0.0)|float %}
    # Computed here, not inside the branch below: Jinja's {% set %} does not
    # escape the if-block it is written in, so a flag assigned there is gone by
    # the time the CHAMBER_ON at the end of this macro would test it.
    {% set declined = 1 if (st.requested|int == 1
                            and st.control_declined|int == 1) else 0 %}

    # A cooldown ramp from the previous job may still be walking the bed and
    # chamber DOWN. It has to die before this print commands anything up, and
    # this runs from Sovol's own START_PRINT, so every profile reaches it --
    # including stock ones that never call COOLDOWN_ARM.
    {% if 'gcode_macro _COOL_STATE' in printer %}
        COOLDOWN_ABORT
    {% endif %}

    # These execute in order: finish the previous print from volatile evidence,
    # then choose this print's bounded trial before CHAMBER_ON starts the loop.
    _CH_ADAPT_FINISH
    _CH_ADAPT_BEGIN
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_target_pending VALUE=0

    {% if declined == 1 %}
        # Orca Target 0 with activation on. The profile asked for no thermal
        # chamber control and gets none -- no inference, no loop.
        RESPOND PREFIX="ch" MSG="START_PRINT: chamber control off, as requested by the slicer"
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=0
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=control_declined VALUE=0
        CHAMBER_OFF
    {% elif st.requested == 1 and cur > 0 %}
        RESPOND PREFIX="ch" MSG="START_PRINT: chamber target {cur}C, as requested by the slicer"
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=requested VALUE=0
    {% else %}
        {% if bed <= 0 %}
            {% set t = 32.0 %}
            {% set why = "no bed target, Sovol default" %}
        {% elif bed <= 70 %}
            {% set t = 32.0 %}
            {% set why = "bed " ~ bed|int ~ "C, PLA-class" %}
        {% elif bed <= 90 %}
            {% set t = 45.0 %}
            {% set why = "bed " ~ bed|int ~ "C, PETG/TPU-class" %}
        {% else %}
            {% set t = 55.0 %}
            {% set why = "bed " ~ bed|int ~ "C, ABS/PC-class" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=ch_target VALUE={t}
        RESPOND PREFIX="ch" MSG="START_PRINT: chamber ceiling {t}C inferred ({why})"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=preheat_phase VALUE=6
    {% if st.proxy_valid|int != 1 and st.observer_source|int != 2 %}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=observer_source VALUE=0
    {% endif %}
    {% if declined == 0 %}
        _CH_Z_BEGIN
        CHAMBER_ON
    {% endif %}
