# START_PRINT — the wipe happens while the plate is still coming down
#
# Include AFTER Macro.cfg and after nozzle_brush.cfg. Includes apply linearly
# and duplicate sections merge with the later one winning
# (configfile.py uses RawConfigParser(strict=False)), so this overrides Sovol's
# START_PRINT without editing their file, which factory_resets.sh overwrites.
#
# WHY THIS EXISTS
#
# The chamber preheat leaves the plate on its ceiling and releases it to the
# printing target the moment the chamber crosses its minimum. Coming back down
# is not instant: Klipper's M190 blocks while |bed - target| exceeds
# PID_SETTLE_DELTA = 1.0, and the plate falls at whatever passive loss gives --
# roughly 5 C/min near print temperature, so about three minutes from 120 to a
# 100 C target.
#
# That window used to be dead time. The start G-code waited on M190 and only
# then called START_PRINT, which cleaned the nozzle first thing. So the machine
# stood still for three minutes and then spent another two doing a wipe that
# never needed a settled plate.
#
# The wipe is now inside the window. CLEAN_NOZZLE scrubs on the brush; it does
# not probe, and its only Z interaction is a coarse G28 when the machine is not
# already homed -- which G28 Z below redoes at the settled temperature anyway.
# Nothing it does depends on the bed being at its final setpoint.
#
# WHAT STILL WAITS, and must
#
# Z_OFFSET_CALIBRATION takes BED_TEMP explicitly and BED_MESH_CALIBRATE reads a
# plate whose shape moves with temperature. Both stay behind the wait. The
# ordering guarantee the old comment claimed -- "bed hot BEFORE calibration and
# mesh" -- is unchanged; it is only the wipe that moved across it.
#
# THE START G-CODE NO LONGER CARRIES M190. It lives here instead, because the
# wipe has to precede it and the wipe lives here. A bundle whose start G-code
# still has its own M190 is fine: the bed is then already at temperature and the
# M190 below returns at once.

[gcode_macro START_PRINT]
description: Clean the nozzle while the plate settles, then calibrate on a settled plate.
gcode:
    {% if printer.save_variables.variables.was_interrupted|float == True %}
        PRINT_END #Clear the last printed power-off information
        CHANG_ROOT_MAIN
        SET_DISPLAY_TEXT
    {% endif %}
    CHAMBER_AUTOSTART   # chamber_fan.cfg: honour M141, else infer from bed
    CLEAR_PAUSE
    M117 Clean Nozzle
    CLEAN_NOZZLE
    # NOT rounded, and the target is re-sent unchanged rather than recomputed.
    # chamber_preheat releases the plate to target + bed_carry, a deliberate
    # fractional offset sized against PID_SETTLE_DELTA; rounding here would
    # silently discard it and command a different bed than the preheat chose.
    {% set bed = printer.heater_bed.target|float %}
    {% if bed > 0 %}
        M117 Bed Settle
        M190 S{bed}
    {% endif %}
    SET_GCODE_OFFSET Z=0
    M117 Eddy Calibration
    Z_OFFSET_CALIBRATION METHOD=force_overlay BED_TEMP={printer.heater_bed.target}
    G28 Z
    M117 Mesh Calibration
    BED_MESH_CALIBRATE
    save_last_file
    # STOCK IS `M117 {last_file}` AND IT HAS NEVER SHOWN ANYTHING. `last_file`
    # is a save_variable (plr.cfg writes it), not a Jinja global, so the bare
    # name is Undefined and Klipper renders Undefined as an empty string rather
    # than raising -- an M117 with no argument, on every print since launch.
    #
    # Reading it back through printer.save_variables would be wrong too, and
    # more subtly: Klipper renders a macro completely before executing any of
    # it, so the value here would be the one save_last_file wrote LAST job, not
    # the one on the line above. print_stats.filename is already this job's and
    # is correct at render time.
    M117 {printer.print_stats.filename}
